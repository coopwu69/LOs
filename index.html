<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แบบประเมิน LOs รายวิชาสหกิจศึกษา</title>
<style>
:root{
  --primary:#1e40af; --primary-light:#3b82f6; --primary-dark:#1e3a8a;
  --bg:#f8fafc; --surface:#ffffff; --surface-2:#f1f5f9;
  --text:#0f172a; --text-secondary:#475569; --text-muted:#94a3b8;
  --border:#e2e8f0; --border-strong:#cbd5e1;
  --success:#16a34a; --warning:#d97706; --error:#dc2626;
  --radius:12px; --radius-sm:8px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06);
  --shadow:0 4px 12px rgba(15,23,42,.08);
  --shadow-lg:0 12px 32px rgba(15,23,42,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Sarabun","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
/* Header */
.app-header{
  background:linear-gradient(135deg,var(--primary-dark),var(--primary));
  color:#fff;padding:28px 24px;box-shadow:var(--shadow);
  position:sticky;top:0;z-index:100;
}
.app-header h1{font-size:1.5rem;font-weight:700;letter-spacing:-.01em}
.app-header .subtitle{font-size:.9rem;opacity:.85;margin-top:4px}
.breadcrumb{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin-top:14px;font-size:.85rem;
}
.breadcrumb button{
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);
  color:#fff;padding:4px 12px;border-radius:20px;cursor:pointer;
  font-size:.8rem;transition:background .15s;
}
.breadcrumb button:hover{background:rgba(255,255,255,.28)}
.breadcrumb .sep{opacity:.5}
.breadcrumb .current{font-weight:600}

/* Layout */
.container{max-width:1200px;margin:0 auto;padding:32px 24px}

/* Level 1: Faculty grid */
.page-title{font-size:1.35rem;font-weight:700;margin-bottom:6px;color:var(--text)}
.page-desc{color:var(--text-secondary);font-size:.95rem;margin-bottom:24px}
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:16px;
}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:22px;cursor:pointer;transition:all .2s;box-shadow:var(--shadow-sm);
  display:flex;flex-direction:column;gap:10px;text-align:left;
  font-family:inherit;color:inherit;
}
.card:hover{border-color:var(--primary-light);box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.card:focus-visible{outline:3px solid var(--primary-light);outline-offset:2px}
.card .card-icon{
  width:44px;height:44px;border-radius:10px;
  background:linear-gradient(135deg,#dbeafe,#bfdbfe);
  display:flex;align-items:center;justify-content:center;
  font-size:1.4rem;color:var(--primary);
}
.card .card-title{font-size:1.05rem;font-weight:600;color:var(--text);line-height:1.4}
.card .card-meta{font-size:.82rem;color:var(--text-muted);display:flex;gap:10px;flex-wrap:wrap}
.card .badge{
  display:inline-flex;align-items:center;gap:4px;
  background:var(--surface-2);color:var(--text-secondary);
  padding:3px 10px;border-radius:20px;font-size:.78rem;font-weight:500;
}

/* Level 3: Evaluation form */
.eval-header{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:24px;margin-bottom:20px;box-shadow:var(--shadow-sm);
}
.eval-header h2{font-size:1.3rem;font-weight:700;color:var(--primary-dark);margin-bottom:6px}
.eval-header .source{font-size:.82rem;color:var(--text-muted);word-break:break-all}
.eval-body{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:32px;box-shadow:var(--shadow-sm);
  line-height:1.75;
}
.eval-body h2.section-title{
  font-size:1.15rem;font-weight:700;color:var(--primary-dark);
  border-bottom:2px solid var(--primary-light);padding-bottom:8px;
  margin:28px 0 14px;
}
.eval-body h2.section-title:first-child{margin-top:0}
.eval-body h3.domain-title{
  font-size:1.02rem;font-weight:600;color:var(--primary);
  background:var(--surface-2);padding:8px 14px;border-radius:var(--radius-sm);
  margin:22px 0 12px;border-left:4px solid var(--primary);
}
.eval-body h4.table-marker{
  font-size:.9rem;font-weight:600;color:var(--text-secondary);
  margin:18px 0 8px;font-style:italic;
}
.eval-body p{margin:8px 0;color:var(--text)}
.eval-body .lo-item{
  margin:10px 0;padding:10px 14px;background:var(--surface-2);
  border-radius:var(--radius-sm);border-left:3px solid var(--primary-light);
}
.eval-body .lo-code{
  display:inline-block;font-weight:700;color:var(--primary);
  background:#fff;padding:2px 8px;border-radius:6px;font-size:.85rem;
  margin-right:6px;border:1px solid var(--border);
}
.eval-body .lo-desc{color:var(--text)}
.eval-body .eval-item{
  font-weight:600;color:var(--text);margin:14px 0 6px;
  padding-top:10px;border-top:1px dashed var(--border);
}
.eval-body .rubric-level{
  margin:6px 0 6px 16px;padding:8px 12px;
  background:#fff;border:1px solid var(--border);border-radius:6px;
  font-size:.92rem;color:var(--text-secondary);
}
.eval-body .rubric-table-wrap{
  overflow-x:auto;margin:14px 0;border:1px solid var(--border);border-radius:var(--radius-sm);
}
.eval-body table.rubric-table{
  border-collapse:collapse;width:100%;font-size:.88rem;
}
.eval-body table.rubric-table th,.eval-body table.rubric-table td{
  border:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:top;
}
.eval-body table.rubric-table tr:nth-child(even){background:var(--surface-2)}
.eval-body table.xlsx-table{font-size:.82rem}

/* Search */
.search-bar{margin-bottom:20px}
.search-bar input{
  width:100%;padding:12px 16px;border:1px solid var(--border-strong);
  border-radius:var(--radius);font-size:.95rem;font-family:inherit;
  background:var(--surface);transition:border-color .15s;
}
.search-bar input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.15)}

/* Empty / loading */
.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
.empty-state .icon{font-size:3rem;margin-bottom:12px}

/* Back button */
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--surface);border:1px solid var(--border-strong);
  color:var(--text-secondary);padding:8px 16px;border-radius:var(--radius-sm);
  cursor:pointer;font-size:.9rem;font-family:inherit;margin-bottom:16px;
  transition:all .15s;
}
.back-btn:hover{border-color:var(--primary);color:var(--primary)}

/* Print */
.print-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--primary);border:none;color:#fff;
  padding:8px 16px;border-radius:var(--radius-sm);cursor:pointer;
  font-size:.9rem;font-family:inherit;margin-bottom:16px;margin-left:10px;
}
.print-btn:hover{background:var(--primary-dark)}

@media print{
  .app-header,.back-btn,.print-btn,.breadcrumb{display:none}
  .container{padding:0;max-width:none}
  .eval-body,.eval-header{box-shadow:none;border:1px solid #ccc}
}
@media (max-width:640px){
  .container{padding:20px 14px}
  .grid{grid-template-columns:1fr}
  .eval-body{padding:18px}
}
</style>
</head>

<header class="app-header">
  <h1>แบบประเมิน LOs รายวิชาสหกิจศึกษา</h1>
  <div class="subtitle">รวบรวมแบบประเมินผลการปฏิบัติสหกิจศึกษาตามผลลัพธ์การเรียนรู้ที่คาดหวัง แยกตามสำนักวิชาและหลักสูตร</div>
  <nav class="breadcrumb" id="breadcrumb" aria-label="การนำทาง"></nav>
</header>
<main class="container" id="app"></main>

<script>
const DATA = [{"faculty": "สำนักวิชาครุศาสตร์และศิลปศาสตร์", "curricula": [{"name": "หลักสูตรภาษาอังกฤษ", "file": "1. สำนักวิชาครุศาสตร์และศิลปศาสตร์ 3 หลักสูตร\\LOs Coop Ed_English_8 Dec 2024.pdf", "ext": "pdf", "html": "<p>ผลลัพธ์การเรียนรู้ของรายวิชาสหกิจศึกษาตาม PLOs ของหลักสูตรภาษาอังกฤษ</p>\n<p>The learning outcomes of cooperative education subject – English Program</p>\n<div class=\"eval-item\">1. ด้านความรู้ (K: Knowledge)</div>\n<p>LO 1 ประยุกต์ใช้องค์ความรู้ด้านภาษาอังกฤษเพื่อปฏิบัติงานในสถานประกอบการได้</p>\n<p>Apply knowledge of English to perform tasks in the workplace.</p>\n<p>LO 2 ประยุกต์ใช้ความรู้เฉพาะด้านในสาขาวิชาชีพที่เกี่ยวข้องกับลักษณะงานในสถานประกอบการได้</p>\n<p>Apply specialized knowledge in a professional field relevant to the specific nature of work in</p>\n<p>the workplace.</p>\n<div class=\"eval-item\">2. ด้านทักษะ (S: Skills)</div>\n<p>LO 3 มีทักษะการสื่อสารภาษาอังกฤษในบริบทของการทำงาน และการนำเสนอผลงานในที่สาธารณะที่เกี่ยวข้อง</p>\n<p>กับการประกอบอาชีพ</p>\n<p>Employ English communication skills in work contexts and public presentations related to</p>\n<p>professional practice.</p>\n<p>LO 4 มีทักษะการใช้เทคโนโลยียุคดิจิทัล ในการค้นคว้าข้อมูล คัดกรอง รวบรวมองค์ความรู้ เพื่อปฏิบัติงานใน</p>\n<p>สถานประกอบการ</p>\n<p>Utilize digital technology skills for researching, filtering, and compiling knowledge to perform</p>\n<p>tasks in the workplace.</p>\n<p>LO 5 มีทักษะการคิด วิเคราะห์ และการใช้เหตุผลเพื่อพัฒนา แก้ปัญหา หรือเพิ่มพูนความรู้ที่เกี่ยวข้องกับสถาน</p>\n<p>ประกอบการ</p>\n<p>Develop skills in critical thinking, analysis, and reasoning to improve, solve problems, or</p>\n<p>enhance knowledge related to the workplace.</p>\n<div class=\"eval-item\">3. ด้านจริยธรรม (E: Ethics)</div>\n<p>LO 6 แสดงออกถึงความกตัญญู รับผิดชอบ ซื่อสัตย์ ตรงเวลา และมจี รรยาบรรณทางวิชาการและวิชาชีพ</p>\n<p>Express gratitude, responsibility, honesty, punctuality, and commitment to academic and</p>\n<p>professional ethics.</p>\n<div class=\"eval-item\">4. ด้านลักษณะส่วนบุคคล (C: Characters)</div>\n<p>LO 7 แสดงออกถึงการมีทัศนคติเปิดกว้าง ยอมรับความแตกต่างและการเปลี่ยนแปลง มีวินัย สามารถปรับตัวและ</p>\n<p>ร่วมงานกับผู้อื่นได้</p>\n<p>Demonstrate an open-minded attitude, acceptance of differences and changes, discipline,</p>\n<p>adaptability, and teamwork skills.</p>\n<h2 class=\"section-title\">แบบประเมินผลการปฏิบัติสหกิจศึกษาตามผลลัพธ์การเรียนรู้ที่คาดหวัง</h2>\n<p>Cooperative Education Assessment Form Based on Expected Learning Outcomes</p>\n<h3 class=\"domain-title\">ตอนที่1 ผลลัพธ์การเรียนรู้ที่คาดหวังของหลักสูตรด้านความรู้และทักษะ</h3>\n<p>Part 1 Expected Learning Outcomes of Knowledge and Skills</p>\n<p>ผลลัพธ์การเรียนรู้ที่คาดหวัง ผลการประเมิน</p>\n<h3 class=\"domain-title\">ด้านความรู้ (Knowledge)</h3>\n<p>LO 1 ประยุกต์ใช้องค์ความรู้ด้านภาษาอังกฤษเพื่อ  ระดับดีเยี่ยม (ประยุกต์ใช้ความรู้ภาษาอังกฤษใน</p>\n<p>ปฏิบัติงานในสถานประกอบการได้ การปฏิบัติงานที่ได้รับมอบหมายในสถานประกอบการ</p>\n<p>Apply knowledge of English to perform tasks ไดอ้ ย่างมปี ระสิทธิภาพ ถูกต้องและเหมาะสม)</p>\n<p>in the workplace.</p>\n<p> ระดับดีมาก (ประยุกต์ใช้ความรู้ภาษาอังกฤษใน</p>\n<p>การปฏิบัติงานที่ได้รับมอบหมายในสถานประกอบการ</p>\n<p>ไดอ้ ย่างมีประสิทธิภาพ แต่ยังมีข้อผิดพลาดบ้าง)</p>\n<p> ระดับดี (ประยุกต์ใช้ความรู้ภาษาอังกฤษในการ</p>\n<p>ปฏิบัติงานที่ได้รับมอบหมายในสถานประกอบการได้</p>\n<p>พอสมควร และยังมีข้อผิดพลาดอยู่บ้าง)</p>\n<p> ระดับพอใช้ (ประยุกต์ใช้ความรู้ภาษาอังกฤษใน</p>\n<p>การปฏิบัติงานที่ได้รับมอบหมายในสถานประกอบการ</p>\n<p>ได้เพียงเล็กน้อย และยังมีข้อผิดพลาดเป็นส่วนใหญ่)</p>\n<p> ระดับควรปรับปรุง (ไม่สามารถประยุกต์ใช้ความรู้</p>\n<p>ภาษาอังกฤษในการปฏิบัติงานที่ได้รับมอบหมายใน</p>\n<p>สถานประกอบการได้)</p>\n<p>LO 2 ประยุกต์ใช้ความรู้เฉพาะด้านในสาขาวิชาชีพที่  ระดับดีเยี่ยม (ประยุกต์ใช้ความรู้เฉพาะด้านใน</p>\n<p>เกี่ยวข้องกับลักษณะงานในสถานประกอบการได้ การปฏิบัติงานที่ได้รับมอบหมายในสถานประกอบการ</p>\n<p>Apply specialized knowledge in a professional ได้อย่างมีประสิทธิภาพ ถูกต้องและเหมาะสม)</p>\n<p>field relevant to the specific nature of work in</p>\n<p>the workplace.  ระดับดีมาก (ประยุกต์ใช้ความรู้เฉพาะด้านในการ</p>\n<p>ประยุกต์ใช้ความรู้เฉพาะด้านในการปฏิบัติงานที่ได้รับ ปฏิบัติงานที่ได้รับมอบหมายในสถานประกอบการได้</p>\n<p>มอบหมายในสถานประกอบการอย่างมีประสิทธิภาพ อย่างมีประสิทธิภาพ แต่ยังมีข้อผิดพลาดบ้าง)</p>\n<p>ผลลัพธ์การเรียนรู้ที่คาดหวัง ผลการประเมิน</p>\n<p> ระดับดี (ประยุกต์ใช้ความรู้เฉพาะด้านในการ</p>\n<p>ปฏิบัติงานที่ได้รับมอบหมายในสถานประกอบการได้</p>\n<p>พอสมควร และยังมีข้อผิดพลาดอยู่บ้าง)</p>\n<p> ระดับพอใช้ (ประยุกต์ใช้ความรู้เฉพาะด้านในการ</p>\n<p>ปฏิบัติงานที่ได้รับมอบหมายในสถานประกอบการได้</p>\n<p>เพียงเล็กน้อย และยังมีข้อผิดพลาดเป็นส่วนใหญ่)</p>\n<p> ระดับควรปรับปรุง (ไม่สามารถประยุกต์ใช้ความรู้</p>\n<p>เฉพาะด้านในการปฏิบัติงานที่ได้รับมอบหมายในสถาน</p>\n<p>ประกอบการได)้</p>\n<h3 class=\"domain-title\">ด้านทักษะ (Skills)</h3>\n<p>LO 3 มีทักษะการสื่อสารภาษาอังกฤษในบริบทของ  ระดับดีเยี่ยม (สื่อสารและนำเสนอโดยใช้</p>\n<p>การทำงาน และการนำเสนอผลงานในที่สาธารณะที่ ภาษาอังกฤษได้อย่างคล่องแคล่ว เนื้อหาครบถ้วน และ</p>\n<p>เกี่ยวข้องกับการประกอบอาชีพ ตอบคำถามได้ทุกประเด็น)</p>\n<p>Employ English communication skills in work</p>\n<p>contexts and public presentations related to  ระดับดีมาก (สื่อสารและนำเสนอโดยใช้</p>\n<p>professional practice. ภาษาอังกฤษได้อย่างคล่องแคล่ว แต่อาจติดขัดบ้าง</p>\n<p>เนื้อหาครบถ้วนเป็นส่วนใหญ่ และตอบคำถามได้เกือบ</p>\n<p>ทุกประเด็น)</p>\n<p> ระดับดี (สื่อสารและนำเสนอโดยใช้ภาษาอังกฤษ</p>\n<p>ไดค้ ล่องแคล่วเป็นส่วนใหญ่ เนื้อหาบางส่วนขาด</p>\n<p>หายไป และตอบคำถามได้บางประเด็น)</p>\n<p> ระดับพอใช้ (สื่อสารและนำเสนอโดยใช้</p>\n<p>ภาษาอังกฤษไม่คล่องแคล่ว เนื้อหาส่วนใหญ่ขาด</p>\n<p>หายไป และตอบคำถามได้น้อยมาก)</p>\n<p> ระดับควรปรับปรุง (ไม่สามารถสื่อสารและ</p>\n<p>นำเสนอโดยใช้ภาษาอังกฤษได้อย่างคล่องแคล่ว</p>\n<p>เนื้อหาไม่ครบถ้วน และไม่สามารถตอบคำถามได)้</p>\n<p>ผลลัพธ์การเรียนรู้ที่คาดหวัง ผลการประเมิน</p>\n<p>LO 4 มีทักษะการใช้เทคโนโลยียุคดิจิทัล ในการ  ระดับดีเยี่ยม (ใช้เทคโนโลยีเพื่อการปฏิบัติงานได้</p>\n<p>ค้นคว้าข้อมูล คัดกรอง รวบรวมองค์ความรู้ เพื่อ อย่างมปี ระสิทธิภาพ)</p>\n<p>ปฏิบัติงานในสถานประกอบการ</p>\n<p>Utilize digital technology skills for researching,  ระดับดีมาก (ใช้เทคโนโลยีเพื่อการปฏิบัติงานได้</p>\n<p>filtering, and compiling knowledge to perform อย่างดี)</p>\n<p>tasks in the workplace.</p>\n<p> ระดับดี (ใช้เทคโนโลยีเพื่อปฏิบัติงานได้ในประดับ</p>\n<p>ปานกลาง)</p>\n<p> ระดับพอใช้ (ใช้เทคโนโลยีเพื่อปฏิบัติงานได้ใน</p>\n<p>ระดับเบื้องต้น)</p>\n<p> ระดับควรปรับปรุง (ขาดความรู้ในการใช้</p>\n<p>เทคโนโลยีเพื่อปฏิบัติงาน)</p>\n<p>LO 5 มีทักษะการคิด วิเคราะห์ และการใช้เหตุผล  ระดับดีเยี่ยม (มีการคิด วิเคราะห์ หรือใช้เหตุผล</p>\n<p>เพื่อพัฒนา แก้ปัญหา หรือเพิ่มพูนความรู้ที่เกี่ยวข้อง เพื่อพัฒนา แก้ปัญหาหรือเพิ่มพูนความรู้ที่เกี่ยวข้องกับ</p>\n<p>กับสถานประกอบการ สถานประกอบการได้ทั้งหมด)</p>\n<p>Develop skills in critical thinking, analysis, and</p>\n<p>reasoning to improve, solve problems, or  ระดับดีมาก (มีการคิด วิเคราะห์ หรือใช้เหตุผล</p>\n<p>enhance knowledge related to the เพื่อพัฒนา แก้ปัญหาหรือเพิ่มพูนความรู้ที่เกี่ยวข้องกับ</p>\n<p>workplace. สถานประกอบการได้เป็นส่วนใหญ่)</p>\n<p> ระดับดี (มีการคิด วิเคราะห์ หรือใช้เหตุผลเพื่อ</p>\n<p>พัฒนา แก้ปัญหาหรือเพิ่มพูนความรู้ที่เกี่ยวข้องกับ</p>\n<p>สถานประกอบการได้พอสมควร)</p>\n<p> ระดับพอใช้ (มีการคิด วิเคราะห์ หรือใช้เหตุผล</p>\n<p>เพื่อพัฒนา แก้ปัญหาหรือเพิ่มพูนความรู้ที่เกี่ยวข้องกับ</p>\n<p>สถานประกอบการไดบ้ ้าง)</p>\n<p> ระดับควรปรับปรุง (ขาดการคิด วิเคราะห์ หรือใช้</p>\n<p>เหตุผลเพื่อพัฒนา แก้ปัญหาหรือเพิ่มพูนความรู้ที่</p>\n<p>เกี่ยวข้องกับสถานประกอบการ)</p>\n<h3 class=\"domain-title\">ตอนที่2 ผลลัพธ์การเรียนรู้ด้านทักษะทางสังคม</h3>\n<p>Part 2 Expected Learning Outcomes of the Social Skills</p>\n<p>ลักษณะบุคคล/สมรรถนะ ผลการประเมิน</p>\n<h3 class=\"domain-title\">ด้านจริยธรรม (Ethics)</h3>\n<p>LO 6 แสดงออกถึงความกตัญญู รับผิดชอบ ซื่อสัตย์</p>\n<p>ตรงเวลา และไม่ละเมิดจรรยาบรรณทางวิชาการและ</p>\n<p>วิชาชีพ</p>\n<p>Express gratitude, responsibility, honesty,</p>\n<p>punctuality, and commitment to academic</p>\n<p>and professional ethics.</p>\n<h3 class=\"domain-title\">ด้านลักษณะบุคคล (Character)</h3>\n<p>LO 7 แสดงออกถึงการมีทัศนคติเปิดกว้าง ยอมรับ</p>\n<p>ความแตกต่างและการเปลี่ยนแปลง มีวินัย สามารถ</p>\n<p>ปรับตัวและร่วมงานกับผู้อื่นได้</p>\n<p>Demonstrate an open-minded attitude,</p>\n<p>acceptance of differences and changes,</p>\n<p>discipline, adaptability, and teamwork skills.</p>"}, {"name": "หลักสูตรภาษาไทยเพื่อการสื่อสาร", "file": "1. สำนักวิชาครุศาสตร์และศิลปศาสตร์ 3 หลักสูตร\\LOs-ของรายวิชาสหกิจศึกษา-67-ไทยเพื่อการสื่อสาร.pdf", "ext": "pdf", "html": "<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของหลักสูตรภาษาไทยเพื่อการสื่อสาร</h2>\n<p>(Program Learning Outcome: PLO)</p>\n<h3 class=\"domain-title\">1) ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO1</span> <span class=\"lo-desc\">อธิบายองค์ความรู้ด้านภาษา วรรณกรรม และวัฒนธรรมไทยได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO2</span> <span class=\"lo-desc\">ประยุกต์ใช้องค์ความรู้ด้านภาษา วรรณกรรม และวัฒนธรรมไทย เพื่อการสร้างสรรค์ เนื้อหา</span></div>\n<p>ด้านงานเขียน งานประชาสัมพันธ์ และงานวิชาการ</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO3</span> <span class=\"lo-desc\">อธิบายความรู้ทางด้านมนุษยศาสตร์ สังคมศาสตร์ทั่วไป การเปลี่ยนแปลงของ</span></div>\n<p>เทคโนโลยีดิจิทัล และการใช้เทคโนโลยีสารสนเทศในงานด้านภาษาไทยเพื่อการสื่อสาร</p>\n<h3 class=\"domain-title\">2) ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO4</span> <span class=\"lo-desc\">มีทักษะการสื่อสารภาษาไทย และภาษาอังกฤษเพื่อการใช้ในชีวิตประจําวัน และการทํางาน</span></div>\n<p>ด้านภาษาไทยเพื่อการสื่อสาร ทั้งการฟัง พูด อ่าน เขียน และการนําเสนอผลงานได้ตามวัตถุประสงค์ ในกรณีที่</p>\n<p>นักศึกษาเลือกเรียนภาษาจีน สามารถสื่อสารภาษาจีนในชีวิตประจําวัน</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO5</span> <span class=\"lo-desc\">มีทักษะการใช้เทคโนโลยีสารสนเทศเพื่อการสืบค้น รวบรวม เรียบเรียง สําหรับการวิเคราะห์</span></div>\n<p>และนําเสนองานด้านวิชาการ รวมทั้งการใช้ในชีวิตประจําวัน</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO6</span> <span class=\"lo-desc\">มีทักษะการคิด วิเคราะห์อย่างมีเหตุผล เพื่อแก้ปัญหาวิจัยทางภาษาไทยอย่างมีจริยธรรมทางวชิ าการ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO7</span> <span class=\"lo-desc\">มีทักษะการดูแลตนเองเพื่อสร้างสุขภาวะ</span></div>\n<h3 class=\"domain-title\">3) ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO8</span> <span class=\"lo-desc\">แสดงออกถึงความซื่อสัตย์สุจริต มีความกตัญญู</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO9</span> <span class=\"lo-desc\">แสดงออกถึงความรับผิดชอบต่อตนเอง เคารพกฎระเบียบสังคมและจริยธรรมในการประกอบอาชีพ</span></div>\n<h3 class=\"domain-title\">4) ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO10</span> <span class=\"lo-desc\">ตระหนักถึงคุณค่าความเป็นไทย มีจิตอาสา และเป็นที่พึ่งด้านภาษาไทยแก่ผู้อื่น</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO11</span> <span class=\"lo-desc\">แสดงออกถึงการมีวินัย การมีภาวะผู้นํา สามารถเป็นได้ทั้งผู้นําและผู้ตาม ทํางานร่วมกับผู้อื่นได้</span></div>\n<p>1</p>\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษาหลักสูตรภาษาไทยเพื่อการสื่อสาร (Learning Outcomes: LOs)</h2>\n<h3 class=\"domain-title\">1) ด้านความรู้ (knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">ประยุกต์ใช้องค์ความรู้ด้านมนุษยศาสตร์ สังคมศาสตร์ โดยเฉพาะด้านภาษา วรรณกรรม และ</span></div>\n<p>วัฒนธรรมไทย เพื่อการสร้างสรรค์เนื้อหา ด้านงานเขียน งานประชาสัมพันธ์ หรืองานวิชาการเพื่อการ</p>\n<p>ปฏิบัติงานในสถานประกอบการ</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">ประยุกต์ใช้องค์ความรู้ด้านภาษาไทยเพื่อการสื่อสาร และการใช้เทคโนโลยีสารสนเทศเพื่อ</span></div>\n<p>วางแผน แก้ปัญหา ในระหว่างปฏิบัติงาน และนําเสนอรายงานสหกิจศึกษาที่เป็นประโยชน์ต่อสถาน</p>\n<p>ประกอบการได ้</p>\n<h3 class=\"domain-title\">2) ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">มีทักษะด้านการคิด การวิเคราะห์ การสื่อสาร เพื่อแก้ปัญหาและปฏิบัติงานร่วมกับผู้อื่นในสถาน</span></div>\n<p>ประกอบการได ้</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">มีทักษะการใช้เทคโนโลยีสารสนเทศ เพื่อการสืบค้น และสร้างสรรค์งานเพื่อตอบสนองการ</span></div>\n<p>ปฏิบัติงานของสถานประกอบการ</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">มีทักษะการผลิตและการนําเสนอผลงานโดยใช้องค์ความรู้ด้านภาษาไทยเพื่อการสื่อสาร</span></div>\n<h3 class=\"domain-title\">3) ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO6</span> <span class=\"lo-desc\">แสดงออกถึงความซื่อสัตย์ ความกตัญญู ความรับผิดชอบต่อตนเองและส่วนรวม ยึดมั่นตามหลัก</span></div>\n<p>จรรยาบรรณวิชาชีพ และเคารพต่อกฎระเบียบของสถานประกอบการ</p>\n<h3 class=\"domain-title\">4) ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO7</span> <span class=\"lo-desc\">แสดงออกถึงการมีวินัย การมีภาวะผู้นํา สามารถเป็นได้ทั้งผู้นําและผู้ตาม ทํางานร่วมกับผู้อื่นได้</span></div>\n<p>2</p>\n<h2 class=\"section-title\">แบบประเมินผลการปฏิบัติสหกิจศึกษาตามผลลัพธ์การเรียนรู้ที่คาดหวัง</h2>\n<p>ตอนท ี่ 1 ผลลัพธ์การเรียนรู้ที่คาดหวังของหลักสูตรด้านความรู้และทักษะ</p>\n<p>ผลลัพธ์การเรียนรู้ที่คาดหวัง ผลการประเมิน</p>\n<h3 class=\"domain-title\">ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">ประยุกต์ใช้องค์ความรู้ด้าน  ดีเยี่ยม (5 คะแนน)</span></div>\n<p>มนุษยศาสตร์ สังคมศาสตร์ โดยเฉพาะด้าน สามารถประยุกต์ใช้องค์ความรู้ด้านมนุษยศาสตร์</p>\n<p>ภาษา วรรณกรรม และวัฒนธรรมไทย เพื่อ สังคมศาสตร์ ด้านภาษา วรรณกรรม และวัฒนธรรมไทย</p>\n<p>การสร้างสรรค์เนื้อหา ด้านงานเขียน งาน เพื่อสร้างสรรค์เนื้อหาในงานเขียน งานประชาสัมพันธ์ หรือ</p>\n<p>ประชาสัมพันธ์ หรืองานวิชาการเพื่อการ งานวิชาการที่ได้รับมอบหมายในสถานประกอบการได้</p>\n<p>ปฏิบัติงานในสถานประกอบการ อย่างโดดเด่น ผลงานมีคุณภาพสูง ชัดเจน และสามารถ</p>\n<p>ตอบสนองความต้องการขององค์กรได้อย่างมีประสิทธิภาพ</p>\n<p> ดีมาก (4 คะแนน)</p>\n<p>สามารถประยุกต์ใช้องค์ความรู้ด้านมนุษยศาสตร์</p>\n<p>สังคมศาสตร์ ด้านภาษา วรรณกรรม และวัฒนธรรมไทย</p>\n<p>เพื่อสร้างสรรค์เนื้อหาในงานเขียน งานประชาสัมพันธ์ หรือ</p>\n<p>งานวิชาการที่ได้รับมอบหมายในสถานประกอบการได้ดี</p>\n<p>ผลงานมีความสมบูรณ์ และสามารถใช้งานได้จริงในองค์กร</p>\n<p> ดี (3 คะแนน)</p>\n<p>สามารถประยุกต์ใช้องค์ความรู้ด้านมนุษยศาสตร์</p>\n<p>สังคมศาสตร์ ด้านภาษา วรรณกรรม และวัฒนธรรมไทย</p>\n<p>เพื่อสร้างสรรค์เนื้อหาในงานเขียน งานประชาสัมพันธ์ หรือ</p>\n<p>งานวิชาการที่ได้รับมอบหมายได้ แต่ยังต้องได้รับคําแนะนํา</p>\n<p>หรือการดูแลบางครั้งจากพี่เลี้ยงหรือผู้เกี่ยวข้อง</p>\n<p> พอใช้ (2 คะแนน)</p>\n<p>สามารถประยุกต์ใช้องค์ความรู้ด้านมนุษยศาสตร์</p>\n<p>สังคมศาสตร์ ด้านภาษา วรรณกรรม และวัฒนธรรมไทย</p>\n<p>เพื่อสร้างสรรค์เนื้อหาในงานเขียน งานประชาสัมพันธ์ หรือ</p>\n<p>งานวิชาการที่ได้รับมอบหมายได้ในระดับพื้นฐาน แต่ต้องมี</p>\n<p>การดูแลอย่างใกล้ชิดจากพี่เลี้ยงหรือผู้นิเทศ</p>\n<p> ควรปรับปรุง (1 คะแนน)</p>\n<p>ไม่สามารถประยุกต์ใช้องค์ความรู้ด้านมนุษยศาสตร์</p>\n<p>สังคมศาสตร์ ด้านภาษา วรรณกรรม และวัฒนธรรมไทย</p>\n<p>เพื่อสร้างสรรค์เนื้อหาในงานเขียน งานประชาสัมพันธ์ หรือ</p>\n<p>งานวิชาการที่ได้รับมอบหมายได้</p>\n<p>3</p>\n<p>ผลลัพธ์การเรียนรู้ที่คาดหวัง ผลการประเมิน</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">ประยุกต์ใช้องค์ความรู้ด้านภาษาไทย  ดีเยี่ยม (5 คะแนน)</span></div>\n<p>เพื่อการสื่อสาร และการใช้เทคโนโลยี สามารถประยุกต์ใช้องค์ความรู้ด้านภาษาไทยเพื่อการ</p>\n<p>สารสนเทศเพื่อวางแผน แก้ปัญหา ในระหว่าง สื่อสาร และใช้เทคโนโลยีสารสนเทศในการวางแผนและ</p>\n<p>ปฏิบัติงาน และนําเสนอรายงานสหกิจศึกษา แก้ปัญหาในระหว่างปฏิบัติงานได้อย่างมีประสิทธิภาพ</p>\n<p>ที่เป็นประโยชน์ต่อสถานประกอบการได้ ผลงานหรือการนําเสนอรายงานสหกิจศึกษามีคุณภาพสูง</p>\n<p>ชัดเจน ตรงประเด็น และสามารถตอบสนองความต้องการ</p>\n<p>ของสถานประกอบการได้อย่างยอดเยี่ยม</p>\n<p> ดีมาก (4 คะแนน)</p>\n<p>สามารถประยุกต์ใช้องค์ความรู้ด้านภาษาไทยเพื่อการ</p>\n<p>สื่อสาร และใช้เทคโนโลยีสารสนเทศในการวางแผนและ</p>\n<p>แก้ปัญหาในระหว่างปฏิบัติงานได้ดี ผลงานหรือการ</p>\n<p>นําเสนอรายงานสหกิจศึกษามีความสมบูรณ์ และ</p>\n<p>ตอบสนองต่อความต้องการของสถานประกอบการได้ดี</p>\n<p> ดี (3 คะแนน)</p>\n<p>สามารถประยุกต์ใช้องค์ความรู้ด้านภาษาไทยเพื่อการ</p>\n<p>สื่อสาร และใช้เทคโนโลยีสารสนเทศในการวางแผนและ</p>\n<p>แก้ปัญหาในระหว่างปฏิบัติงานได้ แต่ยังต้องได้รับ</p>\n<p>คําแนะนําหรือการดูแลบางครั้งจากพี่เลี้ยงหรือผู้เกี่ยวข้อง</p>\n<p> พอใช้ (2 คะแนน)</p>\n<p>สามารถประยุกต์ใช้องค์ความรู้ด้านภาษาไทยเพื่อการ</p>\n<p>สื่อสาร และใช้เทคโนโลยีสารสนเทศในการวางแผนและ</p>\n<p>แก้ปัญหาในระหว่างปฏิบัติงานได้ในระดับพื้นฐาน แต่ต้องมี</p>\n<p>การดูแลอย่างใกล้ชิดจากพี่เลี้ยงหรือผู้นิเทศ</p>\n<p> ควรปรับปรุง (1 คะแนน)</p>\n<p>ไม่สามารถประยุกต์ใช้องค์ความรู้ด้านภาษาไทยเพื่อการ</p>\n<p>สื่อสาร หรือการใช้เทคโนโลยีสารสนเทศในการวางแผน</p>\n<p>และแก้ปัญหาในระหว่างปฏิบัติงานได้ ผลงานหรือรายงาน</p>\n<p>ที่นําเสนอยังไม่ตอบโจทย์หรือไม่สามารถนําไปใช้ประโยชน์</p>\n<p>ในสถานประกอบการได้</p>\n<p>4</p>\n<p>ผลลัพธ์การเรียนรู้ที่คาดหวัง ผลการประเมิน</p>\n<h3 class=\"domain-title\">ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">มีทักษะด้านการคิด การวิเคราะห์ การ  ดีเยี่ยม (5 คะแนน)</span></div>\n<p>สื่อสาร เพื่อแก้ปัญหาและปฏิบัติงานร่วมกับ แสดงให้เห็นถึงทักษะการคิดและการวิเคราะห์ที่ชัดเจนและ</p>\n<p>ผู้อื่นในสถานประกอบการได้ ลึกซึ้ง สามารถแก้ปัญหาที่ซับซ้อนได้อย่างสร้างสรรค์และมี</p>\n<p>ประสิทธิภาพ การสื่อสารมีความชัดเจนและมีผลลัพธ์ที่ดี</p>\n<p>เยี่ยมในสถานการณ์ต่าง ๆ สามารถทํางานร่วมกับผู้อื่นได้</p>\n<p>อย่างราบรื่นและมีส่วนช่วยส่งเสริมความสําเร็จของทีม</p>\n<p> ดีมาก (4 คะแนน)</p>\n<p>แสดงทักษะการคิดและการวิเคราะห์ที่ดี สามารถแก้ปัญหา</p>\n<p>ส่วนใหญ่ได้อย่างเหมาะสมและมีประสิทธิภาพ การสื่อสาร</p>\n<p>มีความชัดเจน เข้าใจง่าย และทํางานร่วมกับผู้อื่นในทีมได้</p>\n<p>อย่างดี</p>\n<p> ดี (3 คะแนน)</p>\n<p>สามารถแสดงทักษะการคิดและการวิเคราะห์ในระดับที่</p>\n<p>เพียงพอสําหรับแก้ปัญหางานทั่วไป การสื่อสารยังคงเข้าใจ</p>\n<p>ไดแ้ ละเหมาะสมในบริบทส่วนใหญ่ แต่บางครั้งอาจต้องการ</p>\n<p>คําแนะนําหรือการช่วยเหลือในการทํางานร่วมกับทีม</p>\n<p> พอใช้ (2 คะแนน)</p>\n<p>ทักษะการคิด การวิเคราะห์ และการแก้ปัญหายังอยู่ใน</p>\n<p>ระดับพื้นฐาน สามารถจัดการงานบางส่วนได้ แต่ต้องการ</p>\n<p>คําแนะนําอย่างใกล้ชิด การสื่อสารอาจไม่ชัดเจนในบางครั้ง</p>\n<p>และการทํางานร่วมกับผู้อื่นในทีมยังต้องปรับปรุง</p>\n<p> ควรปรับปรุง (1 คะแนน)</p>\n<p>ไม่สามารถแสดงทักษะการคิด การวิเคราะห ์ หรือแก้ปัญหา</p>\n<p>ได้อย่างเหมาะสม การสื่อสารมีปัญหา ทําให้เกิดความ</p>\n<p>เข้าใจผิดบ่อยครั้ง และไม่สามารถทํางานร่วมกับผู้อื่นในทีม</p>\n<p>ได้อย่างมีประสิทธิภาพ</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">มีทักษะการใช้เทคโนโลยีสารสนเทศเพื่อ  ดีเยี่ยม (5 คะแนน)</span></div>\n<p>การสืบค้น และสร้างสรรค์งานเพื่อตอบสนอง สามารถใช้เทคโนโลยีสารสนเทศได้อย่างเชี่ยวชาญและมี</p>\n<p>การปฏิบัติงานของสถานประกอบการ ประสิทธิภาพทั้งในการสืบค้นข้อมูลและการสร้างสรรค์งาน</p>\n<p>ผลงานมีความสร้างสรรค์ มีคุณภาพสูง และตอบสนองต่อ</p>\n<p>ความต้องการของสถานประกอบการได้อย่างสมบูรณ์แบบ</p>\n<p>5</p>\n<p>ผลลัพธ์การเรียนรู้ที่คาดหวัง ผลการประเมิน</p>\n<p> ดีมาก (4 คะแนน)</p>\n<p>มีทักษะการใช้เทคโนโลยีสารสนเทศที่ดี สามารถสืบค้น</p>\n<p>ข้อมูลและสร้างสรรค์งานได้อย่างมีประสิทธิภาพ ผลงานมี</p>\n<p>ความสมบูรณ์และตรงกับความต้องการของสถาน</p>\n<p>ประกอบการ</p>\n<p> ดี (3 คะแนน)</p>\n<p>สามารถใช้เทคโนโลยีสารสนเทศได้ในระดับที่เพียงพอ</p>\n<p>สําหรับการสืบค้นข้อมูลและสร้างสรรค์งานทั่วไป ผลงาน</p>\n<p>อยู่ในระดับที่ยอมรับได้ แต่บางครั้งอาจต้องการคําแนะนํา</p>\n<p>หรือการดูแลจากพี่เลี้ยงหรือผู้เกี่ยวข้อง</p>\n<p> พอใช้ (2 คะแนน)</p>\n<p>การใช้เทคโนโลยีสารสนเทศอยู่ในระดับพื้นฐาน สามารถ</p>\n<p>สืบคน้ ข้อมูลและสร้างสรรค์งานได้บางส่วน แต่ต้องการ</p>\n<p>คําแนะนําหรือการดูแลอย่างใกล้ชิด</p>\n<p> ควรปรับปรุง (1 คะแนน)</p>\n<p>ไม่สามารถใช้เทคโนโลยีสารสนเทศในการสืบค้นหรือ</p>\n<p>สร้างสรรค์งานได้อย่างเหมาะสม ผลงานที่นําเสนอไม่</p>\n<p>สามารถตอบสนองความต้องการของสถานประกอบการได้</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">มีทักษะการผลิตและการนําเสนอผลงาน  ดีเยี่ยม (5 คะแนน)</span></div>\n<p>โดยใช้องค์ความรู้ด้านภาษาไทยเพื่อการ สามารถผลิตผลงานที่มีความสร้างสรรค์ เนื้อหามีความ</p>\n<p>สื่อสาร ถูกต้อง สมบูรณ์ และเหมาะสมกับวัตถุประสงค์การสื่อสาร</p>\n<p>ใช้ภาษาไทยได้อย่างถูกต้อง ชัดเจน และมีความน่าสนใจสูง</p>\n<p>การนําเสนอผลงานโดดเด่น ดึงดูดความสนใจของผู้ฟัง และ</p>\n<p>ตอบโจทย์ความต้องการของสถานประกอบการได้อย่าง</p>\n<p>ยอดเยี่ยม</p>\n<p> ดีมาก (4 คะแนน)</p>\n<p>สามารถผลิตผลงานที่มีความสมบูรณ์ เนื้อหามีความถูกต้อง</p>\n<p>และเหมาะสมกับวัตถุประสงค์ ใช้ภาษาไทยได้ดีและมีความ</p>\n<p>ชัดเจน การนําเสนอผลงานมีความน่าสนใจและตอบโจทย์</p>\n<p>ความต้องการของสถานประกอบการได้อย่างดี</p>\n<p> ดี (3 คะแนน)</p>\n<p>6</p>\n<p>ผลลัพธ์การเรียนรู้ที่คาดหวัง ผลการประเมิน</p>\n<p>สามารถผลิตผลงานที่อยู่ในระดับยอมรับได้ เนื้อหามีความ</p>\n<p>ถูกต้องในภาพรวมแต่ยังอาจขาดความลึกซึ้ง ใช้ภาษาไทย</p>\n<p>ได้ถูกต้องในระดับพื้นฐาน การนําเสนอผลงานมีความ</p>\n<p>ชัดเจนพอสมควร แต่ยังขาดความดึงดูดใจหรือความลื่นไหล</p>\n<p>ในการนําเสนอ</p>\n<p> พอใช้ (2 คะแนน)</p>\n<p>การผลิตผลงานยังอยู่ในระดับพื้นฐาน เนื้อหามีความ</p>\n<p>ถูกต้องบางส่วน แต่ขาดความสมบูรณ์หรือไม่ชัดเจน</p>\n<p>เพียงพอ การใช้ภาษาไทยอาจมีข้อผิดพลาดบ้าง การ</p>\n<p>นําเสนอผลงานขาดความชัดเจนและยังต้องการการพัฒนา</p>\n<p> ควรปรับปรุง (1 คะแนน)</p>\n<p>ไม่สามารถผลิตผลงานที่ตอบโจทย์หรือเหมาะสมกับ</p>\n<p>วัตถุประสงค์ได้ การใช้ภาษาไทยมีข้อผิดพลาดจํานวนมาก</p>\n<p>การนําเสนอผลงานขาดความชัดเจนและไม่สามารถดึงดูด</p>\n<p>ความสนใจของผู้ฟังได้</p>\n<p>ตอนท ี่ 2 ผลลัพธ์การเรียนรู้ด้านทักษะทางสังคม</p>\n<p>ลักษณะบุคคล/สมรรถนะ ผลการประเมิน</p>\n<h3 class=\"domain-title\">ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO6</span> <span class=\"lo-desc\">แสดงออกถึงความซื่อสัตย์ ความกตัญญู ความ  ดีเยี่ยม (5 คะแนน)</span></div>\n<p>รับผิดชอบต่อตนเองและส่วนรวม ยึดมั่นตามหลัก แสดงออกถึงความซื่อสัตย์ ความกตัญญู และความ</p>\n<p>จรรยาบรรณวิชาชีพ และเคารพต่อกฎระเบียบของ รับผิดชอบอย่างโดดเด่นในทุกด้าน ทั้งต่อตนเองและ</p>\n<p>สถานประกอบการ ส่วนรวม ปฏิบัติตามหลักจรรยาบรรณวิชาชีพอย่าง</p>\n<p>เคร่งครัด มีวินัยและปฏิบัติตามกฎระเบียบของสถาน</p>\n<p>ประกอบการโดยไม่ต้องมีการเตือนหรือกํากับ</p>\n<p> ดีมาก (4 คะแนน)</p>\n<p>มีความซื่อสัตย์ ความกตัญญ ู และความรับผิดชอบใน</p>\n<div class=\"rubric-level\">ระดับดี แสดงออกถึงการยึดมั่นในจรรยาบรรณ</div>\n<p>วิชาชีพและเคารพกฎระเบียบของสถาน</p>\n<p>ประกอบการอย่างเหมาะสม อาจมีข้อผิดพลาด</p>\n<p>เล็กน้อย แต่สามารถแก้ไขได้โดยไม่ต้องการ</p>\n<p>คําแนะนําเพิ่มเติม</p>\n<p>7</p>\n<p>ลักษณะบุคคล/สมรรถนะ ผลการประเมิน</p>\n<p> ดี (3 คะแนน)</p>\n<p>มีความซื่อสัตย์ ความกตัญญ ู และความรับผิดชอบใน</p>\n<p>ระดับที่ยอมรับได้ แสดงออกถึงความตั้งใจที่จะยึด</p>\n<p>มั่นในจรรยาบรรณวิชาชีพและปฏิบัติตาม</p>\n<p>กฎระเบียบ แต่บางครั้งอาจต้องการคําเตือนหรือ</p>\n<p>คําแนะนําเพื่อปรับปรุงพฤติกรรม</p>\n<p> พอใช้ (2 คะแนน)</p>\n<p>แสดงความซื่อสัตย์ ความกตัญญู และความ</p>\n<p>รับผิดชอบในระดับพื้นฐาน แต่ยังขาดความต่อเนื่อง</p>\n<p>และความมั่นคงในการปฏิบัติ บางครั้งไม่สามารถ</p>\n<p>ปฏิบัติตามจรรยาบรรณวิชาชีพหรือกฎระเบียบได้</p>\n<p>อย่างเหมาะสม และต้องการการกํากับดูแลอย่าง</p>\n<p>ใกล้ชิด</p>\n<p> ควรปรับปรุง (1 คะแนน)</p>\n<p>ขาดการแสดงออกถึงความซื่อสัตย์ ความกตัญญู</p>\n<p>และความรับผิดชอบอย่างชัดเจน ไม่ปฏิบัติตามหลัก</p>\n<p>จรรยาบรรณวิชาชีพหรือกฎระเบียบของสถาน</p>\n<p>ประกอบการ และมีพฤติกรรมที่ส่งผลเสียต่อ</p>\n<p>ส่วนรวม</p>\n<h3 class=\"domain-title\">ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO7</span> <span class=\"lo-desc\">แสดงออกถึงการมีวินัย การมีภาวะผู้นํา  ดีเยี่ยม (5 คะแนน)</span></div>\n<p>สามารถเป็นได้ทั้งผู้นําและผู้ตาม ทํางานร่วมกับผู้อื่น แสดงออกถึงการมีวินัยและภาวะผู้นําอย่างเด่นชัด</p>\n<p>ได ้ สามารถทํางานร่วมกับผู้อื่นได้ดีทั้งในบทบาทของ</p>\n<p>ผู้นําและผู้ตาม การทํางานในทีมเป็นไปอย่างราบรื่น</p>\n<p>มีการสนับสนุนและกระตุ้นทีมให้สําเร็จตาม</p>\n<p>เป้าหมาย สามารถตัดสินใจได้ดีในสถานการณ์ต่าง ๆ</p>\n<p>และรับผิดชอบในการตัดสินใจของตนเอง</p>\n<p> ดีมาก (4 คะแนน)</p>\n<p>มีวินัยและภาวะผู้นําที่ดี สามารถทํางานร่วมกับผู้อื่น</p>\n<p>ได้ทั้งในบทบาทของผู้นําและผู้ตาม มีการสนับสนุน</p>\n<p>ทีมและทํางานร่วมกันได้อย่างดี การตัดสินใจใน</p>\n<p>สถานการณ์ต่าง ๆ สามารถทําได้ดี และยึดมั่นใน</p>\n<p>หน้าที่ความรับผิดชอบ</p>\n<p>8</p>\n<p>ลักษณะบุคคล/สมรรถนะ ผลการประเมิน</p>\n<p> ดี (3 คะแนน)</p>\n<p>มีวินัยและภาวะผู้นําในระดับที่ดี แต่ยังต้องการการ</p>\n<p>พัฒนาเพิ่มเติมในการทํางานร่วมกับผู้อื่นในบาง</p>\n<p>สถานการณ์ สามารถเป็นผู้นําและผู้ตามได้ตาม</p>\n<p>สถานการณ์ แต่บางครั้งอาจขาดการแสดงออกที่</p>\n<p>ชัดเจนหรือการตัดสินใจที่แข็งแกร่ง</p>\n<p> พอใช้ (2 คะแนน)</p>\n<p>แสดงวินัยในระดับพื้นฐานและสามารถทํางาน</p>\n<p>ร่วมกับผู้อื่นได้ในบางสถานการณ์ การมีภาวะผู้นํายัง</p>\n<p>ไม่ชัดเจนและต้องการการสนับสนุนจากผู้อื่นในบาง</p>\n<p>กรณ ี การทํางานร่วมกับทีมอาจไม่ราบรื่นเท่าที่ควร</p>\n<p> ควรปรับปรุง (1 คะแนน)</p>\n<p>ไม่แสดงออกถึงการมีวินัยหรือภาวะผู้นําที่เหมาะสม</p>\n<p>การทํางานร่วมกับผู้อื่นมีปัญหา ไม่สามารถเป็นทั้ง</p>\n<p>ผู้นําและผู้ตามได้อย่างมีประสิทธิภาพ จําเป็นต้อง</p>\n<p>พัฒนาในการตัดสินใจและการทํางานเป็นทีม</p>\n<p>9</p>"}, {"name": "หลักสูตรภาษาจีน", "file": "1. สำนักวิชาครุศาสตร์และศิลปศาสตร์ 3 หลักสูตร\\ผลลัพธ์การเรียนรู้ที่คาดหวังของหลักสูตรภาษาจีน.pdf", "ext": "pdf", "html": "<p>ตอนท ี่ 1 ผลลัพธ์การเรียนรู้ที่คาดหวังของหลักสูตรภาษาจีนด้านความรู้และทักษะ กำหนดตาม LOs</p>\n<p>ของรายวิชาสหกิจศึกษา</p>\n<p>ผลลัพธ์การเรียนรู้ที่คาดหวัง</p>\n<h3 class=\"domain-title\">ด้านความรู้ (knowledge)</h3>\n<div class=\"eval-item\">1. ประยุกต์ใช้ความรู้ภาษาจีนเพื่อการสื่อสารด้านการแปล หรือธุกิจ หรือท่องเที่ยว (ขึ้นกับวิชาโทที่ผู้เรียนเลือก)</div>\n<p>ให้เหมาะสมกับการปฏิบัติงานได้</p>\n<h3 class=\"domain-title\">ด้านทักษะ (Skills)</h3>\n<div class=\"eval-item\">2. มีทักษะการสื่อสารภาษาจีนในฐานะภาษาต่างประเทศ ควบคู่ไปกับภาษาไทย และภาษาอังกฤษตามบริบท</div>\n<p>การทำงานได้อย่างเหมาะสม</p>\n<div class=\"eval-item\">3. มีทักษะด้านเทคโนโลยีดิจิทัล เพื่อศึกษาค้นคว้าข้อมูล และนำเสนอผลงานได้ตรงตามความต้องการของสถาน</div>\n<p>ประกอบการ</p>\n<div class=\"eval-item\">4. มีทักษะการคิด วิเคราะห์อย่างมีเหตุผล และการเรียนรู้อย่างต่อเนื่อง</div>\n<p>ตอนท ี่ 2 ผลลัพธ์การเรียนรู้ที่คาดหวังและผลการประเมินของหลักสูตรภาษาจีนด้านความรู้และทักษะ</p>\n<p>กำหนดตาม LOs ของรายวิชาสหกิจศึกษา</p>\n<p>ผลลัพธ์การเรียนรู้ที่คาดหวัง ผลการประเมิน</p>\n<h3 class=\"domain-title\">ด้านความรู้ (knowledge)</h3>\n<div class=\"eval-item\">1. ประยุกต์ใช้ความรู้ภาษาจีนเพื่อการสื่อสาร * ระดับยอดเยี่ยม (ประยุกต์ใช้ความรู้ภาษาจีนในการสื่อสาร</div>\n<p>ด้านการแปล หรือธุกิจ หรือท่องเที่ยว (ขึ้นกับ ได้อย่างเชี่ยวชาญ มีความคิดสร้างสรรค์และแก้ไขปัญหา</p>\n<p>วิชาโทที่ผู้เรียนเลือก) ให้เหมาะสมกับการ ให้กับสถานประกอบการได้อย่างมีประสิทธิภาพ/ สามารถ</p>\n<p>ปฏิบัติงานได้ ดำเนินการได้ด้วยตนเอง)</p>\n<p>*ระดับดีมาก (ประยุกต์ใช้ความรู้ภาษาจีนในการสื่อสารและ</p>\n<p>แก้ไขปัญหาให้กับสถานประกอบการได้ดี/ สามารถ</p>\n<p>ดำเนินการได้ด้วยตนเอง)</p>\n<p>*ระดับด ี (ประยุกต์ใช้ความรู้ภาษาจีนในการสื่อสารและแก้ไข</p>\n<p>ปัญหาให้กับสถานประกอบการได้ โดยต้องมีการดูแลบางครั้ง</p>\n<p>จากผู้นิเทศ)</p>\n<p>*ระดับพอใช้ (สามารถใช้ความรู้ภาษาจีนในการสื่อสารและ</p>\n<p>แก้ไขปัญหาให้กับสถานประกอบการได้ โดยมีการดูแลจากผู้</p>\n<p>นิเทศอย่างใกล้ชิด)</p>\n<p>*ระดับควรปรับปรุง (ไม่แสดงออกถึงผลการเรียนรู้ดังกล่าว</p>\n<p>ควรปรับปรุง)</p>\n<h3 class=\"domain-title\">ด้านทักษะ (Skills)</h3>\n<p>ผลลัพธ์การเรียนรู้ที่คาดหวัง ผลการประเมิน</p>\n<div class=\"eval-item\">2. มีทักษะการสื่อสารภาษาจีนในฐานะ *ระดับยอดเยี่ยม (สามารถสื่อสารภาษาจีน ภาษาไทย และ</div>\n<p>ภาษาต่างประเทศ ควบคู่ไปกับภาษาไทย และ ภาษาอังกฤษได้อย่างคล่องแคล่ว เข้าใจง่าย ชัดเจน ถูกต้อง</p>\n<p>ภาษาอังกฤษตามบริบทการทำงานได้อย่าง และมีประสิทธิภาพด้วยตนเอง รวมถึงชี้แจงผลการ</p>\n<p>เหมาะสม ดำเนินงาน และตอบคำถามได้ดี)</p>\n<p>*ระดับดีมาก (สามารถสื่อสารภาษาจีน ภาษาไทย และ</p>\n<p>ภาษาอังกฤษได้อย่างเข้าใจง่าย ชัดเจน ถูกต้อง รู้จักสอบถาม</p>\n<p>และชี้แจงผลการดำเนินงานและ ตอบคำถามได้ดี)</p>\n<p>*ระดับดี (สามารถสื่อสารภาษาจีน ภาษาไทย และ</p>\n<p>ภาษาอังกฤษได้อย่างเข้าใจง่าย ชัดเจน ถูกต้อง)</p>\n<p>*ระดับพอใช้ (สามารถสื่อสารภาษาจีน ภาษาไทย และ</p>\n<p>ภาษาอังกฤษได้)</p>\n<p>*ระดับควรปรับปรุง (ไม่แสดงออกถึงผลการเรียนรู้ดังกล่าว</p>\n<p>ควรปรับปรุง)</p>\n<div class=\"eval-item\">3. มีทักษะด้านเทคโนโลยีดิจิทัล เพื่อศึกษา *ระดับยอดเยี่ยม (ออกแบบสื่อหรือกระบวนการในการ</div>\n<p>ค้นคว้าข้อมูล และนำเสนอผลงานได้ตรงตาม สร้างสรรค์ผลงาน และนำเสนอผลงานได้ถูกต้องตามความ</p>\n<p>ความต้องการของสถานประกอบการ ต้องการของสถานประกอบการ)</p>\n<p>*ระดับดีมาก (ออกแบบสื่อหรือกระบวนการในการ</p>\n<p>สร้างสรรค์ผลงาน และนำเสนอผลงานได้)</p>\n<p>*ระดับดี (ประยุกต์ใช้เทคโนโลยีสื่อดิจิทัลเพื่อแก้ปัญหาใน</p>\n<p>การทำงานได้)</p>\n<p>*ระดับพอใช้ (สามารถใช้เทคโนโลยีสื่อดิจิทัลเพื่อการทำงาน</p>\n<p>ได้)</p>\n<p>*ระดับควรปรับปรุง (ไม่แสดงออกถึงผลการเรียนรู้ดังกล่าว</p>\n<p>ควรปรับปรุง)</p>\n<p>ผลลัพธ์การเรียนรู้ที่คาดหวัง ผลการประเมิน</p>\n<div class=\"eval-item\">4. มีทักษะการคิด วิเคราะห์อย่างมีเหตุผล และ *ระดับยอดเยี่ยม (คิด วิเคราะห์อย่างมีเหตุผล สามารถนำ</div>\n<p>การเรียนรู้อย่างต่อเนื่อง ความรู้ที่แสวงหามาประยุกต์ใช้ให้เหมาะสมกับความต้องการ</p>\n<p>ของสถานประกอบการอย่างต่อเนื่อง)</p>\n<p>*ระดับดีมาก (คิด วิเคราะห์อย่างมีเหตุผล เรียนรู้งานของ</p>\n<p>ของสถานประกอบการอย่างต่อเนื่อง)</p>\n<p>*ระดับดี (คิด วิเคราะห์อย่างมีเหตุผล เรียนรู้งานของของ</p>\n<p>สถานประกอบการเพื่อการทำงานได้)</p>\n<p>*ระดับพอใช้ (เรียนรู้งานของสถานประกอบการเพื่อการ</p>\n<p>ทำงานได้)</p>\n<p>*ระดับควรปรับปรุง (ไม่แสดงออกถึงผลการเรียนรู้ดังกล่าว</p>\n<p>ควรปรับปรุง)</p>"}]}, {"faculty": "สำนักวิชาแพทยศาสตร์", "curricula": [{"name": "หลักสูตรวิทยาศาสตร์การกีฬาและการออกกำลังกาย", "file": "2. สำนักวิชาแพทยศาสตร์ 1หลักสูตร\\แบบประเมินสหกิจศึกษาที่สอดคล้องกับ LOs รายวิชาสหกิจศึกษา (วิทย์กีฬา).pdf", "ext": "pdf", "html": "<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของหลักสูตร (Program Learning Outcomes: PLOs)</h2>\n<p>หลักสูตรวิทยาศาสตรบัณฑิต สาขาวิทยาศาสตร์การกีฬาและการออกกำลังกาย</p>\n<p>(หลักสูตรปรับปรุง พ.ศ. 2567)</p>\n<h3 class=\"domain-title\">1) ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO1</span> <span class=\"lo-desc\">อธิบายความรู้วิทยาศาสตร์พื้นฐานทั่วไป มนุษยศาสตร์ สังคมศาสตร์ทั่วไป พื้นฐานเทคโนโลยี</span></div>\n<p>สารสนเทศ และศาสตร์ด้านวิทยาศาสตร์การกีฬาและการออกกำลังกาย</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO2</span> <span class=\"lo-desc\">ประยุกต์ความรู้ด้านวิทยาศาสตร์พื้นฐานทั่วไป เทคโนโลยีสารสนเทศ และศาสตร์ด้านวิทยาศาสตร์</span></div>\n<p>การกีฬาและการออกกำลังกาย เพื่อการส่งเสริม ฟื้นฟูสุขภาพ และพัฒนาศักยภาพนักกีฬา</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO3</span> <span class=\"lo-desc\">วิเคราะห์และประเมินสมรรถภาพทางกายสำหรับจัดโปรแกรมการออกกำลังกายได้อย่างเหมาะสม</span></div>\n<p>กับกลุ่มเป้าหมาย</p>\n<h3 class=\"domain-title\">2) ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO4</span> <span class=\"lo-desc\">มีทักษะการปฏิบัติทางวิทยาศาสตร์การกีฬาและการออกกำลังกายได้อย่างถูกต้องตามหลัก</span></div>\n<p>วิชาการ</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO5</span> <span class=\"lo-desc\">มีทักษะในการใช้เครื่องมือทางวิทยาศาสตร์การกีฬาและการออกกำลังกายได้อย่างถูกต้องตาม</span></div>\n<p>หลักวิชาการ</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO6</span> <span class=\"lo-desc\">มีทักษะการวิจัยเพื่อสร้างงานนวัตกรรมและแก้ปัญหาเกี่ยวกับวิทยาศาสตร์การกีฬาและการออก</span></div>\n<p>กำลังกาย</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO7</span> <span class=\"lo-desc\">มีทักษะการสื่อสารทั้งภาษาไทยและภาษาอังกฤษ ในการดำเนินชีวิตและการทำงานด้าน</span></div>\n<p>วิทยาศาสตร์การกีฬาทั้งการฟัง พูด อ่าน และเขียน และการนำเสนอผลงานได้ตามวัตถุประสงค์ หรือในกรณีที่</p>\n<p>นักศึกษาเลือกเรียนภาษาจีนจะต้องมีทักษะสื่อสารภาษาจีนในชีวิตประจำวันได้</p>\n<h3 class=\"domain-title\">3) ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO8</span> <span class=\"lo-desc\">แสดงออกถึงมีความซื่อสัตย์ มีความกตัญญู มีความรับผิดชอบต่อตนเอง ผู้อื่นและสังคม เคารพและ</span></div>\n<p>ปฏิบัติตามกฎระเบียบที่กำหนด</p>\n<h3 class=\"domain-title\">4) ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO9</span> <span class=\"lo-desc\">แสดงออกถึงการมีน้ าใจนักกีฬา ใฝ่เรียนรู้ มีความอดทนและเชื่อมั่นในตนเอง</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO10</span> <span class=\"lo-desc\">แสดงออกถึงการมีวินัย มีภาวะผู้นำ สามารถเป็นได้ทั้งผู้นำและผู้ตาม ทำงานร่วมกับผู้อื่นได้</span></div>\n<p>และมีจิตอาสา</p>\n<p>1</p>\n<p>(ร่าง) ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษา (Learning Outcome: LO)</p>\n<p>หลักสูตรวิทยาศาสตรบัณฑิต สาขาวิทยาศาสตร์การกีฬาและการออกกำลังกาย</p>\n<p>(หลักสูตรปรับปรุง พ.ศ. 2567)</p>\n<h3 class=\"domain-title\">1) ด้านความรู้ (knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">ประยุกต์ใช้ความรู้ด้านวิทยาศาสตร์การกีฬาและการออกกำลังกาย เพื่อการส่งเสริม ฟื้นฟูสุขภาพ</span></div>\n<p>และพัฒนาศักยภาพให้กับกลุ่มเป้าหมายในสถานประกอบการได้</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">วิเคราะห์และประเมินสมรรถภาพทางกายสำหรับจัดโปรแกรมการออกกำลังกายได้อย่างเหมาะสม</span></div>\n<p>กับกลุ่มเป้าหมายในสถานประกอบการได้</p>\n<h3 class=\"domain-title\">2) ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">มีทักษะการปฏิบัติทางวิทยาศาสตร์การกีฬาและการออกกำลังกายได้อย่างถูกต้องตามหลักวิชาการ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">มีทักษะในการใช้เครื่องมือทางวิทยาศาสตร์การกีฬาและการออกกำลังกายได้อย่างถูกต้องตามหลัก</span></div>\n<p>วิชาการ</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">มีทักษะการสื่อสารในการทำงานด้านวิทยาศาสตร์การกีฬาได้อย่างเหมาะสม</span></div>\n<h3 class=\"domain-title\">3) ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO6</span> <span class=\"lo-desc\">แสดงออกถึงมีความซื่อสัตย์ มีความรับผิดชอบต่อตนเอง ผู้อื่นและสังคม เคารพและปฏิบัติตาม</span></div>\n<p>กฎระเบียบที่กำหนด</p>\n<h3 class=\"domain-title\">4) ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO7</span> <span class=\"lo-desc\">แสดงออกถึงการมีวินัย มีภาวะผู้นำ สามารถเป็นได้ทั้งผู้นำและผู้ตาม ทำงานร่วมกับผู้อื่นได้ และ</span></div>\n<p>มีจิตอาสา</p>\n<p>2</p>\n<h2 class=\"section-title\">(ร่าง) แบบประเมินผลการปฏิบัติสหกิจศึกษาตามผลลัพธ์การเรียนรู้ที่คาดหวัง</h2>\n<h3 class=\"domain-title\">ตอนที่ 1 ผลลัพธ์การเรียนรู้ที่คาดหวังของหลักสูตรด้านความรู้และทักษะ</h3>\n<p>ผลลัพธ์การเรียนรู้ที่คาดหวัง ผลการประเมิน</p>\n<h3 class=\"domain-title\">ด้านความรู้ (knowledge)</h3>\n<div class=\"eval-item\">1. ประยุกต์ใช้ความรู้ด้านวิทยาศาสตร์การกีฬาและ ระดับดีมาก (ประยุกต์ใช้ความรู้ในการส่งเสริม</div>\n<p>การออกกำลังกายได้อย่างเหมาะสมกับการปฏิบัติงาน</p>\n<p>สุขภาพ และพัฒนาศักยภาพให้กับกลุ่มเป้าหมายได้</p>\n<p>ถูกต้อง พร้อมอธิบายเหตุผลเชิงลึก)</p>\n<div class=\"rubric-level\">ระดับดี (ประยุกต์ใช้ความรู้ในการส่งเสริมสุขภาพ</div>\n<p>และพัฒนาศักยภาพให้กับกลุ่มเป้าหมายได้เหมาะสม</p>\n<p>ส่วนใหญ่ และอธิบายเหตุผลได้)</p>\n<div class=\"rubric-level\">ระดับพอใช้ (สามารถใช้ความรู้ในการส่งเสริม</div>\n<p>สุขภาพ และและพัฒนาศักยภาพให้กับกลุ่มเป้าหมาย</p>\n<p>ได้บางส่วน และอธิบายเหตุผลได้ไม่ครบถ้วน)</p>\n<div class=\"rubric-level\">ระดับควรปรับปรุง (ไม่แสดงออกถึงผลการเรียนรู้</div>\n<p>ดังกล่าว ควรปรับปรุง)</p>\n<div class=\"eval-item\">2. วิเคราะห์และประเมินสมรรถภาพทางกายสำหรับ ระดับดีมาก (วิเคราะห์สมรรถภาพทางกายได้</div>\n<p>จัดโปรแกรมการออกกำลังกายได้อย่างเหมาะสม</p>\n<p>ถูกต้องครบถ้วน ออกแบบโปรแกรมได้เหมาะสมกับ</p>\n<p>เป้าหมายและความต้องการเฉพาะบุคคล พร้อม</p>\n<p>อธิบายเหตุผลเชิงลึกได้)</p>\n<div class=\"rubric-level\">ระดับดี (วิเคราะห์สมรรถภาพได้ถูกต้องส่วนใหญ่</div>\n<p>ออกแบบโปรแกรมได้เหมาะสมในภาพรวม และ</p>\n<p>อธิบายเหตุผลได้ครอบคลุม)</p>\n<p>ระดับพอใช ้ (วิเคราะห์สมรรถภาพได้บางส่วน</p>\n<p>ออกแบบโปรแกรมได้ในระดับพื้นฐาน และอธิบายเหตุ</p>\n<p>ผลได้เพียงบางส่วน)</p>\n<div class=\"rubric-level\">ระดับควรปรับปรุง (ไม่แสดงออกถึงผลการเรียนรู้</div>\n<p>ดังกล่าว ควรปรับปรุง)</p>\n<h3 class=\"domain-title\">ด้านทักษะ (Skills)</h3>\n<div class=\"eval-item\">3. มีทักษะการปฏิบัติทางวิทยาศาสตร์การกีฬาและ ระดับดีมาก (ปฏิบัติถูกต้องตามหลักวิชาการทุก</div>\n<p>การออกกำลังกายได้อย่างถูกต้องตามหลักวิชาการ</p>\n<p>ขั้นตอน และอธิบายเหตุผลได้ชัดเจน)</p>\n<div class=\"rubric-level\">ระดับดี (ปฏิบัติถูกต้องส่วนใหญ่ มีข้อผิดพลาด</div>\n<p>เล็กน้อย และอธิบายเหตุผลได้ครอบคลุม)</p>\n<p>3</p>\n<p>ผลลัพธ์การเรียนรู้ที่คาดหวัง ผลการประเมิน</p>\n<div class=\"rubric-level\">ระดับพอใช้ (ปฏิบัติถูกต้องบางส่วน และอธิบาย</div>\n<p>เหตุผลได้เพียงบางส่วน)</p>\n<div class=\"rubric-level\">ระดับควรปรับปรุง (ไม่แสดงออกถึงผลการเรียนรู้</div>\n<p>ดังกล่าว ควรปรับปรุง)</p>\n<div class=\"eval-item\">4. มีทักษะในการใช้เครื่องมือทางวิทยาศาสตร์การกีฬา ระดับดีมาก (ใช้เครื่องมือได้ถูกต้องตามหลัก</div>\n<p>และการออกกำลังกายได้อย่างถูกต้องตามหลัก</p>\n<p>วิชาการทุกขั้นตอนและอธิบายการใช้งานได้เชิงลึก)</p>\n<p>วิชาการ</p>\n<div class=\"rubric-level\">ระดับดี (ใช้เครื่องมือได้ถูกต้องในส่วนใหญ่ มี</div>\n<p>ข้อผิดพลาดเล็กน้อยที่ไม่กระทบผลลัพธ์ และอธิบาย</p>\n<p>การใช้งานได้)</p>\n<div class=\"rubric-level\">ระดับพอใช้ (ใช้เครื่องมือถูกต้องบางส่วน มี</div>\n<p>ข้อผิดพลาดสำคัญ และอธิบายได้เพียงบางส่วน)</p>\n<div class=\"rubric-level\">ระดับควรปรับปรุง (ไม่แสดงออกถึงผลการเรียนรู้</div>\n<p>ดังกล่าว ควรปรับปรุง)</p>\n<div class=\"eval-item\">5. มีทักษะการสื่อสาร ระดับดีมาก (สามารถสื่อสาร การพูด การเขียน</div>\n<p>การนำเสนอ ได้อย่างเข้าใจง่าย เรียบร้อย ชัดเจน</p>\n<p>ถูกต้อง รู้จักสอบถามและชี้แจงผลการดำเนินงานและ</p>\n<p>ตอบคำถามได้ดี)</p>\n<div class=\"rubric-level\">ระดับดี (สามารถสื่อสาร การพูด การเขียน การ</div>\n<p>นำเสนอ ได้อย่างเข้าใจได้ง่าย เรียบร้อย ชัดเจน</p>\n<p>ถูกต้อง)</p>\n<div class=\"rubric-level\">ระดับพอใช้ (สามารถสื่อสาร การพูด การเขียน</div>\n<p>การนำเสนอได้)</p>\n<div class=\"rubric-level\">ระดับควรปรับปรุง (ไม่แสดงออกถึงผลการเรียนรู้</div>\n<p>ดังกล่าว ควรปรับปรุง)</p>\n<h3 class=\"domain-title\">ตอนที่ 2 ผลลัพธ์การเรียนรู้ด้านทักษะทางสังคม</h3>\n<p>ผลลัพธ์การเรียนรู้ที่คาดหวัง ผลการประเมิน</p>\n<h3 class=\"domain-title\">ด้านจริยธรรม (Ethics)</h3>\n<div class=\"eval-item\">6. มีความซื่อสัตย์ สุจริต เคารพต่อกฎระเบียบของ ระดับดีมาก (ปฏิบัติตามทุกกฎระเบียบและ</div>\n<p>องค์กร</p>\n<p>นโยบายขององค์กรอย่างเคร่งครัด ไม่มีการละเมิดหรือ</p>\n<p>ทุจริต)</p>\n<p>4</p>\n<p>ผลลัพธ์การเรียนรู้ที่คาดหวัง ผลการประเมิน</p>\n<div class=\"rubric-level\">ระดับดี (ปฏิบัติตามกฎระเบียบและนโยบายส่วน</div>\n<p>ใหญ่ อาจมีการละเมิดบ้างในบางครั้งแต่ไม่เป็นปัญหา</p>\n<p>ร้ายแรง)</p>\n<div class=\"rubric-level\">ระดับพอใช้ (มีการปฏิบัติตามกฎระเบียบและ</div>\n<p>นโยบายบางประการ แต่บางครั้งอาจละเลยหรือ</p>\n<p>ละเมิดกฎระเบียบ)</p>\n<div class=\"rubric-level\">ระดับควรปรับปรุง (มีการละเมิดกฎระเบียบและ</div>\n<p>นโยบายอย่างสม่ าเสมอ มีการกระทำที่ไม่ซื่อสัตย์หรือ</p>\n<p>ทุจริต)</p>\n<div class=\"eval-item\">7. มีความรับผิดชอบต่องานที่ได้รับมอบหมาย ส่งงาน ระดับดีมาก (ส่งงานทั้งหมดตามกำหนดเวลาที่</div>\n<p>ที่ได้รับมอบหมายตรงเวลา</p>\n<p>กำหนดเสมอ มีการวางแผนและจัดการเวลาได้อย่างมี</p>\n<p>ประสิทธิภาพ งานที่ส่งมอบมีคุณภาพสูง ตรงตาม</p>\n<p>ความคาดหวัง)</p>\n<div class=\"rubric-level\">ระดับดี (ส่งงานตามกำหนดเวลาเกือบทั้งหมด</div>\n<p>อาจมีการล่าช้าเล็กน้อยบางครั้ง แต่สามารถจัดการ</p>\n<p>เวลาได้ดี ส่งมอบมีคุณภาพดี ตรงตามข้อกำหนดส่วน</p>\n<p>ใหญ่ แต่</p>\n<p>มีข้อผิดพลาดเล็กน้อยที่สามารถแก้ไขได้)</p>\n<div class=\"rubric-level\">ระดับพอใช้ (มีการล่าช้าในการส่งงานบ้าง ส่งงาน</div>\n<p>ไม่ตรงเวลาตามกำหนดบางครั้ง คุณภาพพอใช้)</p>\n<div class=\"rubric-level\">ระดับควรปรับปรุง (ส่งงานล่าช้าอยู่เสมอ หรือไม่</div>\n<p>สามารถปฏิบัติตามกำหนดเวลาได้ตามที่ต้องการ</p>\n<p>คุณภาพต่ า มีข้อผิดพลาดหรือข้อบกพร่องมากมายที่</p>\n<p>ต้องการการแก้ไขอย่างเร่งด่วน)</p>\n<h3 class=\"domain-title\">ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"eval-item\">8. เคารพสิทธิ์และรับฟังความคิดเห็นของผู้อื่น ระดับดีมาก (แสดงความเคารพต่อสิทธิและความ</div>\n<p>คิดเห็นของผู้อื่นเสมอ ฟังความคิดเห็นอย่างเต็มที่และ</p>\n<p>ให้ความสำคัญกับมุมมองที่แตกต่าง)</p>\n<div class=\"rubric-level\">ระดับดี (แสดงความเคารพต่อสิทธิและความ</div>\n<p>คิดเห็นของผู้อื่นในระดับดี ฟังความคิดเห็นและ</p>\n<p>พิจารณามุมมองที่แตกต่างได้ดี)</p>\n<p>5</p>\n<p>ผลลัพธ์การเรียนรู้ที่คาดหวัง ผลการประเมิน</p>\n<div class=\"rubric-level\">ระดับพอใช้ (เคารพสิทธิและความคิดเห็นของ</div>\n<p>ผู้อื่นบางครั้ง แต่บางครั้งอาจมีการแสดงออกที่ไม่เต็มที่</p>\n<p>หรือ</p>\n<p>ขาดความใส่ใจ)</p>\n<div class=\"rubric-level\">ระดับควรปรับปรุง (ขาดความเคารพต่อสิทธิและ</div>\n<p>ความคิดเห็นของผู้อื่น มักไม่ฟังความคิดเห็นหรือไม่ให้</p>\n<p>ความสำคัญกับมุมมองที่แตกต่าง)</p>\n<p>6</p>"}]}, {"faculty": "สำนักวิชาสารสนเทศศาสตร์", "curricula": [{"name": "หลักสูตรนิเทศศาสตร์", "file": "3. สำนักวิชาสารสนเทศศาสตร์ 5 หลักสูตร\\1.ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษา หลักสูตรนิเทศศาสตร์.docx", "ext": "docx", "html": "<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษา (Learning Outcome: LO) หลักสูตรนิเทศศาสตร์ดิจิทัล</h2>\n<h3 class=\"domain-title\">1) ด้านความรู้ (knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">ประยุกต์ใช้ความรู้ด้านนิเทศศาสตร์ เพื่อวางแผนและแก้ไขปัญหาในการสร้างสรรค์และผลิตสื่อ หรือการสื่อสารองค์กรดิจิทัลและอีเว้นท์ (ขึ้นอยู่กับวิชาโทที่ผู้เรียนเลือก) ในสถานประกอบการได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">ประยุกต์ใช้แนวคิดการรู้เท่าทันสื่อและวิเคราะห์ข้อมูลข่าวสาร เพื่อนำไปใช้ในการสร้างสรรค์ผลงานในสถานประกอบการได้</span></div>\n<h3 class=\"domain-title\">2) ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">มีทักษะการใช้นวัตกรรมการสื่อสารและเทคโนโลยีสื่อดิจิทัลได้ตรงตามความต้องการขององค์กรและอุตสาหกรรมสื่อดิจิทัลได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">มีทักษะในการผลิตเนื้อหาหลากหลายรูปแบบบนมัลติแพลตฟอร์ม เพื่อตอบสนองต่อองค์กรและอุตสาหกรรมสื่อดิจิทัล</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">มีทักษะการนำเสนอเพื่อโน้มน้าวใจในการเจรจาต่อรองสำหรับงานด้านนิเทศศาสตร์</span></div>\n<h3 class=\"domain-title\">3) ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO6</span> <span class=\"lo-desc\">แสดงออกถึงความซื่อสัตย์ มีความกตัญญู เคารพต่อกฎระเบียบ มีความรับผิดชอบต่อตนเองและสังคม และยึดมั่นตามหลักจรรยาวิชาชีพสื่อ</span></div>\n<h3 class=\"domain-title\">4) ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO7</span> <span class=\"lo-desc\">แสดงออกถึงการมีวินัย การมีภาวะผู้นา สามารถเป็นได้ทั้งผู้นาและผู้ตาม สามารถทางานเป็นทีมและยอมรับความแตกต่างทางความคิดเห็นของผู้อื่น มีจิตอาสา และมีสุขภาวะ</span></div>\n<p>แบบประเมินผลการปฏิบัติสหกิจศึกษาตามผลลัพธ์การเรียนรู้ที่คาดหวัง รูปแบบ Rubric Scoring</p>\n<h3 class=\"domain-title\">ตอนที่ 1: ผลลัพธ์การเรียนรู้ที่คาดหวังของหลักสูตรด้านความรู้และทักษะ</h3>\n\n<h3 class=\"domain-title\">ตอนที่ 2 ผลลัพธ์การเรียนรู้ที่คาดหวังของหลักสูตรด้านทักษะทางสังคม</h3>\n\n<h4 class=\"table-marker\">[TABLE 1]</h4>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table\">\n<tr><td>ผลลัพธ์การเรียนรู้ที่คาดหวัง</td><td>ผลการประเมิน</td></tr>\n</table></div>\n<h3 class=\"domain-title\">ด้านความรู้ (Knowledge) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">ประยุกต์ใช้ความรู้ด้านนิเทศศาสตร์ เพื่อวางแผนและแก้ไขปัญหาในการสร้างสรรค์และผลิตสื่อ หรือการสื่อสารองค์กรดิจิทัลและอีเว้นท์ (ขึ้นอยู่กับวิชาโทที่ผู้เรียนเลือก) ในสถานประกอบการได้ | ☑ ระดับดีมาก (สามารถวางแผน แก้ไขปัญหา และสร้างสรรค์ผลงานได้อย่างมีประสิทธิภาพโดยไม่ต้องการการดูแลเพิ่มเติม)</span></div>\n<p>☑ ระดับดี (สามารถวางแผน แก้ไขปัญหา และสร้างสรรค์ผลงานได้ โดยมีการดูแลจากผู้นิเทศในบางครั้ง)</p>\n<p>☑ ระดับพอใช้ (สามารถดำเนินงานได้แต่ต้องการการดูแลใกล้ชิดจากผู้นิเทศ)</p>\n<p>☑ ระดับควรปรับปรุง (ไม่สามารถดำเนินงานตามผลลัพธ์ที่คาดหวังได้)</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">ประยุกต์ใช้แนวคิดการรู้เท่าทันสื่อและวิเคราะห์ข้อมูลข่าวสาร เพื่อนำไปใช้ในการสร้างสรรค์ผลงานในสถานประกอบการได้ | ☑ ระดับดีมาก (สามารถนำความรู้เท่าทันสื่อและวิเคราะห์ข้อมูลข่าวสารมาใช้ได้อย่างมีประสิทธิภาพ)</span></div>\n<p>☑ ระดับดี (สามารถนำแนวคิดการรู้เท่าทันสื่อไปใช้งานได้ แต่ต้องการการสนับสนุนบางครั้ง)</p>\n<p>☑ ระดับพอใช้ (มีพื้นฐานแต่ต้องการคำแนะนำอย่างต่อเนื่อง)</p>\n<p>☑ ระดับควรปรับปรุง (ยังไม่สามารถใช้แนวคิดได้)</p>\n<h3 class=\"domain-title\">ด้านทักษะ (Skills) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">มีทักษะการใช้นวัตกรรมการสื่อสารและเทคโนโลยีสื่อดิจิทัลได้ตรงตามความต้องการขององค์กรและอุตสาหกรรมสื่อดิจิทัลได้ | ☑ ระดับดีมาก (สามารถใช้นวัตกรรมและเทคโนโลยีสื่อดิจิทัลได้อย่างเชี่ยวชาญและเหมาะสมกับงาน)</span></div>\n<p>☑ ระดับดี (ใช้นวัตกรรมและเทคโนโลยีได้ดี แต่ต้องการคำแนะนำในบางครั้ง)</p>\n<p>☑ ระดับพอใช้ (สามารถใช้งานได้ในระดับพื้นฐาน)</p>\n<p>☑ ระดับควรปรับปรุง (ยังไม่สามารถใช้งานได้อย่างเหมาะสม)</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">มีทักษะในการผลิตเนื้อหาหลากหลายรูปแบบบนมัลติแพลตฟอร์ม เพื่อตอบสนองต่อองค์กรและอุตสาหกรรมสื่อดิจิทัล | ☑ ระดับดีมาก (ผลิตเนื้อหาได้หลากหลายรูปแบบและเหมาะสมกับแพลตฟอร์มต่าง ๆ)</span></div>\n<p>☑ ระดับดี (ผลิตเนื้อหาได้ดีในบางแพลตฟอร์ม แต่ต้องการคำแนะนำเพิ่มเติม)</p>\n<p>☑ ระดับพอใช้ (ผลิตเนื้อหาได้พื้นฐานแต่ยังไม่หลากหลาย)</p>\n<p>☑ ระดับควรปรับปรุง (ยังไม่สามารถผลิตเนื้อหาได้ตามที่คาดหวัง)</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">มีทักษะการนำเสนอเพื่อโน้มน้าวใจในการเจรจาต่อรองสำหรับงานด้านนิเทศศาสตร์ | ☑ ระดับดีมาก (นำเสนอได้ชัดเจนและโน้มน้าวใจอย่างมีประสิทธิภาพ)</span></div>\n<p>☑ ระดับดี (นำเสนอได้ดีแต่ต้องการการปรับปรุงบางจุด)</p>\n<p>☑ ระดับพอใช้ (สามารถนำเสนอได้ในระดับพื้นฐาน)</p>\n<p>☑ ระดับควรปรับปรุง (ยังไม่สามารถนำเสนอได้อย่างชัดเจน)</p>\n\n<h4 class=\"table-marker\">[TABLE 2]</h4>\n<h3 class=\"domain-title\">ด้านจริยธรรม (Ethics) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO6</span> <span class=\"lo-desc\">แสดงออกถึงความซื่อสัตย์ มีความกตัญญู เคารพต่อกฎระเบียบ มีความรับผิดชอบต่อตนเองและสังคม และยึดมั่นตามหลักจรรยาวิชาชีพสื่อ | ☑ ระดับดีมาก (ปฏิบัติตามจรรยาบรรณอย่างเคร่งครัดและแสดงความรับผิดชอบได้อย่างดีเยี่ยม)</span></div>\n<p>☑ ระดับดี (ปฏิบัติตามจรรยาบรรณได้ดี แต่ต้องการการกระตุ้นเพิ่มเติมในบางเรื่อง)</p>\n<p>☑ ระดับพอใช้ (ปฏิบัติได้ในระดับพื้นฐาน)</p>\n<p>☑ ระดับควรปรับปรุง (ยังไม่สามารถปฏิบัติตามจรรยาบรรณได้)</p>\n<h3 class=\"domain-title\">ด้านลักษณะบุคคล (Character) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO7</span> <span class=\"lo-desc\">แสดงออกถึงการมีวินัย การมีภาวะผู้นำ สามารถเป็นได้ทั้งผู้นำและผู้ตาม สามารถทำงานเป็นทีมและยอมรับความแตกต่างทางความคิดเห็นของผู้อื่น | ☑ ระดับดีมาก (แสดงความเป็นผู้นำและผู้ตามได้ดีเยี่ยม สามารถทำงานเป็นทีมอย่างมีประสิทธิภาพ)</span></div>\n<p>☑ ระดับดี (ทำงานร่วมกับทีมได้ดี แต่ยังต้องการการพัฒนาในบางเรื่อง)</p>\n<p>☑ ระดับพอใช้ (ทำงานร่วมกับทีมได้ในระดับพื้นฐาน)</p>\n<p>☑ ระดับควรปรับปรุง (ยังไม่สามารถทำงานเป็นทีมได้อย่างมีประสิทธิภาพ)</p>"}, {"name": "หลักสูตรเทคโนโลยีดิจิทัลทางการแพทย์ (พ.ศ. 2567)", "file": "3. สำนักวิชาสารสนเทศศาสตร์ 5 หลักสูตร\\2.ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษา หลักสูตรเทคโนโลยีดิจิทัลทางการแพทย์ พ.ศ.67.docx", "ext": "docx", "html": "<p>หลักสูตรเทคโนโลยีดิจิทัลทางการแพทย์</p>\n<p>ปรับปรุง พ.ศ. 2567</p>\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของหลักสูตร (Program Learning Outcomes: PLOs</h2>\n<h3 class=\"domain-title\">ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO1</span> <span class=\"lo-desc\">อธิบายองค์ความรู้วิทยาศาสตร์ทั่วไป สังคมศาสตร์และมนุษยศาสตร์ พื้นฐานเทคโนโลยีสารสนเทศ ความรู้พื้นฐานทางแพทย์ และความรู้ด้านเทคโนโลยีดิจิทัล ที่เกี่ยวข้องกับการพัฒนาระบบงานเทคโนโลยีดิจิทัลทางการแพทย์และสุขภาพ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO2</span> <span class=\"lo-desc\">อธิบายกฎหมายที่เกี่ยวข้องกับระบบงานเทคโนโลยีดิจิทัลทางการแพทย์และสุขภาพ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO3</span> <span class=\"lo-desc\">อธิบายวิธีการประเมินผลกระทบและประโยชน์ที่คาดว่าจะได้รับจากการพัฒนาระบบงานด้านเทคโนโลยีดิจิทัลทางการแพทย์และสุขภาพ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO4</span> <span class=\"lo-desc\">ประยุกต์ใช้องค์ความรู้ในการพัฒนาระบบงานด้านปัญญาประดิษฐ์ทางการแพทย์ หรือ นวัตกรรมการแพทย์ดิจิทัล ได้อย่างเหมาะสมกับความต้องการของผู้ใช้ (ขึ้นกับวิชาโทที่ผู้เรียนเลือก)</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO5</span> <span class=\"lo-desc\">วิเคราะห์ความต้องการที่แตกต่างและหลากหลายเพื่อแก้ปัญหางานทางการแพทย์และสุขภาพ</span></div>\n<h3 class=\"domain-title\">ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO6</span> <span class=\"lo-desc\">มีทักษะการสื่อสารภาษาไทย และภาษาอังกฤษหรือภาษาจีน(ในกรณีเลือกแผนภาษาจีน) เพื่อใช้ในชีวิตประจำวัน และในการทำงานด้านเทคโนโลยีดิจิทัลทางการแพทย์ ทั้งการฟัง พูด อ่าน เขียน และเสนอผลงานได้ตามวัตถุประสงค์</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO7</span> <span class=\"lo-desc\">มีทักษะการพัฒนาระบบงานด้านปัญญาประดิษฐ์ทางการแพทย์ หรือ นวัตกรรมการแพทย์ดิจิทัล ด้วยเทคโนโลยีที่เหมาะสม (ขึ้นกับวิชาโทที่ผู้เรียนเลือก)</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO8</span> <span class=\"lo-desc\">มีทักษะการวิจัยในการพัฒนาระบบงาน หรือแก้ปัญหา หรือสร้างนวัตกรรมทางการแพทย์และสุขภาพ ด้วยเทคโนโลยีดิจิทัล</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO9</span> <span class=\"lo-desc\">มีทักษะในการออกกำลังกายเพื่อสร้างสุขภาพที่ดีทั้งทางร่างกายและจิตใจ</span></div>\n<h3 class=\"domain-title\">ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO10</span> <span class=\"lo-desc\">แสดงออกถึงความซื่อสัตย์ มีความกตัญญู มีความรับผิดชอบต่อตนเองและสังคม</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO11</span> <span class=\"lo-desc\">ปฏิบัติตามกฎระเบียบและข้อบังคับที่เกี่ยวข้องในการปฏิบัติงานด้านเทคโนโลยีดิจิทัลทางการแพทย์ และมีความรับผิดชอบต่อการใช้ข้อมูลส่วนบุคคล</span></div>\n<h3 class=\"domain-title\">ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO12</span> <span class=\"lo-desc\">แสดงออกถึงการเรียนรู้ คิดริเริ่ม กำหนดเป้าหมาย วางแผน ปฏิบัติงานด้วยตนเองอย่างต่อเนื่อง ให้ทันต่อการเปลี่ยนแปลงของสังคมโลกยุคดิจิทัล</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO13</span> <span class=\"lo-desc\">แสดงออกถึงการมีภาวะผู้นำ สามารถเป็นได้ทั้งผู้นำและผู้ตาม ทำงานร่วมกับผู้อื่นได้ มีจิตอาสา และมีวินัย</span></div>\n\n<h2 class=\"section-title\">แบบประเมินผลการปฏิบัติสหกิจศึกษาตามผลลัพธ์การเรียนรู้ที่คาดหวัง</h2>\n\n<h4 class=\"table-marker\">[TABLE 1]</h4>\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษา (Learning Outcome: LO)</h2>\n<h3 class=\"domain-title\">ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">ผู้เรียนสามารถระบุและแก้ปัญหาในงานที่ได้รับมอบหมายในสถานประกอบการ โดยประยุกต์ความรู้ในการพัฒนาระบบงานด้านปัญญาประดิษฐ์ทางการแพทย์ หรือ นวัตกรรมการแพทย์ดิจิทัล ได้อย่างเหมาะสมกับความต้องการของผู้ใช้</span></div>\n\n<h3 class=\"domain-title\">ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">ผู้เรียนสามารถรวบรวม วิเคราะห์ และแปลผลข้อมูลจากการปฏิบัติงานในสถานประกอบการ พัฒนาระบบงาน หรือแก้ปัญหา หรือสร้างนวัตกรรมทางการแพทย์และสุขภาพ ด้วยเทคโนโลยีดิจิทัล</span></div>\n\n<h3 class=\"domain-title\">ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">ผู้เรียนสามารถปฏิบัติงานตามกฎระเบียบของสถานประกอบการด้วยความรับผิดชอบและคำนึงถึงจริยธรรมในวิชาชีพ โดยพิจารณาผลกระทบต่อเศรษฐกิจ สังคม และสิ่งแวดล้อม</span></div>\n\n<h3 class=\"domain-title\">ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">ผู้เรียนสามารถทำงานร่วมกับทีม ได้อย่างมีประสิทธิภาพ มีความคิดริเริ่ม กำหนดเป้าหมาย วางแผน ปฏิบัติงานด้วยตนเอง พร้อมทั้งแสดงบทบาทความเป็นผู้นำและผู้ตามที่ดีตามสถานะของตนเองในทีม</span></div>\n\n<h4 class=\"table-marker\">[TABLE 2]</h4>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table\">\n<tr><td>ผลการเรียนรู้ที่คาดหวัง</td><td>ผลการประเมิน</td></tr>\n</table></div>\n<h3 class=\"domain-title\">(1) ด้านความรู้ (Knowledge) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">ผู้เรียนสามารถระบุและแก้ปัญหาในงานที่ได้รับมอบหมายในสถานประกอบการ โดยประยุกต์ความรู้ในการพัฒนาระบบงานด้านปัญญาประดิษฐ์ทางการแพทย์ หรือ นวัตกรรมการแพทย์ดิจิทัล ได้อย่างเหมาะสมกับความต้องการของผู้ใช้ |   5 (ยอดเยี่ยม): ระบุและแก้ปัญหาได้อย่างครบถ้วน พร้อมเสนอแนวทางแก้ไขที่สร้างสรรค์ มีประสิทธิภาพสูง และตอบโจทย์ความต้องการของสถานประกอบการได้ตรงกับความต้องการของหน่วยงาน</span></div>\n<p>  4 (ดีมาก): ระบุและแก้ปัญหาได้ในระดับดี พร้อมเสนอแนวทางแก้ไขที่เหมาะสม แม้จะมีข้อบกพร่องเล็กน้อยแต่ไม่กระทบต่อคุณภาพโดยรวม</p>\n<p>  3 (ดี): ระบุปัญหาและแก้ไขได้ในระดับพื้นฐาน แต่ข้อเสนอแนวทางแก้ไขยังขาดความสมบูรณ์ในบางส่วน</p>\n<p>  2 (พอใช้): ระบุปัญหาได้บางส่วน แต่ไม่สามารถแก้ไขได้อย่างเหมาะสม ต้องการคำแนะนำอย่างใกล้ชิด</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถระบุหรือแก้ปัญหาได้ และไม่มีข้อเสนอแนะแนวทางแก้ไข</p>\n<h3 class=\"domain-title\">(2) ด้านทักษะ (Skills) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">ผู้เรียนสามารถรวบรวม วิเคราะห์ และแปลผลข้อมูลจากการปฏิบัติงานในสถานประกอบการ พัฒนาระบบงาน หรือแก้ปัญหา หรือสร้างนวัตกรรมทางการแพทย์และสุขภาพ ด้วยเทคโนโลยีดิจิทัล |   5 (ยอดเยี่ยม): วิเคราะห์ข้อมูลได้อย่างถูกต้อง ครบถ้วน และแปลผลได้ชัดเจน พร้อมข้อสรุปที่นำไปใช้ได้จริง</span></div>\n<p>  4 (ดีมาก): วิเคราะห์ข้อมูลได้ดีในระดับที่เหมาะสม พร้อมข้อสรุปที่เป็นประโยชน์ แม้จะมีข้อผิดพลาดเล็กน้อย</p>\n<p>  3 (ดี): วิเคราะห์ข้อมูลได้ในระดับพื้นฐาน แต่ข้อสรุปยังขาดความชัดเจนและสมบูรณ์ในบางส่วน</p>\n<p>  2 (พอใช้): วิเคราะห์ข้อมูลได้เพียงบางส่วน และข้อสรุปยังไม่ชัดเจน ต้องการคำแนะนำเพิ่มเติม</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถวิเคราะห์ข้อมูลหรือแปลผลได้</p>\n<h3 class=\"domain-title\">(3) ด้านจริยธรรม (Ethics) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">ผู้เรียนสามารถปฏิบัติงานตามกฎระเบียบของสถานประกอบการด้วยความรับผิดชอบและคำนึงถึงจริยธรรมในวิชาชีพ โดยพิจารณาผลกระทบต่อเศรษฐกิจ สังคม และสิ่งแวดล้อม |   5 (ยอดเยี่ยม): ปฏิบัติตามกฎระเบียบทุกข้ออย่างเคร่งครัด พร้อมแสดงความซื่อสัตย์และความรับผิดชอบอย่างชัดเจน</span></div>\n<p>  4 (ดีมาก): ปฏิบัติตามกฎระเบียบส่วนใหญ่ และแสดงความรับผิดชอบในงานได้ดี แม้จะมีข้อผิดพลาดเล็กน้อย</p>\n<p>  3 (ดี): ปฏิบัติตามกฎระเบียบได้ในระดับพื้นฐาน แต่ยังต้องการการปรับปรุงในบางส่วน</p>\n<p>  2 (พอใช้): ปฏิบัติตามกฎระเบียบได้เพียงบางข้อ และยังมีการละเลยหรือผิดพลาดบ้าง</p>\n<p>  1 (ต้องปรับปรุง): ไม่ปฏิบัติตามกฎระเบียบ และแสดงถึงความขาดความรับผิดชอบในงาน</p>\n<h3 class=\"domain-title\">(4) ด้านลักษณะบุคคล (Character) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">ผู้เรียนสามารถทำงานร่วมกับทีม ได้อย่างมีประสิทธิภาพ มีความคิดริเริ่ม กำหนดเป้าหมาย วางแผน ปฏิบัติงานด้วยตนเอง พร้อมทั้งแสดงบทบาทความเป็นผู้นำและผู้ตามที่ดีตามสถานะของตนเองในทีม |   5 (ยอดเยี่ยม): มีบทบาทสำคัญในทีม มีความคิดริเริ่ม มีการกำหนดเป้าหมายของงาน รวมทั้งวางแผนการทำงานได้ด้วยตนเอง ช่วยสร้างสภาพแวดล้อมการทำงานที่ดี และแสดงภาวะผู้นำได้อย่างชัดเจน</span></div>\n<p>  4 (ดีมาก): ทำงานร่วมกับทีมได้ดีในระดับที่เหมาะสม และปฏิบัติงานตามบทบาทที่ได้รับอย่างสมบูรณ์</p>\n<p>  3 (ดี): ทำงานร่วมกับทีมได้ในระดับพื้นฐาน แต่ยังต้องปรับปรุงในบางด้าน</p>\n<p>  2 (พอใช้): ทำงานร่วมกับทีมได้บางส่วน แต่มีปัญหาในการสื่อสารหรือการมีส่วนร่วม</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถทำงานร่วมกับทีมได้อย่างเหมาะสม</p>"}, {"name": "หลักสูตรเทคโนโลยีสารสนเทศอัจฉริยะ (IIT)", "file": "3. สำนักวิชาสารสนเทศศาสตร์ 5 หลักสูตร\\3.ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษาหลักสูตรเทคโนโลยีสารสนเทศอัจฉริยะ (IIT).pdf", "ext": "pdf", "html": "<p>หลักสูตรเทคโนโลยีสารสนเทศอัจฉริยะ</p>\n<p>ปรับปรุง พ.ศ. 2567</p>\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของหลักสูตร (Program Learning Outcomes: PLOs</h2>\n<h3 class=\"domain-title\">1) ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO1</span> <span class=\"lo-desc\">อธิบายความรู้สังคมศาสตร์มนุษยศาสตร์ทั่วไป เทคโนโลยีสารสนเทศ และ ความรู้เชิงทฤษฎีในการ</span></div>\n<p>พัฒนาแอปพลิเคชันอัจฉริยะที่ใช้งานได้จริงด้านปัญญาประดิษฐ์และการวิเคราะห์ข้อมูลขนาดใหญ่</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO2</span> <span class=\"lo-desc\">ประยุกต์ใช้องค์ความรู้ทางด้านปัญญาประดิษฐ์ และการวิเคราะห์ข้อมูลขนาดใหญ่เพื่อนำไปพัฒนาแอป</span></div>\n<p>พลิเคชันอัจฉริยะ</p>\n<h3 class=\"domain-title\">2) ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO3</span> <span class=\"lo-desc\">มีทักษะในการใช้เครื่องมือที่ทันสมัยทางด้านปัญญาประดิษฐ์ และการวิเคราะห์ข้อมูลขนาดใหญ่ในการ</span></div>\n<p>พัฒนาแอปพลิเคชันอัจฉริยะ</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO4</span> <span class=\"lo-desc\">มีทักษะในการแก้ปัญหาด้านเทคโนโลยีสารสนเทศโดยใช้การคิดวิเคราะห์ได้อย่างมีเหตุผลและมีแบบ</span></div>\n<p>แผน</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO5</span> <span class=\"lo-desc\">มีทักษะการสื่อสารภาษาไทยและภาษาอังกฤษ เพื่อใช้ในชีวิตประจำวัน และในการทำงานด้าน</span></div>\n<p>เทคโนโลยีสารสนเทศทั้งการฟัง พูด อ่าน เขียน และเสนอผลงานได้ตามวัตถุประสงค์ ในกรณีที่นักศึกษาเลือก</p>\n<p>ภาษาจีนควรมีทักษะการสื่อสารภาษาจีนในชีวิตประจำวัน</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO6</span> <span class=\"lo-desc\">มีทักษะการดูแลตนเองเพื่อสร้างสุขภาวะ</span></div>\n<h3 class=\"domain-title\">3) ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO7</span> <span class=\"lo-desc\">แสดงออกถึงความซื่อสัตย์ มีความกตัญญู มีความรับผิดชอบต่อตนเอง ผู้อื่นและสังคม เคารพ</span></div>\n<p>กฎระเบียบ มีจริยธรรมทางวิชาการในการใช้กระบวนการและเครื่องมือทางเทคโนโลยีสารสนเทศในการ</p>\n<p>ทำงาน</p>\n<h3 class=\"domain-title\">4) ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO8</span> <span class=\"lo-desc\">แสดงออกซึ่งการเรียนรู้ด้วยตนเองสามารถคิดริเริ่ม กำหนดเป้าหมายวางแผน ปฏิบัติ และประเมินผล</span></div>\n<p>การเรียนรู้ด้วยตนเองโดยคำนึงถึงการเปลี่ยนแปลงของสังคมโลกยุคดิจิทัล</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO9</span> <span class=\"lo-desc\">แสดงออกถึงการมีวินัย การมีภาวะผู้นำ สามารถเป็นได้ทั้งผู้นำและผู้ตามทำงานร่วมกับผู้อื่นได้ และมี</span></div>\n<p>จิตอาสา</p>\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษา (Learning Outcome: LO)</h2>\n<h3 class=\"domain-title\">(1) ด้านความรู้ (Knowledge)</h3>\n<p>-</p>\n<h3 class=\"domain-title\">(2) ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">ผู้เรียนสามารถใช้เครื่องมือทางด้านปัญญาประดิษฐ์หรือการวิเคราะห์ข้อมูล หรือพัฒนาแอปพลิเคชัน</span></div>\n<p>อัจฉริยะได้อย่างเหมาะสมในงานที่ได้รับมอบหมาย</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">ผู้เรียนสามารถวิเคราะห์และแก้ไขปัญหาที่ซับซ้อนในงานที่เกี่ยวข้องกับเทคโนโลยีสารสนเทศ โดยใช้</span></div>\n<p>กระบวนการคิดวิเคราะห์ที่มีแบบแผน</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">ผู้เรียนสามารถสื่อสารภาษาไทยและภาษาอังกฤษ หรือภาษาจีน ในการรายงานผลการปฏิบัติงานและการ</span></div>\n<p>นำเสนอผลงานได้อย่างมีประสิทธิภาพ</p>\n<h3 class=\"domain-title\">(3) ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO7</span> <span class=\"lo-desc\">ผู้เรียนสามารถแสดงความซื่อสัตย์ มีความกตัญญู ความรับผิดชอบ และปฏิบัติตามกฎระเบียบของสถาน</span></div>\n<p>ประกอบการ รวมถึงมีจริยธรรมในการใช้เทคโนโลยีสารสนเทศ</p>\n<h3 class=\"domain-title\">(4) ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO8</span> <span class=\"lo-desc\">ผู้เรียนสามารถแสดงความสามารถในการเรียนรู้ด้วยตนเอง คิดริเริ่ม และวางแผนการทำงานให้สอดคล้อง</span></div>\n<p>กับการเปลี่ยนแปลงในยุคดิจิทัล</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO9</span> <span class=\"lo-desc\">ผู้เรียนสามารถปฏิบัติงานร่วมกับผู้อื่นได้อย่างมีประสิทธิภาพ ทั้งในฐานะผู้นำและผู้ตาม และมีจิตอาสาใน</span></div>\n<p>การทำงานเพื่อประโยชน์ของสังคม</p>\n<h2 class=\"section-title\">แบบประเมินผลการปฏิบัติสหกิจศึกษาตามผลลัพธ์การเรียนรู้ที่คาดหวัง</h2>\n<p>ผลการเรียนรู้ที่คาดหวัง ผลการประเมิน</p>\n<h3 class=\"domain-title\">(1) ด้านความรู้ (Knowledge)</h3>\n<p>- -</p>\n<p>(5) (2) ด้านทักษะ (Skills)</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">ผู้เรียนสามารถใช้เครื่องมือทางด้าน 5 (ยอดเยี่ยม): ใช้เครื่องมือได้อย่างถูกต้องครบถ้วน</span></div>\n<p>ปัญญาประดิษฐ์หรือการวิเคราะห์ข้อมูล หรือพัฒนา พร้อมแสดงผลลัพธ์ที่ชัดเจนและมีประสิทธิภาพสูง</p>\n<p>แอปพลิเคชันอัจฉริยะได้อย่างเหมาะสมในงานที่ได้รับ</p>\n<div class=\"rubric-level\">4 (ดีมาก): ใช้เครื่องมือได้ดีในระดับที่เหมาะสม แม้จะ</div>\n<p>มอบหมาย</p>\n<p>มีข้อผิดพลาดเล็กน้อยแต่ไม่กระทบต่อการทำงาน</p>\n<div class=\"rubric-level\">3 (ดี): ใช้เครื่องมือได้ในระดับพื้นฐาน แต่ยังขาดความ</div>\n<p>สมบูรณ์หรือการใช้งานที่ลึกซึ้ง</p>\n<div class=\"rubric-level\">2 (พอใช้): ใช้เครื่องมือได้ในบางส่วน แต่ยังต้องการ</div>\n<p>คำแนะนำและการปรับปรุง</p>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): ไม่สามารถใช้เครื่องมือได้อย่าง</div>\n<p>ถูกต้อง</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">ผู้เรียนสามารถวิเคราะห์และแก้ไขปัญหาที่ 5 (ยอดเยี่ยม): วิเคราะห์ปัญหาได้อย่างละเอียดและ</span></div>\n<p>ซับซ้อนในงานที่เกี่ยวข้องกับเทคโนโลยีสารสนเทศ แก้ไขได้อย่างมีประสิทธิภาพ พร้อมเสนอแนวทางที่</p>\n<p>โดยใช้กระบวนการคิดวิเคราะห์ที่มีแบบแผน สร้างสรรค์</p>\n<div class=\"rubric-level\">4 (ดีมาก): วิเคราะห์ปัญหาได้ดี และสามารถแก้ไขได้</div>\n<p>ในระดับที่เหมาะสม แม้จะมีข้อบกพร่องเล็กน้อย</p>\n<div class=\"rubric-level\">3 (ดี): วิเคราะห์ปัญหาและแก้ไขได้ในระดับพื้นฐาน</div>\n<p>แต่ขาดความสมบูรณ์ในรายละเอียด</p>\n<div class=\"rubric-level\">2 (พอใช้): วิเคราะห์ปัญหาได้บางส่วน แต่ไม่สามารถ</div>\n<p>แก้ไขได้อย่างเหมาะสม</p>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): ไม่สามารถวิเคราะห์หรือแก้ไข</div>\n<p>ปัญหาได้</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">ผู้เรียนสามารถสื่อสารภาษาไทยและ 5 (ยอดเยี่ยม): สื่อสารได้อย่างชัดเจนและตรงประเด็น</span></div>\n<p>ภาษาอังกฤษ หรือภาษาจีน ในการรายงานผลการ ทั้งการพูด ฟัง อ่าน เขียน และการนำเสนอ</p>\n<p>ปฏิบัติงานและการนำเสนอผลงานได้อย่างมี</p>\n<div class=\"rubric-level\">4 (ดีมาก): สื่อสารได้ดีในระดับที่เหมาะสม แม้จะมี</div>\n<p>ประสิทธิภาพ</p>\n<p>ข้อผิดพลาดเล็กน้อย</p>\n<div class=\"rubric-level\">3 (ดี): สื่อสารได้ในระดับพื้นฐาน แต่ยังขาดความ</div>\n<p>ชัดเจนหรือความมั่นใจในบางส่วน</p>\n<div class=\"rubric-level\">2 (พอใช้): สื่อสารได้ในบางส่วน แต่ยังไม่สามารถ</div>\n<p>สื่อสารได้ครบถ้วน</p>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): ไม่สามารถสื่อสารได้อย่างมี</div>\n<p>ประสิทธิภาพ</p>\n<h3 class=\"domain-title\">(3) ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO7</span> <span class=\"lo-desc\">ผู้เรียนสามารถแสดงความซื่อสัตย์ มีความ 5 (ยอดเยี่ยม): แสดงออกถึงความซื่อสัตย์และ</span></div>\n<p>กตัญญ ู ความรับผิดชอบ และปฏิบัติตามกฎระเบียบ จริยธรรมในทุกสถานการณ์ พร้อมทั้งปฏิบัติตาม</p>\n<p>ของสถานประกอบการ รวมถึงมีจริยธรรมในการใช้ กฎระเบียบของสถานประกอบการอย่างเคร่งครัด</p>\n<p>เทคโนโลยีสารสนเทศ</p>\n<div class=\"rubric-level\">4 (ดีมาก): มีจริยธรรมในการปฏิบัติงานในระดับที่ดี</div>\n<p>แม้มีข้อผิดพลาดเล็กน้อย</p>\n<div class=\"rubric-level\">3 (ดี): แสดงจริยธรรมในระดับพื้นฐาน แต่ยังขาด</div>\n<p>ความสม่ำเสมอ</p>\n<div class=\"rubric-level\">2 (พอใช้): แสดงจริยธรรมในบางส่วน แต่ยังต้องการ</div>\n<p>คำแนะนำเพิ่มเติม</p>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): ขาดจริยธรรมในการปฏิบัติงาน</div>\n<h3 class=\"domain-title\">(4) ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO8</span> <span class=\"lo-desc\">ผู้เรียนสามารถแสดงความสามารถในการเรียนรู้ 5 (ยอดเยี่ยม): แสดงความสามารถในการเรียนรู้และ</span></div>\n<p>ด้วยตนเอง คิดริเริ่ม และวางแผนการทำงานให้ คิดริเริ่มได้อย่างสร้างสรรค์ พร้อมวางแผนและ</p>\n<p>สอดคล้องกับการเปลี่ยนแปลงในยุคดิจิทัล ประเมินผลการทำงานได้อย่างสมบูรณ์</p>\n<div class=\"rubric-level\">4 (ดีมาก): มีความสามารถในการเรียนรู้ด้วยตนเองใน</div>\n<p>ระดับที่ดี แม้มีข้อบกพร่องในรายละเอียดเล็กน้อย</p>\n<div class=\"rubric-level\">3 (ดี): แสดงความสามารถในการเรียนรู้ด้วยตนเองใน</div>\n<p>ระดับพื้นฐาน แต่ยังขาดความลึกซึ้งในกระบวนการ</p>\n<div class=\"rubric-level\">2 (พอใช้): เรียนรู้ด้วยตนเองในบางส่วน แต่ยัง</div>\n<p>ต้องการคำแนะนำเพิ่มเติม</p>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): ขาดความสามารถในการเรียนรู้</div>\n<p>หรือวางแผนการทำงาน</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO9</span> <span class=\"lo-desc\">ผู้เรียนสามารถปฏิบัติงานร่วมกับผู้อื่นได้อย่างมี 5 (ยอดเยี่ยม): มีวินัยและภาวะผู้นำที่โดดเด่น</span></div>\n<p>ประสิทธิภาพ ทั้งในฐานะผู้นำและผู้ตาม และมีจิต สามารถทำงานร่วมกับผู้อื่นได้อย่างราบรื่น และแสดง</p>\n<p>อาสาในการทำงานเพื่อประโยชน์ของสังคม จิตอาสาในการช่วยเหลือทีม</p>\n<div class=\"rubric-level\">4 (ดีมาก): มีวินัยและภาวะผู้นำในระดับที่ดี แม้มี</div>\n<p>ข้อผิดพลาดเล็กน้อย</p>\n<div class=\"rubric-level\">3 (ดี): แสดงวินัยและภาวะผู้นำในระดับพื้นฐาน แต่ยัง</div>\n<p>ขาดการปรับตัวในบางสถานการณ์</p>\n<div class=\"rubric-level\">2 (พอใช้): มีวินัยและภาวะผู้นำในบางส่วน แต่ยัง</div>\n<p>ต้องการการพัฒนาความมั่นใจและความร่วมมือ</p>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): ขาดวินัยและภาวะผู้นำ ส่งผลต่อ</div>\n<p>การทำงานร่วมกันในทีม</p>\n"}, {"name": "หลักสูตรดิจิทัลคอนเทนต์และสื่อ", "file": "3. สำนักวิชาสารสนเทศศาสตร์ 5 หลักสูตร\\4.หลักสูตรดิจิทัลคอนเทนต์และสื่อ.pdf", "ext": "pdf", "html": "<p>หลักสูตรสารสนเทศศาสตรบณั ฑิต</p>\n<p>สาขาดิจิทลั คอนเทนต์และสื่อ</p>\n<p>ปรับปรุง พ.ศ.2567</p>\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของหลักสูตร (Program Learning Outcomes: PLOs)</h2>\n<p>บัณฑิตที่สำเร็จการศึกษาในหลักสูตรนี้ มีความสามารถในแต่ละด้าน ดังนี้</p>\n<h3 class=\"domain-title\">1) ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO1</span> <span class=\"lo-desc\">อธิบายความรู้ด้านมนุษยศาสตร์ สังคมศาสตร์ทั่วไป เทคโนโลยีสารสนเทศพื้นฐาน และแนวคิด</span></div>\n<p>สำหรับการออกแบบ ผลิต และเผยแพร่ดิจิทัลคอนเทนต์ที่ตอบสนองความต้องการของผู้ใช ้</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO2</span> <span class=\"lo-desc\">ประยุกต์ใช้ความรู้ด้านการจัดการสารสนเทศ การออกแบบและผลิตสื่อ การจัดบริการดิจิทัลคอน</span></div>\n<p>เทนต ์ และความรใู้ นการประกอบอาชีพด้านการพัฒนาการเรียนแบบออนไลน์ หรือ คอนเทนต์เพื่อการตลาดดิจิทัล</p>\n<p>หรือ ดิจิทัลคอลเล็กชัน หรือ เทคโนโลยีเพื่อการจัดการคอนเทนต์ เพื่อตอบสนองความต้องการของผู้ประกอบการ</p>\n<p>ในอุตสาหกรรมดิจิทัล</p>\n<h3 class=\"domain-title\">2) ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO3</span> <span class=\"lo-desc\">เลือกใช้เทคโนโลยีเพื่อการพัฒนาดิจิทัลคอนเทนต์ที่ตอบสนองวัตถุประสงค์การใช้งานของผู้ใช้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO4</span> <span class=\"lo-desc\">ออกแบบการจัดบริการดิจิทัลคอนเทนต์อย่างเป็นระบบ โดยใช้กระบวนการวิจัยและพัฒนาเพื่อ</span></div>\n<p>รองรับการเปลี่ยนแปลงทางดิจิทัลขององค์กร</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO5</span> <span class=\"lo-desc\">มีทักษะในการจัดระบบบริการดิจิทัลคอนเทนต์ให้สอดคล้องกับความต้องการขององค์กร</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO6</span> <span class=\"lo-desc\">มีทักษะการสื่อสารภาษาไทยและภาษาอังกฤษ เพื่อใช้ในชีวิตประจำวัน ทั้งการฟัง พูด อ่าน เขียน</span></div>\n<p>และเสนอผลงานได้ตามวัตถุประสงค์ ในกรณีที่นักศึกษาเลือกภาษาจีนสามารถสื่อสารภาษาจีนในชีวิตประจำวันได ้</p>\n<h3 class=\"domain-title\">3) ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO7</span> <span class=\"lo-desc\">แสดงออกถึงความซื่อสัตย์ ความกตัญญูกตเวที ความรับผิดชอบต่อตนเองและสังคม ปฏิบัติตาม</span></div>\n<p>กฎระเบียบ และปฏิบัติตนอย่างถูกต้องตามจริยธรรมทางวิชาการ</p>\n<h3 class=\"domain-title\">4) ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO8</span> <span class=\"lo-desc\">แสดงออกถึงการมีภาวะผู้นำ มีสุขภาวะ สามารถเป็นได้ทั้งผู้นำและผู้ตาม มีจิตอาสาและทำงาน</span></div>\n<p>ร่วมกับผู้อื่น</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO9</span> <span class=\"lo-desc\">แสดงออกถึงการรู้ดิจิทัล สามารถแสวงหาความรู้ภายใต้สภาพแวดล้อมดิจิทัล</span></div>\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษา (Learning Outcome: LO)</h2>\n<h3 class=\"domain-title\">(1) ด้านความรู้ (Knowledge)</h3>\n<h3 class=\"domain-title\">1) ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO1</span> <span class=\"lo-desc\">อธิบายความรู้ด้านมนุษยศาสตร์ สังคมศาสตร์ทั่วไป เทคโนโลยีสารสนเทศพื้นฐาน และแนวคิด</span></div>\n<p>สำหรับการออกแบบ ผลิต และเผยแพร่ดิจิทัลคอนเทนต์ที่ตอบสนองความต้องการของผู้ใช ้</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO2</span> <span class=\"lo-desc\">ประยุกต์ใช้ความรู้ด้านการจัดการสารสนเทศ การออกแบบและผลิตสื่อ การจัดบริการดิจิทัล</span></div>\n<p>คอนเทนต์ และความรู้ในการประกอบอาชีพด้านการพัฒนาการเรียนแบบออนไลน์ หรือ คอนเทนต์เพื่อ</p>\n<p>การตลาดดิจิทัล หรือ ดิจิทัลคอลเล็กชัน หรือ เทคโนโลยีเพื่อการจัดการคอนเทนต์ เพื่อตอบสนองความต้องการ</p>\n<p>ของผู้ประกอบการในอุตสาหกรรมดิจิทัล</p>\n<h3 class=\"domain-title\">2) ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO3</span> <span class=\"lo-desc\">เลือกใช้เทคโนโลยีเพื่อการพัฒนาดิจิทัลคอนเทนต์ที่ตอบสนองวัตถุประสงค์การใช้งานของผู้ใช้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO4</span> <span class=\"lo-desc\">ออกแบบการจัดบริการดิจิทัลคอนเทนต์อย่างเป็นระบบ โดยใช้กระบวนการวิจัยและพัฒนาเพื่อ</span></div>\n<p>รองรับการเปลี่ยนแปลงทางดิจิทัลขององค์กร</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO5</span> <span class=\"lo-desc\">มีทักษะในการจัดระบบบริการดิจิทัลคอนเทนต์ให้สอดคล้องกับความต้องการขององค์กร</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO6</span> <span class=\"lo-desc\">มีทักษะการสื่อสารภาษาไทยและภาษาอังกฤษ เพื่อใช้ในชีวิตประจำวัน ทั้งการฟัง พูด อ่าน</span></div>\n<p>เขียน และเสนอผลงานได้ตามวัตถุประสงค์ ในกรณีที่นักศึกษาเลือกภาษาจีนสามารถสื่อสารภาษาจีนใน</p>\n<p>ชีวิตประจำวันได ้</p>\n<h3 class=\"domain-title\">3) ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO7</span> <span class=\"lo-desc\">แสดงออกถึงความซื่อสัตย์ ความกตัญญูกตเวที ความรับผิดชอบต่อตนเองและสังคม ปฏิบัติตาม</span></div>\n<p>กฎระเบียบ และปฏิบัติตนอย่างถูกต้องตามจริยธรรมทางวิชาการ</p>\n<h3 class=\"domain-title\">4) ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO8</span> <span class=\"lo-desc\">แสดงออกถึงการมีภาวะผู้นำ มีสุขภาวะ สามารถเป็นได้ทั้งผู้นำและผู้ตาม มีจิตอาสาและทำงาน</span></div>\n<p>ร่วมกับผู้อื่น</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO9</span> <span class=\"lo-desc\">แสดงออกถึงการรู้ดิจิทัล สามารถแสวงหาความรู้ภายใต้สภาพแวดล้อมดิจิทัล</span></div>\n<h2 class=\"section-title\">แบบประเมินผลการปฏิบัติสหกิจศึกษาตามผลลัพธ์การเรียนรู้ที่คาดหวัง</h2>\n<p>ผลลัพธ์การเรยี นรู้ทคี่ าดหวงั ผลการประเมนิ</p>\n<h3 class=\"domain-title\">(1) ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO1</span> <span class=\"lo-desc\">อธิบายความรู้ด้านมนุษยศาสตร์ 5 (ยอดเยี่ยม): บูรณาการความรู้ทุกด้านมาสร้าง</span></div>\n<p>สังคมศาสตร์ทั่วไป เทคโนโลยีสารสนเทศพื้นฐาน ดิจิทลั คอนเทนต์ที่ตอบโจทย์ผู้ใช้ได้ นำเสนอแนวคิดได้</p>\n<p>และแนวคิดสำหรับการออกแบบ ผลิต และ</p>\n<p>อย่างครบถ้วนชัดเจน</p>\n<p>เผยแพร่ดิจิทัลคอนเทนต์ที่ตอบสนองความต้องการ</p>\n<div class=\"rubric-level\">4 (ดีมาก): ประยุกต์ใช้ความรู้ได้อย่างเหมาะสม ผลิต</div>\n<p>ของผู้ใช ้</p>\n<p>คอนเทนต์ที่มีคุณภาพดี ตรงความต้องการนผู้ใช้ แต่ยัง</p>\n<p>ขาดความโดนเด่นด้านนวัตกรรม</p>\n<div class=\"rubric-level\">3 (ดี): ใชค้ วามรู้พื้นฐานไดถ้ ูกต้อง สร้างคอนเทนต์ได้</div>\n<p>ตามมาตรฐาน แต่ยังต้องปรบั ปรุงการตอบสนองความ</p>\n<p>ต้องการผู้ใช้</p>\n<div class=\"rubric-level\">2 (พอใช้): เข้าใจหลักการพื้นฐาน แต่ประยุกต์ใช้ได้</div>\n<p>จำกัด ผลงานยังไม่สมบูรณ์ ต้องได้รับคำแนะนำบ่อยครั้ง</p>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): ขาดความเข้าใจพื้นฐาน ไม่</div>\n<p>สามารถนำความรู้มาใช้ได้อย่างเหมาะสม ผลงานไม่ผ่าน</p>\n<p>เกณฑ์มาตฐาน</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO2</span> <span class=\"lo-desc\">ประ
