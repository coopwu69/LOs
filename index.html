ต์ความรู้การจัดการการท่องเที่ยวและการโรงแรมเพื่อการปฏิบัติงานด้านการท่องเที่ยวและการโรงแรม</span></div>\n<h3 class=\"domain-title\">2) ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO5</span> <span class=\"lo-desc\">มีทักษะการสื่อสารภาษาไทย และภาษาอังกฤษ เพื่อใช้ในชีวิตประจำวันและในการทำงานด้านการท่องเที่ยวและการโรงแรมทั้งการฟัง พูด อ่าน เขียน และนำเสนอผลงานได้อย่างเหมาะสมกับ สถานการณ์ ในกรณีนักศึกษาเลือกภาษาจีน สามารถสื่อสารภาษาจีน ในชีวิตประจำวันได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO6</span> <span class=\"lo-desc\">มีทักษะการใช้เทคโนโลยีสารสนเทศเพื่อสืบค้นข้อมูล วิเคราะห์ นำเสนอ และมีทักษะการใช้โปรแกรมประยุกต์ในงานด้านการท่องเที่ยวและการโรงแรม</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO7</span> <span class=\"lo-desc\">มีทักษะการแก้ไขปัญหาในการปฏิบัติงานด้านการท่องเที่ยวและการโรงแรม โดยการคิดวิเคราะห์ อย่างมีเหตุผล</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO8</span> <span class=\"lo-desc\">มีทักษะการให้บริการและนันทนาการด้านการท่องเที่ยวและการโรงแรมแก่ลูกค้า</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO9</span> <span class=\"lo-desc\">มีทักษะการออกแบบประสบการณ์การท่องเที่ยวแก่ลูกค้าในแหล่งท่องเที่ยวและโรงแรม</span></div>\n\n<h3 class=\"domain-title\">3) ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO10</span> <span class=\"lo-desc\">มีความรับผิดชอบต่อตนเอง สังคม และสิ่งแวดล้อม</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO11</span> <span class=\"lo-desc\">มีความกตัญญู ซื่อสัตย์ และปฏิบัติตามกฎระเบียบด้านการท่องเที่ยวและการโรงแรม และสังคม</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO12</span> <span class=\"lo-desc\">แสดงออกถึงการอนุรักษ์ทรัพยากรธรรมชาติและวัฒนธรรมเพื่อลดผลกระทบที่เกิดขึ้นต่อ เศรษฐกิจ สังคม และสิ่งแวดล้อม</span></div>\n\n<h3 class=\"domain-title\">4) ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO13</span> <span class=\"lo-desc\">แสดงออกถึงการมีจิตบริการ และบุคลิกภาพด้านการแต่งกายและการพูดในงานบริการด้านการท่องเที่ยวและการโรงแรมที่เหมาะสม</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO14</span> <span class=\"lo-desc\">แสดงออกถึงการมีวินัย มีภาวะผู้นำ สามารถเป็นได้ทั้งผู้นำ และผู้ตาม ทำงานร่วมกับผู้อื่นได้ มีจิตอาสา และสามารถพัฒนาตนเองในงานด้านการท่องเที่ยวและการโรงแรมได้อย่างต่อเนื่อง</span></div>\n\n<h2 class=\"section-title\">แบบประเมินผลการปฏิบัติสหกิจศึกษาตามผลลัพธ์การเรียนรู้ที่คาดหวัง</h2>\n\n<h4 class=\"table-marker\">[TABLE 1]</h4>\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษา (Learning Outcome: LO)</h2>\n<h3 class=\"domain-title\">ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">ประยุกต์ความรู้ด้านบริหารธุรกิจและการจัดการนวัตกรรมเพื่อการดำเนินงานด้านการท่องเที่ยวและการโรงแรม</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">ประยุกต์ความรู้การจัดการการท่องเที่ยวและการโรงแรมเพื่อการปฏิบัติงานด้านการท่องเที่ยวและการโรงแรม</span></div>\n\n<h3 class=\"domain-title\">ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">มีทักษะการสื่อสารภาษาไทย และภาษาอังกฤษ เพื่อใช้ในชีวิตประจำวันและในการทำงานด้านการท่องเที่ยวและการโรงแรมทั้งการฟัง พูด อ่าน เขียน และนำเสนอผลงานได้อย่างเหมาะสมกับ สถานการณ์ ในกรณีนักศึกษาเลือกภาษาจีน สามารถสื่อสารภาษาจีน ในชีวิตประจำวันได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">มีทักษะการใช้เทคโนโลยีสารสนเทศเพื่อสืบค้นข้อมูล วิเคราะห์ นำเสนอ และมีทักษะการใช้โปรแกรมประยุกต์ในงานด้านการท่องเที่ยวและการโรงแรม</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">มีทักษะการแก้ไขปัญหาในการปฏิบัติงานด้านการท่องเที่ยวและการโรงแรม โดยการคิดวิเคราะห์ อย่างมีเหตุผล</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO6</span> <span class=\"lo-desc\">มีทักษะการให้บริการและนันทนาการด้านการท่องเที่ยวและการโรงแรมแก่ลูกค้า</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO7</span> <span class=\"lo-desc\">มีทักษะการออกแบบประสบการณ์การท่องเที่ยวแก่ลูกค้าในแหล่งท่องเที่ยวและโรงแรม</span></div>\n\n<h3 class=\"domain-title\">ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO8</span> <span class=\"lo-desc\">มีความรับผิดชอบต่อตนเอง สังคม และสิ่งแวดล้อม</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO9</span> <span class=\"lo-desc\">มีความกตัญญู ซื่อสัตย์ และปฏิบัติตามกฎระเบียบด้านการท่องเที่ยวและการโรงแรม และสังคม</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO10</span> <span class=\"lo-desc\">แสดงออกถึงการอนุรักษ์ทรัพยากรธรรมชาติและวัฒนธรรมเพื่อลดผลกระทบที่เกิดขึ้นต่อ เศรษฐกิจ สังคม และสิ่งแวดล้อม</span></div>\n\n<h3 class=\"domain-title\">ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO11</span> <span class=\"lo-desc\">แสดงออกถึงการมีจิตบริการ และบุคลิกภาพด้านการแต่งกายและการพูดในงานบริการด้านการท่องเที่ยวและการโรงแรมที่เหมาะสม</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO12</span> <span class=\"lo-desc\">แสดงออกถึงการมีวินัย มีภาวะผู้นำ สามารถเป็นได้ทั้งผู้นำ และผู้ตาม ทำงานร่วมกับผู้อื่นได้ มีจิตอาสา และสามารถพัฒนาตนเองในงานด้านการท่องเที่ยวและการโรงแรมได้อย่างต่อเนื่อง</span></div>\n\n<h4 class=\"table-marker\">[TABLE 2]</h4>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table\">\n<tr><td>ผลการเรียนรู้ที่คาดหวัง</td><td>ผลการประเมิน</td></tr>\n</table></div>\n<h3 class=\"domain-title\">(1) ด้านความรู้ (Knowledge) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">ประยุกต์ความรู้ด้านบริหารธุรกิจและการจัดการนวัตกรรมเพื่อการดำเนินงานด้านการท่องเที่ยวและการโรงแรม |   5 (ยอดเยี่ยม): นักศึกษาสามารถวิเคราะห์สถานการณ์และเสนอแนวทางแก้ไขปัญหาโดยใช้หลักการบริหารธุรกิจได้อย่างเป็นระบบ นำเสนอนวัตกรรมหรือแนวคิดใหม่ๆ ที่สามารถนำไปใช้ได้จริงในองค์กร มีการบูรณาการความรู้จากหลายศาสตร์มาประยุกต์ใช้ได้อย่างเหมาะสม</span></div>\n<p>  4 (ดีมาก): นักศึกษาสามารถประยุกต์ใช้หลักการบริหารธุรกิจในการทำงานได้ดี มีการนำเสนอแนวคิดใหม่ๆ ในการพัฒนางาน เข้าใจและเชื่อมโยงทฤษฎีสู่การปฏิบัติได้</p>\n<p>  3 (ดี): นักศึกษาเข้าใจหลักการบริหารธุรกิจพื้นฐานและนำมาใช้ในงานได้ ทำงานตามกระบวนการมาตรฐานขององค์กรได้ดี รู้จักปรับปรุงวิธีการทำงานเมื่อได้รับคำแนะนำ</p>\n<p>  2 (พอใช้): นักศึกษาเข้าใจหลักการพื้นฐานแต่ประยุกต์ใช้ได้จำกัด ต้องได้รับคำแนะนำในการทำงานบ่อยครั้ง ทำงานตามที่ได้รับมอบหมายได้แต่ขาดการริเริ่ม</p>\n<p>  1 (ต้องปรับปรุง): นักศึกษาไม่สามารถนำความรู้มาประยุกต์ใช้ในงานได้ ไม่เข้าใจหลักการพื้นฐานที่จำเป็น ต้องได้รับการกำกับดูแลอย่างใกล้ชิดตลอดเวลา</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">ประยุกต์ความรู้การจัดการการท่องเที่ยวและการโรงแรมเพื่อการปฏิบัติงานด้านการท่องเที่ยวและการโรงแรม |   5 (ยอดเยี่ยม): นักศึกษาสามารถจัดการงานบริการได้อย่างมีประสิทธิภาพสูง โดยได้รับความพึงพอใจจากลูกค้า &gt; 90% แก้ไขสถานการณ์เฉพาะหน้าได้อย่างเหมาะสมและรวดเร็ว สามารถสอนงานหรือแนะนำเพื่อนร่วมงานได้</span></div>\n<p>  4 (ดีมาก): นักศึกษาสามารถจัดการงานบริการได้ดี ได้รับความพึงพอใจจากลูกค้า 80-90% แก้ไขปัญหาพื้นฐานในงานบริการได้ด้วยตนเอง มีการวางแผนและจัดลำดับความสำคัญของงานได้ดี</p>\n<p>  3 (ดี): นักศึกษาสามารถให้บริการตามมาตรฐานได้ดี ได้รับความพึงพอใจจากลูกค้า 70-79% ทำงานตามขั้นตอนที่กำหนดได้ครบถ้วน สื่อสารกับลูกค้าและเพื่อนร่วมงานได้อย่างเหมาะสม</p>\n<p>  2 (พอใช้): นักศึกษาสามารถให้บริการได้ตามมาตรฐานขั้นต่ำ ได้รับความพึงพอใจจากลูกค้า 60-69% ต้องได้รับคำแนะนำในการแก้ไขปัญหาเสมอ การสื่อสารกับลูกค้ายังมีข้อบกพร่อง</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถให้บริการตามมาตรฐานขั้นต่ำ ได้รับความพึงพอใจจากลูกค้า &lt; 60% ไม่สามารถแก้ไขปัญหาพื้นฐานได้ มีปัญหาในการสื่อสารกับลูกค้าและเพื่อนร่วมงาน</p>\n<h3 class=\"domain-title\">(2) ด้านทักษะ (Skills) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">มีทักษะการสื่อสารภาษาไทย และภาษาอังกฤษ เพื่อใช้ในชีวิตประจำวันและในการทำงานด้านการท่องเที่ยวและการโรงแรมทั้งการฟัง พูด อ่าน เขียน และนำเสนอผลงานได้อย่างเหมาะสมกับ สถานการณ์ ในกรณีนักศึกษาเลือกภาษาจีน สามารถสื่อสารภาษาจีน ในชีวิตประจำวันได้ |   5 (ยอดเยี่ยม): นักศึกษาสามารถสื่อสารภาษาไทยและภาษาอังกฤษได้อย่างคล่องแคล่วทั้งการฟัง พูด อ่าน เขียน สามารถนำเสนองานเป็นภาษาอังกฤษได้อย่างมีประสิทธิภาพ กรณีเลือกภาษาจีน: สื่อสารในชีวิตประจำวันและงานบริการได้อย่างคล่องแคล่ว</span></div>\n<p>  4 (ดีมาก): นักศึกษาสามารถสื่อสารภาษาไทยได้ดีมาก และภาษาอังกฤษได้ดี นำเสนองานเป็นภาษาอังกฤษได้ โดยมีข้อผิดพลาดเล็กน้อย กรณีเลือกภาษาจีน: สื่อสารในชีวิตประจำวันได้ดี มีข้อผิดพลาดน้อย</p>\n<p>  3 (ดี): นักศึกษาสามารถสื่อสารภาษาไทยได้ดี และภาษาอังกฤษได้ในระดับใช้งาน นำเสนองานเป็นภาษาอังกฤษได้ แต่ต้องเตรียมตัวมาก กรณีเลือกภาษาจีน: สื่อสารประโยคพื้นฐานในชีวิตประจำวันได้</p>\n<p>  2 (พอใช้): นักศึกษาสามารถสื่อสารภาษาไทยได้พอใช้ ภาษาอังกฤษมีข้อจำกัด ต้องได้รับความช่วยเหลือในการนำเสนองานภาษาอังกฤษ กรณีเลือกภาษาจีน: สื่อสารได้เฉพาะประโยคง่ายๆ</p>\n<p>  1 (ต้องปรับปรุง): นักศึกษามีปัญหาในการสื่อสารทั้งภาษาไทยและภาษาอังกฤษ ไม่สามารถนำเสนองานเป็นภาษาอังกฤษได้ กรณีเลือกภาษาจีน: ไม่สามารถสื่อสารภาษาจีนได้แม้แต่ประโยคพื้นฐาน</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">มีทักษะการใช้เทคโนโลยีสารสนเทศเพื่อสืบค้นข้อมูล วิเคราะห์ นำเสนอ และมีทักษะการใช้โปรแกรมประยุกต์ในงานด้านการท่องเที่ยวและการโรงแรม |   5 (ยอดเยี่ยม): นักศึกษาสามารถใช้โปรแกรมสำนักงานและระบบสารสนเทศขององค์กรได้อย่างคล่องแคล่ว สามารถแก้ไขปัญหาทางเทคนิคเบื้องต้นได้ด้วยตนเอง สามารถประยุกต์ใช้เทคโนโลยีใหม่ๆ เพื่อพัฒนางานได้</span></div>\n<p>  4 (ดีมาก): นักศึกษาสามารถใช้โปรแกรมสำนักงานได้ดี และเรียนรู้ระบบใหม่ได้เร็ว ต้องการความช่วยเหลือในการแก้ปัญหาทางเทคนิคเพียงเล็กน้อย มีความคิดริเริ่มในการใช้เทคโนโลยีเพื่อพัฒนางาน</p>\n<p>  3 (ดี): นักศึกษาสามารถใช้โปรแกรมพื้นฐานได้ดี เรียนรู้ระบบใหม่ได้เมื่อได้รับการสอน ทำงานกับระบบสารสนเทศขององค์กรได้ตามมาตรฐาน</p>\n<p>  2 (พอใช้): นักศึกษาสามารถใช้โปรแกรมพื้นฐานได้แต่มีข้อจำกัด ต้องการความช่วยเหลือในการใช้ระบบใหม่บ่อยครั้ง ทำงานกับระบบสารสนเทศได้ช้า</p>\n<p>  1 (ต้องปรับปรุง): นักศึกษาไม่สามารถใช้โปรแกรมพื้นฐานได้อย่างมีประสิทธิภาพ ไม่สามารถเรียนรู้ระบบใหม่ได้แม้จะได้รับการสอน มีปัญหาในการใช้ระบบสารสนเทศขององค์กร</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">มีทักษะการแก้ไขปัญหาในการปฏิบัติงานด้านการท่องเที่ยวและการโรงแรม โดยการคิดวิเคราะห์ อย่างมีเหตุผล |   5 (ยอดเยี่ยม): นักศึกษาสามารถวิเคราะห์สาเหตุของปัญหาได้อย่างเป็นระบบ เสนอทางเลือกในการแก้ปัญหาได้หลากหลายและสร้างสรรค์ แก้ไขปัญหาเฉพาะหน้าได้อย่างมีประสิทธิภาพ โดยคำนึงถึงผลกระทบระยะยาว</span></div>\n<p>  4 (ดีมาก): นักศึกษาสามารถวิเคราะห์ปัญหาได้ดี เสนอแนวทางแก้ไขปัญหาได้มากกว่า 1 แนวทาง แก้ไขปัญหาเฉพาะหน้าได้ดี</p>\n<p>  3 (ดี): นักศึกษาสามารถระบุปัญหาและสาเหตุได้ เสนอแนวทางแก้ไขปัญหาได้ 1 แนวทาง แก้ไขปัญหาพื้นฐานได้ตามแนวทางที่กำหนด</p>\n<p>  2 (พอใช้): นักศึกษาสามารถระบุปัญหาได้แต่วิเคราะห์สาเหตุได้ไม่ชัดเจน ต้องได้รับคำแนะนำในการแก้ไขปัญหา แก้ไขปัญหาได้เฉพาะเมื่อมีผู้ชี้แนะ</p>\n<p>  1 (ต้องปรับปรุง): นักศึกษาไม่สามารถระบุปัญหาและสาเหตุได้ ไม่สามารถเสนอแนวทางแก้ไขปัญหา ไม่สามารถแก้ไขปัญหาได้แม้จะได้รับคำแนะนำ</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO6</span> <span class=\"lo-desc\">มีทักษะการให้บริการและนันทนาการด้านการท่องเที่ยวและการโรงแรมแก่ลูกค้า |   5 (ยอดเยี่ยม): นักศึกษาสามารถให้บริการและหรือจัดกิจกรรมนันทนาการที่สร้างสรรค์และเหมาะสมกับกลุ่มลูกค้าได้โดดเด่น แก้ไขสถานการณ์เฉพาะหน้าในการให้บริการได้อย่างยอดเยี่ยม ได้รับความพึงพอใจจากลูกค้าในระดับดีเยี่ยม (&gt;90%)</span></div>\n<p>  4 (ดีมาก): นักศึกษาสามารถให้บริการและหรือจัดกิจกรรมนันทนาการที่น่าสนใจและเหมาะสมกับกลุ่มลูกค้า จัดการสถานการณ์ในการให้บริการได้ดี ได้รับความพึงพอใจจากลูกค้าในระดับดีมาก (80-90%)</p>\n<p>  3 (ดี): นักศึกษาสามารถให้บริการและหรือจัดกิจกรรมนันทนาการตามแผนที่กำหนดได้ ให้บริการได้ตามมาตรฐาน ได้รับความพึงพอใจจากลูกค้าในระดับดี (70-79%)</p>\n<p>  2 (พอใช้): นักศึกษาสามารถให้บริการและหรือจัดกิจกรรมนันทนาการได้แต่ต้องมีผู้ช่วยแนะนำ ให้บริการได้แต่ยังมีข้อบกพร่อง ได้รับความพึงพอใจจากลูกค้าในระดับพอใช้ (60-69%)</p>\n<p>  1 (ต้องปรับปรุง): นักศึกษาไม่สามารถจัดกิจกรรมนันทนาการได้แม้จะมีผู้แนะนำ มีปัญหาในการให้บริการบ่อยครั้ง ได้รับความพึงพอใจจากลูกค้าในระดับต่ำ (&lt;60%)</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO7</span> <span class=\"lo-desc\">มีทักษะการออกแบบประสบการณ์การท่องเที่ยวแก่ลูกค้าในแหล่งท่องเที่ยวและโรงแรม |   5 (ยอดเยี่ยม): นักศึกษาสามารถออกแบบโปรแกรมการท่องเที่ยวที่สร้างสรรค์และตอบโจทย์ความต้องการของลูกค้าได้ดีเยี่ยม บูรณาการทรัพยากรการท่องเที่ยวและบริการต่างๆ ได้อย่างลงตัว นำเสนอประสบการณ์ที่แปลกใหม่และน่าประทับใจ พร้อมคำนึงถึงความยั่งยืน</span></div>\n<p>  4 (ดีมาก): นักศึกษาสามารถออกแบบโปรแกรมการท่องเที่ยวที่น่าสนใจและตอบสนองความต้องการของลูกค้าจัดการทรัพยากรการท่องเที่ยวและบริการได้อย่างมีประสิทธิภาพ  สร้างประสบการณ์ที่น่าจดจำให้กับลูกค้าได้</p>\n<p>  3 (ดี): นักศึกษาสามารถออกแบบโปรแกรมการท่องเที่ยวตามมาตรฐานได้ จัดการทรัพยากรการท่องเที่ยวและบริการได้ตามแผน นำเสนอประสบการณ์ที่เหมาะสมกับกลุ่มลูกค้า</p>\n<p>  2 (พอใช้): นักศึกษาสามารถออกแบบโปรแกรมการท่องเที่ยวได้แต่ต้องมีผู้แนะนำ จัดการทรัพยากรการท่องเที่ยวและบริการได้แต่มีข้อบกพร่อง นำเสนอประสบการณ์แบบพื้นฐานได้</p>\n<p>  1 (ต้องปรับปรุง): นักศึกษาไม่สามารถออกแบบโปรแกรมการท่องเที่ยวได้แม้มีผู้แนะนำ มีปัญหาในการจัดการทรัพยากรการท่องเที่ยวและบริการ ไม่สามารถนำเสนอประสบการณ์ที่น่าพอใจให้กับลูกค้า</p>\n<h3 class=\"domain-title\">(3) ด้านจริยธรรม (Ethics) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO8</span> <span class=\"lo-desc\">มีความรับผิดชอบต่อตนเอง สังคม และสิ่งแวดล้อม |   5 (ยอดเยี่ยม): นักศึกษามีความตรงต่อเวลาและรับผิดชอบงานอย่างสม่ำเสมอ มีส่วนร่วมในกิจกรรมเพื่อสังคมขององค์กรอย่างกระตือรือร้น ริเริ่มและนำเสนอแนวทางการอนุรักษ์สิ่งแวดล้อมในการทำงาน</span></div>\n<p>  4 (ดีมาก): นักศึกษามีความตรงต่อเวลาและรับผิดชอบงานเป็นอย่างดี เข้าร่วมกิจกรรมเพื่อสังคมขององค์กรอย่างสม่ำเสมอ ปฏิบัติตามแนวทางการอนุรักษ์สิ่งแวดล้อมขององค์กรอย่างเคร่งครัด</p>\n<p>  3 (ดี): นักศึกษามีความตรงต่อเวลาและรับผิดชอบงานตามที่ได้รับมอบหมาย เข้าร่วมกิจกรรมเพื่อสังคมตามที่องค์กรกำหนด ปฏิบัติตามแนวทางการอนุรักษ์สิ่งแวดล้อมขององค์กร</p>\n<p>  2 (พอใช้): นักศึกษามาสายหรือส่งงานล่าช้าบ้างเป็นครั้งคราว เข้าร่วมกิจกรรมเพื่อสังคมเมื่อถูกร้องขอ ปฏิบัติตามแนวทางการอนุรักษ์สิ่งแวดล้อมไม่สม่ำเสมอ</p>\n<p>  1 (ต้องปรับปรุง): นักศึกษามาสายหรือส่งงานล่าช้าบ่อยครั้ง ไม่เข้าร่วมกิจกรรมเพื่อสังคม ละเลยการปฏิบัติตามแนวทางการอนุรักษ์สิ่งแวดล้อม</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO9</span> <span class=\"lo-desc\">มีความกตัญญู ซื่อสัตย์ และปฏิบัติตามกฎระเบียบด้านการท่องเที่ยวและการโรงแรม และสังคม |   5 (ยอดเยี่ยม): นักศึกษาปฏิบัติตามกฎระเบียบขององค์กรอย่างเคร่งครัดและสม่ำเสมอ รายงานข้อมูลและนำส่งทรัพย์สิน/เงินอย่างถูกต้องครบถ้วนทุกครั้ง แสดงความเคารพและให้เกียรติผู้อื่นอย่างสม่ำเสมอ เป็นแบบอย่างที่ดีให้เพื่อนร่วมงาน</span></div>\n<p>  4 (ดีมาก): นักศึกษาปฏิบัติตามกฎระเบียบขององค์กรอย่างสม่ำเสมอ รายงานข้อมูลและนำส่งทรัพย์สิน/เงินอย่างถูกต้อง แสดงความเคารพและให้เกียรติผู้อื่นเป็นประจำ ได้รับความไว้วางใจจากผู้ร่วมงาน</p>\n<p>  3 (ดี): นักศึกษาปฏิบัติตามกฎระเบียบขององค์กรเป็นส่วนใหญ่ รายงานข้อมูลและนำส่งทรัพย์สิน/เงินโดยมีข้อผิดพลาดเล็กน้อย แสดงความเคารพและให้เกียรติผู้อื่น ไม่มีข้อร้องเรียนด้านความซื่อสัตย์</p>\n<p>  2 (พอใช้): นักศึกษามีการละเลยการปฏิบัติตามกฎระเบียบบ้าง มีข้อผิดพลาดในการรายงานข้อมูลและนำส่งทรัพย์สิน/เงิน ขาดความเคารพหรือให้เกียรติผู้อื่นบางครั้ง ต้องได้รับการตักเตือนด้านความประพฤติ</p>\n<p>  1 (ต้องปรับปรุง): นักศึกษาละเลยการปฏิบัติตามกฎระเบียบบ่อยครั้ง มีปัญหาด้านความซื่อสัตย์ในการรายงานหรือนำส่งทรัพย์สิน ขาดความเคารพหรือให้เกียรติผู้อื่นบ่อยครั้ง มีข้อร้องเรียนด้านความประพฤติ</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO10</span> <span class=\"lo-desc\">แสดงออกถึงการอนุรักษ์ทรัพยากรธรรมชาติและวัฒนธรรมเพื่อลดผลกระทบที่เกิดขึ้นต่อ เศรษฐกิจ สังคม และสิ่งแวดล้อม |   5 (ยอดเยี่ยม): นักศึกษาริเริ่มหรือมีส่วนร่วมในโครงการอนุรักษ์สิ่งแวดล้อมและวัฒนธรรมท้องถิ่น นำเสนอแนวทางลดผลกระทบต่อสิ่งแวดล้อมที่สามารถนำไปปฏิบัติได้จริง สื่อสารและสร้างความตระหนักด้านการอนุรักษ์แก่ลูกค้าและผู้ร่วมงาน ปฏิบัติตามหลักการท่องเที่ยวอย่างยั่งยืนอย่างสม่ำเสมอ</span></div>\n<p>  4 (ดีมาก): นักศึกษาเข้าร่วมกิจกรรมอนุรักษ์สิ่งแวดล้อมและวัฒนธรรมท้องถิ่นอย่างสม่ำเสมอ ปฏิบัติตามแนวทางลดผลกระทบต่อสิ่งแวดล้อมอย่างเคร่งครัด ให้ข้อมูลด้านการอนุรักษ์แก่ลูกค้าได้อย่างถูกต้อง คำนึงถึงผลกระทบต่อสิ่งแวดล้อมในการทำงาน</p>\n<p>  3 (ดี): นักศึกษาเข้าร่วมกิจกรรมอนุรักษ์ตามที่องค์กรกำหนด ปฏิบัติตามแนวทางลดผลกระทบต่อสิ่งแวดล้อมได้ดี เข้าใจและสามารถอธิบายความสำคัญของการอนุรักษ์ ไม่สร้างผลกระทบเชิงลบต่อสิ่งแวดล้อมและวัฒนธรรม</p>\n<p>  2 (พอใช้): นักศึกษาเข้าร่วมกิจกรรมอนุรักษ์เมื่อถูกร้องขอ ปฏิบัติตามแนวทางลดผลกระทบต่อสิ่งแวดล้อมไม่สม่ำเสมอ มีความเข้าใจด้านการอนุรักษ์ในระดับพื้นฐาน ขาดความใส่ใจต่อผลกระทบด้านสิ่งแวดล้อมบางครั้ง</p>\n<p>  1 (ต้องปรับปรุง): นักศึกษาไม่สนใจเข้าร่วมกิจกรรมอนุรักษ์ ละเลยการปฏิบัติตามแนวทางลดผลกระทบต่อสิ่งแวดล้อม ขาดความเข้าใจด้านการอนุรักษ์ สร้างผลกระทบเชิงลบต่อสิ่งแวดล้อมและวัฒนธรรม</p>\n<h3 class=\"domain-title\">(4) ด้านลักษณะบุคคล (Character) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO11</span> <span class=\"lo-desc\">แสดงออกถึงการมีจิตบริการ และบุคลิกภาพด้านการแต่งกายและการพูดในงานบริการด้านการท่องเที่ยวและการโรงแรมที่เหมาะสม |   5 (ยอดเยี่ยม): นักศึกษาแต่งกายสุภาพเรียบร้อย ถูกระเบียบทุกครั้ง ให้บริการด้วยความกระตือรือร้น เต็มใจ และเป็นมิตร ได้รับคำชมเชยจากลูกค้าหรือผู้ร่วมงานเป็นประจำ</span></div>\n<p>  4 (ดีมาก): นักศึกษาแต่งกายสุภาพเรียบร้อยเกือบทุกครั้ง ให้บริการด้วยความเต็มใจและเป็นมิตร ได้รับคำชมเชยจากลูกค้าหรือผู้ร่วมงานบ่อยครั้ง</p>\n<p>  3 (ดี): นักศึกษาแต่งกายถูกระเบียบเป็นส่วนใหญ่ ให้บริการตามมาตรฐานที่กำหนด ไม่มีข้อร้องเรียนจากลูกค้าหรือผู้ร่วมงาน</p>\n<p>  2 (พอใช้): นักศึกษาแต่งกายไม่เรียบร้อยบ้างเป็นครั้งคราว ให้บริการไม่สม่ำเสมอ มีข้อร้องเรียนจากลูกค้าหรือผู้ร่วมงานบ้าง</p>\n<p>  1 (ต้องปรับปรุง): นักศึกษาแต่งกายไม่เหมาะสมบ่อยครั้ง ให้บริการไม่เต็มใจ หรือแสดงกิริยาไม่เหมาะสม มีข้อร้องเรียนจากลูกค้าหรือผู้ร่วมงานบ่อยครั้ง</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO12</span> <span class=\"lo-desc\">แสดงออกถึงการมีวินัย มีภาวะผู้นำ สามารถเป็นได้ทั้งผู้นำ และผู้ตาม ทำงานร่วมกับผู้อื่นได้ มีจิตอาสา และสามารถพัฒนาตนเองในงานด้านการท่องเที่ยวและการโรงแรมได้อย่างต่อเนื่อง |   5 (ยอดเยี่ยม): นักศึกษาแสดงภาวะผู้นำในการทำงานกลุ่ม รับฟังความคิดเห็นของผู้อื่นและประสานงานได้ดีเยี่ยม มีจิตอาสาช่วยเหลืองานส่วนรวมสม่ำเสมอ</span></div>\n<p>  4 (ดีมาก): นักศึกษาสามารถเป็นได้ทั้งผู้นำและผู้ตามที่ดี ประสานงานกับผู้อื่นได้ดี มีจิตอาสาช่วยเหลืองานส่วนรวมบ่อยครั้ง</p>\n<p>  3 (ดี): นักศึกษาทำหน้าที่ผู้นำหรือผู้ตามได้ตามที่ได้รับมอบหมาย ทำงานร่วมกับผู้อื่นได้ดี มีจิตอาสาช่วยเหลืองานส่วนรวมเมื่อมีโอกาส</p>\n<p>  2 (พอใช้): นักศึกษาไม่ค่อยแสดงบทบาทผู้นำ ทำงานร่วมกับผู้อื่นได้แต่มีข้อจำกัด ช่วยเหลืองานส่วนรวมเมื่อถูกร้องขอ</p>\n<p>  1 (ต้องปรับปรุง): นักศึกษาไม่สามารถเป็นผู้นำหรือผู้ตามที่ดีได้ มีปัญหาในการทำงานร่วมกับผู้อื่น ไม่มีจิตอาสาช่วยเหลืองานส่วนรวม</p>"}, {"name": "หลักสูตรการจัดการการท่องเที่ยวและการโรงแรม", "file": "9. สำนักวิชากการจัดการ 4 หลักสูตร\\แบบประเมินสหกิจฯ สาขาการจัดการการท่องเที่ยวและการโรงแรม (updated 30 Jan 2025).pdf", "ext": "pdf", "html": "<p>หลักสูตรบริหารธุรกิจบัณฑิต</p>\n<p>สาขาการจัดการการท่องเที่ยวและการโรงแรม</p>\n<p>สำนักวิชาการจัดการ</p>\n<p>(หลักสตู รปรับปรุง ปีการศึกษา 2567)</p>\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของหลักสูตร (Program Learning Outcomes: PLOs)</h2>\n<h3 class=\"domain-title\">1) ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO1</span> <span class=\"lo-desc\">อธิบายแนวคิด การปรับตัว และคุณค่าวัฒนธรรมโดยคำนึงถึงความแตกต่างและการเปลี่ยนแปลง</span></div>\n<p>ทั้งทางด้านเศรษฐกิจ สังคม วัฒนธรรม และสิ่งแวดล้อม</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO2</span> <span class=\"lo-desc\">อธิบายแนวคิดด้านบริหารธุรกิจ การท่องเที่ยวและการโรงแรม ภายใต้การเปลี่ยนแปลงของ</span></div>\n<p>เทคโนโลยีสารสนเทศในยุคดิจิทัล</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO3</span> <span class=\"lo-desc\">ประยุกต์ความรู้ด้านบริหารธุรกิจและการจัดการนวัตกรรมเพื่อการดำเนินงานด้านการท่องเที่ยว</span></div>\n<p>และการโรงแรม</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO4</span> <span class=\"lo-desc\">ประยุกต์ความรู้การจัดการการท่องเที่ยวและการโรงแรมเพื่อการปฏิบัติงานด้านการท่องเที่ยวและ</span></div>\n<p>การโรงแรม</p>\n<h3 class=\"domain-title\">2) ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO5</span> <span class=\"lo-desc\">มีทักษะการสื่อสารภาษาไทย และภาษาอังกฤษ เพื่อใช้ในชีวิตประจำวันและในการทำงานด้านการ</span></div>\n<p>ท่องเที่ยวและการโรงแรมทั้งการฟัง พูด อ่าน เขียน และนำเสนอผลงานได้อย่างเหมาะสมกับ สถานการณ์ ในกรณี</p>\n<p>นักศึกษาเลือกภาษาจีน สามารถสื่อสารภาษาจีน ในชีวิตประจำวันได้</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO6</span> <span class=\"lo-desc\">มีทักษะการใช้เทคโนโลยีสารสนเทศเพื่อสืบค้นข้อมูล วิเคราะห์ นำเสนอ และมีทักษะการใช้</span></div>\n<p>โปรแกรมประยุกต์ในงานด้านการท่องเที่ยวและการโรงแรม</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO7</span> <span class=\"lo-desc\">มีทักษะการแก้ไขปัญหาในการปฏิบัติงานด้านการท่องเที่ยวและการโรงแรม โดยการคิดวิเคราะห์</span></div>\n<p>อย่างมีเหตุผล</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO8</span> <span class=\"lo-desc\">มีทักษะการให้บริการและนันทนาการด้านการท่องเที่ยวและการโรงแรมแก่ลูกค้า</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO9</span> <span class=\"lo-desc\">มีทักษะการออกแบบประสบการณ์การท่องเที่ยวแก่ลูกค้าในแหล่งท่องเที่ยวและโรงแรม</span></div>\n<h3 class=\"domain-title\">3) ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO10</span> <span class=\"lo-desc\">มีความรับผิดชอบต่อตนเอง สังคม และสิ่งแวดล้อม</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO11</span> <span class=\"lo-desc\">มีความกตัญญู ซื่อสัตย์ และปฏิบัติตามกฎระเบียบด้านการท่องเที่ยวและการโรงแรม และสังคม</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO12</span> <span class=\"lo-desc\">แสดงออกถึงการอนุรักษ์ทรัพยากรธรรมชาติและวัฒนธรรมเพื่อลดผลกระทบที่เกิดขึ้นต่อ</span></div>\n<p>เศรษฐกิจ สังคม และสิ่งแวดล้อม</p>\n<h3 class=\"domain-title\">4) ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO13</span> <span class=\"lo-desc\">แสดงออกถึงการมีจิตบริการ และบุคลิกภาพด้านการแต่งกายและการพูดในงานบริการด้านการ</span></div>\n<p>ท่องเที่ยวและการโรงแรมที่เหมาะสม</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO14</span> <span class=\"lo-desc\">แสดงออกถึงการมีวินัย มีภาวะผู้นำ สามารถเป็นได้ทั้งผู้นำ และผู้ตาม ทำงานร่วมกับผู้อื่นได้ มีจิต</span></div>\n<p>อาสา และสามารถพัฒนาตนเองในงานด้านการท่องเที่ยวและการโรงแรมได้อย่างต่อเนื่อง</p>\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษา (Learning Outcome: LO)</h2>\n<h3 class=\"domain-title\">(1) ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">ประยุกต์ความรู้ด้านบริหารธุรกิจและการจัดการนวัตกรรมเพื่อการดำเนินงานด้านการท่องเที่ยวและการ</span></div>\n<p>โรงแรม</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">ประยุกต์ความรู้การจัดการการท่องเที่ยวและการโรงแรมเพื่อการปฏิบัติงานด้านการท่องเที่ยวและการ</span></div>\n<p>โรงแรม</p>\n<h3 class=\"domain-title\">(2) ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">มีทักษะการสื่อสารภาษาไทย และภาษาอังกฤษ เพื่อใช้ในชีวิตประจำวันและในการทำงานด้านการ</span></div>\n<p>ท่องเที่ยวและการโรงแรมทั้งการฟัง พูด อ่าน เขียน และนำเสนอผลงานได้อย่างเหมาะสมกับ สถานการณ์ ใน</p>\n<p>กรณีนักศึกษาเลือกภาษาจีน สามารถสื่อสารภาษาจีน ในชีวิตประจำวันได้</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">มีทักษะการใช้เทคโนโลยีสารสนเทศเพื่อสืบค้นข้อมูล วิเคราะห์ นำเสนอ และมีทักษะการใช้โปรแกรม</span></div>\n<p>ประยุกต์ในงานด้านการท่องเที่ยวและการโรงแรม</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">มีทักษะการแก้ไขปัญหาในการปฏิบัติงานด้านการท่องเที่ยวและการโรงแรม โดยการคิดวิเคราะห์ อย่างมี</span></div>\n<p>เหตุผล</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO6</span> <span class=\"lo-desc\">มีทักษะการให้บริการและนันทนาการด้านการท่องเที่ยวและการโรงแรมแก่ลูกค้า</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO7</span> <span class=\"lo-desc\">มีทักษะการออกแบบประสบการณ์การท่องเที่ยวแก่ลูกค้าในแหล่งท่องเที่ยวและโรงแรม</span></div>\n<h3 class=\"domain-title\">(3) ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO8</span> <span class=\"lo-desc\">มีความรับผิดชอบต่อตนเอง สังคม และสิ่งแวดล้อม</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO9</span> <span class=\"lo-desc\">มีความกตัญญู ซื่อสัตย์ และปฏิบัติตามกฎระเบียบด้านการท่องเที่ยวและการโรงแรม และสังคม</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO10</span> <span class=\"lo-desc\">แสดงออกถึงการอนุรักษ์ทรัพยากรธรรมชาติและวัฒนธรรมเพื่อลดผลกระทบที่เกิดขึ้นต่อ เศรษฐกิจ</span></div>\n<p>สังคม และสิ่งแวดล้อม</p>\n<h3 class=\"domain-title\">(4) ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO11</span> <span class=\"lo-desc\">แสดงออกถึงการมีจิตบริการ และบุคลิกภาพด้านการแต่งกายและการพูดในงานบริการด้านการ</span></div>\n<p>ท่องเที่ยวและการโรงแรมที่เหมาะสม</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO12</span> <span class=\"lo-desc\">แสดงออกถึงการมีวินัย มีภาวะผู้นำ สามารถเป็นได้ทั้งผู้นำ และผู้ตาม ทำงานร่วมกับผู้อื่นได้ มีจิตอาสา</span></div>\n<p>และสามารถพัฒนาตนเองในงานด้านการท่องเที่ยวและการโรงแรมได้อย่างต่อเนื่อง</p>\n<h2 class=\"section-title\">แบบประเมินผลการปฏิบัติสหกิจศึกษาตามผลลัพธ์การเรียนรู้ที่คาดหวัง</h2>\n<p>ผลการเรียนรู้ที่คาดหวัง ผลการประเมิน</p>\n<h3 class=\"domain-title\">(1) ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">ประยุกต์ความรู้ด้านบริหารธุรกิจและการจัดการ 5 (ยอดเยี่ยม): นักศึกษาสามารถวิเคราะห์สถานการณ์</span></div>\n<p>นวัตกรรมเพื่อการดำเนินงานด้านการท่องเที่ยวและ</p>\n<p>และเสนอแนวทางแก้ไขปัญหาโดยใช้หลักการบริหารธุรกิจ</p>\n<p>การโรงแรม</p>\n<p>ได้อย่างเป็นระบบ นำเสนอนวัตกรรมหรือแนวคิดใหม่ๆ ที่</p>\n<p>สามารถนำไปใช้ได้จริงในองค์กร มีการบูรณาการความรู้</p>\n<p>จากหลายศาสตร์มาประยุกต์ใช้ได้อย่างเหมาะสม</p>\n<div class=\"rubric-level\">4 (ดีมาก): นักศึกษาสามารถประยุกต์ใช้หลักการ</div>\n<p>บริหารธุรกิจในการทำงานได้ดี มีการนำเสนอแนวคิดใหม่ๆ</p>\n<p>ในการพัฒนางาน เข้าใจและเชื่อมโยงทฤษฎีสู่การปฏิบัติได้</p>\n<div class=\"rubric-level\">3 (ดี): นักศึกษาเข้าใจหลักการบริหารธุรกิจพื้นฐาน</div>\n<p>และนำมาใช้ในงานได้ ทำงานตามกระบวนการมาตรฐาน</p>\n<p>ขององค์กรได้ดี รู้จักปรับปรุงวิธีการทำงานเมื่อได้รับ</p>\n<p>คำแนะนำ</p>\n<div class=\"rubric-level\">2 (พอใช้): นักศึกษาเข้าใจหลักการพื้นฐานแต่</div>\n<p>ประยุกต์ใช้ได้จำกัด ต้องได้รับคำแนะนำในการทำงาน</p>\n<p>บ่อยครั้ง ทำงานตามที่ได้รับมอบหมายได้แต่ขาดการริเริ่ม</p>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): นักศึกษาไม่สามารถนำความรู้มา</div>\n<p>ประยุกต์ใช้ในงานได้ ไม่เข้าใจหลักการพื้นฐานที่จำเป็น ต้อง</p>\n<p>ได้รับการกำกับดูแลอย่างใกล้ชิดตลอดเวลา</p>\n<p>(5) LO2: ประยุกต์ความรู้การจัดการการท่องเที่ยวและ 5 (ยอดเยี่ยม): นักศึกษาสามารถจัดการงานบริการได้</p>\n<p>การโรงแรมเพื่อการปฏิบัติงานด้านการท่องเที่ยวและ</p>\n<p>อย่างมีประสิทธิภาพสูง โดยได้รับความพึงพอใจจากลูกค้า</p>\n<p>การโรงแรม</p>\n<p>&gt; 90% แก้ไขสถานการณ์เฉพาะหน้าได้อย่างเหมาะสมและ</p>\n<p>รวดเร็ว สามารถสอนงานหรือแนะนำเพื่อนร่วมงานได้</p>\n<div class=\"rubric-level\">4 (ดีมาก): นักศึกษาสามารถจัดการงานบริการได้ดี</div>\n<p>ได้รับความพึงพอใจจากลูกค้า 80-90% แก้ไขปัญหาพื้นฐาน</p>\n<p>ในงานบริการได้ด้วยตนเอง มีการวางแผนและจัดลำดับ</p>\n<p>ความสำคัญของงานได้ดี</p>\n<div class=\"rubric-level\">3 (ดี): นักศึกษาสามารถให้บริการตามมาตรฐานได้ดี</div>\n<p>ได้รับความพึงพอใจจากลูกค้า 70-79% ทำงานตามขั้นตอน</p>\n<p>ที่กำหนดได้ครบถ้วน สื่อสารกับลูกค้าและเพื่อนร่วมงานได้</p>\n<p>อย่างเหมาะสม</p>\n<div class=\"rubric-level\">2 (พอใช้): นักศึกษาสามารถให้บริการได้ตาม</div>\n<p>มาตรฐานขั้นต่ า ได้รับความพึงพอใจจากลูกค้า 60-69%</p>\n<p>ต้องได้รับคำแนะนำในการแก้ไขปัญหาเสมอ การสื่อสารกับ</p>\n<p>ลูกค้ายังมีข้อบกพร่อง</p>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): ไม่สามารถให้บริการตามมาตรฐาน</div>\n<p>ขั้นต่ า ได้รับความพึงพอใจจากลูกค้า &lt; 60% ไม่สามารถ</p>\n<p>แก้ไขปัญหาพื้นฐานได้ มีปัญหาในการสื่อสารกับลูกค้าและ</p>\n<p>เพื่อนร่วมงาน</p>\n<p>(6) (2) ด้านทักษะ (Skills)</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">มีทักษะการสื่อสารภาษาไทย และภาษาอังกฤษ 5 (ยอดเยี่ยม): นักศึกษาสามารถสื่อสารภาษาไทยและ</span></div>\n<p>เพื่อใช้ในชีวิตประจำวันและในการทำงานด้านการ</p>\n<p>ภาษาอังกฤษได้อย่างคล่องแคล่วทั้งการฟัง พูด อ่าน เขียน</p>\n<p>ท่องเที่ยวและการโรงแรมทั้งการฟัง พูด อ่าน เขียน</p>\n<p>สามารถนำเสนองานเป็นภาษาอังกฤษได้อย่างมี</p>\n<p>และนำเสนอผลงานได้อย่างเหมาะสมกับ สถานการณ์</p>\n<p>ประสิทธิภาพ กรณีเลือกภาษาจีน: สื่อสารในชีวิตประจำวัน</p>\n<p>ในกรณีนักศึกษาเลือกภาษาจีน สามารถสื่อสาร</p>\n<p>และงานบริการได้อย่างคล่องแคล่ว</p>\n<p>ภาษาจีน ในชีวิตประจำวันได้</p>\n<div class=\"rubric-level\">4 (ดีมาก): นักศึกษาสามารถสื่อสารภาษาไทยได้ดีมาก</div>\n<p>และภาษาอังกฤษได้ดี นำเสนองานเป็นภาษาอังกฤษได้ โดย</p>\n<p>มีข้อผิดพลาดเล็กน้อย กรณีเลือกภาษาจีน: สื่อสารใน</p>\n<p>ชีวิตประจำวันได้ดี มีข้อผิดพลาดน้อย</p>\n<div class=\"rubric-level\">3 (ดี): นักศึกษาสามารถสื่อสารภาษาไทยได้ดี และ</div>\n<p>ภาษาอังกฤษได้ในระดับใช้งาน นำเสนองานเป็น</p>\n<p>ภาษาอังกฤษได้ แต่ต้องเตรียมตัวมาก กรณีเลือกภาษาจีน:</p>\n<p>สื่อสารประโยคพื้นฐานในชีวิตประจำวันได้</p>\n<div class=\"rubric-level\">2 (พอใช้): นักศึกษาสามารถสื่อสารภาษาไทยได้พอใช้</div>\n<p>ภาษาอังกฤษมีข้อจำกัด ต้องได้รับความช่วยเหลือในการ</p>\n<p>นำเสนองานภาษาอังกฤษ กรณีเลือกภาษาจีน: สื่อสารได้</p>\n<p>เฉพาะประโยคง่ายๆ</p>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): นักศึกษามีปัญหาในการสื่อสารทั้ง</div>\n<p>ภาษาไทยและภาษาอังกฤษ ไม่สามารถนำเสนองานเป็น</p>\n<p>ภาษาอังกฤษได้ กรณีเลือกภาษาจีน: ไม่สามารถสื่อสาร</p>\n<p>ภาษาจีนได้แม้แต่ประโยคพื้นฐาน</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">มีทักษะการใช้เทคโนโลยีสารสนเทศเพื่อสืบค้น 5 (ยอดเยี่ยม): นักศึกษาสามารถใช้โปรแกรม</span></div>\n<p>ข้อมูล วิเคราะห์ นำเสนอ และมีทักษะการใช้โปรแกรม</p>\n<p>สำนักงานและระบบสารสนเทศขององค์กรได้อย่าง</p>\n<p>ประยุกต์ในงานด้านการท่องเที่ยวและการโรงแรม</p>\n<p>คล่องแคล่ว สามารถแก้ไขปัญหาทางเทคนิคเบื้องต้นได้ด้วย</p>\n<p>ตนเอง สามารถประยุกต์ใช้เทคโนโลยีใหม่ๆ เพื่อพัฒนางาน</p>\n<p>ได้</p>\n<div class=\"rubric-level\">4 (ดีมาก): นักศึกษาสามารถใช้โปรแกรมสำนักงานได้</div>\n<div class=\"rubric-level\">ดี และเรียนรู้ระบบใหม่ได้เร็ว ต้องการความช่วยเหลือใน</div>\n<p>การแก้ปัญหาทางเทคนิคเพียงเล็กน้อย มีความคิดริเริ่มใน</p>\n<p>การใช้เทคโนโลยีเพื่อพัฒนางาน</p>\n<div class=\"rubric-level\">3 (ดี): นักศึกษาสามารถใช้โปรแกรมพื้นฐานได้ดี</div>\n<p>เรียนรู้ระบบใหม่ได้เมื่อได้รับการสอน ทำงานกับระบบ</p>\n<p>สารสนเทศขององค์กรได้ตามมาตรฐาน</p>\n<div class=\"rubric-level\">2 (พอใช้): นักศึกษาสามารถใช้โปรแกรมพื้นฐานได้แต่</div>\n<p>มีข้อจำกัด ต้องการความช่วยเหลือในการใช้ระบบใหม่</p>\n<p>บ่อยครั้ง ทำงานกับระบบสารสนเทศได้ช้า</p>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): นักศึกษาไม่สามารถใช้โปรแกรม</div>\n<p>พื้นฐานได้อย่างมีประสิทธิภาพ ไม่สามารถเรียนรู้ระบบใหม่</p>\n<p>ได้แม้จะได้รับการสอน มีปัญหาในการใช้ระบบสารสนเทศ</p>\n<p>ขององค์กร</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">มีทักษะการแก้ไขปัญหาในการปฏิบัติงานด้าน 5 (ยอดเยี่ยม): นักศึกษาสามารถวิเคราะห์สาเหตุของ</span></div>\n<p>การท่องเที่ยวและการโรงแรม โดยการคิดวิเคราะห์</p>\n<p>ปัญหาได้อย่างเป็นระบบ เสนอทางเลือกในการแก้ปัญหาได้</p>\n<p>อย่างมีเหตุผล</p>\n<p>หลากหลายและสร้างสรรค์ แก้ไขปัญหาเฉพาะหน้าได้อย่าง</p>\n<p>มีประสิทธิภาพ โดยคำนึงถึงผลกระทบระยะยาว</p>\n<div class=\"rubric-level\">4 (ดีมาก): นักศึกษาสามารถวิเคราะห์ปัญหาได้ดี</div>\n<p>เสนอแนวทางแก้ไขปัญหาได้มากกว่า 1 แนวทาง แก้ไข</p>\n<p>ปัญหาเฉพาะหน้าได้ดี</p>\n<div class=\"rubric-level\">3 (ดี): นักศึกษาสามารถระบุปัญหาและสาเหตุได้</div>\n<p>เสนอแนวทางแก้ไขปัญหาได้ 1 แนวทาง แก้ไขปัญหา</p>\n<p>พื้นฐานได้ตามแนวทางที่กำหนด</p>\n<div class=\"rubric-level\">2 (พอใช้): นักศึกษาสามารถระบุปัญหาได้แต่วิเคราะห์</div>\n<p>สาเหตุได้ไม่ชัดเจน ต้องได้รับคำแนะนำในการแก้ไขปัญหา</p>\n<p>แก้ไขปัญหาได้เฉพาะเมื่อมีผู้ชี้แนะ</p>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): นักศึกษาไม่สามารถระบุปัญหาและ</div>\n<p>สาเหตุได้ ไม่สามารถเสนอแนวทางแก้ไขปัญหา ไม่สามารถ</p>\n<p>แก้ไขปัญหาได้แม้จะได้รับคำแนะนำ</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO6</span> <span class=\"lo-desc\">มีทักษะการให้บริการและนันทนาการด้านการ 5 (ยอดเยี่ยม): นักศึกษาสามารถให้บริการและหรือจัด</span></div>\n<p>ท่องเที่ยวและการโรงแรมแก่ลูกค้า</p>\n<p>กิจกรรมนันทนาการที่สร้างสรรค์และเหมาะสมกับกลุ่ม</p>\n<p>ลูกค้าได้โดดเด่น แก้ไขสถานการณ์เฉพาะหน้าในการ</p>\n<p>ให้บริการได้อย่างยอดเยี่ยม ได้รับความพึงพอใจจากลูกค้า</p>\n<p>ในระดับดีเยี่ยม (&gt;90%)</p>\n<div class=\"rubric-level\">4 (ดีมาก): นักศึกษาสามารถให้บริการและหรือจัด</div>\n<p>กิจกรรมนันทนาการที่น่าสนใจและเหมาะสมกับกลุ่มลูกค้า</p>\n<p>จัดการสถานการณ์ในการให้บริการได้ดี ได้รับความพึงพอใจ</p>\n<p>จากลูกค้าในระดับดีมาก (80-90%)</p>\n<div class=\"rubric-level\">3 (ดี): นักศึกษาสามารถให้บริการและหรือจัดกิจกรรม</div>\n<p>นันทนาการตามแผนที่กำหนดได้ ให้บริการได้ตามมาตรฐาน</p>\n<p>ได้รับความพึงพอใจจากลูกค้าในระดับดี (70-79%)</p>\n<div class=\"rubric-level\">2 (พอใช้): นักศึกษาสามารถให้บริการและหรือจัด</div>\n<p>กิจกรรมนันทนาการได้แต่ต้องมีผู้ช่วยแนะนำ ให้บริการได้</p>\n<p>แต่ยังมีข้อบกพร่อง ได้รับความพึงพอใจจากลูกค้าในระดับ</p>\n<div class=\"rubric-level\">พอใช้ (60-69%)</div>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): นักศึกษาไม่สามารถจัดกิจกรรม</div>\n<p>นันทนาการได้แม้จะมีผู้แนะนำ มีปัญหาในการให้บริการ</p>\n<p>บ่อยครั้ง ได้รับความพึงพอใจจากลูกค้าในระดับต่ า (&lt;60%)</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO7</span> <span class=\"lo-desc\">มีทักษะการออกแบบประสบการณ์การ 5 (ยอดเยี่ยม): นักศึกษาสามารถออกแบบโปรแกรม</span></div>\n<p>ท่องเที่ยวแก่ลูกค้าในแหล่งท่องเที่ยวและโรงแรม</p>\n<p>การท่องเที่ยวที่สร้างสรรค์และตอบโจทย์ความต้องการของ</p>\n<p>ลูกค้าได้ดีเยี่ยม บูรณาการทรัพยากรการท่องเที่ยวและ</p>\n<p>บริการต่างๆ ได้อย่างลงตัว นำเสนอประสบการณ์ที่แปลก</p>\n<p>ใหม่และน่าประทับใจ พร้อมคำนึงถึงความยั่งยืน</p>\n<div class=\"rubric-level\">4 (ดีมาก): นักศึกษาสามารถออกแบบโปรแกรมการ</div>\n<p>ท่องเที่ยวที่น่าสนใจและตอบสนองความต้องการของลูกค้า</p>\n<p>จัดการทรัพยากรการท่องเที่ยวและบริการได้อย่างมี</p>\n<p>ประสิทธิภาพ สร้างประสบการณ์ที่น่าจดจำให้กับลูกค้าได้</p>\n<div class=\"rubric-level\">3 (ดี): นักศึกษาสามารถออกแบบโปรแกรมการ</div>\n<p>ท่องเที่ยวตามมาตรฐานได้ จัดการทรัพยากรการท่องเที่ยว</p>\n<p>และบริการได้ตามแผน นำเสนอประสบการณ์ที่เหมาะสม</p>\n<p>กับกลุ่มลูกค้า</p>\n<div class=\"rubric-level\">2 (พอใช้): นักศึกษาสามารถออกแบบโปรแกรมการ</div>\n<p>ท่องเที่ยวได้แต่ต้องมีผู้แนะนำ จัดการทรัพยากรการ</p>\n<p>ท่องเที่ยวและบริการได้แต่มีข้อบกพร่อง นำเสนอ</p>\n<p>ประสบการณ์แบบพื้นฐานได้</p>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): นักศึกษาไม่สามารถออกแบบ</div>\n<p>โปรแกรมการท่องเที่ยวได้แม้มีผู้แนะนำ มีปัญหาในการ</p>\n<p>จัดการทรัพยากรการท่องเที่ยวและบริการ ไม่สามารถ</p>\n<p>นำเสนอประสบการณ์ที่น่าพอใจให้กับลูกค้า</p>\n<h3 class=\"domain-title\">(3) ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO8</span> <span class=\"lo-desc\">มีความรับผิดชอบต่อตนเอง สังคม และ 5 (ยอดเยี่ยม): นักศึกษามีความตรงต่อเวลาและ</span></div>\n<p>สิ่งแวดล้อม</p>\n<p>รับผิดชอบงานอย่างสม่ าเสมอ มีส่วนร่วมในกิจกรรมเพื่อ</p>\n<p>สังคมขององค์กรอย่างกระตือรือร้น ริเริ่มและนำเสนอแนว</p>\n<p>ทางการอนุรักษ์สิ่งแวดล้อมในการทำงาน</p>\n<div class=\"rubric-level\">4 (ดีมาก): นักศึกษามีความตรงต่อเวลาและรับผิดชอบ</div>\n<p>งานเป็นอย่างดี เข้าร่วมกิจกรรมเพื่อสังคมขององค์กรอย่าง</p>\n<p>สม่ าเสมอ ปฏิบัติตามแนวทางการอนุรักษ์สิ่งแวดล้อมของ</p>\n<p>องค์กรอย่างเคร่งครัด</p>\n<div class=\"rubric-level\">3 (ดี): นักศึกษามีความตรงต่อเวลาและรับผิดชอบงาน</div>\n<p>ตามที่ได้รับมอบหมาย เข้าร่วมกิจกรรมเพื่อสังคมตามที่</p>\n<p>องค์กรกำหนด ปฏิบัติตามแนวทางการอนุรักษ์สิ่งแวดล้อม</p>\n<p>ขององค์กร</p>\n<div class=\"rubric-level\">2 (พอใช)้ : นักศึกษามาสายหรือส่งงานล่าช้าบ้างเป็น</div>\n<p>ครั้งคราว เข้าร่วมกิจกรรมเพื่อสังคมเมื่อถูกร้องขอ ปฏิบัติ</p>\n<p>ตามแนวทางการอนุรักษ์สิ่งแวดล้อมไม่สม่ าเสมอ</p>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): นักศึกษามาสายหรือส่งงานล่าช้า</div>\n<p>บ่อยครั้ง ไม่เข้าร่วมกิจกรรมเพื่อสังคม ละเลยการปฏิบัติ</p>\n<p>ตามแนวทางการอนุรักษ์สิ่งแวดล้อม</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO9</span> <span class=\"lo-desc\">มีความกตัญญู ซื่อสัตย์ และปฏิบัติตาม 5 (ยอดเยี่ยม): นักศึกษาปฏิบัติตามกฎระเบียบของ</span></div>\n<p>กฎระเบียบด้านการท่องเที่ยวและการโรงแรม และ</p>\n<p>องค์กรอย่างเคร่งครัดและสม่ าเสมอ รายงานข้อมูลและ</p>\n<p>สังคม</p>\n<p>นำส่งทรัพย์สิน/เงินอย่างถูกต้องครบถ้วนทุกครั้ง แสดง</p>\n<p>ความเคารพและให้เกียรติผู้อื่นอย่างสม่ าเสมอ เป็น</p>\n<p>แบบอย่างที่ดีให้เพื่อนร่วมงาน</p>\n<div class=\"rubric-level\">4 (ดีมาก): นักศึกษาปฏิบัติตามกฎระเบียบขององค์กร</div>\n<p>อย่างสม่ าเสมอ รายงานข้อมูลและนำส่งทรัพย์สิน/เงินอย่าง</p>\n<p>ถูกต้อง แสดงความเคารพและให้เกียรติผู้อื่นเป็นประจำ</p>\n<p>ได้รับความไว้วางใจจากผู้ร่วมงาน</p>\n<div class=\"rubric-level\">3 (ดี): นักศึกษาปฏิบัติตามกฎระเบียบขององค์กรเป็น</div>\n<p>ส่วนใหญ่ รายงานข้อมูลและนำส่งทรัพย์สิน/เงินโดยมี</p>\n<p>ข้อผิดพลาดเล็กน้อย แสดงความเคารพและให้เกียรติผู้อื่น</p>\n<p>ไม่มีข้อร้องเรียนด้านความซื่อสัตย์</p>\n<div class=\"rubric-level\">2 (พอใช้): นักศึกษามีการละเลยการปฏิบัติตาม</div>\n<p>กฎระเบียบบ้าง มีข้อผิดพลาดในการรายงานข้อมูลและ</p>\n<p>นำส่งทรัพย์สิน/เงิน ขาดความเคารพหรือให้เกียรติผู้อื่น</p>\n<p>บางครั้ง ต้องได้รับการตักเตือนด้านความประพฤติ</p>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): นักศึกษาละเลยการปฏิบัติตาม</div>\n<p>กฎระเบียบบ่อยครั้ง มีปัญหาด้านความซื่อสัตย์ในการ</p>\n<p>รายงานหรือนำส่งทรัพย์สิน ขาดความเคารพหรือให้เกียรติ</p>\n<p>ผู้อื่นบ่อยครั้ง มีข้อร้องเรียนด้านความประพฤติ</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO10</span> <span class=\"lo-desc\">แสดงออกถึงการอนุรักษ์ทรัพยากรธรรมชาติ 5 (ยอดเยี่ยม): นักศึกษาริเริ่มหรือมีส่วนร่วมใน</span></div>\n<p>และวัฒนธรรมเพื่อลดผลกระทบที่เกิดขึ้นต่อ เศรษฐกิจ</p>\n<p>โครงการอนุรักษ์สิ่งแวดล้อมและวัฒนธรรมท้องถิ่น นำเสนอ</p>\n<p>สังคม และสิ่งแวดล้อม</p>\n<p>แนวทางลดผลกระทบต่อสิ่งแวดล้อมที่สามารถนำไปปฏิบัติ</p>\n<p>ได้จริง สื่อสารและสร้างความตระหนักด้านการอนุรักษ์แก่</p>\n<p>ลูกค้าและผู้ร่วมงาน ปฏิบัติตามหลักการท่องเที่ยวอย่าง</p>\n<p>ยั่งยืนอย่างสม่ าเสมอ</p>\n<div class=\"rubric-level\">4 (ดีมาก): นักศึกษาเข้าร่วมกิจกรรมอนุรักษ์</div>\n<p>สิ่งแวดล้อมและวัฒนธรรมท้องถิ่นอย่างสม่ าเสมอ ปฏิบัติ</p>\n<p>ตามแนวทางลดผลกระทบต่อสิ่งแวดล้อมอย่างเคร่งครัด ให้</p>\n<p>ข้อมูลด้านการอนุรักษ์แก่ลูกค้าได้อย่างถูกต้อง คำนึงถึง</p>\n<p>ผลกระทบต่อสิ่งแวดล้อมในการทำงาน</p>\n<div class=\"rubric-level\">3 (ดี): นักศึกษาเข้าร่วมกิจกรรมอนุรักษ์ตามที่องค์กร</div>\n<p>กำหนด ปฏิบัติตามแนวทางลดผลกระทบต่อสิ่งแวดล้อมได้</p>\n<div class=\"rubric-level\">ดี เข้าใจและสามารถอธิบายความสำคัญของการอนุรักษ์ ไม่</div>\n<p>สร้างผลกระทบเชิงลบต่อสิ่งแวดล้อมและวัฒนธรรม</p>\n<div class=\"rubric-level\">2 (พอใช้): นักศึกษาเข้าร่วมกิจกรรมอนุรักษ์เมื่อถูก</div>\n<p>ร้องขอ ปฏิบัติตามแนวทางลดผลกระทบต่อสิ่งแวดล้อมไม่</p>\n<p>สม่ าเสมอ มีความเข้าใจด้านการอนุรักษ์ในระดับพื้นฐาน</p>\n<p>ขาดความใส่ใจต่อผลกระทบด้านสิ่งแวดล้อมบางครั้ง</p>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): นักศึกษาไม่สนใจเข้าร่วมกิจกรรม</div>\n<p>อนุรักษ ์ ละเลยการปฏิบัติตามแนวทางลดผลกระทบต่อ</p>\n<p>สิ่งแวดล้อม ขาดความเข้าใจด้านการอนุรักษ์ สร้าง</p>\n<p>ผลกระทบเชิงลบต่อสิ่งแวดล้อมและวัฒนธรรม</p>\n<h3 class=\"domain-title\">(4) ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO11</span> <span class=\"lo-desc\">แสดงออกถึงการมีจิตบริการ และบุคลิกภาพ 5 (ยอดเยี่ยม): นักศึกษาแต่งกายสุภาพเรียบร้อย ถูก</span></div>\n<p>ด้านการแต่งกายและการพูดในงานบริการด้านการ</p>\n<p>ระเบียบทุกครั้ง ให้บริการด้วยความกระตือรือร้น เต็มใจ</p>\n<p>ท่องเที่ยวและการโรงแรมที่เหมาะสม</p>\n<p>และเป็นมิตร ได้รับคำชมเชยจากลูกค้าหรือผู้ร่วมงานเป็น</p>\n<p>ประจำ</p>\n<div class=\"rubric-level\">4 (ดีมาก): นักศึกษาแต่งกายสุภาพเรียบร้อยเกือบทุก</div>\n<p>ครั้ง ให้บริการด้วยความเต็มใจและเป็นมิตร ได้รับคำชมเชย</p>\n<p>จากลูกค้าหรือผู้ร่วมงานบ่อยครั้ง</p>\n<div class=\"rubric-level\">3 (ดี): นักศึกษาแต่งกายถูกระเบียบเป็นส่วนใหญ่</div>\n<p>ให้บริการตามมาตรฐานที่กำหนด ไม่มีข้อร้องเรียนจาก</p>\n<p>ลูกค้าหรือผู้ร่วมงาน</p>\n<div class=\"rubric-level\">2 (พอใช้): นักศึกษาแต่งกายไม่เรียบร้อยบ้างเป็นครั้ง</div>\n<p>คราว ให้บริการไม่สม่ าเสมอ มีข้อร้องเรียนจากลูกค้าหรือ</p>\n<p>ผู้ร่วมงานบ้าง</p>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): นักศึกษาแต่งกายไม่เหมาะสม</div>\n<p>บ่อยครั้ง ให้บริการไม่เต็มใจ หรือแสดงกิริยาไม่เหมาะสม มี</p>\n<p>ข้อร้องเรียนจากลูกค้าหรือผู้ร่วมงานบ่อยครั้ง</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO12</span> <span class=\"lo-desc\">แสดงออกถึงการมีวินัย มีภาวะผู้นำ สามารถ 5 (ยอดเยี่ยม): นักศึกษาแสดงภาวะผู้นำในการทำงาน</span></div>\n<p>เป็นได้ทั้งผู้นำ และผู้ตาม ทำงานร่วมกับผู้อื่นได้ มีจิต</p>\n<p>กลุ่ม รับฟังความคิดเห็นของผู้อื่นและประสานงานได้ดีเยี่ยม</p>\n<p>อาสา และสามารถพัฒนาตนเองในงานด้านการ</p>\n<p>มีจิตอาสาช่วยเหลืองานส่วนรวมสม่ าเสมอ</p>\n<p>ท่องเที่ยวและการโรงแรมได้อย่างต่อเนื่อง</p>\n<div class=\"rubric-level\">4 (ดีมาก): นักศึกษาสามารถเป็นได้ทั้งผู้นำและผู้ตามที่</div>\n<div class=\"rubric-level\">ดี ประสานงานกับผู้อื่นได้ดี มีจิตอาสาช่วยเหลืองาน</div>\n<p>ส่วนรวมบ่อยครั้ง</p>\n<div class=\"rubric-level\">3 (ดี): นักศึกษาทำหน้าที่ผู้นำหรือผู้ตามได้ตามที่ได้รับ</div>\n<p>มอบหมาย ทำงานร่วมกับผู้อื่นได้ดี มีจิตอาสาช่วยเหลืองาน</p>\n<p>ส่วนรวมเมื่อมีโอกาส</p>\n<div class=\"rubric-level\">2 (พอใช้): นักศึกษาไม่ค่อยแสดงบทบาทผู้นำ ทำงาน</div>\n<p>ร่วมกับผู้อื่นได้แต่มีข้อจำกัด ช่วยเหลืองานส่วนรวมเมื่อถูก</p>\n<p>ร้องขอ</p>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): นักศึกษาไม่สามารถเป็นผู้นำหรือผู้</div>\n<p>ตามที่ดีได้ มีปัญหาในการทำงานร่วมกับผู้อื่น ไม่มีจิตอาสา</p>\n<p>ช่วยเหลืองานส่วนรวม</p>"}]}, {"faculty": "สำนักวิชาบัญชี", "curricula": [{"name": "หลักสูตรเศรษฐศาสตรบัณฑิต", "file": "10.สำนักวิชาบัญชี 2 หลักสูตร\\LO สหกิจหลักสูตรเศรษฐศาสตรบัณฑิต.docx", "ext": "docx", "html": "<p>หลักสูตรเศรษฐศาสตรบัณฑิต</p>\n<p>ปรับปรุง พ.ศ. 2567</p>\n\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของหลักสูตร (Program Learning Outcomes: PLOs</h2>\n<div class=\"eval-item\">1. ด้านความรู้ (Knowledge)</div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO1</span> <span class=\"lo-desc\">ประยุกต์ใช้ความรู้ทางวิทยาศาสตร์ เทคโนโลยี และสังคมศาสตร์ในสถานการณ์ต่างๆ เพื่อการตัดสินใจและแก้ปัญหาทางเศรษฐกิจ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO2</span> <span class=\"lo-desc\">ประยุกต์ใช้องค์ความรู้ทางเศรษฐศาสตร์เพื่อวางแผนและแก้ปัญหาทางเศรษฐกิจในระดับ</span></div>\n<p>ปัจเจกและระดับองค์กรได้อย่างเหมาะสม</p>\n<div class=\"eval-item\">2. ด้านทักษะ (Skills)</div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO3</span> <span class=\"lo-desc\">มีทักษะการใช้เทคโนโลยีและวิทยาการข้อมูล (Data Science) เพื่อการวิเคราะห์และคาดการณ์ตัวแปรและปรากฎการณ์ทางเศรษฐกิจ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO4</span> <span class=\"lo-desc\">มีทักษะการใช้กระบวนการวิจัยในการวิเคราะห์ สังเคราะห์ในฐานะนักเศรษฐศาสตร์ได้อย่างเป็นเหตุเป็นผล</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO5</span> <span class=\"lo-desc\">มีทักษะการสื่อสารภาษาไทยและภาษาอังกฤษ เพื่อใช้ในชีวิตประจำวัน และในการทำงานด้านเศรษฐศาสตร์ ทั้งการฟัง พูด อ่าน เขียน และเสนอผลงานได้ตามวัตถุประสงค์ ในกรณีที่นักศึกษาเลือกภาษาจีนสามารถสื่อสารภาษาจีนในชีวิตประจำวันได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO6</span> <span class=\"lo-desc\">มีทักษะในการปรับตัวให้เข้ากับการเปลี่ยนแปลงด้านต่าง ๆ ของสังคม สุขภาพ เศรษฐกิจ วัฒนธรรมและสิ่งแวดล้อม</span></div>\n<div class=\"eval-item\">3. ด้านจริยธรรม (Ethics)</div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO7</span> <span class=\"lo-desc\">แสดงออกซึ่งความกตัญญู ความซื่อสัตย์ และปฏิบัติตามกฎระเบียบของสังคม</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO8</span> <span class=\"lo-desc\">มีความรับผิดชอบต่อตนเอง สังคมและสิ่งแวดล้อม ที่มุ่งสู่เป้าหมายการพัฒนาที่ยั่งยืน</span></div>\n<div class=\"eval-item\">4. ด้านลักษณะบุคคล (Character)</div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO9</span> <span class=\"lo-desc\">แสดงออกถึงการมีภาวะผู้นำ สามารถเป็นได้ทั้งผู้นำและผู้ตาม กล้าเสนอแนะข้อคิดเห็นอย่างตรงไปตรงมา มีวินัย มีจิตอาสา และทำงานร่วมกับผู้อื่นได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO10</span> <span class=\"lo-desc\">ใฝ่เรียน ใฝ่รู้และพัฒนาตนเองอย่างต่อเนื่อง</span></div>\n\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษา (Learning Outcome: LO)</h2>\n<div class=\"eval-item\">1. ด้านความรู้ (Knowledge)</div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">ผู้เรียนสามารถประยุกต์ใช้ความรู้ทางเศรษฐศาสตร์ในการปฏิบัติงานในองค์กรอย่างเหมาะสม โดยคำนึงถึงบริบทของสถานประกอบการและสถานการณ์จริง</span></div>\n<div class=\"eval-item\">2. ด้านทักษะ (Skills)</div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">ผู้เรียนสามารถใช้เทคโนโลยีและวิทยาการข้อมูล (Data Science) ในการวิเคราะห์ข้อมูลและสนับสนุนกระบวนการทำงานในสถานประกอบการได้อย่างมีประสิทธิภาพ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">ผู้เรียนสามารถใช้กระบวนการวิจัยเพื่อวิเคราะห์ สังเคราะห์ และนำเสนอข้อมูลในฐานะนักเศรษฐศาสตร์ได้อย่างเป็นระบบ เพื่อตอบโจทย์งานที่ได้รับมอบหมายและจัดทำรายงานสหกิจศึกษาที่สมบูรณ์</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">ผู้เรียนสามารถสื่อสารและประสานงานกับเพื่อนร่วมงานและบุคลากรในสถานประกอบการ ทั้งภาษาไทยและภาษาอังกฤษได้อย่างมีประสิทธิภาพเพื่อบรรลุเป้าหมายของงาน</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">ผู้เรียนสามารถปรับตัวและรับมือกับการเปลี่ยนแปลงในสถานประกอบการ เช่น สภาพแวดล้อมการทำงาน หรือวัฒนธรรมองค์กรได้อย่างเหมาะสม</span></div>\n<div class=\"eval-item\">3. ด้านจริยธรรม (Ethics)</div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO6</span> <span class=\"lo-desc\">ผู้เรียนสามารถปฏิบัติงานด้วยความรับผิดชอบและคำนึงถึงจริยธรรม</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO7</span> <span class=\"lo-desc\">ผู้เรียนสามารถปฏิบัติตามระเบียบและวัฒนธรรมองค์กร</span></div>\n<div class=\"eval-item\">4. ด้านลักษณะบุคคล (Character)</div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO8</span> <span class=\"lo-desc\">ผู้เรียนสามารถทำงานร่วมกับผู้อื่นได้อย่างมีประสิทธิภาพทั้งในฐานะผู้นำและผู้ตาม พร้อมแสดงออกถึงความคิดสร้างสรรค์และข้อเสนอแนะที่เป็นประโยชน์ต่อองค์กร</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO9</span> <span class=\"lo-desc\">ผู้เรียนสามารถพัฒนาตนเอง เรียนรู้อย่างต่อเนื่อง และเตรียมความพร้อมเพื่อก้าวเข้าสู่วิชาชีพในอนาคต</span></div>\n\n<h2 class=\"section-title\">แบบประเมินผลการปฏิบัติสหกิจศึกษาตามผลลัพธ์การเรียนรู้ที่คาดหวัง</h2>\n\n\n\n\n\n\n\n<h4 class=\"table-marker\">[TABLE 1]</h4>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table\">\n<tr><td>ผลการเรียนรู้ที่คาดหวัง</td><td>ผลการประเมิน</td></tr>\n</table></div>\n<h3 class=\"domain-title\">(1) ด้านความรู้ (Knowledge) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">ผู้เรียนสามารถประยุกต์ใช้ความรู้ทางเศรษฐศาสตร์ในการปฏิบัติงานในองค์กรอย่างเหมาะสม โดยคำนึงถึงบริบทของสถานประกอบการและสถานการณ์จริง | 5 (ยอดเยี่ยม): ประยุกต์ใช้ความรู้ทางเศรษฐศาสตร์ได้อย่างถูกต้อง สอดคล้องกับสถานการณ์จริง และมีการเสนอแนะแนวทางแก้ปัญหาที่สร้างสรรค์</span></div>\n<div class=\"rubric-level\">4 (ดีมาก): ประยุกต์ใช้ความรู้ทางเศรษฐศาสตร์ได้อย่างถูกต้องและเหมาะสมในสถานการณ์ส่วนใหญ่ พร้อมมีข้อเสนอที่ดี</div>\n<div class=\"rubric-level\">3 (ดี): ประยุกต์ใช้ความรู้ทางเศรษฐศาสตร์ในงานที่ได้รับมอบหมายได้ดีในระดับพื้นฐาน</div>\n<div class=\"rubric-level\">2 (พอใช้): ประยุกต์ใช้ความรู้ได้บางส่วน แต่ขาดความสมบูรณ์หรือความเหมาะสมในบางกรณี</div>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): ไม่สามารถประยุกต์ใช้ความรู้ทางเศรษฐศาสตร์ในงานได้อย่างเหมาะสม</div>\n<h3 class=\"domain-title\">(2) ด้านทักษะ (Skills) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">ผู้เรียนสามารถใช้เทคโนโลยีและวิทยาการข้อมูล (Data Science) ในการวิเคราะห์ข้อมูลและสนับสนุนกระบวนการทำงานในสถานประกอบการได้อย่างมีประสิทธิภาพ | 5 (ยอดเยี่ยม): ใช้เทคโนโลยีและเครื่องมือ Data Science ในการวิเคราะห์ข้อมูลได้อย่างแม่นยำ ครบถ้วน และมีประสิทธิภาพ</span></div>\n<div class=\"rubric-level\">4 (ดีมาก): ใช้เทคโนโลยีและเครื่องมือได้อย่างถูกต้องและมีประสิทธิภาพในส่วนใหญ่</div>\n<div class=\"rubric-level\">3 (ดี): ใช้เทคโนโลยีและเครื่องมือได้ในระดับพื้นฐาน แต่ยังมีข้อผิดพลาดเล็กน้อย</div>\n<div class=\"rubric-level\">2 (พอใช้): ใช้เทคโนโลยีได้ในบางกรณี แต่ยังมีข้อผิดพลาดชัดเจน</div>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): ไม่สามารถใช้เทคโนโลยีหรือเครื่องมือได้อย่างถูกต้อง</div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">ผู้เรียนสามารถใช้กระบวนการวิจัยเพื่อวิเคราะห์ สังเคราะห์ และนำเสนอข้อมูลในฐานะนักเศรษฐศาสตร์ได้อย่างเป็นระบบ เพื่อตอบโจทย์งานที่ได้รับมอบหมายและจัดทำรายงานสหกิจศึกษาที่สมบูรณ์ | 5 (ยอดเยี่ยม): ใช้กระบวนการวิจัยได้ครบถ้วน สอดคล้องกับเป้าหมาย และจัดทำรายงานที่มีคุณภาพสูง</span></div>\n<div class=\"rubric-level\">4 (ดีมาก): ใช้กระบวนการวิจัยได้ดีในส่วนใหญ่ และจัดทำรายงานที่ชัดเจน</div>\n<div class=\"rubric-level\">3 (ดี): ใช้กระบวนการวิจัยในระดับพื้นฐานและจัดทำรายงานที่เข้าใจได้</div>\n<div class=\"rubric-level\">2 (พอใช้): ใช้กระบวนการวิจัยได้เพียงบางส่วน และรายงานขาดความสมบูรณ์</div>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): ไม่สามารถใช้กระบวนการวิจัยหรือจัดทำรายงานได้อย่างเหมาะสม</div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">ผู้เรียนสามารถสื่อสารและประสานงานกับเพื่อนร่วมงานและบุคลากรในสถานประกอบการ ทั้งภาษาไทยและภาษาอังกฤษได้อย่างมีประสิทธิภาพเพื่อบรรลุเป้าหมายของงาน | 5 (ยอดเยี่ยม): สื่อสารภาษาไทยและภาษาอังกฤษได้อย่างมืออาชีพ ชัดเจน และเหมาะสมกับบริบท</span></div>\n<div class=\"rubric-level\">4 (ดีมาก): สื่อสารภาษาไทยและภาษาอังกฤษได้ดีในสถานการณ์ส่วนใหญ่</div>\n<div class=\"rubric-level\">3 (ดี): สื่อสารได้ในระดับพื้นฐาน แต่ยังมีจุดที่ต้องปรับปรุง</div>\n<div class=\"rubric-level\">2 (พอใช้): สื่อสารได้บ้าง แต่มีข้อผิดพลาดที่ทำให้เกิดความไม่ชัดเจน</div>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): ไม่สามารถสื่อสารได้อย่างเหมาะสม</div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">ผู้เรียนสามารถปรับตัวและรับมือกับการเปลี่ยนแปลงในสถานประกอบการ เช่น สภาพแวดล้อมการทำงาน หรือวัฒนธรรมองค์กรได้อย่างเหมาะสม | 5 (ยอดเยี่ยม): ปรับตัวและรับมือกับการเปลี่ยนแปลงในสถานประกอบการได้อย่างมีประสิทธิภาพ พร้อมเสนอแนวทางแก้ไขที่เหมาะสม</span></div>\n<div class=\"rubric-level\">4 (ดีมาก): ปรับตัวได้ดีในสถานการณ์ส่วนใหญ่</div>\n<div class=\"rubric-level\">3 (ดี): ปรับตัวได้ในระดับพื้นฐาน แต่ยังต้องปรับปรุงในบางกรณี</div>\n<div class=\"rubric-level\">2 (พอใช้): ปรับตัวได้บางส่วน แต่ยังขาดความยืดหยุ่นหรือการตอบสนองที่เหมาะสม</div>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): ไม่สามารถปรับตัวได้เมื่อเกิดการเปลี่ยนแปลง</div>\n<h3 class=\"domain-title\">(3) ด้านจริยธรรม (Ethics) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO6</span> <span class=\"lo-desc\">ผู้เรียนสามารถปฏิบัติงานด้วยความรับผิดชอบและคำนึงถึงจริยธรรม | 5 (ยอดเยี่ยม): แสดงออกถึงความรับผิดชอบและจริยธรรมในวิชาชีพได้อย่างชัดเจนในทุกสถานการณ์</span></div>\n<div class=\"rubric-level\">4 (ดีมาก): แสดงความรับผิดชอบและจริยธรรมในสถานการณ์ส่วนใหญ่</div>\n<div class=\"rubric-level\">3 (ดี): ปฏิบัติงานด้วยจริยธรรมในระดับพื้นฐาน</div>\n<div class=\"rubric-level\">2 (พอใช้): แสดงความรับผิดชอบได้บางส่วน แต่ยังมีข้อบกพร่อง</div>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): ขาดความรับผิดชอบหรือไม่คำนึงถึงจริยธรรม</div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO7</span> <span class=\"lo-desc\">ผู้เรียนสามารถปฏิบัติตามระเบียบและวัฒนธรรมองค์กร | 5 (ยอดเยี่ยม): ปฏิบัติตามระเบียบและวัฒนธรรมองค์กรได้อย่างเคร่งครัดและเป็นแบบอย่างที่ดี</span></div>\n<div class=\"rubric-level\">4 (ดีมาก): ปฏิบัติตามระเบียบได้ในสถานการณ์ส่วนใหญ่</div>\n<div class=\"rubric-level\">3 (ดี): ปฏิบัติตามระเบียบในระดับพื้นฐาน แต่ยังมีข้อผิดพลาดเล็กน้อย</div>\n<div class=\"rubric-level\">2 (พอใช้): ปฏิบัติตามได้บางส่วน แต่ยังไม่ครบถ้วน</div>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): ไม่ปฏิบัติตามระเบียบหรือขาดความเข้าใจในวัฒนธรรมองค์กร</div>\n<h3 class=\"domain-title\">(4) ด้านลักษณะบุคคล (Character) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO8</span> <span class=\"lo-desc\">ผู้เรียนสามารถทำงานร่วมกับผู้อื่นได้อย่างมีประสิทธิภาพทั้งในฐานะผู้นำและผู้ตาม พร้อมแสดงออกถึงความคิดสร้างสรรค์และข้อเสนอแนะที่เป็นประโยชน์ต่อองค์กร | 5 (ยอดเยี่ยม): ทำงานร่วมกับผู้อื่นได้อย่างมีประสิทธิภาพทั้งในฐานะผู้นำและผู้ตาม พร้อมเสนอแนะที่เป็นประโยชน์</span></div>\n<div class=\"rubric-level\">4 (ดีมาก): ทำงานร่วมกับผู้อื่นได้ดีในสถานการณ์ส่วนใหญ่</div>\n<div class=\"rubric-level\">3 (ดี): ทำงานร่วมกับผู้อื่นในระดับพื้นฐาน แต่ยังต้องปรับปรุงในบางจุด</div>\n<div class=\"rubric-level\">2 (พอใช้): ทำงานร่วมกับผู้อื่นได้บางส่วน แต่มีความขัดแย้งหรือการสื่อสารที่ไม่ชัดเจน</div>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): ไม่สามารถทำงานร่วมกับผู้อื่นได้อย่างเหมาะสม</div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO9</span> <span class=\"lo-desc\">ผู้เรียนสามารถพัฒนาตนเอง เรียนรู้อย่างต่อเนื่อง และเตรียมความพร้อมเพื่อก้าวเข้าสู่วิชาชีพในอนาคต | 5 (ยอดเยี่ยม): แสดงความกระตือรือร้นในการพัฒนาตนเองและเรียนรู้อย่างต่อเนื่อง พร้อมนำความรู้ใหม่ไปประยุกต์ใช้</span></div>\n<div class=\"rubric-level\">4 (ดีมาก): แสดงความตั้งใจในการเรียนรู้และพัฒนาตนเองในสถานการณ์ส่วนใหญ่</div>\n<div class=\"rubric-level\">3 (ดี): มีการพัฒนาตนเองในระดับพื้นฐาน แต่ยังขาดความสม่ำเสมอ</div>\n<div class=\"rubric-level\">2 (พอใช้): มีความพยายามพัฒนาตนเองเพียงบางส่วน</div>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): ขาดความกระตือรือร้นในการเรียนรู้หรือพัฒนาตนเอง</div>"}, {"name": "หลักสูตรบัญชีบัณฑิต (ปรับปรุง พ.ศ. 2567)", "file": "10.สำนักวิชาบัญชี 2 หลักสูตร\\ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษา(หลักสูตรบัญชีบัณฑิต-ปรับปรุง-2567).docx", "ext": "docx", "html": "<p>หลักสูตรบัญชีบัณฑิต (ปรับปรุง พ.ศ. 2567)</p>\n\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของหลักสูตร (Program Learning Outcomes: PLOs)</h2>\n<h3 class=\"domain-title\">ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO1</span> <span class=\"lo-desc\">อธิบายหลักการบัญชี มาตรฐานการรายงานทางการเงิน เพื่อจัดทำสารสนเทศที่สนับสนุนการตัดสินใจและเป็นประโยชน์ต่อผู้ใช้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO2</span> <span class=\"lo-desc\">อธิบายความรู้ด้านสังคมศาสตร์ทั่วไป มนุษย์ศาสตร์ เทคโนโลยีสารสนเทศ องค์กรและธุรกิจ ประกอบด้วย หลักการจัดการ เศรษฐศาสตร์ กฎหมาย ข้อบังคับที่เกี่ยวข้องกับวิชาชีพบัญชี</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO3</span> <span class=\"lo-desc\">ประยุกต์ใช้ความรู้หลักการบัญชี มาตรฐานการรายงานทางการเงิน ด้านองค์กรและธุรกิจ เพื่อจัดทำรายงานทางการเงินตามมาตรฐานวิชาชีพ และวิเคราะห์รายงานทางการเงินได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO4</span> <span class=\"lo-desc\">ประยุกต์ใช้ความรู้ด้านการสอบบัญชี เพื่อปฏิบัติงานสอบบัญชีและแสดงความเห็นต่องบการเงินในสถานการณ์ต่าง ๆ ได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO5</span> <span class=\"lo-desc\">ในกรณีที่นักศึกษาเลือกกลุ่มวิชาชีพการบัญชีเพื่อองค์กรธุรกิจ สามารถออกแบบระบบบัญชี ประยุกต์ใช้เทคโนโลยีสารสนเทศในการจัดทำ และนำเสนอรายงานทางการเงินที่เหมาะสมตามลักษณะเฉพาะของกิจการได้ และในกรณีที่นักศึกษาเลือกกลุ่มวิชาชีพการสอบบัญชี สามารถประยุกต์ใช้เทคโนโลยีสารสนเทศ เพื่อปฏิบัติงานสอบบัญชีและแสดงความเห็น ต่องบการเงินในกิจการที่มีลักษณะเฉพาะได้</span></div>\n<h3 class=\"domain-title\">ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO6</span> <span class=\"lo-desc\">มีทักษะการสื่อสารโดยใช้เทคโนโลยีสารสนเทศ ร่วมกับทักษะในการใช้ภาษาไทยและภาษาอังกฤษ เพื่อใช้ในชีวิตประจำวันและในการทำงานด้านวิชาชีพบัญชี ทั้งการฟัง พูด อ่าน เขียน และเสนอผลงาน ในกรณีที่นักศึกษาเลือกภาษาจีน สามารถสื่อสารภาษาจีนในชีวิตประจำวันได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO7</span> <span class=\"lo-desc\">มีทักษะการแก้ปัญหา โดยใช้กระบวนการวิจัย การวิเคราะห์ข้อมูลทางด้านบัญชีเชิงปริมาณและเชิงคุณภาพ นำไปสู่การใช้ข้อมูลทางบัญชีในการแก้ปัญหาในการดำเนินงานขององค์กรได้</span></div>\n<h3 class=\"domain-title\">ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO8</span> <span class=\"lo-desc\">ปฏิบัติตามมาตรฐานและจรรยาบรรณทางวิชาการและวิชาชีพบัญชี</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO9</span> <span class=\"lo-desc\">แสดงออกถึงความกตัญญู ความรับผิดชอบต่อตนเอง ผู้อื่น สังคม และปฏิบัติตามกฎหมายและกฎระเบียบของสังคม</span></div>\n<h3 class=\"domain-title\">ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO10</span> <span class=\"lo-desc\">ปฏิบัติตนในฐานะผู้นำและผู้ตาม ยอมรับในความหลากหลาย มีวินัย มีจิตอาสา มีสุขภาวะที่ดี และสามารถทำงานร่วมกับผู้อื่นได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO11</span> <span class=\"lo-desc\">แสดงออกถึงการปรับตัวตามสถานการณ์ที่เปลี่ยนแปลงในศาสตร์ทางการบัญชี รู้เท่าทันการเปลี่ยนแปลงของสังคมและของโลก เพื่อพัฒนาตนเองได้อย่างต่อเนื่อง</span></div>\n\n<p>แบบประเมินผลการปฏิบัติสหกิจศึกษาตามผลลัพธ์การเรียนรู้ที่คาดหวัง หลักสูตรบัญชี (ปรับปรุง พ.ศ. 2567)</p>\n\n<h4 class=\"table-marker\">[TABLE 1]</h4>\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษา (Learning Outcome: LO) หลักสูตรบัญชี (ปรับปรุง พ.ศ. 2567)</h2>\n<h3 class=\"domain-title\">ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">ผู้เรียนสามารถประยุกต์ใช้หลักการบัญชี มาตรฐานการรายงานทางการเงิน และศาสตร์ที่เกี่ยวข้องกับวิชาชีพบัญชี ในการปฏิบัติงานสถานประกอบการได้อย่างเหมาะสม</span></div>\n\n<h3 class=\"domain-title\">ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">ผู้เรียนสามารถวิเคราะห์และแปลผลข้อมูลทางบัญชี เพื่อสนับสนุนการตัดสินใจในสถานประกอบการได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">ผู้เรียนสามารถสื่อสารด้วยภาษาไทยและภาษาอังกฤษในการปฏิบัติงานบัญชีได้อย่างมีประสิทธิภาพ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">ผู้เรียนสามารถเรียนรู้และพัฒนาทักษะใหม่ที่เกี่ยวข้องกับงานบัญชีด้วยตนเองได้</span></div>\n\n<h3 class=\"domain-title\">ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">ผู้เรียนสามารถปฏิบัติงานด้วยความรับผิดชอบ และคำนึงถึงจรรยาบรรณวิชาชีพบัญชี</span></div>\n\n<h3 class=\"domain-title\">ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO6</span> <span class=\"lo-desc\">ผู้เรียนสามารถทำงานร่วมกับทีมได้อย่างมีประสิทธิภาพ และแสดงความเป็นผู้นำ</span></div>\n\n<h4 class=\"table-marker\">[TABLE 2]</h4>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table\">\n<tr><td>ผลการเรียนรู้ที่คาดหวัง</td><td>ผลการประเมิน</td></tr>\n</table></div>\n<h3 class=\"domain-title\">(1) ด้านความรู้ (Knowledge) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">ผู้เรียนสามารถประยุกต์ใช้หลักการบัญชี มาตรฐานการรายงานทางการเงิน และศาสตร์ที่เกี่ยวข้องกับวิชาชีพบัญชี ในการปฏิบัติงานสถานประกอบการได้อย่างเหมาะสม | 5 (ยอดเยี่ยม): ประยุกต์ใช้หลักการบัญชีได้อย่างคล่องแคล่ว ถูกต้อง และสร้างสรรค์</span></div>\n<div class=\"rubric-level\">4 (ดีมาก): ประยุกต์ใช้หลักการบัญชีได้ดี มีข้อผิดพลาดเล็กน้อยที่ไม่กระทบต่อผลลัพธ์</div>\n<div class=\"rubric-level\">3 (ดี): ประยุกต์ใช้หลักการบัญชีในระดับพื้นฐาน แต่ขาดความสามารถในการประยุกต์ใช้แบบเจาะจงหรือลึกซึ้ง</div>\n<div class=\"rubric-level\">2 (พอใช้): ประยุกต์ใช้หลักการบัญชีได้บางส่วน ต้องการคำแนะนำ และยังขาดความแม่นยำในการปฏิบัติงาน</div>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): ไม่สามารถประยุกต์ใช้หลักการบัญชีได้ ยังขาดความรู้พื้นฐานและต้องการเสริมทักษะอย่างมาก</div>\n<h3 class=\"domain-title\">(2) ด้านทักษะ (Skills) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">ผู้เรียนสามารถวิเคราะห์และแปลผลข้อมูลทางบัญชี เพื่อสนับสนุนการตัดสินใจในสถานประกอบการได้ | 5 (ยอดเยี่ยม): วิเคราะห์ข้อมูลเชิงลึก สรุปผลชัดเจน และนำเสนออย่างเป็นระบบ</span></div>\n<div class=\"rubric-level\">4 (ดีมาก): วิเคราะห์ข้อมูลได้ดี มีข้อสรุปที่เป็นประโยชน์</div>\n<div class=\"rubric-level\">3 (ดี): วิเคราะห์ข้อมูลในระดับพื้นฐานและมีข้อสรุปที่ใช้งานได้</div>\n<div class=\"rubric-level\">2 (พอใช้): วิเคราะห์ข้อมูลได้บางส่วนหรือไม่ครอบคลุม</div>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): ไม่สามารถวิเคราะห์ข้อมูลได้อย่างถูกต้อง ขาดทักษะการสรุปผลและนำเสนออย่างมีประสิทธิภาพ</div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">ผู้เรียนสามารถสื่อสารด้วยภาษาไทยและภาษาอังกฤษในการปฏิบัติงานบัญชีได้อย่างมีประสิทธิภาพ | 5 (ยอดเยี่ยม): สื่อสารได้อย่างคล่องแคล่ว ชัดเจน และเหมาะสมกับสถานการณ์</span></div>\n<div class=\"rubric-level\">4 (ดีมาก): สื่อสารได้ดี มีข้อผิดพลาดเล็กน้อยไม่กระทบต่อความเข้าใจ</div>\n<div class=\"rubric-level\">3 (ดี): สื่อสารในระดับพื้นฐานที่สามารถเข้าใจได้ แต่ยังขาดความเข้าใจในบางจุด</div>\n<div class=\"rubric-level\">2 (พอใช้): สื่อสารได้บางส่วน มีข้อจำกัดด้านความชัดเจนหรือการใช้ภาษา</div>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): ไม่สามารถสื่อสารได้อย่างเหมาะสมในสถานการณ์การทำงาน / ฝึกงาน</div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">ผู้เรียนสามารถเรียนรู้และพัฒนาทักษะใหม่ที่เกี่ยวข้องกับงานบัญชีด้วยตนเองได้ | 5 (ยอดเยี่ยม): เรียนรู้และพัฒนาทักษะใหม่ได้อย่างรวดเร็ว และประยุกต์ใช้อย่างมีประสิทธิภาพ</span></div>\n<div class=\"rubric-level\">4 (ดีมาก): เรียนรู้และพัฒนาทักษะใหม่ได้ดี มีความเข้าใจเนื้อหา และการใช้งาน</div>\n<div class=\"rubric-level\">3 (ดี): เรียนรู้และพัฒนาทักษะในระดับพื้นฐาน แต่ยังขาดการประยุกต์ใช้อย่างมีประสิทธิภาพ</div>\n<div class=\"rubric-level\">2 (พอใช้): เรียนรู้และพัฒนาทักษะได้บางส่วน และต้องการคำแนะนำเพิ่มเติม</div>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): ไม่สามารถเรียนรู้และพัฒนาทักษะได้ด้วยตนเอง</div>\n<h3 class=\"domain-title\">(3) ด้านจริยธรรม (Ethics) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">ผู้เรียนสามารถปฏิบัติงานด้วยความรับผิดชอบ และคำนึงถึงจรรยาบรรณวิชาชีพบัญชี | 5 (ยอดเยี่ยม): ปฏิบัติตามจรรยาบรรณอย่างเคร่งครัด เป็นแบบอย่างที่ดี และแสดงความรับผิดชอบสูงสุด</span></div>\n<div class=\"rubric-level\">4 (ดีมาก): ปฏิบัติตามจรรยาบรรณได้ดี มีความรับผิดชอบต่อหน้าที่</div>\n<div class=\"rubric-level\">3 (ดี): ปฏิบัติตามจรรยาบรรณในระดับพื้นฐาน แต่ยังขาดความรอบคอบในบางจุด</div>\n<div class=\"rubric-level\">2 (พอใช้): ปฏิบัติตามจรรยาบรรณได้บางส่วน และต้องการคำแนะนำเพิ่มเติม</div>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): ไม่ปฏิบัติตามจรรยาบรรณ หรือขาดความรับผิดชอบในงาน</div>\n<h3 class=\"domain-title\">(4) ด้านลักษณะบุคคล (Character) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO6</span> <span class=\"lo-desc\">ผู้เรียนสามารถทำงานร่วมกับทีมได้อย่างมีประสิทธิภาพ และแสดงความเป็นผู้นำ | 5 (ยอดเยี่ยม): เป็นผู้นำที่ดี ทำงานเป็นทีมอย่างมีประสิทธิภาพสูง และสามารถแก้ปัญหาที่ซับซ้อนได้อย่างเป็นระบบ</span></div>\n<div class=\"rubric-level\">4 (ดีมาก): ทำงานเป็นทีมได้ดี มีความรับผิดชอบ แสดงบทบาทผู้นำได้ดีในสถานการณ์ทั่วไป</div>\n<div class=\"rubric-level\">3 (ดี): ทำงานเป็นทีมในระดับพื้นฐาน แต่ยังขาดความเป็นผู้นำที่ชัดเจน และยังต้องการพัฒนาทักษะในด้านการประสานงาน</div>\n<div class=\"rubric-level\">2 (พอใช้): ทำงานเป็นทีมได้บางส่วน ยังต้องการคำแนะนำในการปรับปรุงตนเองและการสร้างความสัมพันธ์ในทีม</div>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): ไม่สามารถทำงานเป็นทีมได้ หรือหลีกเลี่ยงความรับผิดชอบ</div>"}]}, {"faculty": "สำนักวิชาสถาปัตยกรรมศาสตร์", "curricula": [{"name": "หลักสูตรออกแบบภายใน", "file": "11.สำนักวิชาสถาปัตยกรรมศาสตร์ฯ 1 หลักสูตร\\ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษา-ออกแบบภายใน.xlsx", "ext": "xlsx", "html": "<h3 class=\"domain-title\">INT_PLOs</h3>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table xlsx-table\">\n<tr><td>รายวิชา</td><td>หน่วยกิต</td><td>ชั้นปีที่</td><td>ผลลัพธ์การเรียนรู้ระดับหลักสูตร (PLOs) 4 ด้าน</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td>|</td></tr>\n<tr><td>|</td><td></td><td>ความรู้</td><td></td><td></td><td></td><t
