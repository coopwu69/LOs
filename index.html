ความรับผิดชอบต่อสังคมและสิ่งแวดล้อม</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td>|</td></tr>\n<tr><td>PLO11 แสดงออกถึงการมีจรรยาบรรณและคำนึงถึงข้อกำหนด ระเบียบกฎเกณฑ์ และกฎหมายที่เกี่ยวข้องกับวิชาชีพการออกแบบภายใน</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td>|</td></tr>\n<tr><td>4) ด้านลักษณะบุคคล (Character)</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td>|</td></tr>\n<tr><td>PLO12 แสดงออกถึงบุคลิกภาพเชิงสร้างสรรค์ ในด้านศิลปะ วัฒนธรรม และทันต่อเทคโนโลยีในการปฏิบัติชาชีพ</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td>|</td></tr>\n<tr><td>PLO13 แสดงออกถึงการมีวินัย มีจิตอาสา มีภาวะผู้นำ สามารถเป็นได้ทั้งผู้นำและผู้ตาม ทำงานร่วมกับผู้อื่นได้</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td>|</td></tr>\n</table></div>\n<h3 class=\"domain-title\">แบบประเมิน LOs</h3>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table xlsx-table\">\n<tr><td>| แบบประเมินสหกิจศึกษาตามผลลัพธ์การเรียนรู้ระดับหลักสูตร Learning Outcomes (LOs)</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td>|</td></tr>\n<tr><td>| หลักสูตรการออกแบบภายใน สำนักวิชาสถาปัตยกรรมศาสตร์และการออกแบบ มหาวิทยาลัยวลัยลักษณ์</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td>|</td></tr>\n<tr><td>Learning Outcomes (LOs)</td><td>ผลลัพธ์การเรียนรู้ระดับหลักสูตร (PLOs)</td><td></td><td>ผลลัพธ์การเรียนรู้ระดับรายวิชาสหกิจศึกษา (CLOs)</td><td></td><td>ระดับการประเมิน</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td>|</td></tr>\n</table></div>\n<p>1. ด้านความรู้</p>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table xlsx-table\">\n<tr><td>(Knowledge)</td><td>PLO4</td><td>ประยุกต์ใช้ความรู้ด้านการออกแบบ สุนทรียภาพ และการก่อสร้าง เพื่อการปฏิบัติงานออกแบบภายในที่สอดคล้องกับมาตรฐานวิชาชีพ</td><td>CLO1</td><td>นักศึกษาสามารถเรียนรู้หลักการหรือองค์ความรู้ด้านออกแบบภายใน การเขียนแบบตามมาตรฐานงานก่อสร้าง การประมาณราคา และสามารถประยุกต์ใช้ทำงานภายในสถานประกอบการได้</td><td>[5] ยอดเยี่ยม นักศึกษาสามารถเรียนรู้หลักการหรือองค์ความรู้ และสามารถประยุกต์ใช้กับการทำงานได้อย่างยอดเยี่ยม และมีการพัฒนาต่อยอดอย่างมีประสิทธิภาพ</td></tr>\n</table></div>\n<p>[4] ดีมาก นักศึกษาสามารถเรียนรู้หลักการหรือองค์ความรู้ และสามารถประยุกต์ใช้กับการทำงานได้อย่างดี และมีการพัฒนาต่อยอด</p>\n<p>[3] ดี นักศึกษาสามารถเรียนรู้หลักการหรือองค์ความรู้ และสามารถประยุกต์ใช้กับการทำงานได้อย่างดี</p>\n<p>[2] พอใช้ นักศึกษาสามารถเรียนรู้หลักการหรือองค์ความรู้ และสามารถประยุกต์ใช้กับการทำงานได้ตามมาตรฐาน</p>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table xlsx-table\">\n<tr><td>[1] ควรปรับปรุง นักศึกษาไม่สามารถเรียนรู้หลักการหรือองค์ความรู้ และไม่สามารถประยุกต์ใช้กับการทำงานได้</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td>|</td></tr>\n</table></div>\n<p>2. ด้านทักษะ</p>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table xlsx-table\">\n<tr><td>(Skills)</td><td>PLO6</td><td>มีทักษะในการดำเนินงานด้านการออกแบบภายในที่สามารถตอบวัตถุประสงค์ของโครงการ ด้วยกระบวนการออกแบบที่เหมาะสมและสอดคล้องกับมาตรฐานการปฏิบัติวิชาชีพ</td><td>CLO2</td><td>นักศึกษาสามารถทำความเข้าใจการดำเนินงาน หรือกระบวนการการออกแบบภายใน ที่สามารถตอบวัตถุประสงค์ของโครงการ และสามารถปฏิบัติตามได้อย่างถูกต้อง</td><td>[5] ยอดเยี่ยม นักศึกษาสามารถทำความเข้าใจการดำเนินงาน หรือกระบวนการการออกแบบภายในและสามารถปฏิบัติตามได้อย่างยอดเยี่ยม และมีการพัฒนาต่อเนื่อง</td></tr>\n</table></div>\n<p>[4] ดีมาก นักศึกษาสามารถทำความเข้าใจการดำเนินงาน หรือกระบวนการการออกแบบภายในและสามารถปฏิบัติตามได้อย่างดี และมีการพัฒนาต่อเนื่อง</p>\n<p>[3] ดี นักศึกษาสามารถทำความเข้าใจการดำเนินงาน หรือกระบวนการการออกแบบภายในและสามารถปฏิบัติตามได้อย่างดี</p>\n<p>[2] พอใช้ นักศึกษาสามารถทำความเข้าใจการดำเนินงาน หรือกระบวนการการออกแบบภายในและสามารถปฏิบัติตามได้ตามมาตรฐาน</p>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table xlsx-table\">\n<tr><td>[1] ควรปรับปรุง นักศึกษาไม่สามารถทำความเข้าใจการดำเนินงาน หรือกระบวนการการออกแบบภายในและไม่สามารถปฏิบัติตามได้ตามมาตรฐาน</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td>|</td></tr>\n<tr><td>| PLO7</td><td>มีทักษะด้านการเขียนแบบและการใช้เทคโนโลยีเพื่อการออกแบบ เขียนแบบ และการนำเสนอแบบด้านงานออกแบบภายในได้ ตามเกณฑ์มาตรฐานวิชาชีพ</td><td>CLO3</td><td>นักศึกษามีทักษะการเขียนแบบ การสร้างงานสามมิติ, ทัศนียภาพ การสร้างแบบจำลอง หรือการจัดทำงานเพื่อนำเสนอเกี่ยวกับโครงการออกแบบภายใน และสามารถใช้งานเครื่องมือ, เทคโนโลยีที่เกี่ยวข้องกับการทำงานออกแบบภายในได้</td><td>[5] ยอดเยี่ยม นักศึกษามีทักษะการทำงานที่ครบตามผลลัพท์การเรียนรู้รายวิชา และสามารถใช้เครื่องมือ, เทคโนโลยีได้อย่างยอดเยี่ยม และมีการพัฒนามากขึ้นอย่างต่อเนื่อง</td></tr>\n</table></div>\n<p>[4] ดีมาก  นักศึกษามีทักษะการทำงานที่ครบตามผลลัพท์การเรียนรู้รายวิชา และสามารถใช้เครื่องมือ, เทคโนโลยีได้อย่างดี และมีการพัฒนามากขึ้น</p>\n<p>[3] ดี นักศึกษามีทักษะการทำงานที่ครบตามผลลัพท์การเรียนรู้รายวิชา และสามารถใช้เครื่องมือ, เทคโนโลยีได้อย่างดี</p>\n<p>[2] พอใช้ นักศึกษามีทักษะการทำงานตามผลลัพท์การเรียนรู้รายวิชาบางส่วน และสามารถใช้เครื่องมือ, เทคโนโลยีได้ตามมาตรฐาน</p>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table xlsx-table\">\n<tr><td>[1] ควรปรับปรุง นักศึกษาไม่มีทักษะการทำงานตามผลลัพท์การเรียนรู้รายวิชา และไม่สามารถใช้เครื่องมือ, เทคโนโลยีได้</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td>|</td></tr>\n<tr><td>| PLO8</td><td>มีทักษะการสื่อสารภาษาไทยและภาษาอังกฤษ เพื่อใช้ในชีวิตประจำวัน และในการทำงานด้านการออกแบบภายใน ทั้งการฟัง พูด อ่าน เขียน และเสนอผลงานได้ตามวัตถุประสงค์ ในกรณีที่นักศึกษาเลือกภาษาจีนจะต้องมีทักษะการสื่อสารภาษาจีนได้</td><td>CLO4</td><td>นักศึกษามีทักษะในการสื่อสารด้วยการฟัง พูด อ่าน เขียน เพื่อการนำเสนอผลงานตามวัตถุประสงค์ และติดต่อประสานงานทั้งภายในและภายนอกองค์กรได้</td><td>[5] ยอดเยี่ยม นักศึกษามีทักษะในการสื่อสารด้วยการฟัง พูด อ่าน เขียน และสามารถนำเสนอผลงานได้อย่างยอดเยี่ยม สามารถติดต่อประสานงานได้อย่างมีประสิทธิภาพ</td></tr>\n</table></div>\n<p>[4] ดีมาก นักศึกษามีทักษะในการสื่อสารด้วยการฟัง พูด อ่าน เขียน และสามารถนำเสนอผลงานได้อย่างดี สามารถติดต่อประสานงานได้อย่างมีประสิทธิภาพ</p>\n<p>[3] ดี นักศึกษามีทักษะในการสื่อสารด้วยการฟัง พูด อ่าน เขียน และสามารถนำเสนอผลงานได้อย่างดี สามารถติดต่อประสานงานได้</p>\n<p>[2] พอใช้ นักศึกษามีทักษะในการสื่อสารด้วยการฟัง พูด อ่าน เขียน และสามารถนำเสนอผลงานได้ สามารถติดต่อประสานงานได้</p>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table xlsx-table\">\n<tr><td>[1] ควรปรับปรุง นักศึกษาไม่มีทักษะในการสื่อสารด้วยการฟัง พูด อ่าน เขียน และไม่สามารถนำเสนอผลงาน ไม่สามารถติดต่อประสานงานได้</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td>|</td></tr>\n</table></div>\n<p>3. ด้านจริยธรรม</p>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table xlsx-table\">\n<tr><td>(Ethics)</td><td>PLO10</td><td>แสดงออกถึงความรับผิดชอบต่อตนเอง ซื่อสัตย์ มีความกตัญญู ปฏิบัติตามกฎระเบียบและมีความเป็นนักออกแบบที่มีความรับผิดชอบต่อสังคมและสิ่งแวดล้อม</td><td>CLO5</td><td>นักศึกษามีความซื่อสัตย์สุจริต มีความรับผิดชอบและกระทำตามกฏระเบียบ, นโยบายปฏิบัติ หรือ ข้อกำหนดขององค์กรได้</td><td>[5] ยอดเยี่ยม นักศึกษามีความซื่อสัตย์สุจริต มีความรับผิดชอบสูง และกระทำตามกฏระเบียบ, นโยบายปฏิบัติ หรือ ข้อกำหนดขององค์กรได้อย่างยอดเยี่ยม</td></tr>\n</table></div>\n<p>[4] ดีมาก นักศึกษามีความซื่อสัตย์สุจริต มีความรับผิดชอบสูง และกระทำตามกฏระเบียบ, นโยบายปฏิบัติ หรือ ข้อกำหนดขององค์กรได้อย่างดีมาก</p>\n<p>[3] ดี นักศึกษามีความซื่อสัตย์สุจริต มีความรับผิดชอบ และกระทำตามกฏระเบียบ, นโยบายปฏิบัติ หรือ ข้อกำหนดขององค์กรได้อย่างดี</p>\n<p>[2] พอใช้ นักศึกษามีความซื่อสัตย์สุจริต มีความรับผิดชอบ และกระทำตามกฏระเบียบ, นโยบายปฏิบัติ หรือ ข้อกำหนดขององค์กรได้</p>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table xlsx-table\">\n<tr><td>[1] ควรปรับปรุง นักศึกษามีความซื่อสัตย์สุจริต มีความรับผิดชอบที่ต่ำ หรือไม่มี และไม่กระทำตามกฏระเบียบ, นโยบายปฏิบัติ หรือ ข้อกำหนดขององค์กร</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td>|</td></tr>\n<tr><td>| PLO11</td><td>แสดงออกถึงการมีจรรยาบรรณและคำนึงถึงข้อกำหนด ระเบียบกฎเกณฑ์ และกฎหมายที่เกี่ยวข้องกับวิชาชีพการออกแบบภายใน</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td>|</td></tr>\n</table></div>\n<p>4. ด้านลักษณะบุคคล</p>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table xlsx-table\">\n<tr><td>(Character)</td><td>PLO12</td><td>แสดงออกถึงบุคลิกภาพเชิงสร้างสรรค์ ในด้านศิลปะ วัฒนธรรม และทันต่อเทคโนโลยีในการปฏิบัติชาชีพ</td><td>CLO6</td><td>นักศึกษาแสดงออกถึงบุคลิกภาพที่ดี มีความคิดเชิงสร้างสรรค์และมีวินัย มีจิตอาสา มีภาวะผู้นำและผู้ตามที่ดี สามารถทำงานร่วมกับผู้อื่นได้</td><td>[5] ยอดเยี่ยม นักศึกษาสามารถแสดงออกถึงบุคลิกภาพที่ดี มีความคิดเชิงสร้างสรรค์และมีวินัย มีจิตอาสา มีภาวะผู้นำและผู้ตามที่ดี สามารถทำงานร่วมกับผู้อื่นได้อย่างยอดเยี่ยม</td></tr>\n</table></div>\n<p>[4] ดีมาก นักศึกษาสามารถแสดงออกถึงบุคลิกภาพที่ดี มีความคิดเชิงสร้างสรรค์และมีวินัย มีจิตอาสา มีภาวะผู้นำและผู้ตามที่ดี สามารถทำงานร่วมกับผู้อื่นได้อย่างดี</p>\n<p>[3] ดี นักศึกษาสามารถแสดงออกถึงบุคลิกภาพที่ดี มีความคิดเชิงสร้างสรรค์และมีวินัย มีจิตอาสา มีภาวะผู้นำและผู้ตามที่ดี สามารถทำงานร่วมกับผู้อื่นได้</p>\n<p>[2] พอใช้ นักศึกษาสามารถแสดงออกถึงบุคลิกภาพได้ และมีวินัย มีจิตอาสา มีภาวะผู้นำและผู้ตามได้ สามารถทำงานร่วมกับผู้อื่นได้</p>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table xlsx-table\">\n<tr><td>[1] ควรปรับปรุง นักศึกษาไม่สามารถแสดงออกถึงบุคลิกภาพได้ และไม่มีวินัย ไม่มีจิตอาสา ไม่มีภาวะผู้นำและผู้ตาม ไม่สามารถทำงานร่วมกับผู้อื่นได้</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td>|</td></tr>\n<tr><td>| PLO13</td><td>แสดงออกถึงการมีวินัย มีจิตอาสา มีภาวะผู้นำ สามารถเป็นได้ทั้งผู้นำและผู้ตาม ทำงานร่วมกับผู้อื่นได้</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td>|</td></tr>\n</table></div>"}]}, {"faculty": "สำนักวิชานานาชาติ", "curricula": [{"name": "หลักสูตรบริหารธุรกิจบัณฑิต นานาชาติ (ปรับปรุง พ.ศ. 2565)", "file": "12. ว.นานาชาติ1หลักสูตร\\ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษา หลักสูตรบริหารธุรกิจบัณฑิต หลักสูตรนานาชาติ (หลักสูตรปรับปรุง พ.ศ. 2565) (1).docx", "ext": "docx", "html": "<p>หลักสูตรบริหารธุรกิจบัณฑิต หลักสูตรนานาชาติ (หลักสูตรปรับปรุง พ.ศ. 2565)</p>\n\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของหลักสูตร (Program Learning Outcomes: PLOs)</h2>\n<div class=\"eval-item\">1. ด้านคุณธรรม จริยธรรม Moral and Ethics</div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO1</span> <span class=\"lo-desc\">แสดงออกถึงความมีวินัย ซื่อสัตย์สุจริต ตรงต่อเวลา และสำนึกสาธารณะ</span></div>\n<p>Showing discipline, honesty, punctuality, and social mindfulness</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO2</span> <span class=\"lo-desc\">ตระหนักถึงบทบาทหน้าที่ ความเป็นมนุษย์ ความเป็นพลเมืองทั้งของตนเองและผู้อื่น</span></div>\n<p>Realizing the roles of human beings, and citizenship of themselves and others.</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO3</span> <span class=\"lo-desc\">สามารถวิเคราะห์ผลกระทบทางจริยธรรมของการดำเนินธุรกิจและแสดงถึงความรับผิดชอบต่อสังคมในการดำเนินงานทางธุรกิจได้</span></div>\n<p>Being able to analyze the ethical impact of business and showing responsibility towards society.</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO4</span> <span class=\"lo-desc\">ปฏิบัติตามกฎ ระเบียบ และข้อตกลงที่เกี่ยวข้องในการดำเนินธุรกิจ</span></div>\n<p>Following rules, regulations, and agreements related to business.</p>\n<div class=\"eval-item\">2. ด้านความรู้ Knowledge</div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO5</span> <span class=\"lo-desc\">สามารถอธิบายหลักการสื่อสารด้วยภาษา พื้นฐานทางสังคมและความเป็นพลเมือง แนวคิดเชิงปรัชญาและการคิดเชิงวิพากษ์ การเล่นกีฬาและการส่งเสริมสุขภาพ การเปลี่ยนแปลงของสภาพแวดล้อม และการประกอบธุรกิจเบื้องต้นได้</span></div>\n<p>Being able to explain the principle of using language for communication, fundamental of society and citizenship, philosophical concepts, and critical thinking, playing sports and health promotion, environmental change, and business basics.</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO6</span> <span class=\"lo-desc\">สามารถอธิบายความก้าวหน้าทางเทคโนโลยีสารสนเทศ กระบวนการแสวงหาความรู้ และการวิจัยขั้นพื้นฐานได้</span></div>\n<p>Being able to explain the advance of information technology, knowledge seeking process, and basic research.</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO7</span> <span class=\"lo-desc\">สามารถอธิบายสาระสำคัญของศาสตร์การบริหารธุรกิจสมัยใหม่ได้</span></div>\n<p>Being able to explain the essence of modern business administration</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO8</span> <span class=\"lo-desc\">สามารถอธิบายความสัมพันธ์ระหว่างความรู้ในการบริหารธุรกิจสมัยใหม่ ความรู้เกี่ยวกับข้อมูลขนาดใหญ่ การวิเคราะห์ทางธุรกิจ และศาสตร์อื่น ๆ ที่เกี่ยวข้องได้</span></div>\n<p>Being able to explain the relationship between knowledge in modern business administration, knowledge about big data, business analysis and other relevant fields.</p>\n<div class=\"eval-item\">3. ด้านทักษะทางปัญญา Intellectual and cognitive skills</div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO9</span> <span class=\"lo-desc\">สามารถค้นหาข้อเท็จจริง ทำความเข้าใจ และประเมินข้อมูลจากหลักฐานได้</span></div>\n<p>Being able to seek truth, understand, and evaluate information from evidence.</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO10</span> <span class=\"lo-desc\">สามารถคิดวิเคราะห์อย่างเป็นระบบแบบองค์รวม มีเหตุผล ความคิดสร้างสรรค์และจินตนาการ</span></div>\n<p>Being able to think holistically, rationally, creatively, and imaginably.</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO11</span> <span class=\"lo-desc\">สามารถประเมินสถานการณ์ขององค์กร ประเมินความเสี่ยง และกำหนด แผนปฏิบัติการเชิงกลยุทธ์ จากการเปลี่ยนแปลงของการบริหารธุรกิจ การเปลี่ยนแปลงในสังคมและโลก เพื่อการเติบโตของธุรกิจได้อย่างมีวิจารณญาณ</span></div>\n<p>Being able to evaluate the organization&#x27;s situation, assess the risk, and set strategic action plans for the growth of business critically.</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO12</span> <span class=\"lo-desc\">สามารถระบุปัญหาทางธุรกิจที่สำคัญต่อองค์กร วิเคราะห์ปัญหาทางธุรกิจอย่างมีเหตุผล กำหนดและเสนอแนวทางแก้ไขทางธุรกิจที่สอดคล้อง</span></div>\n<p>Being able to define the important business problem of an organization, analyze business related problems, set and present solutions.</p>\n<div class=\"eval-item\">4. ด้านทักษะความสัมพันธ์ระหว่างบุคคลและความรับผิดชอบ Interpersonal Skills and Responsibility</div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO13</span> <span class=\"lo-desc\">สามารถกำหนดเป้าหมาย วางแผนและรับผิดชอบในการทำงาน การแสวงหาความรู้ การพัฒนาตนเอง และกระบวนการบริหารจัดการได้อย่างต่อเนื่อง</span></div>\n<p>Being able to plan and be responsible for work, knowledge seeking, self-improvement, and management continuously</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO14</span> <span class=\"lo-desc\">สามารถปรับตัวการในทำงานร่วมกับผู้อื่น โดยอาศัยความเข้าใจถึงพัฒนาการทางสังคม แนวคิดด้านปรัชญา และลักษณะทางพหุวัฒนธรรมได้อย่างเหมาะสมและมีความรับผิดชอบ</span></div>\n<p>Being able to adapt to working with others by understanding social development,</p>\n<p>philosophical concept, and multiculturalism appropriately and responsibly.</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO15</span> <span class=\"lo-desc\">สามารถแสดงทักษะความเป็นผู้นำได้</span></div>\n<p>Being able to present leadership skills.</p>\n<div class=\"eval-item\">5. ด้านทักษะการวิเคราะห์เชิงตัวเลข การสื่อสาร และการใช้เทคโนโลยีสารสนเทศ Numerical Analysis, Communication and Information technology skills</div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO16</span> <span class=\"lo-desc\">สามารถสื่อสารภาษาไทยพื้นฐานในชีวิตประจำวันได้</span></div>\n<p>Being able to communicate in Thai in daily life</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO17</span> <span class=\"lo-desc\">สามารถสื่อสารภาษาอังกฤษ หรือภาษาที่สามในสถานการณ์ทั่วไปที่เกิดขึ้นในชีวิตประจำวันและการประกอบอาชีพได้</span></div>\n<p>Being able to communicate in English or in a third language in situations in daily life and in career.</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO18</span> <span class=\"lo-desc\">สามารถเลือกใช้เทคนิคทางคณิตศาสตร์หรือสถิติที่เกี่ยวข้องในชีวิตประจำวันได้</span></div>\n<p>Being able to use mathematical or related statistical techniques in daily life.</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO19</span> <span class=\"lo-desc\">สามารถเลือกใช้เทคโนโลยีสารสนเทศในสำนักงานอิเล็กทรอนิกส์ การติดต่อสื่อสาร การสืบค้นข้อมูล และการนำเสนอได้อย่างรู้เท่าทัน</span></div>\n<p>Being able to use information technology in the electronic office, communication, searching, and presentation appropriately and knowingly.</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO20</span> <span class=\"lo-desc\">สามารถเลือกใช้เทคโนโลยีสารสนเทศวิเคราะห์เชิงปริมาณและเชิงคุณภาพ และแปลความหมายของข้อมูลเพื่อการแก้ไขปัญหาและการตัดสินใจทางธุรกิจได้</span></div>\n<p>Being able to use information technology to analyze quantitatively and qualitatively and interpret information for solutions and decisions.</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO21</span> <span class=\"lo-desc\">สามารถใช้เทคโนโลยีในการวางแผน การควบคุม การประเมินผล และการรายงานทางบริหารได้อย่างถูกต้อง</span></div>\n<p>Being able to use technology for planning, controlling, evaluating and administrational reports correctly.</p>\n\n<h2 class=\"section-title\">แบบประเมินผลการปฏิบัติสหกิจศึกษาตามผลลัพธ์การเรียนรู้ที่คาดหวัง</h2>\n\n<h4 class=\"table-marker\">[TABLE 1]</h4>\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษา (Learning Outcome: LO)</h2>\n<h3 class=\"domain-title\">ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">ผู้เรียนสามารถระบุและแก้ปัญหาที่ซับซ้อนในงานที่ได้รับมอบหมายในสถานประกอบการ โดยประยุกต์หลักการทางบริหารธุรกิจได้อย่างเหมาะสม</span></div>\n\n<h3 class=\"domain-title\">ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">ผู้เรียนสามารถรวบรวม วิเคราะห์ และแปลผลข้อมูลจากการปฏิบัติงานในสถานประกอบการ เพื่อหาข้อสรุปที่เป็นประโยชน์</span></div>\n\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">ผู้เรียนสามารถสื่อสารกับเพื่อนร่วมงานและบุคคลในสถานประกอบการด้วยภาษาอังกฤษได้อย่างเหมาะสม เพื่อให้การทำงานสำเร็จลุล่วงตามเป้าหมาย</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">ผู้เรียนสามารถเรียนรู้และพัฒนาทักษะใหม่ที่เกี่ยวข้องกับงานในสถานประกอบการด้วยตนเอง</span></div>\n\n<h3 class=\"domain-title\">ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">ผู้เรียนสามารถปฏิบัติงานด้วยความรับผิดชอบและคำนึงถึงจริยธรรมในวิชาชีพ โดยพิจารณาผลกระทบต่อเศรษฐกิจ สังคม และสิ่งแวดล้อม</span></div>\n\n<h3 class=\"domain-title\">ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO6</span> <span class=\"lo-desc\">ผู้เรียนสามารถทำงานร่วมกับทีม ได้อย่างมีประสิทธิภาพ พร้อมทั้งแสดงบทบาทความเป็นผู้นำและการร่วมมือที่ดีตามสถานะของตนเองในทีม</span></div>\n\n<h4 class=\"table-marker\">[TABLE 2]</h4>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table\">\n<tr><td>ผลการเรียนรู้ที่คาดหวัง</td><td>ผลการประเมิน</td></tr>\n</table></div>\n<h3 class=\"domain-title\">(1) ด้านความรู้ (Knowledge) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">ผู้เรียนสามารถระบุและแก้ปัญหาที่ซับซ้อนในงานที่ได้รับมอบหมายในสถานประกอบการ โดยประยุกต์หลักการทางบริหารธุรกิจได้อย่างเหมาะสม |   5 (ยอดเยี่ยม): ระบุและแก้ปัญหาที่ซับซ้อนได้อย่างครบถ้วน พร้อมเสนอแนวทางแก้ไขที่สร้างสรรค์ มีประสิทธิภาพสูง และตอบโจทย์ความต้องการของสถานประกอบการได้อย่างสมบูรณ์</span></div>\n<p>  4 (ดีมาก): ระบุและแก้ปัญหาได้ในระดับดี พร้อมเสนอแนวทางแก้ไขที่เหมาะสม แม้จะมีข้อบกพร่องเล็กน้อยแต่ไม่กระทบต่อคุณภาพโดยรวม</p>\n<p>  3 (ดี): ระบุปัญหาและแก้ไขได้ในระดับพื้นฐาน แต่ข้อเสนอแนวทางแก้ไขยังขาดความสมบูรณ์ในบางส่วน</p>\n<p>  2 (พอใช้): ระบุปัญหาได้บางส่วน แต่ไม่สามารถแก้ไขได้อย่างเหมาะสม ต้องการคำแนะนำอย่างใกล้ชิด</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถระบุหรือแก้ปัญหาได้ และไม่มีข้อเสนอแนะแนวทางแก้ไข</p>\n<h3 class=\"domain-title\">(2) ด้านทักษะ (Skills) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">ผู้เรียนสามารถรวบรวม วิเคราะห์ และแปลผลข้อมูลจากการปฏิบัติงานในสถานประกอบการได้ |   5 (ยอดเยี่ยม): วิเคราะห์ข้อมูลได้อย่างถูกต้อง ครบถ้วน และแปลผลได้ชัดเจน พร้อมข้อสรุปที่นำไปใช้ได้จริง</span></div>\n<p>  4 (ดีมาก): วิเคราะห์ข้อมูลได้ดีในระดับที่เหมาะสม พร้อมข้อสรุปที่เป็นประโยชน์ แม้จะมีข้อผิดพลาดเล็กน้อย</p>\n<p>  3 (ดี): วิเคราะห์ข้อมูลได้ในระดับพื้นฐาน แต่ข้อสรุปยังขาดความชัดเจนและความสมบูรณ์ในบางส่วน</p>\n<p>  2 (พอใช้): วิเคราะห์ข้อมูลได้เพียงบางส่วน และข้อสรุปยังไม่ชัดเจน ต้องการคำแนะนำเพิ่มเติม</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถวิเคราะห์ข้อมูลหรือแปลผลได้</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">ผู้เรียนสามารถสื่อสารกับเพื่อนร่วมงานและบุคคลในสถานประกอบการด้วยภาษาอังกฤษได้ |   5 (ยอดเยี่ยม): สื่อสารได้ชัดเจน เข้าใจง่าย ใช้ภาษาอังกฤษได้อย่างเหมาะสมกับสถานการณ์</span></div>\n<p>  4 (ดีมาก): สื่อสารได้ดีในระดับที่เหมาะสม แม้จะมีข้อผิดพลาดเล็กน้อยที่ไม่กระทบต่อการทำงาน</p>\n<p>  3 (ดี): สื่อสารได้ในระดับพื้นฐาน แต่ยังมีข้อผิดพลาดหรือจุดที่ไม่ชัดเจนในบางสถานการณ์</p>\n<p>  2 (พอใช้): สื่อสารได้บ้าง แต่ยังไม่เหมาะสมกับสถานการณ์หรือมีข้อผิดพลาดที่ส่งผลต่อการทำงาน</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถสื่อสารได้อย่างเหมาะสมในสถานการณ์จริง</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">ผู้เรียนสามารถเรียนรู้และพัฒนาทักษะใหม่ที่เกี่ยวข้องกับงานในสถานประกอบการด้วยตนเอง |   5 (ยอดเยี่ยม): นักศึกษาสามารถเรียนรู้ทักษะใหม่ได้อย่างรวดเร็วและนำไปประยุกต์ใช้ในงานได้อย่างมีประสิทธิภาพ มีการริเริ่มในการศึกษาข้อมูลเพิ่มเติมด้วยตัวเอง และแสดงผลลัพธ์ที่ชัดเจน</span></div>\n<p>  4 (ดีมาก): นักศึกษาสามารถเรียนรู้ทักษะใหม่ได้ดี และสามารถนำไปใช้ในงานได้ในระดับที่เหมาะสม แม้จะมีการปรับปรุงในบางส่วน</p>\n<p>  3 (ดี): นักศึกษาสามารถเรียนรู้ทักษะใหม่ได้ในระดับพื้นฐาน และเริ่มต้นนำไปใช้ในงานบางส่วน แต่ยังขาดความสมบูรณ์</p>\n<p>  2 (พอใช้): นักศึกษาสามารถเรียนรู้ทักษะใหม่ได้ในระดับที่จำกัด และยังไม่สามารถประยุกต์ใช้ได้อย่างเหมาะสม</p>\n<p>  1 (ต้องปรับปรุง): นักศึกษาไม่สามารถเรียนรู้ทักษะใหม่ได้ด้วยตนเอง และขาดความพยายามในการพัฒนาตนเอง</p>\n<h3 class=\"domain-title\">(3) ด้านจริยธรรม (Ethics) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">ผู้เรียนสามารถปฏิบัติงานด้วยความรับผิดชอบและคำนึงถึงจริยธรรมในวิชาชีพ |   5 (ยอดเยี่ยม): ปฏิบัติตามกฎระเบียบทุกข้ออย่างเคร่งครัด พร้อมแสดงความซื่อสัตย์และความรับผิดชอบอย่างชัดเจน</span></div>\n<p>  4 (ดีมาก): ปฏิบัติตามกฎระเบียบส่วนใหญ่ และแสดงความรับผิดชอบในงานได้ดี แม้จะมีข้อผิดพลาดเล็กน้อย</p>\n<p>  3 (ดี): ปฏิบัติตามกฎระเบียบได้ในระดับพื้นฐาน แต่ยังต้องการการปรับปรุงในบางส่วน</p>\n<p>  2 (พอใช้): ปฏิบัติตามกฎระเบียบได้เพียงบางข้อ และยังมีการละเลยหรือผิดพลาดบ้าง</p>\n<p>  1 (ต้องปรับปรุง): ไม่ปฏิบัติตามกฎระเบียบ และแสดงถึงความขาดความรับผิดชอบในงาน</p>\n<h3 class=\"domain-title\">(4) ด้านลักษณะบุคคล (Character) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO6</span> <span class=\"lo-desc\">ผู้เรียนสามารถทำงานร่วมกับทีม ได้อย่างมีประสิทธิภาพ พร้อมทั้งแสดงบทบาทความเป็นผู้นำและการร่วมมือที่ดี |   5 (ยอดเยี่ยม): มีบทบาทสำคัญในทีม ช่วยสร้างสภาพแวดล้อมการทำงานที่ดี และแสดงภาวะผู้นำได้อย่างชัดเจน</span></div>\n<p>  4 (ดีมาก): ทำงานร่วมกับทีมได้ดีในระดับที่เหมาะสม และปฏิบัติงานตามบทบาทที่ได้รับอย่างสมบูรณ์</p>\n<p>  3 (ดี): ทำงานร่วมกับทีมได้ในระดับพื้นฐาน แต่ยังต้องปรับปรุงในบางด้าน</p>\n<p>  2 (พอใช้): ทำงานร่วมกับทีมได้บางส่วน แต่มีปัญหาในการสื่อสารหรือการมีส่วนร่วม</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถทำงานร่วมกับทีมได้อย่างเหมาะสม</p>"}]}, {"faculty": "สำนักวิชาเทคโนโลยีการเกษตร", "curricula": [{"name": "หลักสูตรวิทยาศาสตรบัณฑิต เกษตรศาสตร์และนวัตกรรม", "file": "13. สำนักวิชาเทคโนโลยีการเกษตรฯ\\PLOs-หลักสูตรวิทยาศาสตรบัณฑิต-สาขาวิทยาศาสต.docx", "ext": "docx", "html": "<p>หลักสูตรวิทยาศาสตรบัณฑิต สาขาวิทยาศาสตร์อาหารและนวัตกรรม  (หลักสูตรปรับปรุง ปีการศึกษา 2562)</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO1</span> <span class=\"lo-desc\">มีคุณธรรม จริยธรรม ตระหนักถึงจรรยาบรรณวิชาชีพ และมีความรับผิดชอบต่อสังคมโดยคำนึงถึงความปลอดภัยของผู้บริโภคและคุณค่าทางโภชนาการของอาหารเป็นสำคัญ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO2</span> <span class=\"lo-desc\">มีความรู้พื้นฐานทั้งภาคทฤษฎีและปฎิบัติที่เพียงพอในวิชาชีพด้านวิทยาศาสตร์อาหารและโภชนาการ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO3</span> <span class=\"lo-desc\">มีสมรรรถนะในการประยุกต์ใช้องค์ความรู้และทักษะวิชาชีพด้านวิทยาศาสตร์อาหารและโภชนาการ สำหรับการทำงานทั้งในอุตสาหกรรมอาหารและโภชนาการ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO4</span> <span class=\"lo-desc\">สามารถวิเคราะห์ความรู้อย่างเป็นระบบจากแหล่งข้อมูลต่าง ๆ ที่หลากหลายได้อย่างถูกต้องและเหมาะสม บนพื้นฐานของการใช้เหตุผลด้านวิทยาศาสตร์อาหารและโภชนาการ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO5</span> <span class=\"lo-desc\">สามารถพัฒนานวัตกรรมด้านวิทยาศาสตร์อาหารและโภชนาการ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO6</span> <span class=\"lo-desc\">สามารถปรับตัวให้เข้ากับวัฒนธรรมองค์กรทั้งด้านอุตสาหกรรมอาหาร โภชนาการ และสังคมทั่วไป</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO7</span> <span class=\"lo-desc\">มีความรับผิดชอบ มีภาวะผู้นำ และสามารถทำงานร่วมกับผู้อื่นได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO8</span> <span class=\"lo-desc\">มีทักษะด้านการสื่อสารและเลือกใช้เทคโนโลยีสารสนเทศได้อย่างเหมาะสม เพื่อเพิ่มประสิทธิภาพการปฏิบัติงานในอุตสาหกรรมอาหารและโภชนาการ</span></div>\n<p>SLO9\tสามารถวางแผนและสร้างงานวิจัยด้านวิทยาศาสตร์อาหารและโภชนาการ เพื่อเผยแพร่ในระดับชาติหรือนานาชาติ</p>\n\n<p>หลักสูตรวิทยาศาสตรบัณฑิต สาขาวิทยาศาสตร์อาหารและนวัตกรรม  (หลักสูตรปรับปรุง ปีการศึกษา 2567)</p>\n<h3 class=\"domain-title\">1) ด้านความรู้  (Khowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO1</span> <span class=\"lo-desc\">อธิบายความรู้ทางด้านวิทยาศาสตร์ พื้นฐานทางด้านเทคโนโลยีสาระสนเทศ คณิตศาสตร์ทั่วไป ทางด้านสังคมศาสตร์และมนุษยศาสตร์</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO2</span> <span class=\"lo-desc\">อธิบายคุณค่าวัฒนธรรมท้องถิ่นของตนเองโดยคำนึงถึงความแตกต่างของพหุวัฒนธรรม รวมทั้งวิธีการปรับตัวท่ามกลางสถานการณ์ที่มีการเปลี่ยนแปลงในด้านต่าง ๆ ของสังคมเศรษฐกิจ และสิ่งแวดล้อมเพื่อเสริมสร้างความยั่งยืน</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO3</span> <span class=\"lo-desc\">อธิบายความรู้ที่เกี่ยวกับการแปรรูปและวิศวกรรมอาหาร เคมีอาหาร จุลชีววิทยาทางอาหาร ความปลอดภัยทางอาหาร หลักโภชนศาสตร์ การประเมินทางประสาทสัมผัส การควบคุมและประกันคุณภาพ การตลาด กฎหมายอาหารและข้อกำหนดต่าง ๆ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO4</span> <span class=\"lo-desc\">ประยุกต์ความรู้ที่เกี่ยวข้องทางด้านวิทยาศาสตร์อาหารเพื่อพัฒนาให้เกิดนวัตกรรมทางด้านกระบวนการผลิต หรือคุณภาพของผลิตภัณฑ์</span></div>\n<h3 class=\"domain-title\">2) ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO5</span> <span class=\"lo-desc\">สามารถเลือกใช้งานเครื่องมือทางวิทยาศาสตร์ วิธีการ และเทคโนโลยี ได้อย่างถูกต้องตามหลักการทางวิทยาศาสตร์</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO6</span> <span class=\"lo-desc\">มีทักษะการปฏิบัติงานเกี่ยวกับการแปรรูปและวิศวกรรมอาหาร เคมีอาหาร จุลชีววิทยาทางอาหาร ความปลอดภัยทางอาหาร หลักโภชนศาสตร์ การประเมินทางประสาทสัมผัส การควบคุมและประกันคุณภาพ การตลาด กฎหมายอาหารและข้อกำหนดต่างๆ ได้อย่างถูกต้องตามมาตรฐาน</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO7</span> <span class=\"lo-desc\">มีทักษะแก้ไขปัญหาทางด้านวิทยาศาสตร์อาหาร โดยอาศัยการคิดวิเคราะห์ สังเคราะห์อย่างมีวิจารณญาณ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO8</span> <span class=\"lo-desc\">มีทักษะการสื่อสารภาษาไทยและภาษาอังกฤษ เพื่อใช้ในชีวิตประจำวัน และในการทำงานด้านวิทยาศาสตร์อาหาร ทั้งการฟัง พูด อ่าน เขียน และเสนอผลงานได้ตามวัตถุประสงค์ ในกรณีที่นักศึกษาเลือกภาษาจีนสามารถสื่อสารภาษาจีนในชีวิตประจำวัน</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO9</span> <span class=\"lo-desc\">มีทักษะการใช้เทคโนโลยีสารสนเทศในการสืบค้น วิเคราะห์ และนำเสนอ ข้อมูลทั่วไปและข้อมูลทางวิชาชีพ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO10</span> <span class=\"lo-desc\">มีทักษะในการออกกำลังกายและการเลือกบริโภคอาหารที่ถูกสุขลักษณะและหลักโภชนาการ เพื่อสร้างสุขภาวะดีทั้งร่างกายและจิตใจ</span></div>\n<h3 class=\"domain-title\">3) ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO11</span> <span class=\"lo-desc\">แสดงออกถึงความรับผิดชอบต่องานที่ได้รับมอบหมาย มีความรับผิดชอบต่อตนเอง ผู้อื่น และสังคม มีความซื่อสัตย์ กตัญญู และปฏิบัติตามกฏระเบียบหรือกฎหมายที่เกี่ยวข้องได้อย่างถูกต้อง</span></div>\n<h3 class=\"domain-title\">4) ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO12</span> <span class=\"lo-desc\">มีภาวะผู้นำและใจอาสา มีวินัย ทำงานร่วมกับผู้อื่น  นิสัยใฝ่รู้ใฝ่เรียน</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO13</span> <span class=\"lo-desc\">มีบุคลิกภาพ ช่างสังเกต มีความคิดสร้างสรรค์ กล้าตัดสินใจ มีความเป็นผู้ประกอบการ</span></div>"}, {"name": "หัวข้อประเมินตาม PLOs เกษตรศาสตร์และนวัตกรรม", "file": "13. สำนักวิชาเทคโนโลยีการเกษตรฯ\\หัวข้อประเมินตาม PLOs เกษตรศาสตร์และนวัตกรร.docx", "ext": "docx", "html": "<p>การประเมินตาม PLOs หลักสูตรเกษตรศาสตร์และนวัตกรรม หลักสูตรปรับปรุงปีการศึกษา 2563</p>\n\n<div class=\"lo-item\"><span class=\"lo-code\">PLO1</span> <span class=\"lo-desc\">อธิบายองค์ความรู้ทั่วไปและความรู้ทางนวัตกรรมการเกษตรตามหลักการทางวิทยาศาสตร์ได้อย่าง ถูกต้องเหมาะสม</span></div>\n\n<div class=\"lo-item\"><span class=\"lo-code\">PLO2</span> <span class=\"lo-desc\">บูรณาการองค์ความรู้ด้านการเกษตรและความรู้ทางด้านธุรกิจการเกษตรได้</span></div>\n\n<div class=\"lo-item\"><span class=\"lo-code\">PLO3</span> <span class=\"lo-desc\">เลือกใช้เทคโนโลยีและนวัตกรรมทางการเกษตรสมัยใหม่ได้อย่างมีประสิทธิภาพและเหมาะสม</span></div>\n\n<div class=\"lo-item\"><span class=\"lo-code\">PLO4</span> <span class=\"lo-desc\">เลือกใช้สื่อและเทคโนโลยีสารสนเทศได้อย่างเหมาะสมเพื่อการสื่อสาร และถ่ายทอดองค์ความรู้ทางด้านนวัตกรรมเกษตรทั้งภาษาไทยและภาษาอังกฤษ</span></div>\n\n<div class=\"lo-item\"><span class=\"lo-code\">PLO5</span> <span class=\"lo-desc\">แสวงหาความรู้ได้ด้วยตนเอง มีการคิดสร้างสรรค์ในการพัฒนานวัตกรรมเกษตร</span></div>\n\n<div class=\"lo-item\"><span class=\"lo-code\">PLO6</span> <span class=\"lo-desc\">ปฏิบัติตนตามบทบาทและหน้าที่ของตนเอง และสามารถทำงานร่วมกับผู้อื่นได้ โดยยึดหลักคุณธรรม จริยธรรม จรรยาบรรณวิชาชีพ และกฎหมายที่เกี่ยวข้อง</span></div>\n\n<h4 class=\"table-marker\">[TABLE 1]</h4>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table\">\n<tr><td>หัวข้อประเมิน</td><td>คะแนนประเมิน</td></tr>\n</table></div>\n<p>มีความรู้ทางนวัตกรรมการเกษตรที่ถูกต้องและสามารถอธิบายหลักการทางวิทยาศาสตร์ที่เกี่ยวข้องได้อย่างชัดเจน |</p>\n<p>สามารถประยุกต์ใช้องค์ความรู้ทางวิทยาศาสตร์และเทคโนโลยีการเกษตรเพื่อแก้ปัญหาและพัฒนางานในสถานประกอบการได้อย่างเหมาะสม |</p>\n<p>สามารถติดตามและประยุกต์ใช้ข้อมูลข่าวสาร เทคโนโลยี และองค์ความรู้ใหม่ที่เกี่ยวข้องกับวิชาชีพทางการเกษตรได้ทันต่อสถานการณ์ |</p>\n<p>สามารถวิเคราะห์และสังเคราะห์ข้อมูลที่เกี่ยวข้องกับงานด้านการเกษตร เพื่อนำไปใช้ในกระบวนการตัดสินใจทางวิชาชีพได้ |</p>\n\n<h4 class=\"table-marker\">[TABLE 2]</h4>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table\">\n<tr><td>หัวข้อประเมิน</td><td>คะแนนประเมิน</td></tr>\n</table></div>\n<p>สามารถนำความรู้ด้านการเกษตรและธุรกิจมาวิเคราะห์และพัฒนาเพื่อเป็นแนวทางในการปฏิบัติงานได้อย่างมีประสิทธิภาพ |</p>\n<p>สามารถสรุปประเด็นสำคัญในการดำเนินงานธุรกิจที่เกี่ยวข้องกับสถานประกอบการและแสดงความเข้าใจในกระบวนการทางธุรกิจการเกษตรได้อย่างเหมาะสม |</p>\n<p>สามารถคิดวิเคราะห์เชิงระบบ มีเหตุผลรอบด้าน และใช้ความรู้ด้านเกษตรและธุรกิจประกอบการตัดสินใจได้อย่างถูกต้อง |</p>\n<p>สามารถแก้ไขปัญหาเฉพาะหน้าที่เกี่ยวข้องกับการดำเนินงานด้านเกษตรและธุรกิจการเกษตรได้อย่างมีประสิทธิภาพ พร้อมมีแนวทางป้องกันปัญหาที่อาจเกิดขึ้นในอนาคต |</p>\n<p>สามารถบูรณาการความรู้ด้านการเกษตร เทคโนโลยี และการจัดการธุรกิจ เพื่อพัฒนาแนวทางที่เป็นประโยชน์ต่อสถานประกอบการ |</p>\n\n<h4 class=\"table-marker\">[TABLE 3]</h4>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table\">\n<tr><td>หัวข้อประเมิน</td><td>คะแนนประเมิน</td></tr>\n</table></div>\n<p>สามารถใช้ทักษะด้านนวัตกรรมการเกษตร โดยเฉพาะทักษะทางวิชาชีพได้อย่างถูกต้อง |</p>\n<p>สามารถปฏิบัติงานทางวิชาชีพได้อย่างมีประสิทธิภาพ ทั้งในด้านการใช้เครื่องมือ เทคโนโลยี และกระบวนการผลิตทางการเกษตร |</p>\n<p>สามารถทำงานได้ด้วยตนเอง ปฏิบัติงานตามมาตรฐานวิชาชีพ และสามารถตัดสินใจแก้ไขปัญหาที่เกี่ยวข้องกับเทคโนโลยีการเกษตรได้อย่างเหมาะสม |</p>\n<p>สามารถสรุปประเด็น วิเคราะห์ปัญหา และนำเสนอแนวทางพัฒนาเพื่อปรับปรุงการใช้เทคโนโลยีและนวัตกรรมในสถานประกอบการ |</p>\n<p>สามารถเรียนรู้และปรับตัวกับเทคโนโลยีใหม่ๆ ในภาคการเกษตร รวมถึงมีทักษะในการฝึกฝนและพัฒนาตนเองด้านเทคโนโลยีทางการเกษตร |</p>\n<p>สามารถประเมินผลกระทบของการใช้เทคโนโลยีและนวัตกรรมที่มีต่อประสิทธิภาพการทำงานและความยั่งยืนของภาคการเกษตรในสถานประกอบการ |</p>\n\n<h4 class=\"table-marker\">[TABLE 4]</h4>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table\">\n<tr><td>หัวข้อประเมิน</td><td>คะแนนประเมิน</td></tr>\n</table></div>\n<p>สามารถสื่อสารและถ่ายทอดองค์ความรู้ด้านนวัตกรรมการเกษตรผ่านสื่อที่เหมาะสม ทั้งในรูปแบบเอกสาร รายงาน และการนำเสนอ |</p>\n<p>สามารถใช้ทักษะการฟัง พูด อ่าน และเขียนภาษาไทยและภาษาอังกฤษ เพื่อการสื่อสารทางวิชาชีพได้อย่างชัดเจนและเหมาะสมกับสถานการณ์การทำงาน |</p>\n<p>สามารถนำความรู้ทางคณิตศาสตร์และสถิติไปใช้ในการวิเคราะห์ข้อมูลและตัดสินใจในกระบวนการทำงานได้อย่างถูกต้อง |</p>\n<p>สามารถใช้ภาษาอังกฤษในบริบทของงานด้านเกษตร ทั้งการสื่อสารทั่วไปและการอ่านเอกสารทางวิชาการหรือคู่มือการทำงานได้อย่างมีประสิทธิภาพ |</p>\n\n<h4 class=\"table-marker\">[TABLE 5]</h4>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table\">\n<tr><td>หัวข้อประเมิน</td><td>คะแนนประเมิน</td></tr>\n</table></div>\n<p>สามารถเรียนรู้และปรับตัวกับงานใหม่ๆ ได้อย่างรวดเร็วและมีประสิทธิภาพ |</p>\n<p>สามารถวางแผนการทำงาน กำหนดเป้าหมาย และจัดลำดับความสำคัญของงานที่ได้รับมอบหมายได้อย่างเหมาะสม |</p>\n<p>สามารถค้นหาข้อมูลที่เกี่ยวข้องกับงาน ทำความเข้าใจ และสังเคราะห์องค์ความรู้เพื่อนำไปใช้ในการปฏิบัติงานได้อย่างเป็นระบบ |</p>\n<p>สามารถแสดงความคิดริเริ่มสร้างสรรค์ในการพัฒนาหรือปรับปรุงงานที่ปฏิบัติให้มีประสิทธิภาพมากขึ้น |</p>\n<p>สามารถนำเสนอแนวทางหรือแนวคิดใหม่ๆ ที่นำไปสู่การแก้ไขปัญหาและพัฒนานวัตกรรมทางการเกษตรให้แก่สถานประกอบการได้ |</p>\n<p>สามารถประเมินตนเองและพัฒนาทักษะทางวิชาชีพอย่างต่อเนื่องเพื่อเพิ่มประสิทธิภาพในการทำงาน |</p>\n<p>สามารถนำเสนอแนวคิดเชิงนวัตกรรมและปรับปรุงงานได้โดยอ้างอิงจากข้อมูลและแนวปฏิบัติที่ดีในอุตสาหกรรมการเกษตร |</p>\n<p>สามารถทำงานร่วมกับผู้อื่นและแลกเปลี่ยนความคิดเห็นอย่างสร้างสรรค์เพื่อพัฒนาการทำงานและนวัตกรรมใหม่ๆ |</p>\n<p>สามารถจัดการข้อผิดพลาดหรืออุปสรรคในการทำงานด้วยแนวคิดที่สร้างสรรค์และมุ่งเน้นการแก้ปัญหาอย่างเป็นระบบ |</p>\n\n<h4 class=\"table-marker\">[TABLE 6]</h4>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table\">\n<tr><td>หัวข้อประเมิน</td><td>คะแนนประเมิน</td></tr>\n</table></div>\n<p>มีความซื่อสัตย์สุจริต และสามารถแสดงออกถึงความโปร่งใสในการทำงาน |</p>\n<p>มีน้ำใจช่วยเหลือผู้อื่นและทำงานร่วมกันในทีมได้อย่างมีประสิทธิภาพ |</p>\n<p>มีวินัย ตรงต่อเวลา และสามารถรับผิดชอบต่อการปฏิบัติงานได้อย่างครบถ้วน |</p>\n<p>เคารพสิทธิ์และรับฟังความคิดเห็นของผู้อื่นอย่างเปิดกว้าง |</p>\n<p>สามารถทำงานร่วมกับผู้อื่นได้ โดยคำนึงถึงความหลากหลายและการทำงานเป็นทีม |</p>\n<p>ปฏิบัติตามจรรยาบรรณวิชาชีพ และสามารถแสดงความรับผิดชอบในบทบาทของตนได้ |</p>\n<p>มีความรู้พื้นฐานด้านกฎหมายที่เกี่ยวข้องกับวิชาชีพและสามารถปฏิบัติตามได้อย่างถูกต้อง |</p>\n<p>สามารถตัดสินใจและดำเนินการภายใต้ข้อจำกัดทางกฎหมายและจริยธรรมในสภาพแวดล้อมการทำงาน |</p>"}]}];
let state = {fac:null, cur:null, q:''};

const app = document.getElementById('app');
const bc = document.getElementById('breadcrumb');

function render(){
  if(state.cur !== null){
    renderEval();
  } else if(state.fac !== null){
    renderCurricula();
  } else {
    renderFaculties();
  }
  renderBreadcrumb();
  window.scrollTo(0,0);
}

function renderBreadcrumb(){
  bc.innerHTML = '';
  const add = (label, idx) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = () => { if(idx===0){state.fac=null;state.cur=null} else if(idx===1){state.cur=null} state.q=''; render(); };
    bc.appendChild(b);
  };
  add('สำนักวิชาทั้งหมด', 0);
  if(state.fac !== null){
    const sep = document.createElement('span'); sep.className='sep'; sep.textContent='›'; bc.appendChild(sep);
    if(state.cur === null){
      const cur = document.createElement('span'); cur.className='current'; cur.textContent = DATA[state.fac].faculty; bc.appendChild(cur);
    } else {
      add(DATA[state.fac].faculty, 1);
      const sep2 = document.createElement('span'); sep2.className='sep'; sep2.textContent='›'; bc.appendChild(sep2);
      const cur = document.createElement('span'); cur.className='current'; cur.textContent = DATA[state.fac].curricula[state.cur].name; bc.appendChild(cur);
    }
  }
}

function renderFaculties(){
  let html = '<div class="page-title">เลือกสำนักวิชา</div>';
  html += '<div class="page-desc">คลิกที่สำนักวิชาเพื่อดูหลักสูตรที่มีแบบประเมิน</div>';
  html += '<div class="search-bar"><input type="search" id="searchInput" placeholder="ค้นหาสำนักวิชาหรือหลักสูตร..." aria-label="ค้นหา"></div>';
  html += '<div class="grid" id="facGrid"></div>';
  app.innerHTML = html;
  const grid = document.getElementById('facGrid');
  const q = state.q.toLowerCase();
  DATA.forEach((d, i) => {
    if(q && !d.faculty.toLowerCase().includes(q) && !d.curricula.some(c=>c.name.toLowerCase().includes(q))) return;
    const card = document.createElement('button');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-icon">🎓</div>
      <div class="card-title">${esc(d.faculty)}</div>
      <div class="card-meta"><span class="badge">${d.curricula.length} หลักสูตร</span></div>
    `;
    card.onclick = () => { state.fac = i; state.q=''; render(); };
    grid.appendChild(card);
  });
  const si = document.getElementById('searchInput');
  si.value = state.q;
  si.addEventListener('input', e => { state.q = e.target.value; renderFaculties(); document.getElementById('searchInput').focus(); });
  if(q && grid.children.length === 0){
    grid.innerHTML = '<div class="empty-state"><div class="icon">🔍</div>ไม่พบผลลัพธ์สำหรับ "'+esc(state.q)+'"</div>';
  }
}

function renderCurricula(){
  const fac = DATA[state.fac];
  let html = `<button class="back-btn" id="backBtn">← กลับสู่สำนักวิชาทั้งหมด</button>`;
  html += `<div class="page-title">${esc(fac.faculty)}</div>`;
  html += `<div class="page-desc">เลือกหลักสูตรเพื่อดูแบบประเมินฉบับเต็ม (${fac.curricula.length} หลักสูตร)</div>`;
  html += `<div class="grid" id="curGrid"></div>`;
  app.innerHTML = html;
  document.getElementById('backBtn').onclick = () => { state.fac=null; render(); };
  const grid = document.getElementById('curGrid');
  fac.curricula.forEach((c, i) => {
    const card = document.createElement('button');
    card.className = 'card';
    const icon = c.ext === 'pdf' ? '📄' : c.ext === 'xlsx' ? '📊' : '📝';
    card.innerHTML = `
      <div class="card-icon">${icon}</div>
      <div class="card-title">${esc(c.name)}</div>
      <div class="card-meta"><span class="badge">.${c.ext}</span></div>
    `;
    card.onclick = () => { state.cur = i; render(); };
    grid.appendChild(card);
  });
}

function renderEval(){
  const fac = DATA[state.fac];
  const c = fac.curricula[state.cur];
  let html = `<button class="back-btn" id="backBtn">← กลับสู่${esc(fac.faculty)}</button>`;
  html += `<button class="print-btn" id="printBtn">🖨 พิมพ์ / บันทึก PDF</button>`;
  html += `<div class="eval-header"><h2>${esc(c.name)}</h2>`;
  html += `<div class="source">สำนักวิชา: ${esc(fac.faculty)} · แหล่งไฟล์: ${esc(c.file)}</div></div>`;
  html += `<div class="eval-body">${c.html}</div>`;
  app.innerHTML = html;
  document.getElementById('backBtn').onclick = () => { state.cur=null; render(); };
  document.getElementById('printBtn').onclick = () => window.print();
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
</body>
</html>
