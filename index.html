นสามารถสื่อสารภาษาจีนในชีวิตประจำวันได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO5</span> <span class=\"lo-desc\">มีทักษะแสวงหาและใช้ความรู้ใหม่ที่จำเป็น โดยใช้กลยุทธ์การเรียนรู้ที่เหมาะสม</span></div>\n<h3 class=\"domain-title\">ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO6</span> <span class=\"lo-desc\">มีความรับผิดชอบทางจริยธรรมและวิชาชีพด้านวิศวกรรมอย่างมีวิจารณญาณ โดยต้องคำนึงถึงผลกระทบในบริบทของโลก เศรษฐกิจ สิ่งแวดล้อม และสังคม</span></div>\n<h3 class=\"domain-title\">ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO7</span> <span class=\"lo-desc\">มีทักษะทำงานเป็นทีมผ่านกระบวนการแบบอไจล์ (Agile) ได้อย่างมีประสิทธิภาพ ตามสถานะในทีม มีความเป็นผู้นำและใจอาสา สร้างสภาพแวดล้อมการทำงานร่วมกันและมีส่วนร่วม กำหนดเป้าหมาย วางแผนงานให้งานบรรลุวัตถุประสงค์</span></div>\n\n<h2 class=\"section-title\">แบบประเมินผลการปฏิบัติสหกิจศึกษาตามผลลัพธ์การเรียนรู้ที่คาดหวัง</h2>\n\n<h4 class=\"table-marker\">[TABLE 1]</h4>\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษา (Learning Outcome: LO)</h2>\n<h3 class=\"domain-title\">ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">ผู้เรียนสามารถระบุและแก้ปัญหาที่ซับซ้อนในงานที่ได้รับมอบหมายในสถานประกอบการ โดยประยุกต์หลักการทางวิศวกรรมคอมพิวเตอร์และปัญญาประดิษฐ์ได้อย่างเหมาะสม</span></div>\n\n<h3 class=\"domain-title\">ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">ผู้เรียนสามารถรวบรวม วิเคราะห์ และแปลผลข้อมูลจากการปฏิบัติงานในสถานประกอบการ เพื่อหาข้อสรุปที่เป็นประโยชน์</span></div>\n\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">ผู้เรียนสามารถสื่อสารกับเพื่อนร่วมงานและบุคคลในสถานประกอบการด้วยภาษาไทยและภาษาอังกฤษได้อย่างเหมาะสม เพื่อให้การทำงานสำเร็จลุล่วงตามเป้าหมาย</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">ผู้เรียนสามารถเรียนรู้และพัฒนาทักษะใหม่ที่เกี่ยวข้องกับงานในสถานประกอบการด้วยตนเอง</span></div>\n\n<h3 class=\"domain-title\">ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">ผู้เรียนสามารถปฏิบัติงานด้วยความรับผิดชอบและคำนึงถึงจริยธรรมในวิชาชีพ โดยพิจารณาผลกระทบต่อเศรษฐกิจ สังคม และสิ่งแวดล้อม</span></div>\n\n<h3 class=\"domain-title\">ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO6</span> <span class=\"lo-desc\">ผู้เรียนสามารถทำงานร่วมกับทีม ได้อย่างมีประสิทธิภาพ พร้อมทั้งแสดงบทบาทความเป็นผู้นำและการร่วมมือที่ดีตามสถานะของตนเองในทีม</span></div>\n\n<h4 class=\"table-marker\">[TABLE 2]</h4>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table\">\n<tr><td>ผลการเรียนรู้ที่คาดหวัง</td><td>ผลการประเมิน</td></tr>\n</table></div>\n<h3 class=\"domain-title\">(1) ด้านความรู้ (Knowledge) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">ผู้เรียนสามารถระบุและแก้ปัญหาที่ซับซ้อนในงานที่ได้รับมอบหมายในสถานประกอบการ โดยประยุกต์หลักการทางวิศวกรรมคอมพิวเตอร์และปัญญาประดิษฐ์ได้อย่างเหมาะสม |   5 (ยอดเยี่ยม): ระบุและแก้ปัญหาที่ซับซ้อนได้อย่างครบถ้วน พร้อมเสนอแนวทางแก้ไขที่สร้างสรรค์ มีประสิทธิภาพสูง และตอบโจทย์ความต้องการของสถานประกอบการได้อย่างสมบูรณ์</span></div>\n<p>  4 (ดีมาก): ระบุและแก้ปัญหาได้ในระดับดี พร้อมเสนอแนวทางแก้ไขที่เหมาะสม แม้จะมีข้อบกพร่องเล็กน้อยแต่ไม่กระทบต่อคุณภาพโดยรวม</p>\n<p>  3 (ดี): ระบุปัญหาและแก้ไขได้ในระดับพื้นฐาน แต่ข้อเสนอแนวทางแก้ไขยังขาดความสมบูรณ์ในบางส่วน</p>\n<p>  2 (พอใช้): ระบุปัญหาได้บางส่วน แต่ไม่สามารถแก้ไขได้อย่างเหมาะสม ต้องการคำแนะนำอย่างใกล้ชิด</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถระบุหรือแก้ปัญหาได้ และไม่มีข้อเสนอแนะแนวทางแก้ไข</p>\n<h3 class=\"domain-title\">(2) ด้านทักษะ (Skills) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">ผู้เรียนสามารถรวบรวม วิเคราะห์ และแปลผลข้อมูลจากการปฏิบัติงานในสถานประกอบการได้ |   5 (ยอดเยี่ยม): วิเคราะห์ข้อมูลได้อย่างถูกต้อง ครบถ้วน และแปลผลได้ชัดเจน พร้อมข้อสรุปที่นำไปใช้ได้จริง</span></div>\n<p>  4 (ดีมาก): วิเคราะห์ข้อมูลได้ดีในระดับที่เหมาะสม พร้อมข้อสรุปที่เป็นประโยชน์ แม้จะมีข้อผิดพลาดเล็กน้อย</p>\n<p>  3 (ดี): วิเคราะห์ข้อมูลได้ในระดับพื้นฐาน แต่ข้อสรุปยังขาดความชัดเจนและสมบูรณ์ในบางส่วน</p>\n<p>  2 (พอใช้): วิเคราะห์ข้อมูลได้เพียงบางส่วน และข้อสรุปยังไม่ชัดเจน ต้องการคำแนะนำเพิ่มเติม</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถวิเคราะห์ข้อมูลหรือแปลผลได้</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">ผู้เรียนสามารถสื่อสารกับเพื่อนร่วมงานและบุคคลในสถานประกอบการด้วยภาษาไทยและภาษาอังกฤษได้ |   5 (ยอดเยี่ยม): สื่อสารได้ชัดเจน เข้าใจง่าย ใช้ภาษาไทยและภาษาอังกฤษได้อย่างเหมาะสมกับสถานการณ์</span></div>\n<p>  4 (ดีมาก): สื่อสารได้ดีในระดับที่เหมาะสม แม้จะมีข้อผิดพลาดเล็กน้อยที่ไม่กระทบต่อการทำงาน</p>\n<p>  3 (ดี): สื่อสารได้ในระดับพื้นฐาน แต่ยังมีข้อผิดพลาดหรือจุดที่ไม่ชัดเจนในบางสถานการณ์</p>\n<p>  2 (พอใช้): สื่อสารได้บ้าง แต่ยังไม่เหมาะสมกับสถานการณ์หรือมีข้อผิดพลาดที่ส่งผลต่อการทำงาน</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถสื่อสารได้อย่างเหมาะสมในสถานการณ์จริง</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">ผู้เรียนสามารถเรียนรู้และพัฒนาทักษะใหม่ที่เกี่ยวข้องกับงานในสถานประกอบการด้วยตนเอง |   5 (ยอดเยี่ยม): นักศึกษาสามารถเรียนรู้ทักษะใหม่ได้อย่างรวดเร็วและนำไปประยุกต์ใช้ในงานได้อย่างมีประสิทธิภาพ มีการริเริ่มในการศึกษาข้อมูลเพิ่มเติมด้วยตัวเอง และแสดงผลลัพธ์ที่ชัดเจน</span></div>\n<p>  4 (ดีมาก): นักศึกษาสามารถเรียนรู้ทักษะใหม่ได้ดี และสามารถนำไปใช้ในงานได้ในระดับที่เหมาะสม แม้จะมีการปรับปรุงในบางส่วน</p>\n<p>  3 (ดี): นักศึกษาสามารถเรียนรู้ทักษะใหม่ได้ในระดับพื้นฐาน และเริ่มต้นนำไปใช้ในงานบางส่วน แต่ยังขาดความสมบูรณ์</p>\n<p>  2 (พอใช้): นักศึกษาสามารถเรียนรู้ทักษะใหม่ได้ในระดับที่จำกัด และยังไม่สามารถประยุกต์ใช้ได้อย่างเหมาะสม</p>\n<p>  1 (ต้องปรับปรุง): นักศึกษาไม่สามารถเรียนรู้ทักษะใหม่ได้ด้วยตนเอง และขาดความพยายามในการพัฒนาตนเอง</p>\n<h3 class=\"domain-title\">(3) ด้านจริยธรรม (Ethics) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">ผู้เรียนสามารถปฏิบัติงานด้วยความรับผิดชอบและคำนึงถึงจริยธรรมในวิชาชีพ |   5 (ยอดเยี่ยม): ปฏิบัติตามกฎระเบียบทุกข้ออย่างเคร่งครัด พร้อมแสดงความซื่อสัตย์และความรับผิดชอบอย่างชัดเจน</span></div>\n<p>  4 (ดีมาก): ปฏิบัติตามกฎระเบียบส่วนใหญ่ และแสดงความรับผิดชอบในงานได้ดี แม้จะมีข้อผิดพลาดเล็กน้อย</p>\n<p>  3 (ดี): ปฏิบัติตามกฎระเบียบได้ในระดับพื้นฐาน แต่ยังต้องการการปรับปรุงในบางส่วน</p>\n<p>  2 (พอใช้): ปฏิบัติตามกฎระเบียบได้เพียงบางข้อ และยังมีการละเลยหรือผิดพลาดบ้าง</p>\n<p>  1 (ต้องปรับปรุง): ไม่ปฏิบัติตามกฎระเบียบ และแสดงถึงความขาดความรับผิดชอบในงาน</p>\n<h3 class=\"domain-title\">(4) ด้านลักษณะบุคคล (Character) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO6</span> <span class=\"lo-desc\">ผู้เรียนสามารถทำงานร่วมกับทีม ได้อย่างมีประสิทธิภาพ พร้อมทั้งแสดงบทบาทความเป็นผู้นำและการร่วมมือที่ดี |   5 (ยอดเยี่ยม): มีบทบาทสำคัญในทีม ช่วยสร้างสภาพแวดล้อมการทำงานที่ดี และแสดงภาวะผู้นำได้อย่างชัดเจน</span></div>\n<p>  4 (ดีมาก): ทำงานร่วมกับทีมได้ดีในระดับที่เหมาะสม และปฏิบัติงานตามบทบาทที่ได้รับอย่างสมบูรณ์</p>\n<p>  3 (ดี): ทำงานร่วมกับทีมได้ในระดับพื้นฐาน แต่ยังต้องปรับปรุงในบางด้าน</p>\n<p>  2 (พอใช้): ทำงานร่วมกับทีมได้บางส่วน แต่มีปัญหาในการสื่อสารหรือการมีส่วนร่วม</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถทำงานร่วมกับทีมได้อย่างเหมาะสม</p>"}, {"name": "หลักสูตรปิโตรเคมีและวัสดุศาสตร์", "file": "6. สำนักวิศวกรรมศาสตร์ 6 หลักสูตร\\ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษา-ปิโตรเคมีฯ.docx", "ext": "docx", "html": "<p>หลักสูตรวิศวกรรมปิโตรเคมีและพอลิเมอร์</p>\n<p>ปรับปรุง พ.ศ. 2567</p>\n\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของหลักสูตร (Program Learning Outcomes: PLOs)</h2>\n<h3 class=\"domain-title\">ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO1</span> <span class=\"lo-desc\">ระบุปัญหา กำหนดความสัมพันธ์ อธิบายและแก้ปัญหาทางวิศวกรรมปิโตรเคมีและพอลิเมอร์ที่ซับซ้อนโดยประยุกต์ใช้หลักการทางวิศวกรรมศาสตร์ วิทยาศาสตร์ และคณิตศาสตร์</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO2</span> <span class=\"lo-desc\">ประยุกต์ใช้ความรู้ในการออกแบบทางวิศวกรรมเพื่อพัฒนาคำตอบที่ตรงกับความต้องการของอุตสาหกรรมปิโตรเคมีและพอลิเมอร์ โดยพิจารณาเงื่อนไขด้านสาธารณสุข สวัสดิภาพ ความปลอดภัย วัฒนธรรม เศรษฐกิจ สังคม และสิ่งแวดล้อม</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO3</span> <span class=\"lo-desc\">ประยุกต์ใช้ความรู้ทางสถิติ และการวิเคราะห์คุณสมบัติ ในการตรวจสอบ วินิจฉัย ประเมินผลงานและปัญหาทางวิศวกรรมปิโตรเคมีและพอลิเมอร์</span></div>\n<h3 class=\"domain-title\">ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO4</span> <span class=\"lo-desc\">มีทักษะการสื่อสารภาษาไทยและภาษาอังกฤษ เพื่อใช้ในชีวิตประจำวัน และในการทำงานด้านวิศวกรรมปิโตรเคมีและพอลิเมอร์ ทั้งการฟัง พูด อ่านเขียน และเสนอผลงานได้ตามวัตถุประสงค์ ในกรณีที่่นักศึกษาเลือกภาษาจีน สามารถสื่อสารภาษาจีนในชีวิตประจำวันได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO5</span> <span class=\"lo-desc\">มีความสามารถในการประยุกต์ความรู้ด้านเทคโนโลยีสารสนเทศและอุปกรณ์เครื่องมือทางวิศวกรรมในการทำงานได้อย่างถูกต้องและเหมาะสม</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO6</span> <span class=\"lo-desc\">มีทักษะในการพัฒนาและการทดลองที่เหมาะสม สามารถวิเคราะห์และแปลความหมายข้อมูล และสามารถใช้หลักการตัดสินทางวิศวกรรมในการสรุปผล</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO7</span> <span class=\"lo-desc\">มีทักษะในการสืบค้นและประยุกต์ใช้ความรู้ที่เกี่ยวข้องเพื่อปฏิบัติงานได้และพัฒนาตนเองอย่างต่อเนื่อง</span></div>\n<h3 class=\"domain-title\">ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO8</span> <span class=\"lo-desc\">มีความรับผิดชอบ ความซื่อสัตย์ ความกตัญญู ปฏิบัติตามกฎระเบียบ และตัดสินด้วยข้อมูลที่ผ่านการวิเคราะห์ถึงผลกระทบต่อบริบทของโลก เศรษฐกิจ สังคม และสิ่งแวดล้อม</span></div>\n<h3 class=\"domain-title\">ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO9</span> <span class=\"lo-desc\">ความสามารถในการทำงานเป็นทีมได้ มีภาวะการเป็นผู้นำ มีแนวคิดและปรับตัวภายใต้ความหลากหลายได้ตลอดชีวิต มีร่างกายและจิตใจที่สมบูรณ์ มีจิตอาสา มีแนวคิดเชิงตรรกะ</span></div>\n\n<h2 class=\"section-title\">แบบประเมินผลการปฏิบัติสหกิจศึกษาตามผลลัพธ์การเรียนรู้ที่คาดหวัง</h2>\n\n<h4 class=\"table-marker\">[TABLE 1]</h4>\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษา (Learning Outcome: LO)</h2>\n<h3 class=\"domain-title\">ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">ผู้เรียนสามารถระบุและแก้ปัญหาที่ซับซ้อนในงานวิศวกรรมปิโตรเคมีและพอลิเมอร์ โดยประยุกต์ใช้หลักการทางวิศวกรรมศาสตร์ วิทยาศาสตร์ และคณิตศาสตร์ ในการวิเคราะห์และแก้ไขปัญหาที่เกิดขึ้นในสถานประกอบการ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">ผู้เรียนสามารถประยุกต์ใช้ความรู้ในการออกแบบทางวิศวกรรม การวิเคราะห์เชิงสถิติ และการประเมินคุณสมบัติในการตรวจสอบและแก้ปัญหาในกระบวนการทำงานของสถานประกอบการ โดยคำนึงถึงปัจจัยด้านสาธารณสุข ความปลอดภัย และสิ่งแวดล้อม</span></div>\n<h3 class=\"domain-title\">ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">ผู้เรียนสามารถสื่อสารอย่างมีประสิทธิภาพด้วยภาษาไทยและอังกฤษ ในบริบทการทำงานด้านวิศวกรรม ปิโตรเคมีและพอลิเมอร์ ทั้งการฟัง พูด อ่าน เขียน และนำเสนอผลงานได้อย่างเหมาะสม</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">ผู้เรียนสามารถประยุกต์ใช้เทคโนโลยีสารสนเทศ และเครื่องมือทางวิศวกรรมในการปฏิบัติงานอย่างถูกต้องและเหมาะสม</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">ผู้เรียนสามารถสืบค้นและประยุกต์ใช้ความรู้ใหม่มาพัฒนาทักษะการทดลอง วิเคราะห์ข้อมูล เพื่อพัฒนาตนเองอย่างต่อเนื่องในระหว่างปฏิบัติสหกิจศึกษา</span></div>\n<h3 class=\"domain-title\">ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO6</span> <span class=\"lo-desc\">ผู้เรียนปฏิบัติงานด้วยความรับผิดชอบ ซื่อสัตย์ และตระหนักถึงจริยธรรมวิชาชีพ โดยคำนึงถึงผลกระทบ</span></div>\n<p>ต่อเศรษฐกิจ สังคม และสิ่งแวดล้อม</p>\n<h3 class=\"domain-title\">ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO7</span> <span class=\"lo-desc\">ผู้เรียนสามารถทำงานร่วมกับทีมอย่างมีประสิทธิภาพ ภาวะความเป็นผู้นำ และปรับตัวภายใต้สถานการณ์ที่หลากหลายตามสถานะของตนเองในทีม</span></div>\n\n<h4 class=\"table-marker\">[TABLE 2]</h4>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table\">\n<tr><td>ผลการเรียนรู้ที่คาดหวัง</td><td>ผลการประเมิน</td></tr>\n</table></div>\n<h3 class=\"domain-title\">(1) ด้านความรู้ (Knowledge) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">ผู้เรียนสามารถระบุและแก้ปัญหาที่ซับซ้อนในงานวิศวกรรมปิโตรเคมีและพอลิเมอร์ โดยประยุกต์ใช้หลักการทางวิศวกรรมศาสตร์ วิทยาศาสตร์ และคณิตศาสตร์ ในการวิเคราะห์และแก้ไขปัญหาที่เกิดขึ้นในสถานประกอบการ |   5 (ยอดเยี่ยม): ระบุและแก้ปัญหาที่ซับซ้อนได้อย่างครบถ้วน พร้อมเสนอแนวทางแก้ไขที่สร้างสรรค์ มีประสิทธิภาพสูง และตอบโจทย์ความต้องการของสถานประกอบการได้อย่างสมบูรณ์</span></div>\n<p>  4 (ดีมาก): ระบุและแก้ปัญหาได้ในระดับดี พร้อมเสนอแนวทางแก้ไขที่เหมาะสม แม้จะมีข้อบกพร่องเล็กน้อยแต่ไม่กระทบต่อคุณภาพโดยรวม</p>\n<p>  3 (ดี): ระบุปัญหาและแก้ไขได้ในระดับพื้นฐาน แต่ข้อเสนอแนวทางแก้ไขยังขาดความสมบูรณ์ในบางส่วน</p>\n<p>  2 (พอใช้): ระบุปัญหาได้บางส่วน แต่ไม่สามารถแก้ไขได้อย่างเหมาะสม ต้องการคำแนะนำอย่างใกล้ชิด</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถระบุหรือแก้ปัญหาได้ และไม่มีข้อเสนอแนะแนวทางแก้ไข</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">ผู้เรียนสามารถประยุกต์ใช้ความรู้ในการออกแบบทางวิศวกรรม การวิเคราะห์เชิงสถิติ และการประเมินคุณสมบัติในการตรวจสอบและแก้ปัญหาในกระบวนการทำงานของสถานประกอบการ โดยคำนึงถึงปัจจัยด้านสาธารณสุข ความปลอดภัย และสิ่งแวดล้อม |   5 (ยอดเยี่ยม): ประยุกต์ใช้ความรู้ได้อย่างสมบูรณ์วิเคราะห์ข้อมูลเชิงลึกครอบคลุม แก้ปัญหาได้อย่างเป็นระบบและคิดริเริ่มสร้างสรรค์</span></div>\n<p>  4 (ดีมาก): ประยุกต์ใช้ความรู้ได้ดี วิเคราะห์ข้อมูลถูกต้องเป็นส่วนใหญ่ แก้ปัญหาได้อย่างมีประสิทธิภาพ</p>\n<p>  3 (ดี): ประยุกต์ใช้ความรู้ได้พอใช้ วิเคราะห์ข้อมูลได้ตามเกณฑ์ แก้ปัญหาได้ตามคำแนะนำ</p>\n<p>  2 (พอใช้): ขาดความเชื่อมโยงของความรู้          การวิเคราะห์ยังไม่ครอบคลุม ต้องการคำแนะนำเพิ่มเติม</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถประยุกต์ใช้ความรู้</p>\n<p>ขาดทักษะการวิเคราะห์ ไม่คำนึงถึงปัจจัยสำคัญ</p>\n<h3 class=\"domain-title\">(2) ด้านทักษะ (Skills) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">ผู้เรียนสามารถสื่อสารอย่างมีประสิทธิภาพด้วยภาษาไทยและอังกฤษ ในบริบทการทำงานด้านวิศวกรรม ปิโตรเคมีและพอลิเมอร์ ทั้งการฟัง พูด อ่าน เขียน และนำเสนอผลงานได้อย่างเหมาะสม |   5 (ยอดเยี่ยม): สื่อสารได้ชัดเจน เข้าใจง่าย ใช้ภาษาไทยและภาษาอังกฤษได้อย่างเหมาะสมกับสถานการณ์</span></div>\n<p>  4 (ดีมาก): สื่อสารได้ดีในระดับที่เหมาะสม แม้จะมีข้อผิดพลาดเล็กน้อยที่ไม่กระทบต่อการทำงาน</p>\n<p>  3 (ดี): สื่อสารได้ในระดับพื้นฐาน แต่ยังมีข้อผิดพลาดหรือจุดที่ไม่ชัดเจนในบางสถานการณ์</p>\n<p>  2 (พอใช้): สื่อสารได้บ้าง แต่ยังไม่เหมาะสมกับสถานการณ์หรือมีข้อผิดพลาดที่ส่งผลต่อการทำงาน</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถสื่อสารได้อย่างเหมาะสมในสถานการณ์จริง</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">ผู้เรียนสามารถประยุกต์ใช้เทคโนโลยีสารสนเทศ และเครื่องมือทางวิศวกรรมในการปฏิบัติงานอย่างถูกต้องและเหมาะสม |   5 (ยอดเยี่ยม): ใช้เทคโนโลยีสารสนเทศได้อย่าง</span></div>\n<p>ชำนาญและสร้างสรรค์ เลือกและประยุกต์เครื่องมือได้</p>\n<p>เหมาะสมกับงานอย่างมีประสิทธิภาพสูงสุด</p>\n<p>  4 (ดีมาก): ใช้เทคโนโลยีสารสนเทศได้ดี</p>\n<p>เลือกเครื่องมือถูกต้องแม่นยำ</p>\n<p>มีประสิทธิภาพในการปฏิบัติงาน</p>\n<p>  3 (ดี): ใช้เทคโนโลยีสารสนเทศพื้นฐาน</p>\n<p>เลือกเครื่องมือได้ตามคำแนะนำ</p>\n<p>  2 (พอใช้): ขาดทักษะการใช้เทคโนโลยีสารสนเทศ เลือกเครื่องมือไม่เหมาะสม</p>\n<p>ต้องการคำแนะนำอย่างใกล้ชิด</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถใช้เทคโนโลยีสารสนเทศ เลือกเครื่องมือผิดพลาดบ่อย ขาดความเข้าใจพื้นฐาน</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">ผู้เรียนสามารถสืบค้นและประยุกต์ใช้ความรู้ใหม่มาพัฒนาทักษะการทดลอง วิเคราะห์ข้อมูล เพื่อพัฒนาตนเองอย่างต่อเนื่องในระหว่างปฏิบัติสหกิจศึกษา |   5 (ยอดเยี่ยม): นักศึกษาสามารถสืบค้นองค์ความรู้และเรียนรู้ทักษะใหม่ได้อย่างรวดเร็วและนำไปประยุกต์ใช้ในงานได้อย่างมีประสิทธิภาพ มีการริเริ่มในการศึกษาข้อมูลเพิ่มเติมด้วยตัวเอง และแสดงผลลัพธ์ที่ชัดเจน</span></div>\n<p>  4 (ดีมาก): นักศึกษาสามารถสืบค้นองค์ความรู้และเรียนรู้ทักษะใหม่ได้ดี และสามารถนำไปใช้ในงานได้ในระดับที่เหมาะสม แม้จะมีการปรับปรุงในบางส่วน</p>\n<p>  3 (ดี): นักศึกษาสามารถสืบค้นองค์ความรู้และเรียนรู้ทักษะใหม่ได้ในระดับพื้นฐาน และเริ่มต้นนำไปใช้ในงานบางส่วน แต่ยังขาดความสมบูรณ์</p>\n<p>  2 (พอใช้): นักศึกษาสามารถสืบค้นองค์ความรู้และเรียนรู้ทักษะใหม่ได้ในระดับที่จำกัด และยังไม่สามารถประยุกต์ใช้ได้อย่างเหมาะสม</p>\n<p>  1 (ต้องปรับปรุง): นักศึกษาไม่สามารถสืบค้นองค์ความรู้และเรียนรู้ทักษะใหม่ได้ด้วยตนเอง และขาดความพยายามในการพัฒนาตนเอง</p>\n<h3 class=\"domain-title\">(3) ด้านจริยธรรม (Ethics) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO6</span> <span class=\"lo-desc\">ผู้เรียนปฏิบัติงานด้วยความรับผิดชอบ ซื่อสัตย์ และตระหนักถึงจริยธรรมวิชาชีพ โดยคำนึงถึงผลกระทบต่อเศรษฐกิจ สังคม และสิ่งแวดล้อม |   5 (ยอดเยี่ยม): ปฏิบัติตามกฎระเบียบทุกข้ออย่างเคร่งครัด พร้อมแสดงความซื่อสัตย์และความรับผิดชอบอย่างชัดเจน</span></div>\n<p>  4 (ดีมาก): ปฏิบัติตามกฎระเบียบส่วนใหญ่ และแสดงความรับผิดชอบในงานได้ดี แม้จะมีข้อผิดพลาดเล็กน้อย</p>\n<p>  3 (ดี): ปฏิบัติตามกฎระเบียบได้ในระดับพื้นฐาน แต่ยังต้องการการปรับปรุงในบางส่วน</p>\n<p>  2 (พอใช้): ปฏิบัติตามกฎระเบียบได้เพียงบางข้อ และยังมีการละเลยหรือผิดพลาดบ้าง</p>\n<p>  1 (ต้องปรับปรุง): ไม่ปฏิบัติตามกฎระเบียบ และแสดงถึงความขาดความรับผิดชอบในงาน</p>\n<h3 class=\"domain-title\">(4) ด้านลักษณะบุคคล (Character) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO7</span> <span class=\"lo-desc\">ผู้เรียนสามารถทำงานร่วมกับทีมอย่างมีประสิทธิภาพ ภาวะความเป็นผู้นำ และปรับตัวภายใต้สถานการณ์ที่หลากหลายตามสถานะของตนเองในทีม |   5 (ยอดเยี่ยม): มีบทบาทสำคัญในทีม ช่วยสร้างสภาพแวดล้อมการทำงานที่ดี และแสดงภาวะผู้นำได้อย่างชัดเจน</span></div>\n<p>  4 (ดีมาก): ทำงานร่วมกับทีมได้ดีในระดับที่เหมาะสม และปฏิบัติงานตามบทบาทที่ได้รับอย่างสมบูรณ์</p>\n<p>  3 (ดี): ทำงานร่วมกับทีมได้ในระดับพื้นฐาน แต่ยังต้องปรับปรุงในบางด้าน</p>\n<p>  2 (พอใช้): ทำงานร่วมกับทีมได้บางส่วน แต่มีปัญหาในการสื่อสารหรือการมีส่วนร่วม</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถทำงานร่วมกับทีมได้อย่างเหมาะสม</p>"}, {"name": "หลักสูตรวิศวกรรมเคมี", "file": "6. สำนักวิศวกรรมศาสตร์ 6 หลักสูตร\\ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษา-วิศวกรรมเคมีฯ.docx", "ext": "docx", "html": "<p>รายวิชา CPE67-493 สหกิจศึกษา</p>\n<p>หลักสูตรวิศวกรรมเคมีและเคมีเภสัชกรรม</p>\n<p>ปรับปรุง พ.ศ. 2567</p>\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของหลักสูตร (Program Learning Outcomes: PLOs</h2>\n<h3 class=\"domain-title\">ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO1</span> <span class=\"lo-desc\">สามารถอธิบายและประยุกต์ใช้ความรู้ทาง วิทยาศาสตร์ คณิตศาสตร์และสถิติเพื่อแก้ปัญหาทางด้านวิศวกรรมเคมีและเคมีเภสัชกรรม</span></div>\n<h3 class=\"domain-title\">ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO2</span> <span class=\"lo-desc\">สามารถเลือกใช้เครื่องมือและเทคโนโลยีสารสนเทศที่เหมาะสมในการสืบค้นข้อมูลและความรู้ใหม่ เพื่อประยุกต์ใช้ในงานวิศวกรรมเคมีและเคมีเภสัชกรรม</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO3</span> <span class=\"lo-desc\">สามารถเขียนแบบทางวิศวกรรม ออกแบบและควบคุมการทำงานของหน่วยปฏิบัติการและกระบวนการผลิต</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO4</span> <span class=\"lo-desc\">สามารถประยุกต์ใช้ความรู้พื้นฐานทางวิศวกรรมเพื่อวิเคราะห์และแก้ปัญหาทางวิศวกรรมเคมีและเคมีเภสัชกรรมโดยคำนึงถึงความปลอดภัย เศรษฐศาสตร์ การบริหารงานวิศวกรรม และผลกระทบทางสิ่งแวดล้อมและพลังงาน</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO5</span> <span class=\"lo-desc\">สามารถดูแลสุขภาพทางกายและจิตใจ และปรับตัวให้สอดคล้องกับสถานการณ์ทางสังคม สิ่งแวดล้อมที่มีการเปลี่ยนแปลง</span></div>\n<h3 class=\"domain-title\">ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO6</span> <span class=\"lo-desc\">มีจรรยาบรรณและปฏิบัติตนตามหลักวิชาชีพ</span></div>\n<h3 class=\"domain-title\">ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO7</span> <span class=\"lo-desc\">สามารถติดต่อสื่อสารทั้งภาษาไทยและภาษาอังกฤษ และทำงานร่วมกับผู้อื่นได้ ในกรณีที่นักศึกษาเลือกภาษาจีนสามารถติดต่อสื่อสารภาษาจีน</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO8</span> <span class=\"lo-desc\">แสวงหาความรู้ใหม่เพื่อประยุกต์ใช้กับงานทางด้านวิศวกรรมเคมีและเคมีเภสัชกรรม</span></div>\n\n<h2 class=\"section-title\">แบบประเมินผลการปฏิบัติสหกิจศึกษาตามผลลัพธ์การเรียนรู้ที่คาดหวัง</h2>\n\n<h4 class=\"table-marker\">[TABLE 1]</h4>\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษา (Learning Outcome: LO)</h2>\n<h3 class=\"domain-title\">ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">ผู้เรียนสามารถระบุและแก้ปัญหาที่ซับซ้อนในงานที่ได้รับมอบหมายในสถานประกอบการ โดยประยุกต์ใข้ความรู้ทาง วิทยาศาสตร์ คณิตศาสตร์และสถิติได้อย่างเหมาะสม</span></div>\n\n<h3 class=\"domain-title\">ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">ผู้เรียนสามารถเลือกใช้เครื่องมือและเทคโนโลยีสารสนเทศที่เหมาะสมในการสืบค้นข้อมูลและความรู้ใหม่ สามารถรวบรวม วิเคราะห์ และสังเคราะห์ข้อมูล เพื่อหาข้อสรุปในการปฏิบัติงานในสถานประกอบการได้</span></div>\n\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">ผู้เรียนอ่านและเขียนแบบทางวิศวกรรม เข้าใจหลักการทำงานของอุปกรณ์และกระบวนการการผลิตที่เกี่ยวข้องกับงานที่ได้รับมอบหมายจากสถานประกอบสหกิจศึกษาได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">ผู้เรียนสามารถประยุกต์ใช้ความรู้พื้นฐานทางวิศวกรรมเพื่อวิเคราะห์และแก้ปัญหาทางวิศวกรรมเคมีและเคมีเภสัชกรรมโดยคำนึงถึงความปลอดภัย เศรษฐศาสตร์ การบริหารงานวิศวกรรม และผลกระทบทางสิ่งแวดล้อมและพลังงาน ในการปฏิบัติงานสหกิจศึกษาได้อย่างเหมาะสม</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">ผู้เรียนสามารถดูแลสุขภาพทางกายและจิตใจ และปรับตัวให้สอดคล้องกับสถานการณ์ทางสังคมและ สิ่งแวดล้อมที่มีการเปลี่ยนแปลงในสถานประกอบสหกิจศึกษาได้</span></div>\n\n<h3 class=\"domain-title\">ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO6</span> <span class=\"lo-desc\">ผู้เรียนสามารถปฏิบัติงานด้วยความรับผิดชอบและคำนึงถึงจริยธรรมและหลักวิชาชีพ</span></div>\n\n<h3 class=\"domain-title\">ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO7</span> <span class=\"lo-desc\">ผู้เรียนสามารถติดต่อสื่อสารทั้งภาษาไทยและภาษาอังกฤษ และทำงานร่วมกับผู้อื่นได้ในการปฏิบัติงานสหกิจศึกษาได้อย่างมีประสิทธิภาพ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO8</span> <span class=\"lo-desc\">ผู้เรียนสามารถแสวงหาความรู้ใหม่ที่ได้จากการปฏิบัติงานสหกิจศึกษาได้</span></div>\n\n<h4 class=\"table-marker\">[TABLE 2]</h4>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table\">\n<tr><td>ผลการเรียนรู้ที่คาดหวัง</td><td>ผลการประเมิน</td></tr>\n</table></div>\n<h3 class=\"domain-title\">(1) ด้านความรู้ (Knowledge) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">ผู้เรียนสามารถระบุและแก้ปัญหาที่ซับซ้อนในงานที่ได้รับมอบหมายในสถานประกอบการ โดยประยุกต์ใข้ความรู้ทาง วิทยาศาสตร์ คณิตศาสตร์และสถิติได้อย่างเหมาะสม |   5 (ยอดเยี่ยม): ระบุและแก้ปัญหาที่ซับซ้อนได้อย่างครบถ้วน เสนอแนวทางแก้ไขที่สร้างสรรค์ สามารถสร้างนวัตกรรมการทำงานหรือแนวปฏิบัติที่ดีที่นำไปสู่การใช้งานได้จริง</span></div>\n<p>  4 (ดีมาก): ระบุและแก้ปัญหาได้ในระดับดี พร้อมเสนอแนวทางแก้ไขที่เหมาะสม</p>\n<p>  3 (ดี): ระบุปัญหาและแก้ไขได้ในระดับพื้นฐาน เสนอแนะข้อเสนอแนวทางแก้ไขได้แต่ยังขาดความสมบูรณ์ในบางส่วน</p>\n<p>  2 (พอใช้): ระบุปัญหาได้ แต่ไม่สามารถแก้ไขได้อย่างเหมาะสม ต้องการคำแนะนำ</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถระบุหรือแก้ปัญหาได้ และไม่มีข้อเสนอแนะแนวทางแก้ไข</p>\n<h3 class=\"domain-title\">(2) ด้านทักษะ (Skills) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">ผู้เรียนสามารถเลือกใช้เครื่องมือและเทคโนโลยีสารสนเทศที่เหมาะสมในการสืบค้นข้อมูลและความรู้ใหม่ สามารถรวบรวม วิเคราะห์ และสังเคราะห์ข้อมูล เพื่อหาข้อสรุปในการปฏิบัติงานในสถานประกอบการได้ |   5 (ยอดเยี่ยม): เลือกใช้เครื่องมือและเทคโนโลยีสารสนเทศในการรวมเรม วิเคราะห์ และ สังเคราะห์ข้อมูลได้อย่างถูกต้อง ครบถ้วน พร้อมข้อสรุปที่นวัตกรรมหรือการนำไปใช้ได้จริงเป็นรูปธรรม</span></div>\n<p>  4 (ดีมาก): รวบรวม วิเคราะห์ข้อมูลได้ดีในระดับที่เหมาะสม สังเคราะห์ข้อมูลพร้อมข้อสรุปที่เป็นประโยชน์ได้แต่ยังขาดความสมบูณ์ในบางองค์ประกอบ</p>\n<p>  3 (ดี): วิเคราะห์ข้อมูลได้ในระดับพื้นฐาน</p>\n<p>  2 (พอใช้): วิเคราะห์ข้อมูลได้เพียงบางส่วน และข้อสรุปยังไม่ชัดเจน ต้องการคำแนะนำ</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถรวบรวม วิเคราะห์และสังเคราะห์ข้อมูลได้</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">ผู้เรียนอ่านและเขียนแบบทางวิศวกรรม เข้าใจหลักการทำงานของอุปกรณ์และกระบวนการการผลิตที่เกี่ยวข้องกับงานที่ได้รับมอบหมายจากสถานประกอบสหกิจศึกษาได้ |   5 (ยอดเยี่ยม): สามารถอ่านและเขียนแบบทางวิศวกรรม เข้าใจกระบวนการงานที่ได้รับมอบหมาย นำเสนอแนวทางในการปรับปรุงกระบวนการ สร้างสรรค์งานใหม่ได้</span></div>\n<p>  4 (ดีมาก): สามารถอ่านและเขียนแบบทางวิศวกรรม เข้าใจกระบวนการงานที่ได้รับมอบหมาย  นำเสนอแนวทางในการปรับปรุงกระบวนการ</p>\n<p>  3 (ดี): สามารถอ่านและเขียนแบบทางวิศวกรรม เข้าใจกระบวนการงานที่ได้รับมอบหมายในระดับพื้นฐาน</p>\n<p>  2 (พอใช้): สามารถอ่านและเขียนแบบทางวิศวกรรม เข้าใจกระบวนการงานที่ได้รับมอบหมายได้บ้าง แต่ยังอาจพบข้อผิดพลาดบ้าง</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถสามารถอ่านและเขียนแบบทางวิศวกรรม ไม่สามารถทำความเข้าใจกระบวนการงานที่ได้รับมอบหมายได้ในสถานการณ์จริง</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">ผู้เรียนสามารถประยุกต์ใช้ความรู้พื้นฐานทางวิศวกรรมเพื่อวิเคราะห์และแก้ปัญหาทางวิศวกรรมเคมีและเคมีเภสัชกรรมโดยคำนึงถึงความปลอดภัย เศรษฐศาสตร์ การบริหารงานวิศวกรรม และผลกระทบทางสิ่งแวดล้อมและพลังงาน ในการปฏิบัติงานสหกิจศึกษาได้อย่างเหมาะสม |   5 (ยอดเยี่ยม): สามารถประยุกต์ใช้ความรู้พื้นฐานทางวิศวกรรมเคมีและเคมีเภสัชกรรมเพื่อวิเคราะห์และแก้ปัญหาโดยคำนึงถึงความปลอดภัย เศรษฐศาสตร์ การบริหารงานวิศวกรรม และผลกระทบทางสิ่งแวดล้อมและพลังงานได้อย่างมีประสิทธิภาพ นำไปสู่นวัตกรรมและการปรับปรุงประสิทธิภาพของระบบงาน สร้างแนวปฏิบัติที่ดีที่ชัดเจนเป็นรูปธรรม</span></div>\n<p>  4 (ดีมาก): สามารถประยุกต์ใช้ความรู้พื้นฐานทางวิศวกรรมเคมีและเคมีเภสัชกรรมเพื่อวิเคราะห์และแก้ปัญหาโดยคำนึงถึงความปลอดภัย เศรษฐศาสตร์ การบริหารงานวิศวกรรม และผลกระทบทางสิ่งแวดล้อมและพลังงานได้อย่างเหมาะสม มีข้อเสนอแนะที่นำไปสู่การปรับปรุงประสิทธิภาพของระบบงาน</p>\n<p>  3 (ดี): สามารถประยุกต์ใช้ความรู้พื้นฐานทางวิศวกรรมเคมีและเคมีเภสัชกรรมเพื่อวิเคราะห์และแก้ปัญหาได้อย่างเหมาะสม</p>\n<p>  2 (พอใช้): สามารถประยุกต์ใช้ความรู้พื้นฐานทางวิศวกรรมเคมีและเคมีเภสัชกรรมเพื่อวิเคราะห์และแก้ปัญหาได้ในระดับที่จำกัด</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถประยุกต์ใช้ความรู้พื้นฐานทางวิศวกรรมเคมีและเคมีเภสัชกรรมเพื่อวิเคราะห์และแก้ปัญหาในการปฏิบัติงานสหกิจศึกษาได้</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">ผู้เรียนสามารถดูแลสุขภาพทางกายและจิตใจ และปรับตัวให้สอดคล้องกับสถานการณ์ทางสังคมและ สิ่งแวดล้อมที่มีการเปลี่ยนแปลงในสถานประกอบสหกิจศึกษาได้ |   5 (ยอดเยี่ยม): ดูแลสุขภาพทางกายและจิตใจ และปรับตัวให้สอดคล้องกับสถานการณ์ทางสังคมและ สิ่งแวดล้อมที่มีการเปลี่ยนแปลงในสถานประกอบสหกิจศึกษาได้อย่างดีเยี่ยม สร้างแนวปฏิบัติที่ดีที่ผู้อื่นนำไปประยุกต์ใช้ได้</span></div>\n<p>  4 (ดีมาก): ดูแลสุขภาพทางกายและจิตใจ และปรับตัวให้สอดคล้องกับสถานการณ์ทางสังคมและ สิ่งแวดล้อมที่มีการเปลี่ยนแปลงในสถานประกอบสหกิจศึกษาได้อย่างดี</p>\n<p>  3 (ดี): ดูแลสุขภาพทางกายและจิตใจ และปรับตัวให้สอดคล้องกับสถานการณ์ทางสังคมและ สิ่งแวดล้อมที่มีการเปลี่ยนแปลงในสถานประกอบสหกิจศึกษาได้อย่างเหมาะสม</p>\n<p>  2 (พอใช้): ดูแลสุขภาพทางกายและจิตใจ และปรับตัวให้สอดคล้องกับสถานการณ์ทางสังคมและ สิ่งแวดล้อมที่มีการเปลี่ยนแปลงในสถานประกอบสหกิจศึกษาได้อย่างในระดับที่จำกัด ต้องการการปรึกษาดูแลบ้าง</p>\n<p>  1 (ต้องปรับปรุง): ไม่ดูแลสุขภาพทางกายและจิตใจ และปรับตัวให้สอดคล้องกับสถานการณ์ทางสังคมและ สิ่งแวดล้อมที่มีการเปลี่ยนแปลงในสถานประกอบสหกิจศึกษาได้ ต้องการการดูแลอย่างใกล้ชิด</p>\n<h3 class=\"domain-title\">(3) ด้านจริยธรรม (Ethics) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO6</span> <span class=\"lo-desc\">ผู้เรียนสามารถปฏิบัติงานด้วยความรับผิดชอบและคำนึงถึงจริยธรรมและหลักวิชาชีพ |   5 (ยอดเยี่ยม): ปฏิบัติตามกฎระเบียบทุกข้ออย่างเคร่งครัด พร้อมแสดงความซื่อสัตย์และความรับผิดชอบเป็นที่ประจักษ์</span></div>\n<p>  4 (ดีมาก): ปฏิบัติตามกฎระเบียบ มีความรับผิดชอบในงาน พบข้อผิดพลาดเล็กน้อย</p>\n<p>  3 (ดี): ปฏิบัติตามกฎระเบียบและแสดงความรับผิดชอบในงานได้ในระดับพื้นฐาน แต่ยังต้องการการปรับปรุงในบางส่วน</p>\n<p>  2 (พอใช้): ปฏิบัติตามกฎระเบียบได้เพียงบางข้อ และยังมีการละเลยหรือผิดพลาดบ้าง</p>\n<p>  1 (ต้องปรับปรุง): ไม่ปฏิบัติตามกฎระเบียบ และแสดงถึงความขาดความรับผิดชอบในงาน</p>\n<h3 class=\"domain-title\">(4) ด้านลักษณะบุคคล (Character) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO6</span> <span class=\"lo-desc\">ผู้เรียนสามารถติดต่อสื่อสารทั้งภาษาไทยและภาษาอังกฤษ และทำงานร่วมกับผู้อื่นได้ในการปฏิบัติงานสหกิจศึกษาได้อย่างมีประสิทธิภาพ |   5 (ยอดเยี่ยม): มีบทบาทสำคัญในทีม ช่วยสร้างสภาพแวดล้อมการทำงานที่ดี และแสดงภาวะผู้นำได้อย่างชัดเจน</span></div>\n<p>  4 (ดีมาก): ทำงานร่วมกับทีมได้ดีในระดับที่เหมาะสม และปฏิบัติงานตามบทบาทที่ได้รับอย่างสมบูรณ์</p>\n<p>  3 (ดี): ทำงานร่วมกับทีมได้ในระดับพื้นฐาน แต่ยังต้องปรับปรุงในบางด้าน</p>\n<p>  2 (พอใช้): ทำงานร่วมกับทีมได้บางส่วน แต่มีปัญหาในการสื่อสารหรือการมีส่วนร่วม</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถทำงานร่วมกับทีมได้อย่างเหมาะสม</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO8</span> <span class=\"lo-desc\">ผู้เรียนสามารถแสวงหาความรู้ใหม่ที่ได้จากการปฏิบัติงานสหกิจศึกษาได้ |   5 (ยอดเยี่ยม): แสวงหาความรู้ใหม่เพื่อสนับสนุนการปฏิบัติงานสหกิจศึกษาได้เป็นอย่างดี สังเคราะห์ความรู้ใหม่จากการปฏิบัติงานสหกิจศึกษาได้โดยรวบรวมและนำเสนอองค์ความรู้ใหม่ได้อย่างครบถ้วนและเป็นระบบ</span></div>\n<p>  4 (ดีมาก): แสวงหาความรู้ใหม่เพื่อสนับสนุนการปฏิบัติงานสหกิจศึกษาได้เป็นอย่างดี รวบรวมและนำเสนอองค์ความรู้ใหม่ได้</p>\n<p>  3 (ดี): แสวงหา รวบรวม และนำเสนอองค์ความรู้ใหม่ได้ แต่ยังขาดความสมบูรณ์บางประเด็น</p>\n<p>  2 (พอใช้): แสวงหา รวบรวม และนำเสนอองค์ความรู้ใหม่ได้อย่างมีขีดจำกัด ต้องการคำแนะนำชี้แนะ</p>\n<p>  1 (ต้องปรับปรุง): ไม่แสวงหาความรู้ใหม่เพื่อสนับสนุนการปฏิบัติงานสหกิจศึกษาได้</p>"}, {"name": "หลักสูตรวิศวกรรมเครื่องกล", "file": "6. สำนักวิศวกรรมศาสตร์ 6 หลักสูตร\\ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษา-วิศวกรรมเครื่องกลฯ.docx", "ext": "docx", "html": "<p>หลักสูตรวิศวกรรมศาสตรบัณฑิต สาขาวิศวกรรมเครื่องกลและหุ่นยนต์</p>\n<p>หลักสูตรปรับปรุง พ.ศ. 2567</p>\n\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของหลักสูตร (Program Learning Outcomes: PLOs)</h2>\n<h3 class=\"domain-title\">ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO1</span> <span class=\"lo-desc\">อธิบายความรู้ทางวิทยาศาสตร์ คณิตศาสตร์ สังคมศาสตร์ มนุษยศาสตร์ เทคโนโลยีสารสนเทศ พื้นฐานทางวิศวกรรม และความรู้เฉพาะทางวิศวกรรม</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO2</span> <span class=\"lo-desc\">ประยุกต์ใช้ความรู้ด้านวิศวกรรมเครื่องกล หุ่นยนต์ และระบบควบคุมอัตโนมัติ เพื่อออกแบบและสร้างแบบจำลองเบื้องต้น</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO3</span> <span class=\"lo-desc\">ประยุกต์ใช้ความรู้ในการวิเคราะห์ด้านเศรษฐศาสตร์ การลงทุน และการบริหารงานวิศวกรรม เพื่อเตรียมความพร้อมสำหรับการเป็นผู้ประกอบการ</span></div>\n<h3 class=\"domain-title\">ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO4</span> <span class=\"lo-desc\">มีทักษะการออกแบบด้านวิศวกรรมเครื่องกล หุ่นยนต์ และระบบควบคุมอัตโนมัติ โดยคำนึงถึงความปลอดภัย เศรษฐศาสตร์ การบริหารงานทางวิศวกรรม ผลกระทบทางสิ่งแวดล้อม และพลังงาน</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO5</span> <span class=\"lo-desc\">มีทักษะเลือกใช้เครื่องมือทางวิศวกรรมและเทคโนโลยีสารสนเทศที่เหมาะสม เพื่อสร้างสรรค์นวัตกรรมด้านวิศวกรรมเครื่องกล หุ่นยนต์ และระบบควบคุมอัตโนมัติ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO6</span> <span class=\"lo-desc\">มีทักษะการสื่อสารภาษาไทยและภาษาอังกฤษ เพื่อใช้ในชีวิตประจำวันและในการทำงานด้านวิศวกรรมเครื่องกล หุ่นยนต์ และระบบควบคุมอัตโนมัติ ทั้งการฟัง พูด อ่าน เขียน และเสนอผลงานได้ตามวัตถุประสงค์ ในกรณีที่นักศึกษาเลือกภาษาจีนสามารถสื่อสารภาษาจีนในชีวิตประจำวันได้</span></div>\n<h3 class=\"domain-title\">ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO7</span> <span class=\"lo-desc\">ซื่อสัตย์สุจริต รับผิดชอบ กตัญญู ปฏิบัติตนตามกฎกติกาของสังคมและจรรยาบรรณแห่งวิชาชีพตามกรอบมาตรฐานการปฏิบัติวิชาชีพวิศวกรรมเครื่องกลและหุ่นยนต์</span></div>\n<h3 class=\"domain-title\">ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO8</span> <span class=\"lo-desc\">สามารถดูแลสุขภาพร่างกายและจิตใจให้พร้อมต่อสิ่งแวดล้อมและสถานการณ์ที่มีการเปลี่ยนแปลง มีภาวะผู้นำ จิตอาสา มีวินัย และทำงานร่วมกับผู้อื่นในสหสาขาวิชาได้อย่างมีประสิทธิภาพ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO9</span> <span class=\"lo-desc\">พัฒนาตนเองและแสวงหาความรู้ใหม่ เพื่อประยุกต์ใช้กับงานทางด้านวิศวกรรมเครื่องกลและหุ่นยนต์</span></div>\n\n<h2 class=\"section-title\">แบบประเมินผลการปฏิบัติสหกิจศึกษาตามผลลัพธ์การเรียนรู้ที่คาดหวัง</h2>\n\n<h4 class=\"table-marker\">[TABLE 1]</h4>\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษา (Learning Outcome: LO)</h2>\n<h3 class=\"domain-title\">ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">ผู้เรียนสามารถระบุและแก้ปัญหาที่ซับซ้อนในงานที่ได้รับมอบหมายในสถานประกอบการ โดยประยุกต์หลักการทางด้านการออกแบบ การสร้างแบบจำลอง การลงทุน และการบริหารงานวิศวกรรมได้อย่างเหมาะสม</span></div>\n\n<h3 class=\"domain-title\">ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">ผู้เรียนสามารถออกแบบด้านวิศวกรรมที่ถูกต้องในสถานประกอบการ เพื่อสร้างสรรค์ผลงานที่เป็นประโยชน์</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">ผู้เรียนสามารถเลือกใช้เครื่องมือทางวิศวกรรมและเทคโนโลยีสารสนเทศที่เหมาะสมในสถานประกอบการ เพื่อการแก้ปัญหาได้อย่างถูกต้อง</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">ผู้เรียนสามารถสื่อสารกับเพื่อนร่วมงานและบุคคลในสถานประกอบการด้วยภาษาไทยและภาษาอังกฤษได้อย่างเหมาะสม เพื่อให้การทำงานสำเร็จลุล่วงตามเป้าหมาย</span></div>\n\n<h3 class=\"domain-title\">ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">ผู้เรียนสามารถปฏิบัติงานด้วยความรับผิดชอบและคำนึงถึงจริยธรรมในวิชาชีพ โดยพิจารณาผลกระทบต่อเศรษฐกิจ สังคม และสิ่งแวดล้อม</span></div>\n\n<h3 class=\"domain-title\">ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO6</span> <span class=\"lo-desc\">ผู้เรียนสามารถทำงานร่วมกับทีม ได้อย่างมีประสิทธิภาพ พร้อมทั้งแสดงบทบาทความเป็นผู้นำและการร่วมมือที่ดีตามสถานะของตนเองในทีม</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO7</span> <span class=\"lo-desc\">ผู้เรียนสามารถเรียนรู้และพัฒนาทักษะใหม่ที่เกี่ยวข้องกับงานในสถานประกอบการด้วยตนเอง</span></div>\n\n<h4 class=\"table-marker\">[TABLE 2]</h4>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table\">\n<tr><td>ผลการเรียนรู้ที่คาดหวัง</td><td>ผลการประเมิน</td></tr>\n</table></div>\n<h3 class=\"domain-title\">(1) ด้านความรู้ (Knowledge) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">ผู้เรียนสามารถระบุและแก้ปัญหาที่ซับซ้อนในงานที่ได้รับมอบหมายในสถานประกอบการ โดยประยุกต์หลักการทางด้านการออกแบบ การสร้างแบบจำลอง การลงทุน และการบริหารงานวิศวกรรมได้อย่างเหมาะสม |   5 (ยอดเยี่ยม): ระบุและแก้ปัญหาที่ซับซ้อนได้อย่างครบถ้วน พร้อมเสนอแนวทางแก้ไขที่สร้างสรรค์ มีประสิทธิภาพสูง และตอบโจทย์ความต้องการของสถานประกอบการได้อย่างสมบูรณ์</span></div>\n<p>  4 (ดีมาก): ระบุและแก้ปัญหาได้ในระดับดี พร้อมเสนอแนวทางแก้ไขที่เหมาะสม แม้จะมีข้อบกพร่องเล็กน้อยแต่ไม่กระทบต่อคุณภาพโดยรวม</p>\n<p>  3 (ดี): ระบุปัญหาและแก้ไขได้ในระดับพื้นฐาน แต่ข้อเสนอแนวทางแก้ไขยังขาดความสมบูรณ์ในบางส่วน</p>\n<p>  2 (พอใช้): ระบุปัญหาได้บางส่วน แต่ไม่สามารถแก้ไขได้อย่างเหมาะสม ต้องการคำแนะนำอย่างใกล้ชิด</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถระบุหรือแก้ปัญหาได้ และไม่มีข้อเสนอแนะแนวทางแก้ไข</p>\n<h3 class=\"domain-title\">(2) ด้านทักษะ (Skills) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">ผู้เรียนสามารถออกแบบด้านวิศวกรรมที่ถูกต้องในสถานประกอบการ เพื่อสร้างสรรค์ผลงานที่เป็นประโยชน์ |   5 (ยอดเยี่ยม): ออกแบบด้านวิศวกรรมได้อย่างถูกต้อง ครบถ้วน และแปลผลได้ชัดเจน พร้อมข้อสรุปที่นำไปใช้ได้จริง</span></div>\n<p>  4 (ดีมาก): ออกแบบด้านวิศวกรรมได้ดีในระดับที่เหมาะสม พร้อมข้อสรุปที่เป็นประโยชน์ แม้จะมีข้อผิดพลาดเล็กน้อย</p>\n<p>  3 (ดี): ออกแบบด้านวิศวกรรมได้ในระดับพื้นฐาน แต่ข้อสรุปยังขาดความชัดเจนและสมบูรณ์ในบางส่วน</p>\n<p>  2 (พอใช้): ออกแบบด้านวิศวกรรมได้เพียงบางส่วน และข้อสรุปยังไม่ชัดเจน ต้องการคำแนะนำเพิ่มเติม</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถออกแบบด้านวิศวกรรมหรือแปลผลได้</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">ผู้เรียนสามารถเลือกใช้เครื่องมือทางวิศวกรรมและเทคโนโลยีสารสนเทศที่เหมาะสมในสถานประกอบการ เพื่อการแก้ปัญหาได้อย่างถูกต้อง |   5 (ยอดเยี่ยม): เลือกใช้เครื่องมือทางวิศวกรรมและเทคโนโลยีสารสนเทศได้อย่างถูกต้อง และสามารถแก้ปัญหาได้อย่างถูกต้อง</span></div>\n<p>  4 (ดีมาก): เลือกใช้เครื่องมือทางวิศวกรรมและเทคโนโลยีสารสนเทศได้ดีในระดับที่เหมาะสม แม้จะมีข้อผิดพลาดเล็กน้อยแต่ไม่กระทบต่อการทำงาน</p>\n<p>  3 (ดี): เลือกใช้เครื่องมือทางวิศวกรรมและเทคโนโลยีสารสนเทศได้ในระดับพื้นฐาน แต่ยังมีข้อผิดพลาดหรือยังไม่เหมาะสมในบางสถานการณ์</p>\n<p>  2 (พอใช้): เลือกใช้เครื่องมือทางวิศวกรรมและเทคโนโลยีสารสนเทศได้บ้าง แต่ยังไม่เหมาะสมกับสถานการณ์หรือมีข้อผิดพลาดที่ส่งผลต่อการทำงาน</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถเลือกใช้เครื่องมือทางวิศวกรรมและเทคโนโลยีสารสนเทศเพื่อการแก้ปัญหาได้เลย</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">ผู้เรียนสามารถสื่อสารกับเพื่อนร่วมงานและบุคคลในสถานประกอบการด้วยภาษาไทยและภาษาอังกฤษได้ |   5 (ยอดเยี่ยม): สื่อสารได้ชัดเจน เข้าใจง่าย ใช้ภาษาไทยและภาษาอังกฤษได้อย่างเหมาะสมกับสถานการณ์</span></div>\n<p>  4 (ดีมาก): สื่อสารได้ดีในระดับที่เหมาะสม แม้จะมีข้อผิดพลาดเล็กน้อยที่ไม่กระทบต่อการทำงาน</p>\n<p>  3 (ดี): สื่อสารได้ในระดับพื้นฐาน แต่ยังมีข้อผิดพลาดหรือจุดที่ไม่ชัดเจนในบางสถานการณ์</p>\n<p>  2 (พอใช้): สื่อสารได้บ้าง แต่ยังไม่เหมาะสมกับสถานการณ์หรือมีข้อผิดพลาดที่ส่งผลต่อการทำงาน</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถสื่อสารได้อย่างเหมาะสมในสถานการณ์จริง</p>\n<h3 class=\"domain-title\">(3) ด้านจริยธรรม (Ethics) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">ผู้เรียนสามารถปฏิบัติงานด้วยความรับผิดชอบและคำนึงถึงจริยธรรมในวิชาชีพ |   5 (ยอดเยี่ยม): ปฏิบัติตามกฎระเบียบทุกข้ออย่างเคร่งครัด พร้อมแสดงความซื่อสัตย์และความรับผิดชอบอย่างชัดเจน</span></div>\n<p>  4 (ดีมาก): ปฏิบัติตามกฎระเบียบส่วนใหญ่ และแสดงความรับผิดชอบในงานได้ดี แม้จะมีข้อผิดพลาดเล็กน้อย</p>\n<p>  3 (ดี): ปฏิบัติตามกฎระเบียบได้ในระดับพื้นฐาน แต่ยังต้องการการปรับปรุงในบางส่วน</p>\n<p>  2 (พอใช้): ปฏิบัติตามกฎระเบียบได้เพียงบางข้อ และยังมีการละเลยหรือผิดพลาดบ้าง</p>\n<p>  1 (ต้องปรับปรุง): ไม่ปฏิบัติตามกฎระเบียบ และแสดงถึงความขาดความรับผิดชอบในงาน</p>\n<h3 class=\"domain-title\">(4) ด้านลักษณะบุคคล (Character) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO6</span> <span class=\"lo-desc\">ผู้เรียนสามารถทำงานร่วมกับทีม ได้อย่างมีประสิทธิภาพ พร้อมทั้งแสดงบทบาทความเป็นผู้นำและการร่วมมือที่ดี |   5 (ยอดเยี่ยม): มีบทบาทสำคัญในทีม ช่วยสร้างสภาพแวดล้อมการทำงานที่ดี และแสดงภาวะผู้นำได้อย่างชัดเจน</span></div>\n<p>  4 (ดีมาก): ทำงานร่วมกับทีมได้ดีในระดับที่เหมาะสม และปฏิบัติงานตามบทบาทที่ได้รับอย่างสมบูรณ์</p>\n<p>  3 (ดี): ทำงานร่วมกับทีมได้ในระดับพื้นฐาน แต่ยังต้องปรับปรุงในบางด้าน</p>\n<p>  2 (พอใช้): ทำงานร่วมกับทีมได้บางส่วน แต่มีปัญหาในการสื่อสารหรือการมีส่วนร่วม</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถทำงานร่วมกับทีมได้อย่างเหมาะสม</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO7</span> <span class=\"lo-desc\">ผู้เรียนสามารถเรียนรู้และพัฒนาทักษะใหม่ที่เกี่ยวข้องกับงานในสถานประกอบการด้วยตนเอง |   5 (ยอดเยี่ยม): นักศึกษาสามารถเรียนรู้ทักษะใหม่ได้อย่างรวดเร็วและนำไปประยุกต์ใช้ในงานได้อย่างมีประสิทธิภาพ มีการริเริ่มในการศึกษาข้อมูลเพิ่มเติมด้วยตัวเอง และแสดงผลลัพธ์ที่ชัดเจน</span></div>\n<p>  4 (ดีมาก): นักศึกษาสามารถเรียนรู้ทักษะใหม่ได้ดี และสามารถนำไปใช้ในงานได้ในระดับที่เหมาะสม แม้จะมีการปรับปรุงในบางส่วน</p>\n<p>  3 (ดี): นักศึกษาสามารถเรียนรู้ทักษะใหม่ได้ในระดับพื้นฐาน และเริ่มต้นนำไปใช้ในงานบางส่วน แต่ยังขาดความสมบูรณ์</p>\n<p>  2 (พอใช้): นักศึกษาสามารถเรียนรู้ทักษะใหม่ได้ในระดับที่จำกัด และยังไม่สามารถประยุกต์ใช้ได้อย่างเหมาะสม</p>\n<p>  1 (ต้องปรับปรุง): นักศึกษาไม่สามารถเรียนรู้ทักษะใหม่ได้ด้วยตนเอง และขาดความพยายามในการพัฒนาตนเอง</p>"}, {"name": "หลักสูตรวิศวกรรมไฟฟ้า (พ.ศ. 2567)", "file": "6. สำนักวิศวกรรมศาสตร์ 6 หลักสูตร\\ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษา-หลักสูตรวิศวกรรมไฟฟ้า-พ.ศ.2567.docx", "ext": "docx", "html": "<p>หลักสูตรวิศวกรรมไฟฟ้า</p>\n<p>ปรับปรุง พ.ศ. 2567</p>\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของหลักสูตร (Program Learning Outcomes: PLOs</h2>\n<h3 class=\"domain-title\">ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO1</span> <span class=\"lo-desc\">ความรู้ทางด้านวิศวกรรม และพื้นฐานทางวิทยาศาสตร์ : สามารถประยุกต์ใช้ความรู้ทางด้าน คณิตศาสตร์ สังคมศาสตร์มนุษย์ศาสตร์ เทคโนโลยีสารสนเทศ วิทยาศาสตร์ทั่วไป พื้นฐานทางด้านวิศวกรรม และความรู้เฉพาะทางวิศวกรรมไฟฟ้า เพื่อกำหนดกรอบความคิด กระบวนการ หรือระบบงานทางวิศวกรรมไฟฟ้าในการทำงานได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO2</span> <span class=\"lo-desc\">การวิเคราะห์ปัญหาทางวิศวกรรม : สามารถระบุปัญหา ตั้งสมการคณิตศาสตร์ สืบค้นทางเอกสาร และแก้ไขปัญหาทางวิศวกรรมไฟฟ้าที่ซับซ้อน จนได้ข้อสรุปเบื้องต้นโดยใช้หลักการและเครื่องมือวิเคราะห์ทางด้านคณิตศาสตร์ วิทยาศาสตร์ และทางด้านวิศวกรรมไฟฟ้าได้อย่างถูกต้อง</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO3</span> <span class=\"lo-desc\">การพิจารณาตรวจสอบ : อธิบาย และประเมินผลกระทบของการดำเนินงานด้านวิศวกรรมไฟฟ้าต่อบริบทของสังคม วัฒนธรรม สิ่งแวดล้อม และการพัฒนาที่ยั่งยืน</span></div>\n<h3 class=\"domain-title\">ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO4</span> <span class=\"lo-desc\">การบริหารงานวิศวกรรมและการลงทุน : วิเคราะห์และประเมินด้านเศรษฐศาสตร์ การลงทุนและการบริหารงานวิศวกรรมไฟฟ้าโดยคำนึงความเสี่ยงและการเปลี่ยนแปลงเทคโนโลยีทางวิศวกรรมไฟฟ้า</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO5</span> <span class=\"lo-desc\">การออกแบบและพัฒนาเพื่อหาคำตอบของปัญหา : มีทักษะในการหาคำตอบของปัญหาทางวิศวกรรมไฟฟ้าที่ซับซ้อน และออกแบบระบบงานหรือกระบวนการทางวิศวกรรมไฟฟ้า ตามความต้องการและข้อกำหนดงานโดยคำนึงถึงข้อกำหนดด้านสังคม ความปลอดภัย การอนามัยและสิ่งแวดล้อม หรือมาตรฐานการปฏิบัติวิชาชีพ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO6</span> <span class=\"lo-desc\">การใช้อุปกรณ์เครื่องมือทันสมัย : มีทักษะในการเลือก และประยุกต์ใช้เทคนิควิธี อุปกรณ์เครื่องมือทางวิศวกรรมไฟฟ้าและทักษะในการใช้เทคโนโลยีอินเทอร์เน็ตในทุกสรรพสิ่งในการจัดการพลังงานที่เหมาะสมและทันสมัย โดยคำนึงถึงข้อกำหนดและข้อจำกัดของเครื่องมือ และอุปกรณ์นั้น</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO7</span> <span class=\"lo-desc\">การติดต่อสื่อสาร : มีทักษะการสื่อสารภาษาไทยและภาษาอังกฤษ เพื่อใช้ในชีวิตประจำวัน และในการทำงานด้านวิศวกรรมไฟฟ้า ทั้งการฟัง พูด อ่าน เขียน และเสนอผลงานได้ตามวัตถุประสงค์ ในกรณีที่นักศึกษาเลือกภาษาจีนสามารถสื่อสารภาษาจีนในชีวิตประจำวันได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO8</span> <span class=\"lo-desc\">สุขภาพกายและจิตใจ : มีทักษะการดูแลสุขภาพทั้งทางร่างกายและจิตใจ  ปฎิบัติตนเพื่อเตรียมความพร้อมทางด้านร่างกายและจิตใจต่อสิ่งแวดล้อมและสถานการณ์ที่มีการเปลี่ยนแปลง</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO9</span> <span class=\"lo-desc\">การเรียนรู้ตลอดชีพ : ใฝ่เรียนรู้และพัฒนาตนเองอย่างต่อเนื่อง</span></div>\n<h3 class=\"domain-title\">ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO10</span> <span class=\"lo-desc\">จรรยาบรรณวิชาชีพ : ยึดมั่นในจรรยาบรรณแห่งวิชาชีพ ซื่อสัตย์ สุจริตและมีความกตัญญู</span></div>\n<h3 class=\"domain-title\">ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO11</span> <span class=\"lo-desc\">วิศวกรและสังคม :  มีความรับผิดชอบต่อการปฏิบัติวิชาชีพวิศวกรรมไฟฟ้าต่อบริบทของสังคมและสิ่งแวดล้อม และสามารถการประเมินผลกระทบของการแก้ไขปัญหาต่อสังคม สิ่งแวดล้อม และการพัฒนาที่ยั่งยืน</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO12</span> <span class=\"lo-desc\">การทำงานร่วมกันเป็นทีม : สามารถทำงานร่วมกับผู้อื่นที่มีความหลากหลายในสหสาขาวิชาได้ สามารถทำงานในฐานะสมาชิกของกลุ่มและผู้นำกลุ่มได้ แสดงออกถึงความมีวินัย การมีภาวะผู้นำ สามารถเป็นได้ทั้งผู้นำ และผู้ตาม ทำงานร่วมกับผู้อื่นได้ มีจิตอาสาโดยใช้จิตวิทยาและปรับตัวตามสถานการณ์</span></div>\n\n<h2 class=\"section-title\">แบบประเมินผลการปฏิบัติสหกิจศึกษาตามผลลัพธ์การเรียนรู้ที่คาดหวัง</h2>\n\n<h4 class=\"table-marker\">[TABLE 1]</h4>\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษา (Learning Outcome: LO)</h2>\n<h3 class=\"domain-title\">ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">ผู้เรียนสามารถประยุกต์ใช้ความรู้ทางวิศวกรรมและวิทยาศาสตร์เพื่อออกแบบและพัฒนาระบบงานวิศวกรรมไฟฟ้าในสภาพแวดล้อมที่เกิดขึ้นในสถานประกอบการของการทำงานจริงได้อย่างมีประสิทธิภาพ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">ผู้เรียนสามารถวิเคราะห์และแก้ไขปัญหาทางวิศวกรรมไฟฟ้าด้วยเครื่องมือและหลักการทางคณิตศาสตร์และวิศวกรรมได้อย่างถูกต้อง</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">ผู้เรียนสามารถประเมินผลกระทบของการดำเนินงานด้านวิศวกรรมไฟฟ้าต่อบริบทสังคม สิ่งแวดล้อม และการพัฒนาที่ยั่งยืนในสถานประกอบการได้</span></div>\n<h3 class=\"domain-title\">ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">ผู้เรียนสามารถวางแผน วิเคราะห์ และประเมินการลงทุนตลอดจนการบริหารงานวิศวกรรมในบริบทของสถานประกอบการ โดยคำนึงถึงความเสี่ยงและการเปลี่ยนแปลงของเทคโนโลยี</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">ผู้เรียนสามารถออกแบบและพัฒนากระบวนการทางวิศวกรรมในสถานประกอบการ เพื่อแก้ไขปัญหาหรือพัฒนางานตามข้อกำหนดและมาตรฐานที่เกี่ยวข้อง</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO6</span> <span class=\"lo-desc\">ผู้เรียนสามารถเลือกใช้อุปกรณ์ เครื่องมือ และเทคโนโลยีที่เหมาะสมกับงานในสถานประกอบการอย่างมีประสิทธิภาพ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO7</span> <span class=\"lo-desc\">ผู้เรียนมีทักษะการสื่อสารภาษาไทยและภาษาอังกฤษ (หรือภาษาอื่น ๆ ที่จำเป็น) ในการทำงานร่วมกับบุคลากรในสถานประกอบการ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO8</span> <span class=\"lo-desc\">ผู้เรียนสามารถดูแลสุขภาพกายและจิตใจของตนเอง เพื่อให้มีความพร้อมในการรับมือกับสถานการณ์และความท้าทายในการทำงาน</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO9</span> <span class=\"lo-desc\">ผู้เรียนมีความสามารถในการเรียนรู้และพัฒนาตนเองอย่างต่อเนื่องในระหว่างการปฏิบัติงานในสถานประกอบการ</span></div>\n<h3 class=\"domain-title\">ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO10</span> <span class=\"lo-desc\">ผู้เรียนมีความซื่อสัตย์ ยึดมั่นในจรรยาบรรณแห่งวิชาชีพ และแสดงความกตัญญูต่อสถานประกอบการ</span></div>\n\n<h3 class=\"domain-title\">ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO11</span> <span class=\"lo-desc\">ผู้เรียนมีความรับผิดชอบต่อผลกระทบของงานวิศวกรรมที่ดำเนินการในสถานประกอบการ และสามารถประเมินผลกระทบต่อสังคมและสิ่งแวดล้อม</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO12</span> <span class=\"lo-desc\">ผู้เรียนสามารถทำงานร่วมกับผู้อื่นในสถานประกอบการอย่างมีประสิทธิภาพ ทั้งในบทบาทผู้นำและผู้ตาม พร้อมทั้งแสดงความมีวินัยและการปรับตัวตามสถานการณ์</span></div>\n\n<h4 class=\"table-marker\">[TABLE 2]</h4>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table\">\n<tr><td>ผลการเรียนรู้ที่คาดหวัง</td><td>ผลการประเมิน</td></tr>\n</table></div>\n<h3 class=\"domain-title\">(1) ด้านความรู้ (Knowledge) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">ผู้เรียนสามารถประยุกต์ใช้ความรู้ทางวิศวกรรมและวิทยาศาสตร์เพื่อออกแบบและพัฒนาระบบงานวิศวกรรมไฟฟ้าในสภาพแวดล้อมที่เกิดขึ้นในสถานประกอบการของการทำงานจริงได้อย่างมีประสิทธิภาพ |   5 (ยอดเยี่ยม): ประยุกต์ใช้ความรู้ทางวิศวกรรมและวิทยาศาสตร์เพื่อออกแบบและพัฒนาระบบงานวิศวกรรมไฟฟ้าในสภาพแวดล้อมที่เกิดขึ้นในสถานประกอบการของการทำงานจริงได้อย่างครบถ้วน</span></div>\n<p>  4 (ดีมาก): ประยุกต์ใช้ความรู้ทางวิศวกรรมและวิทยาศาสตร์เพื่อออกแบบและพัฒนาระบบงานวิศวกรรมไฟฟ้าในสภาพแวดล้อมที่เกิดขึ้นในสถานประกอบการของการทำงานจริงได้ในระดับดี แม้จะมีข้อบกพร่องเล็กน้อยแต่ไม่กระทบต่อคุณภาพโดยรวม</p>\n<p>  3 (ดี): ประยุกต์ใช้ความรู้ทางวิศวกรรมและวิทยาศาสตร์เพื่อออกแบบและพัฒนาระบบงานวิศวกรรมไฟฟ้าในสภาพแวดล้อมที่เกิดขึ้นในสถานประกอบการของการทำงานจริงได้ในระดับพื้นฐาน แต่ข้อเสนอแนวทางแก้ไขยังขาดความสมบูรณ์ในบางส่วน</p>\n<p>  2 (พอใช้): ประยุกต์ใช้ความรู้ทางวิศวกรรมและวิทยาศาสตร์เพื่อออกแบบและพัฒนาระบบงานวิศวกรรมไฟฟ้าในสภาพแวดล้อมที่เกิดขึ้นในสถานประกอบการของการทำงานจริงได้บางส่วน แต่ไม่สามารถแก้ไขได้อย่างเหมาะสม ต้องการคำแนะนำอย่างใกล้ชิด</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถประยุกต์ใช้ความรู้ทางวิศวกรรมและวิทยาศาสตร์เพื่อออกแบบและพัฒนาระบบงานวิศวกรรมไฟฟ้าในสภาพแวดล้อมที่เกิดขึ้นในสถานประกอบการของการทำงานจริงได้</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">ผู้เรียนสามารถวิเคราะห์และแก้ไขปัญหาทางวิศวกรรมไฟฟ้าด้วยเครื่องมือและหลักการทางคณิตศาสตร์และวิศวกรรมได้อย่างถูกต้อง |   5 (ยอดเยี่ยม): ระบุและแก้ปัญหาที่ซับซ้อนได้อย่างครบถ้วน พร้อมเสนอแนวทางแก้ไขที่สร้างสรรค์ มีประสิทธิภาพสูง และตอบโจทย์ความต้องการของสถานประกอบการได้อย่างครบถ้วน</span></div>\n<p>  4 (ดีมาก): ระบุแล สถานการณ์และความท้าทายในการทำงาน |   5 (ยอดเยี่ยม): ดูแลสุขภาพกายและจิตใจของตนเอง เพื่อให้มีความพร้อมในการรับมือกับสถานการณ์และความท้าทายในการทำงานได้อย่างถูกต้องและเหมาะสม</span></div>\n<p>  4 (ดีมาก): ดูแลสุขภาพกายและจิตใจของตนเอง เพื่อให้มีความพร้อมในการรับมือกับสถานการณ์และความท้าทายในการทำงานได้ในระดับดี แม้จะมีข้อบกพร่องเล็กน้อยแต่ไม่กระทบต่อสุขภาพกายและจิตใจของตนเองในการทำงาน</p>\n<p>  3 (ดี): ดูแลสุขภาพกายและจิตใจของตนเอง เพื่อให้มีความพร้อมในการรับมือกับสถานการณ์และความท้าทายในการทำงานได้ระดับพื้นฐาน แต่จำเป็นต้องได้รับคำแนะนำหรือแนวทางในการทำงาน</p>\n<p>  2 (พอใช้): ดูแลสุขภาพกายและจิตใจของตนเอง เพื่อให้มีความพร้อมในการรับมือกับสถานการณ์และความท้าทายในการทำงานได้บางส่วน ต้องการคำแนะนำอย่างใกล้ชิด</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถสามารถดูแลสุขภาพกายและจิตใจของตนเอง ให้มีความพร้อมการทำงานได้</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO9</span> <span class=\"lo-desc\">ผู้เรียนมีความสามารถในการเรียนรู้และพัฒนาตนเองอย่างต่อเนื่องในระหว่างการปฏิบัติงานในสถานประกอบการ |   5 (ยอดเยี่ยม): เรียนรู้และพัฒนาตนเองอย่างต่อเนื่องและสม่ำเสมอในระหว่างการปฏิบัติงานในสถานประกอบการ ค้นคว้าหาข้อมูลเพิ่มเติมด้วยตัวเอง</span></div>\n<p>  4 (ดีมาก): เรียนรู้และพัฒนาตนเองอย่างต่อเนื่องในระหว่างการปฏิบัติงานในสถานประกอบการในระดับดี แม้จะมีการปรับปรุงในบางส่วน</p>\n<p>  3 (ดี): เรียนรู้และพัฒนาตนเองอย่างต่อเนื่องในระหว่างการปฏิบัติงานในสถานประกอบการในระดับพื้นฐาน แต่ยังขาดความสมบูรณ์ในบางส่วน</p>\n<p>  2 (พอใช้): เรียนรู้และพัฒนาตนเองอย่างต่อเนื่องในระหว่างการปฏิบัติงานในสถานประกอบการได้ และ ต้องการคำแนะนำอย่างใกล้ชิด</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถเรียนรู้และพัฒนาตนเองในระหว่างการปฏิบัติงานในสถานประกอบการด้วยตนเอง</p>\n<h3 class=\"domain-title\">(3) ด้านจริยธรรม (Ethics) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO10</span> <span class=\"lo-desc\">ผู้เรียนมีความซื่อสัตย์ ยึดมั่นในจรรยาบรรณแห่งวิชาชีพ และแสดงความกตัญญูต่อสถานประกอบการ |   5 (ยอดเยี่ยม): ซื่อสัตย์ ปฏิบัติตามกฎระเบียบ   มีความยึดมั่นในจรรยาบรรณแห่งวิชาชีพ และแสดงความกตัญญูต่อสถานประกอบการอย่างเคร่งครัด</span></div>\n<p>  4 (ดีมาก): ซื่อสัตย์ ปฏิบัติตามกฎระเบียบ         มีความยึดมั่นในจรรยาบรรณแห่งวิชาชีพ และแสดงความกตัญญูต่อสถานประกอบการได้ในระดับดี แม้จะมีข้อผิดพลาดเล็กน้อย</p>\n<p>  3 (ดี): ซื่อสัตย์ ปฏิบัติตามกฎระเบียบ มีความยึดมั่นในจรรยาบรรณแห่งวิชาชีพ และแสดงความกตัญญูต่อสถานประกอบการได้ในระดับพื้นฐาน                    มีข้อผิดพลาดเล็กน้อยและมีข้อปรับปรุงในบางส่วน</p>\n<p>  2 (พอใช้): ซื่อสัตย์ ปฏิบัติตามกฎระเบียบ         มีความยึดมั่นในจรรยาบรรณแห่งวิชาชีพ และแสดงความกตัญญูต่อสถานประกอบการในบางโอกาส</p>\n<p>  1 (ต้องปรับปรุง): ไม่ปฏิบัติตามกฎระเบียบ และแสดงถึงความขาดความรับผิดชอบในงานอย่างชัดเจน</p>\n<h3 class=\"domain-title\">(4) ด้านลักษณะบุคคล (Character) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO11</span> <span class=\"lo-desc\">ผู้เรียนมีความรับผิดชอบต่อผลกระทบของงานวิศวกรรมที่ดำเนินการในสถานประกอบการ และสามารถประเมินผลกระทบต่อสังคมและสิ่งแวดล้อม |   5 (ยอดเยี่ยม): รับผิดชอบต่อผลกระทบของงานวิศวกรรมที่ดำเนินการในสถานประกอบการ และสามารถประเมินผลกระทบต่อสังคมและสิ่งแวดล้อมได้เป็นอย่างถูกต้องครบถ้วน</span></div>\n<p>  4 (ดีมาก): รับผิดชอบต่อผลกระทบของงานวิศวกรรมที่ดำเนินการในสถานประกอบการ และสามารถประเมินผลกระทบต่อสังคมและสิ่งแวดล้อมได้เป็นอย่างถูกต้อง</p>\n<p>  3 (ดี): รับผิดชอบต่อผลกระทบของงานวิศวกรรมที่ดำเนินการในสถานประกอบการ และสามารถประเมินผลกระทบต่อสังคมและสิ่งแวดล้อมได้ในระดับดี แม้จะมีข้อบกพร่องเล็กน้อยแต่ไม่กระทบงานที่ได้รับผิดชอบ</p>\n<p>  2 (พอใช้): รับผิดชอบต่อผลกระทบของงานวิศวกรรมที่ดำเนินการในสถานประกอบการ และสามารถประเมินผลกระทบต่อสังคมและสิ่งแวดล้อมได้เพียงบางส่วน</p>\n<p>  1 (ต้องปรับปรุง): ไม่มีความรับผิดชอบต่อผลกระทบของงานวิศวกรรม</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO12</span> <span class=\"lo-desc\">ผู้เรียนสามารถทำงานร่วมกับผู้อื่นในสถานประกอบการอย่างมีประสิทธิภาพ ทั้งในบทบาทผู้นำและผู้ตาม พร้อมทั้งแสดงความมีวินัยและการปรับตัวตามสถานการณ์ |   5 (ยอดเยี่ยม): ทำงานร่วมกับผู้อื่นในสถานประกอบการอย่างมีประสิทธิภาพ ทั้งในบทบาทผู้นำและผู้ตาม พร้อมทั้งแสดงความมีวินัยและการปรับตัวตามสถานการณ์</span></div>\n<p>  4 (ดีมาก): ทำงานร่วมกับผู้อื่นในสถานประกอบการได้เป็นอย่างดี ทั้งในบทบาทผู้นำและผู้ตาม พร้อมทั้งแสดงความมีวินัยและการปรับตัวตามสถานการณ์</p>\n<p>  3 (ดี): ทำงานร่วมกับผู้อื่นในสถานประกอบการได้ในระดับพื้นฐาน ทั้งในบทบาทผู้นำและผู้ตาม พร้อมทั้งแสดงความมีวินัยและการปรับตัวตามสถานการณ์ แต่ต้องได้รับคำแนะนำหรือแนวทางในการทำงาน</p>\n<p>  2 (พอใช้): ทำงานร่วมกับผู้อื่นในสถานประกอบการได้ในบางส่วน ทั้งในบทบาทผู้นำและผู้ตาม พร้อมทั้งแสดงความมีวินัยและการปรับตัวตามสถานการณ์แต่จำเป็นต้องได้รับคำแนะนำหรือแนวทางในการทำงาน</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถทำงานร่วมกับทีมได้อย่างเหมาะสม</p>"}, {"name": "หลักสูตรวิศวกรรมศาสตรบัณฑิต สาขาวิศวกรรมโยธา (ปรับปรุง พ.ศ. 2567)", "file": "6. สำนักวิศวกรรมศาสตร์ 6 หลักสูตร\\หลักสูตรวิศวกรรมศาสตรบัณฑิต สาขาวิศวกรรมโยธา ปรังปรุงปีการศึกษา 2567  .docx", "ext": "docx", "html": "<p>หลักสูตรวิศวกรรมศาสตรบัณฑิต</p>\n<p>สาขาวิศวกรรมโยธา</p>\n<p>หลักสูตรปรับปรุง ปีการศึกษา ๒๕๖๗</p>\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของหลักสูตร (Program Learning Outcomes: PLOs)</h2>\n<h3 class=\"domain-title\">1) ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO1</span> <span class=\"lo-desc\">ประยุกต์ใช้ความรู้ทางด้านคณิตศาสตร์ วิทยาศาสตร์ทั่วไป และพื้นฐานทางด้านวิศวกรรมศาสตร์ ในการกำหนดกรอบความคิด กระบวนการ หรือระบบงานสำหรับการแก้ปัญหาวิศวกรรมในการทำงาน</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO2</span> <span class=\"lo-desc\">วิเคราะห์ แก้ไขปัญหา ประเมินผลงานและปัญหาทางวิศวกรรม เพื่อให้ได้ผลสรุปที่ถูกต้องตามหลักเหตุผลโดยใช้หลักการและเครื่องมือวิเคราะห์ทางด้านคณิตศาสตร์ วิทยาศาสตร์ทั่วไป และทางด้านวิศวกรรมศาสตร์ได้อย่างถูกต้อง</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO3</span> <span class=\"lo-desc\">อธิบาย และประเมินผลกระทบของการดำเนินงานด้านวิศวกรรมโยธาต่อบริบทของทางสังคม ชีวอนามัย ความปลอดภัย กฎหมาย และวัฒนธรรมที่เกี่ยวพันกับการปฏิบัติวิชาชีพวิศวกรรมวัฒนธรรม สิ่งแวดล้อม และการพัฒนาที่ยั่งยืน</span></div>\n<h3 class=\"domain-title\">2) ด้านทักษะ (Skill\ts)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO4</span> <span class=\"lo-desc\">ออกแบบการก่อสร้างหรือกระบวนการทางวิศวกรรมที่มีความซับซ้อน ตามความต้องการและเป็นไปตามข้อกำหนดงาน โดยคำนึงถึงข้อกำหนดด้านกฎหมาย สังคม ความปลอดภัย และมาตรฐานการปฏิบัติวิชาชีพ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO5</span> <span class=\"lo-desc\">มีความเป็นผู้ประกอบการ สามารถอธิบาย วิเคราะห์ และประเมินเศรษฐศาสตร์ การลงทุน สัญญา และการบริหารงานวิศวกรรมโดยคำนึงถึงความเสี่ยงและการเปลี่ยนแปลง</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO6</span> <span class=\"lo-desc\">มีทักษะตั้งสมมติฐาน ระบุ สืบค้น อ้างอิง ทำการทดลอง วิเคราะห์ข้อมูลและออกแบบการทดลองงานทางด้านวิศวกรรมได้อย่างถูกต้อง</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO7</span> <span class=\"lo-desc\">มีทักษะการเลือก และใช้เทคนิควิธี อุปกรณ์เครื่องมือทางวิศวกรรมและเทคโนโลยีสารสนเทศที่เหมาะกับงานทางด้านวิศวกรรมโยธา โดยคำนึงถึงข้อกำหนดและข้อจำกัดของเครื่องมือและอุปกรณ์นั้น</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO8</span> <span class=\"lo-desc\">มีทักษะการสื่อสารภาษาไทยและภาษาอังกฤษ เพื่อใช้ในชีวิตประจำวัน และในการทำงานด้านวิศวกรรมโยธา ทั้งการฟัง พูด อ่าน เขียน และเสนอผลงานได้ตามวัตถุประสงค์ ในกรณีที่นักศึกษาเลือกภาษาจีนสามารถสื่อสารภาษาจีนในชีวิตประจำวันได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO9</span> <span class=\"lo-desc\">มีทักษะการดูแลสุขภาพทางกายและจิตใจ และปฏิบัติตนเพื่อเตรียมพร้อมด้านร่างกายและจิตใจต่อสิ่งแวดล้อมและสถานการณ์ที่มีการเปลี่ยนแปลง</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO10</span> <span class=\"lo-desc\">ใฝ่เรียน ใฝ่รู้ และพัฒนาตนเองอย่างต่อเนื่อง</span></div>\n<h3 class=\"domain-title\">3) ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO11</span> <span class=\"lo-desc\">ซื่อสัตย์สุจริต กตัญญู ปฏิบัติตนตามกฎกติกาของสังคมและจรรยาบรรณแห่งวิชาชีพตามกรอบมาตรฐานการปฏิบัติวิชาชีพวิศวกรรมโยธา</span></div>\n<h3 class=\"domain-title\">4) ด้านลักษณะบุคคล (Character)</h3>\n<p>PLO 12 ขยัน มีวินัย มีจิตสาธารณะ คิดเป็นระบบอย่างมีวิจารณญาณมีเหตุผล รับผิดชอบต่อสังคมและรักษาสิ่งแวดล้อม และอดทนในการทำงานตามวิชาชีพ</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO13</span> <span class=\"lo-desc\">สามารถทำงานเป็นทีมโดยปฏิบัติตนเป็นผู้นำ และ/หรือ ในฐานะสมาชิกของกลุ่มร่วมกับผู้อื่นที่มีความหลากหลายในสหสาขาวิชาได้</span></div>\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษา (Learning Outcome: LO)</h2>\n<h3 class=\"domain-title\">ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">ประยุกต์ใช้ความรู้ทางด้านคณิตศาสตร์ พื้นฐานทางด้านวิศวกรรมศาสตร์ ในการกำหนดกรอบความคิด กระบวนการ หรือระบบงานสำหรับการวิเคราะห์ แก้ไขปัญหา และประเมินผลงานและปัญหาทางวิศวกรรม วิศวกรรมในการทำงานได้อย่างถูกต้อง</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">อธิบาย และประเมินผลกระทบของการดำเนินงานด้านวิศวกรรมโยธาต่อบริบทของทางสังคม ชีวอนามัย ความปลอดภัย กฎหมาย สิ่งแวดล้อม และการพัฒนาที่ยั่งยืน</span></div>\n<h3 class=\"domain-title\">ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">ออกแบบการก่อสร้างหรือกระบวนการทางวิศวกรรม ตามความต้องการและเป็นไปตามข้อกำหนดงาน โดยคำนึงถึงข้อกำหนดด้านกฎหมาย สังคม ความปลอดภัย และมาตรฐานการปฏิบัติวิชาชีพ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">มีความเป็นผู้ประกอบการ สามารถอธิบาย วิเคราะห์ และประเมินเศรษฐศาสตร์ การลงทุน สัญญา และการบริหารงานวิศวกรรมโดยคำนึงถึงความเสี่ยงและการเปลี่ยนแปลง</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">มีทักษะตั้งสมมติฐาน ระบุ สืบค้น อ้างอิง ทำการทดลอง วิเคราะห์ข้อมูลและออกแบบการทดลองงานทางด้านวิศวกรรม และใช้เทคนิควิธี อุปกรณ์เครื่องมือทางวิศวกรรมและเทคโนโลยีสารสนเทศที่เหมาะกับงานทางด้านวิศวกรรมโยธา</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO6</span> <span class=\"lo-desc\">มีทักษะการสื่อสารภาษาไทยและภาษาอังกฤษในการทำงานด้านวิศวกรรมโยธา ทั้งการฟัง พูด อ่าน เขียน และเสนอผลงานได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO7</span> <span class=\"lo-desc\">มีทักษะการดูแลสุขภาพทางกายและจิตใจ และปฏิบัติตนเพื่อเตรียมพร้อมด้านร่างกายและจิตใจต่อสิ่งแวดล้อมและสถานการณ์ที่มีการเปลี่ยนแปลง</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO8</span> <span class=\"lo-desc\">พัฒนาตนเองอย่างต่อเนื่อง</span></div>\n<h3 class=\"domain-title\">ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO9</span> <span class=\"lo-desc\">ปฏิบัติตนตามกฎกติกาของสังคมและจรรยาบรรณแห่งวิชาชีพตามกรอบมาตรฐานการปฏิบัติวิชาชีพวิศวกรรมโยธา</span></div>\n<h3 class=\"domain-title\">ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO10</span> <span class=\"lo-desc\">คิดเป็นระบบอย่างมีวิจารณญาณมีเหตุผล รับผิดชอบต่อสังคมและรักษาสิ่งแวดล้อม</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO11</span> <span class=\"lo-desc\">สามารถทำงานเป็นทีมโดยปฏิบัติตนเป็นผู้นำ และ/หรือ ในฐานะสมาชิกของกลุ่มร่วมกับผู้อื่นที่มีความหลากหลายในสหสาขาวิชาได้</span></div>\n\n<h2 class=\"section-title\">แบบประเมินผลการปฏิบัติสหกิจศึกษาตามผลลัพธ์การเรียนรู้ที่คาดหวัง</h2>\n\n<h4 class=\"table-marker\">[TABLE 1]</h4>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table\">\n<tr><td>ผลการเรียนรู้ที่คาดหวัง</td><td>ผลการประเมิน</td></tr>\n</table></div>\n<h3 class=\"domain-title\">ด้านความรู้ (Knowledge) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">ประยุกต์ใช้ความรู้ทางด้านคณิตศาสตร์ พื้นฐานทางด้านวิศวกรรมศาสตร์ ในการกำหนดกรอบความคิด กระบวนการ หรือระบบงานสำหรับการวิเคราะห์ แก้ไขปัญหา และประเมินผลงานและปัญหาทางวิศวกรรม วิศวกรรมในการทำงานได้อย่างถูกต้อง |  5 (ยอดเยี่ยม): ประยุกต์ใช้ความรู้ทางด้านคณิตศาสตร์ พื้นฐานทางด้านวิศวกรรมศาสตร์ ในการกำหนดกรอบความคิด กระบวนการ หรือระบบงานสำหรับการวิเคราะห์ แก้ไขปัญหา และประเมินผลงานและปัญหาทางวิศวกรรมในการทำงานได้อย่างถูกต้อง</span></div>\n<p> 4 (ดีมาก): ประยุกต์ใช้ความรู้ทางด้านคณิตศาสตร์ พื้นฐานทางด้านวิศวกรรมศาสตร์ ในการกำหนดกรอบความคิด กระบวนการ หรือระบบงานสำหรับการวิเคราะห์ แก้ไขปัญหา และประเมินผลงานและปัญหาทางวิศวกรรมในการทำงานได้ไม่กระทบต่อคุณภาพโดยรวม</p>\n<p> 3 (ดี): ประยุกต์ใช้ความรู้ทางด้านคณิตศาสตร์ พื้นฐานทางด้านวิศวกรรมศาสตร์ ในการกำหนดกรอบความคิด กระบวนการ หรือระบบงานสำหรับการวิเคราะห์ แก้ไขปัญหา และประเมินผลงานและปัญหาทางวิศวกรรมโดยยังขาดความสมบูรณ์ในบางส่วน</p>\n<p>  2 (พอใช้): ประยุกต์ใช้ความรู้ทางด้านคณิตศาสตร์ พื้นฐานทางด้านวิศวกรรมศาสตร์ ในการกำหนดกรอบความคิด กระบวนการ หรือระบบงานสำหรับการวิเคราะห์ แก้ไขปัญหา และประเมินผลงานและปัญหาทางวิศวกรรม โดยต้องการคำแนะนำอย่างใกล้ชิด</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถประยุกต์ใช้ความรู้ทางด้านคณิตศาสตร์ พื้นฐานทางด้านวิศวกรรมศาสตร์ ในการกำหนดกรอบความคิด กระบวนการ หรือระบบงานสำหรับการวิเคราะห์ แก้ไขปัญหา และประเมินผลงานและปัญหาทางวิศวกรรม วิศวกรรมในการทำงานได้อย่างถูกต้อง</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">อธิบาย และประเมินผลกระทบของการดำเนินงานด้านวิศวกรรมโยธาต่อบริบทของทางสังคม ชีวอนามัย ความปลอดภัย กฎหมาย สิ่งแวดล้อม และการพัฒนาที่ยั่งยืน |   5 (ยอดเยี่ยม): อธิบาย และประเมินผลกระทบของการดำเนินงานด้านวิศวกรรมโยธาต่อบริบทของทางสังคม ชีวอนามัย ความปลอดภัย กฎหมาย สิ่งแวดล้อม และการพัฒนาที่ยั่งยืนในการทำงานได้อย่างถูกต้อง</span></div>\n<p>  4 (ดีมาก): อธิบาย และประเมินผลกระทบของการดำเนินงานด้านวิศวกรรมโยธาต่อบริบทของทางสังคม ชีวอนามัย ความปลอดภัย กฎหมาย สิ่งแวดล้อม และการพัฒนาที่ยั่งยืนในการทำงานได้ไม่กระทบต่อคุณภาพโดยรวม</p>\n<p>  3 (ดี): อธิบาย และประเมินผลกระทบของการดำเนินงานด้านวิศวกรรมโยธาต่อบริบทของทางสังคม ชีวอนามัย ความปลอดภัย กฎหมาย สิ่งแวดล้อม และการพัฒนาที่ยั่งยืนโดยยังขาดความสมบูรณ์ในบางส่วน</p>\n<p>  2 (พอใช้): อธิบาย และประเมินผลกระทบของการดำเนินงานด้านวิศวกรรมโยธาต่อบริบทของทางสังคม ชีวอนามัย ความปลอดภัย กฎหมาย สิ่งแวดล้อม และการพัฒนาที่ยั่งยืนโดยต้องการคำแนะนำอย่างใกล้ชิด</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถอธิบาย และประเมินผลกระทบข
