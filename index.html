ละจิตใจต่อสิ่งแวดล้อมและสถานการณ์ที่มีการเปลี่ยนแปลงโดยต้องการคำแนะนำอย่างใกล้ชิด</p>\n<p>  1 (ต้องปรับปรุง): ไม่มีทักษะการดูแลสุขภาพทางกายและจิตใจ และปฏิบัติตนเพื่อเตรียมพร้อมด้านร่างกายและจิตใจต่อสิ่งแวดล้อมและสถานการณ์ที่มีการเปลี่ยนแปลง</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO8</span> <span class=\"lo-desc\">พัฒนาตนเองอย่างต่อเนื่อง |  5 (ยอดเยี่ยม): ใฝ่เรียน ใฝ่รู้ และพัฒนาตนเองอย่างต่อเนื่อง</span></div>\n<p> 4 (ดีมาก): ใฝ่เรียน ใฝ่รู้ และพัฒนาตนเองอย่างต่อเนื่องได้บางส่วนไม่กระทบต่อคุณภาพโดยรวม</p>\n<p> 3 (ดี): พัฒนาตนเองอย่างต่อเนื่องโดยยังขาดความสมบูรณ์ในบางส่วน</p>\n<p> 2 (พอใช้): พัฒนาตนเองอย่างต่อเนื่องโดยต้องการคำแนะนำอย่างใกล้ชิด</p>\n<p> 1 (ต้องปรับปรุง): ไม่สามารถพัฒนาตนเองอย่างต่อเนื่อง</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO9</span> <span class=\"lo-desc\">ปฏิบัติตนตามกฎกติกาของสังคมและจรรยาบรรณแห่งวิชาชีพตามกรอบมาตรฐานการปฏิบัติวิชาชีพวิศวกรรมโยธา |  5 (ยอดเยี่ยม): ปฏิบัติตนตามกฎกติกาของสังคมและจรรยาบรรณแห่งวิชาชีพตามกรอบมาตรฐานการปฏิบัติวิชาชีพวิศวกรรมโยธา</span></div>\n<p> 4 (ดีมาก): ปฏิบัติตนตามกฎกติกาของสังคมและจรรยาบรรณแห่งวิชาชีพตามกรอบมาตรฐานการปฏิบัติวิชาชีพวิศวกรรมโยธาได้บางส่วนไม่กระทบต่อคุณภาพโดยรวม</p>\n<p> 3 (ดี): ปฏิบัติตนตามกฎกติกาของสังคมและจรรยาบรรณแห่งวิชาชีพตามกรอบมาตรฐานการปฏิบัติวิชาชีพวิศวกรรมโยธาโดยยังขาดความสมบูรณ์ในบางส่วน</p>\n<p> 2 (พอใช้): ปฏิบัติตนตามกฎกติกาของสังคมและจรรยาบรรณแห่งวิชาชีพตามกรอบมาตรฐานการปฏิบัติวิชาชีพวิศวกรรมโยธาโดยต้องการคำแนะนำอย่างใกล้ชิด</p>\n<p> 1 (ต้องปรับปรุง): ไม่ปฏิบัติตนตามกฎกติกาของสังคมและจรรยาบรรณแห่งวิชาชีพตามกรอบมาตรฐานการปฏิบัติวิชาชีพวิศวกรรมโยธา</p>\n<h3 class=\"domain-title\">ด้านจริยธรรม (Ethics) | ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO10</span> <span class=\"lo-desc\">คิดเป็นระบบอย่างมีวิจารณญาณมีเหตุผล รับผิดชอบต่อสังคมและรักษาสิ่งแวดล้อม |  5 (ยอดเยี่ยม): คิดเป็นระบบอย่างมีวิจารณญาณมีเหตุผล รับผิดชอบต่อสังคมและรักษาสิ่งแวดล้อม</span></div>\n<p> 4 (ดีมาก): คิดเป็นระบบอย่างมีวิจารณญาณมีเหตุผล รับผิดชอบต่อสังคมและรักษาสิ่งแวดล้อมได้บางส่วนไม่กระทบต่อคุณภาพโดยรวม</p>\n<p> 3 (ดี): คิดเป็นระบบอย่างมีวิจารณญาณมีเหตุผล รับผิดชอบต่อสังคมและรักษาสิ่งแวดล้อมโดยยังขาดความสมบูรณ์ในบางส่วน</p>\n<p> 2 (พอใช้): คิดเป็นระบบอย่างมีวิจารณญาณมีเหตุผล รับผิดชอบต่อสังคมและรักษาสิ่งแวดล้อมโดยต้องการคำแนะนำอย่างใกล้ชิด</p>\n<p> 1 (ต้องปรับปรุง): ไม่สามารถคิดเป็นระบบอย่างมีวิจารณญาณมีเหตุผล รับผิดชอบต่อสังคมและรักษาสิ่งแวดล้อม</p>\n<h3 class=\"domain-title\">ด้านลักษณะบุคคล (Character) | ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO11</span> <span class=\"lo-desc\">สามารถทำงานเป็นทีมโดยปฏิบัติตนเป็นผู้นำ และ/หรือ ในฐานะสมาชิกของกลุ่มร่วมกับผู้อื่นที่มีความหลากหลายในสหสาขาวิชาได้ |  5 (ยอดเยี่ยม): สามารถทำงานเป็นทีมโดยปฏิบัติตนเป็นผู้นำ และ/หรือ ในฐานะสมาชิกของกลุ่มร่วมกับผู้อื่นที่มีความหลากหลายในสหสาขาวิชาได้</span></div>\n<p> 4 (ดีมาก): สามารถทำงานเป็นทีมโดยปฏิบัติตนเป็นผู้นำ และ/หรือ ในฐานะสมาชิกของกลุ่มร่วมกับผู้อื่นที่มีความหลากหลายในสหสาขาวิชาได้บางส่วนไม่กระทบต่อคุณภาพโดยรวม</p>\n<p> 3 (ดี): สามารถทำงานเป็นทีมโดยปฏิบัติตนเป็นผู้นำ และ/หรือ ในฐานะสมาชิกของกลุ่มร่วมกับผู้อื่นที่มีความหลากหลายในสหสาขาวิชาได้ในการทำงานตามวิชาชีพ โดยยังขาดความสมบูรณ์ในบางส่วน</p>\n<p> 2 (พอใช้): สามารถทำงานเป็นทีมโดยปฏิบัติตนเป็นผู้นำ และ/หรือ ในฐานะสมาชิกของกลุ่มร่วมกับผู้อื่นที่มีความหลากหลายในสหสาขาวิชาได้โดยต้องการคำแนะนำอย่างใกล้ชิด</p>\n<p> 1 (ต้องปรับปรุง): ไม่สามารถทำงานเป็นทีมโดยปฏิบัติตนเป็นผู้นำ และ/หรือ ในฐานะสมาชิกของกลุ่มร่วมกับผู้อื่นที่มีความหลากหลายในสหสาขาวิชาได้</p>"}]}, {"faculty": "สำนักวิชาสาธารณสุขศาสตร์", "curricula": [{"name": "หลักสูตรอนามัยสิ่งแวดล้อม", "file": "7.สำนักสาธารณสุขศาสตร์ 1 หลักสูตร\\ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษา อนามัยสิ่งแวดล้อม.pdf", "ext": "pdf", "html": "<p>หลักสูตรวิทยาศาสตรบัณฑิตสาขาอนามัยสิ่งแวดล้อม</p>\n<p>(หลักสตู รปรับปรุง พ.ศ. 2568)</p>\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของหลักสูตร (Program Learning Outcomes: PLOs)</h2>\n<h3 class=\"domain-title\">1) ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO1</span> <span class=\"lo-desc\">อธิบายความรู้วิทยาศาสตร์ เทคโนโลยีสารสนเทศ คณิตศาสตร์ และวิทยาศาสตร์สุขภาพ เพื่อติดตาม</span></div>\n<p>ตรวจสอบ เฝ้าระวัง ป้องกัน และควบคุมปัจจัยด้านสิ่งแวดล้อมที่ส่งผลกระทบต่อสุขภาพอนามัยของมนุษย์</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO2</span> <span class=\"lo-desc\">ประยุกต์ใช้องค์ความรู้ตามกรอบวิชาชีพการสาธารณสุขชุมชนเพื่อปฏิบัติงานอนามัยสิ่งแวดล้อม</span></div>\n<p>โดยคำนึงถึงความแตกต่างของพหุวัฒนธรรม</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO3</span> <span class=\"lo-desc\">ประยุกต์ใช้ความรู้ด้านอนามัยสิ่งแวดล้อมในการเสนอแนะการจัดการหรือแนวคิดนวัตกรรม เพื่อแก้ไข</span></div>\n<p>ปัญหาด้านอนามัยสิ่งแวดล้อม</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO4</span> <span class=\"lo-desc\">ประยุกต์ใช้ความรู้ด้านวิทยาศาสตร์ คณิตศาสตร์ สถิติ ด้านวิทยาศาสตร์สุขภาพ ในการเฝ้าระวังและ</span></div>\n<p>การป้องกัน โรคจากการประกอบอาชีพและสิ่งแวดล้อม</p>\n<h3 class=\"domain-title\">2) ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO5</span> <span class=\"lo-desc\">มีทักษะในการใช้เครื่องมือและอุปกรณ์ทางวิทยาศาสตร์ในการสำรวจ เก็บและวิเคราะห์ตัวอย่างในงาน</span></div>\n<p>สิ่งแวดล้อม</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO6</span> <span class=\"lo-desc\">มีทักษะในการใช้เทคโนโลยีสารสนเทศเพื่อแสวงหาความรู้ สืบค้นและวิเคราะห์ข้อมูลในงานอนามัย</span></div>\n<p>สิ่งแวดล้อม</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO7</span> <span class=\"lo-desc\">มีทักษะในการให้คำปรึกษาเพื่อป้องกันและลดปัจจัยสิ่งแวดล้อมที่มีผลต่อสุขภาพภายใต้มาตรฐาน</span></div>\n<p>การปฏิบัติงานทางวิชาชีพ</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO8</span> <span class=\"lo-desc\">มีทักษะในการออกแบบและดำเนินการโครงการเพื่อส่งเสริม ป้องกัน และแก้ไขปัญหาสุขภาพและ</span></div>\n<p>สิ่งแวดล้อม</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO9</span> <span class=\"lo-desc\">มีทักษะการสื่อสารภาษาไทยและภาษาอังกฤษ ในกรณีที่นักศึกษาเลือกภาษาจีนสามารถสื่อสารภาษาจีนได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO10</span> <span class=\"lo-desc\">มีทักษะในการปฏิบัติงานเป็นทีมและยอมรับความแตกต่างทางความคิดเห็นของผู้อื่น</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO11</span> <span class=\"lo-desc\">มีทักษะการออกกำลังกาย ส่งเสริมสุขภาพ เฝ้าระวัง ป้องกัน โรคจากการประกอบอาชีพ และสิ่งแวดล้อม</span></div>\n<h3 class=\"domain-title\">3) ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO12</span> <span class=\"lo-desc\">มีความรับผิดชอบต่อตนเอง ผู้อื่น และสังคม ตามบทบาทและจรรยาบรรณทางวิชาชีพ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO13</span> <span class=\"lo-desc\">มีวินัย ตรงต่อเวลา กตัญญูและซื่อสัตย์สุจริต</span></div>\n<h3 class=\"domain-title\">4) ด้านลักษณะบุคคล (Characters)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO14</span> <span class=\"lo-desc\">ประยุกต์ใช้ความรู้ด้านอนามัยสิ่งแวดล้อมในการปฏิบัติงานที่แตกต่างกันโดยใช้แนวคิดการพัฒนาที่ยั่งยืน</span></div>\n<p>(Sustainable development)</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO15</span> <span class=\"lo-desc\">แสดงออกถึงการมีภาวะผู้นำ สามารถเป็นได้ทั้งผู้นำและผู้ตาม ทำงานร่วมกับผู้อื่นได้ มีจติ อาสา</span></div>\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษา (Course Learning Outcome: CLO)</h2>\n<h3 class=\"domain-title\">(1) ด้านความรู้ (Knowledge)</h3>\n<p>CLO2 ประยุกต์ใช้องค์ความรู้ตามกรอบวิชาชีพการสาธารณสุขชุมชนเพื่อปฏิบัติงานอนามัยสิ่งแวดล้อม</p>\n<p>โดยคำนึงถึงบริบทพหุวัฒนธรรมระหว่างการปฏิบัติงานสหกิจศึกษา</p>\n<p>CLO3 ประยุกต์ใช้ความรู้ด้านอนามัยสิ่งแวดล้อมในการเสนอแนะการจัดการหรือแนวคิดนวัตกรรม</p>\n<p>เพื่อแก้ไขปัญหาด้านอนามัยสิ่งแวดล้อมระหว่างการปฏิบัติงานสหกิจศึกษา</p>\n<p>CLO4 ประยุกต์ใช้ความรู้ด้านวิทยาศาสตร์คณิตศาสตร์ สถิติ ด้านวิทยาศาสตร์สุขภาพ ในการเฝ้าระวัง</p>\n<p>และการป้องกันโรคจากการประกอบอาชีพและสิ่งแวดล้อมระหว่างการปฏิบัติงานสหกิจศึกษา</p>\n<h3 class=\"domain-title\">(2) ด้านทักษะ (Skills)</h3>\n<p>CLO7 แสดงทักษะในการให้คำปรึกษาเพื่อป้องกันและลดปัจจัยสิ่งแวดล้อมที่มีผลต่อสุขภาพภายใต้</p>\n<p>มาตรฐานการปฏิบัติงานทางวิชาชีพในสถานประกอบการสหกิจศึกษา</p>\n<p>CLO8 ปฏิบัติการออกแบบและดำเนินการโครงการสหกิจศึกษาเพื่อส่งเสริม ป้องกัน และแก้ไขปัญหา</p>\n<p>สุขภาพและสิ่งแวดล้อม</p>\n<p>CLO9 แสดงทักษะการสื่อสารอย่างมีประสิทธิภาพทั้งในภาษาไทย และภาษาอื่น ๆ ตามที่สถาน</p>\n<p>ประกอบการกำหนด ผ่านรายงานและการนำเสนอระหว่างการปฏิบัติงานสหกิจศึกษา</p>\n<p>CLO10 แสดงทักษะการทำงานร่วมกับผู้อื่นในทีมที่หลากหลาย โดยเคารพความคิดเห็นที่แตกต่างใน</p>\n<p>ระหว่างการปฏิบัติสหกิจศึกษา</p>\n<h3 class=\"domain-title\">(3) ด้านจริยธรรม (Ethics)</h3>\n<p>CLO12 ปฏิบัติงานด้วยความรับผิดชอบต่อตนเอง ผู้อื่น และสังคม โดยปฏิบัติตามจรรยาบรรณวิชาชีพ</p>\n<p>ตลอดการปฏิบัติงานสหกิจศึกษา</p>\n<h3 class=\"domain-title\">(4) ด้านลักษณะบุคคล (Character)</h3>\n<p>CLO15 แสดงออกถึงการมีภาวะผู้นำและทำงานร่วมกับผู้อื่นในสถานประกอบการสหกิจศึกษาอย่างมีจติ</p>\n<p>อาสา</p>\n<h2 class=\"section-title\">แบบประเมินผลการปฏิบัติสหกิจศึกษาตามผลลัพธ์การเรียนรู้ที่คาดหวัง</h2>\n<p>ผลการเรียนรู้ที่คาดหวัง ดีมาก ดี พอใช้ ต้องปรับปรุง</p>\n<p>(4 คะแนน) (3 คะแนน) (2 คะแนน) (1 คะแนน)</p>\n<h3 class=\"domain-title\">(1) ด้านความรู้ (Knowledge)</h3>\n<p>CLO2 ประยุกต์ใช้องค์ความรู้ ประยุกต์ใช้องค์ความรู้ได้ ประยุกต์ใช้องค์ ประยุกต์ใช้องค์ความรู้ ไม่สามารถ</p>\n<p>ตามกรอบวิชาชีพการ อย่างถูกต้อง ครอบคลุม ความรู้ได้ดีในบริบท ได้บางส่วน แตย่ ังขาด ประยุกต์ใช้องค์</p>\n<p>สาธารณสุขชุมชนเพื่อ และเหมาะสมในทุกบริบท พหุวัฒนธรรม แต่ยัง ความเหมาะสมในบาง ความรู้ได้อย่าง</p>\n<p>ปฏิบัติงานอนามัยสิ่งแวดล้อม พหุวัฒนธรรม มีข้อผิดพลาด จุด เหมาะสม</p>\n<p>โดยคำนึงถึงบริบทพหุ เล็กน้อย</p>\n<p>วัฒนธรรมระหว่างการ</p>\n<p>ปฏิบัติงานสหกจิ ศึกษา</p>\n<p>CLO3 ประยุกต์ใช้ความรดู้ ้าน เสนอแนวทางการจัดการ เสนอแนวทางไดด้ ี แต่ เสนอแนวทางได้ใน ไม่สามารถเสนอ</p>\n<p>อนามัยสิ่งแวดล้อมในการ หรือแนวคิดนวัตกรรมได้ ยังขาดรายละเอียดใน ระดับพื้นฐาน แตย่ ัง แนวทางที่</p>\n<p>เสนอแนะการจัดการหรือ อย่างชัดเจน สร้างสรรค์ บางจุด ขาดความเชื่อมโยงกับ เหมาะสมได ้</p>\n<p>แนวคิดนวัตกรรม และมีความเป็นไปได ้ ปัญหา</p>\n<p>เพื่อแก้ไขปัญหาด้านอนามัย</p>\n<p>สิ่งแวดล้อมระหว่างการ</p>\n<p>ปฏิบัติงานสหกจิ ศึกษา</p>\n<p>CLO4 ประยุกต์ใช้ความรู้ ใช้ความรู้ด้าน ใช้ความรู้ไดด้ ี แต่ยังมี ใช้ความรู้ได้บางส่วน ไม่สามารถใช้</p>\n<p>ด้านวิทยาศาสตร์คณิตศาสตร์ วิทยาศาสตร์ คณติ ศาสตร์ ข้อผิดพลาดเล็กน้อย แต่ยังขาดความชัดเจน ความรู้ได้อย่าง</p>\n<p>สถิติ ด้านวิทยาศาสตร์ และสถติ ิได้อย่างถูกต้อง ในบางจุด เหมาะสม</p>\n<p>สุขภาพ ในการเฝ้าระวัง และ เหมาะสมในทุก</p>\n<p>การป้องกันโรคจากการ สถานการณ ์</p>\n<p>ประกอบอาชีพและ</p>\n<p>สิ่งแวดล้อมระหว่างการ</p>\n<p>ปฏิบัติงานสหกจิ ศึกษา</p>\n<h3 class=\"domain-title\">(2) ด้านทักษะ (Skills)</h3>\n<p>CLO7 แสดงทักษะในการให้ ให้คำปรึกษาได้อย่าง ให้คำปรึกษาได้ดี แต่ ให้คำปรึกษาได้ ไม่สามารถให้</p>\n<p>คำปรึกษาเพื่อป้องกันและลด ถูกต้อง ครอบคลุม และ ยังมีข้อขาดตก บางส่วน แต่ยังขาด คำปรึกษาได้อย่าง</p>\n<p>ปัจจัยสิ่งแวดล้อมที่มผี ลต่อ เหมาะสมกับมาตรฐาน เล็กน้อย ความครบถ้วน เหมาะสม</p>\n<p>สุขภาพภายใต้มาตรฐานการ วิชาชีพ</p>\n<p>ปฏิบัติงานทางวิชาชีพใน</p>\n<p>สถานประกอบการสหกิจ</p>\n<p>ศึกษา</p>\n<p>CLO8 ปฏบิ ัติการออกแบบ ออกแบบและดำเนิน ออกแบบและดำเนิน ออกแบบและดำเนิน ไม่สามารถ</p>\n<p>และดำเนินการโครงการสห โครงการได้อย่างสมบูรณ์ โครงการได้ดี แต่ยังมี โครงการได้บางส่วน ออกแบบและ</p>\n<p>กิจศึกษาเพื่อส่งเสริม ป้องกัน ครอบคลมุ และมี จุดที่ต้องปรับปรุง แต่ยังขาดความ ดำเนินโครงการได้</p>\n<p>และแก้ไขปญั หาสุขภาพและ ประสิทธภิ าพ สมบูรณ ์ อย่างเหมาะสม</p>\n<p>สิ่งแวดล้อม</p>\n<p>ผลการเรียนรู้ที่คาดหวัง ดีมาก ดี พอใช้ ต้องปรับปรุง</p>\n<p>(4 คะแนน) (3 คะแนน) (2 คะแนน) (1 คะแนน)</p>\n<p>CLO9 แสดงทักษะการสื่อสาร สื่อสารได้อย่างชัดเจน สื่อสารไดด้ ี แต่ยังมี สื่อสารได้บางส่วน แต่ ไม่สามารถสื่อสาร</p>\n<p>อย่างมีประสิทธิภาพทั้งใน ครอบคลมุ และเหมาะสม ข้อขาดตกเล็กน้อย ยังขาดประสิทธิภาพใน ได้อย่างชัดเจน</p>\n<p>ภาษาไทย และภาษาอื่น ๆ กับผู้ฟัง บางจุด</p>\n<p>ตามที่สถานประกอบการ</p>\n<p>กำหนด ผ่านรายงานและการ</p>\n<p>นำเสนอระหว่างการปฏิบัติงาน</p>\n<p>สหกิจศึกษา</p>\n<p>CLO10 แสดงทักษะการ ทำงานร่วมกับทีมได้อย่าง ทำงานร่วมกับทีมได้ดี ทำงานร่วมกับทีมได้ใน ไม่สามารถทำงาน</p>\n<p>ทำงานร่วมกับผู้อื่นในทีมที่ ราบรื่น เคารพความ แต่ยังมีข้อขัดแย้ง ระดับพื้นฐาน แตย่ ัง ร่วมกับทีมได ้</p>\n<p>หลากหลาย โดยเคารพความ คิดเห็นของผู้อื่น และ เล็กน้อย ขาดความกลมเกลียว</p>\n<p>คิดเห็นที่แตกต่างในระหว่าง บรรลเุป้าหมาย</p>\n<p>การปฏิบัตสิ หกิจศึกษา</p>\n<h3 class=\"domain-title\">(3) ด้านจริยธรรม (Ethics)</h3>\n<p>CLO12 ปฏิบตั ิงานด้วยความ แสดงความรับผดิ ชอบและ แสดงความ แสดงความรับผดิ ชอบ ไม่แสดงความ</p>\n<p>รับผิดชอบต่อตนเอง ผู้อื่น จรรยาบรรณวิชาชีพได้ รับผิดชอบได้ดี แตย่ ัง ในระดับพื้นฐาน แต่ยัง รับผิดชอบตาม</p>\n<p>และสังคม โดยปฏิบัตติ าม อย่างดีเยี่ยม มีข้อขาดตกเล็กน้อย ขาดความต่อเนื่อง จรรยาบรรณ</p>\n<p>จรรยาบรรณวิชาชีพตลอด</p>\n<p>การปฏิบัติงานสหกิจศึกษา</p>\n<h3 class=\"domain-title\">(4) ด้านลักษณะบุคคล (Character)</h3>\n<p>CLO15 แสดงออกถึงการมี แสดงภาวะผู้นำและ แสดงภาวะผู้นำและ แสดงภาวะผู้นำและ ไม่แสดงภาวะผู้นำ</p>\n<p>ภาวะผู้นำและทำงานร่วมกับ ทำงานร่วมกับผู้อื่นได้ ทำงานร่วมกับผู้อื่นได้ ทำงานร่วมกับผู้อื่นได้ และไม่สามารถ</p>\n<p>ผู้อื่นในสถานประกอบการสห อย่างราบรื่น เคารพความ ดี แม้มีข้อขัดแย้ง บางส่วน แต่ยังขาด ทำงานร่วมกับ</p>\n<p>กิจศึกษาอย่างมีจิตอาสา คิดเห็นของทีม และ เล็กน้อย แต่ยัง ความชัดเจนหรือมีข้อ ผู้อื่นได้อยา่ ง</p>\n<p>สนับสนุนการทำงานของ สามารถแก้ไขได้และ ขัดแย้งที่ส่งผลต่อการ เหมาะสม</p>\n<p>ทีมให้บรรลุเป้าหมาย ทำให้ทีมเดินหน้า ทำงานของทีม</p>\n<p>อย่างมีประสิทธิภาพ ต่อไป</p>\n<p>หลักสูตรวิทยาศาสตรบัณฑิตสาขาอนามัยสิ่งแวดล้อม</p>\n<p>(หลักสตู รปรับปรุง พ.ศ. 2564)</p>\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของหลักสูตร (Program Learning Outcomes: PLOs)</h2>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO1</span> <span class=\"lo-desc\">วิเคราะห์ความสัมพันธ์ระหว่างปัจจัยสิ่งแวดล้อมกับสุขภาพมนุษย์</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO2</span> <span class=\"lo-desc\">ตรวจสอบ เฝ้าระวังประเมินปัจจัยสงแวดล้อมที่มีผลกระทบต่อสขภาพมนุษย์</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO3</span> <span class=\"lo-desc\">ป้องกันและควบคุมปัจจัยเสี่ยงต่อสุขภาพมนุษย์</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO4</span> <span class=\"lo-desc\">ควบคุมและอำนวยการการปฏิบัติงานทางด้านอนามัยสิ่งแวดล้อม</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO5</span> <span class=\"lo-desc\">ออกแบบกระบวนการ และให้คําปรึกษา เพื่อป้องกันและลดปัจจัยสิ่งแวดล้อมที่มีผลต่อสุขภาพ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO6</span> <span class=\"lo-desc\">สื่อสารความเสี่ยงด้านอนามัยสิ่งแวดล้อม</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO7</span> <span class=\"lo-desc\">มีภาวะผู้นํา และคุณธรรมจริยธรรม</span></div>\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษา (Course Learning Outcome: CLO)</h2>\n<p>CLO1 วิเคราะห์ความสัมพันธ์ระหว่างปัจจัยสิ่งแวดล้อมต่อสุขภาพของมนุษย์ในการปฏิบัติงานสหกิจศึกษา</p>\n<p>CLO2 ตรวจสอบ เฝ้าระวัง และประเมินปัจจัยสิ่งแวดล้อมที่ส่งผลกระทบต่อสุขภาพมนุษย์ในการปฏิบัติงานสหกิจ</p>\n<p>ศึกษา</p>\n<p>CLO3 เสนอมาตรการป้องกันและควบคุมปัจจัยเสี่ยงต่อสุขภาพในการปฏิบัติงานสหกิจศึกษา</p>\n<p>CLO4 ปฏิบัติงานสหกิจศึกษาด้านอนามัยสิ่งแวดล้อมได้ตามวัตถุประสงค์และความต้องการของสถานประกอบการ</p>\n<p>CLO5 ออกแบบกระบวนการและให้คำปรึกษาด้านอนามัยสิ่งแวดล้อมให้กับสถานประกอบการได้อย่างถูกต้องตาม</p>\n<p>หลักวิชาการ</p>\n<p>CLO6 สื่อสารผลการปฏิบัติสหกิจและโครงงานได้อย่างเข้าใจ</p>\n<p>CLO7 แสดงออกถึงความเป็นผู้นำและปฏิบัติตัวตามวัฒนธรรมขององค์กรอย่างมีคุณธรรมและจริยธรรม</p>\n<h2 class=\"section-title\">แบบประเมินผลการปฏิบัติสหกิจศึกษาตามผลลัพธ์การเรียนรู้ที่คาดหวัง</h2>\n<p>ผลการเรียนรู้ที่คาดหวัง ดีมาก ดี พอใช้ ต้องปรับปรุง</p>\n<p>(4 คะแนน) (3 คะแนน) (2 คะแนน) (1 คะแนน)</p>\n<p>CLO1 วิเคราะห์ วิเคราะหค์ วามสัมพันธ์ วิเคราะหไ์ ด้ถูกต้อง วิเคราะหไ์ ด้บางส่วน ไม่สามารถวเิคราะห์</p>\n<p>ความสัมพันธร์ ะหว่างปัจจยั ได้อย่างถูกต้อง ในภาพรวม แต่ขาด แต่ยังขาดความ ความสัมพันธไ์ ด้</p>\n<p>สิ่งแวดล้อมต่อสุขภาพของ ครอบคลมุ และแสดง รายละเอียดในบาง เชื่อมโยงที่ชัดเจน อย่างถูกต้องหรือ</p>\n<p>มนุษย์ในการปฏิบตั ิงานสห ความเข้าใจเชิงลึก จุด เหมาะสม</p>\n<p>กิจศึกษา</p>\n<p>CLO2 ตรวจสอบ เฝ้าระวัง ตรวจสอบ เฝ้าระวัง ตรวจสอบและ ตรวจสอบได้บางส่วน ไม่สามารถ</p>\n<p>และประเมินปจั จัย และประเมินปจั จัย ประเมินไดด้ ี แต่ขาด แต่ยังขาดการประเมิน ตรวจสอบและ</p>\n<p>สิ่งแวดล้อมทสี่ ่งผลกระทบ สิ่งแวดล้อมได้อย่าง ความละเอียดในบาง ที่เหมาะสมหรือ ประเมินได้อยา่ ง</p>\n<p>ต่อสุขภาพมนุษย์ในการ ถูกต้อง ครอบคลุม และ ประเด็น ครบถ้วน ถูกต้อง</p>\n<p>ปฏิบัติงานสหกจิ ศึกษา ครบถ้วน</p>\n<p>ผลการเรียนรู้ที่คาดหวัง ดีมาก ดี พอใช้ ต้องปรับปรุง</p>\n<p>(4 คะแนน) (3 คะแนน) (2 คะแนน) (1 คะแนน)</p>\n<p>CLO3 เสนอมาตรการ เสนอมาตรการที่ชัดเจน เสนอมาตรการไดด้ ี เสนอมาตรการได้ ไม่สามารถเสนอ</p>\n<p>ป้องกันและควบคุมปัจจัย ใช้ได้จริง และมีความ แต่ยังขาด บางส่วน แต่ขาดความ มาตรการที่</p>\n<p>เสี่ยงต่อสุขภาพในการ เหมาะสมตามหลัก รายละเอียดใน ชัดเจนหรือความ เหมาะสมได ้</p>\n<p>ปฏิบัติงานสหกจิ ศึกษา วิชาการ บางส่วน เหมาะสม</p>\n<p>CLO4 ปฏิบัติงานสหกิจ ปฏิบัติงานได้ครบถ้วน ปฏิบัติงานได้ตรงตาม ปฏิบัติงานได้บางส่วน ไม่สามารถ</p>\n<p>ศึกษาด้านอนามัย ตรงตามวตั ถุประสงค์ วัตถุประสงค์ แต่ยัง แต่ยังไมส่ อดคล้องกับ ปฏิบัติงานได้ตรง</p>\n<p>สิ่งแวดล้อมไดต้ าม ของสถานประกอบการ ขาดประสิทธิภาพใน วัตถุประสงค์ทั้งหมด ตามวัตถุประสงค ์</p>\n<p>วัตถุประสงค์และความ และเกินความคาดหวัง บางส่วน</p>\n<p>ต้องการของสถาน</p>\n<p>ประกอบการ</p>\n<p>CLO5 ออกแบบ ออกแบบกระบวนการ ออกแบบ ออกแบบและให้ ไม่สามารถออกแบบ</p>\n<p>กระบวนการและให้ และให้คำปรึกษาได้ กระบวนการไดด้ ี แต่ คำปรึกษาได้บางส่วน กระบวนการหรือให้</p>\n<p>คำปรึกษาด้านอนามัย อย่างถูกต้อง ครบถ้วน ยังขาดรายละเอียด แต่ยังไมส่ มบรู ณ ์ คำปรึกษาได้อย่าง</p>\n<p>สิ่งแวดล้อมให้กับสถาน และเหมาะสมกับ ในบางประเด็น เหมาะสม</p>\n<p>ประกอบการได้อย่างถูกต้อง สถานการณ ์</p>\n<p>ตามหลักวิชาการ</p>\n<p>CLO6 สื่อสารผลการปฏิบัติ สื่อสารผลการปฏิบัติงาน สื่อสารไดด้ ี แต่ยัง สื่อสารได้บางส่วน แต่ ไม่สามารถสื่อสารผล</p>\n<p>สหกิจและโครงงานได้อย่าง ได้อย่างชัดเจน เขา้ ใจ ขาดความชัดเจนใน ยังขาดความสมบูรณ์ การปฏิบัติงานได้</p>\n<p>เข้าใจ ง่าย และครบถ้วน บางส่วน หรือประสิทธิภาพ อย่างเหมาะสม</p>\n<p>CLO7 แสดงออกถึงความ แสดงภาวะผู้นำได้อย่าง แสดงภาวะผู้นำได้ดี แสดงภาวะผู้ \"lo-code\">PLO3</span> <span class=\"lo-desc\">วิพากษ์ วิจารณ์ สนับสนุน โต้แย้ง โดยใช้แนวคิด ทฤษฎี หลักกฎหมาย เพื่อนำไปสู่ข้อยุติ การเสนอทางออกหรือกระบวนการยุติธรรมทางเลือกอื่นได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO4</span> <span class=\"lo-desc\">ประยุกต์ความรู้ทางด้านกฎหมายเพื่อนำไปใช้ในการจัดทำเอกสารทางกฎหมาย และการปฏิบัติงานตามวิชาชีพทางกฎหมายได้</span></div>\n\n<h3 class=\"domain-title\">2) ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO5</span> <span class=\"lo-desc\">มีทักษะการวิจัยทางกฎหมายโดยเชื่อมโยงแบบบูรณาการกับศาสตร์อื่น ๆ ที่เกี่ยวข้องได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO6</span> <span class=\"lo-desc\">มีทักษะการสื่อสารภาษาไทยและภาษาอังกฤษเพื่อใช้ในชีวิตประจำวันและในการทำงานด้านกฎหมาย ทั้งการฟัง พูด อ่าน เขียน และเสนอผลงานได้ตามวัตถุประสงค์ ในกรณีที่นักศึกษาเลือกภาษาจีนสามารถสื่อสารภาษาจีนในชีวิตประจำวันได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO7</span> <span class=\"lo-desc\">มีทักษะในการประยุกต์ใช้เทคโนโลยีสารสนเทศในการค้นคว้าเพื่อประโยชน์แก่การพัฒนา</span></div>\n<p>องค์ความรู้อย่างรอบด้าน โดยครอบคลุมทั้งกฎหมายไทย กฎหมายต่างประเทศ รวมถึงสนธิสัญญาระหว่างประเทศ</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO8</span> <span class=\"lo-desc\">มีทักษะการดูเลตนเอง เพื่อสร้างสุขภาวะ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO9</span> <span class=\"lo-desc\">มีทักษะการปฏิบัติงานที่เกี่ยวข้องกับวิชาชีพทางกฎหมาย การให้คำปรึกษาด้วยการใช้และการตีความกฎหมายโดยคำนึงถึงหลักความยุติธรรม และหลักนิติธรรม</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO10</span> <span class=\"lo-desc\">มีทักษะการคิดวิเคราะห์เพื่อวินิจฉัยปัญหาโดยใช้ทฤษฎี หลักการ แนวคิด บทบัญญัติของกฎหมายเฉพาะด้านหรือกฎหมายพิเศษไปปรับใช้กับข้อเท็จจริงต่าง ๆ ที่เกิดขึ้น</span></div>\n\n<h3 class=\"domain-title\">3) ด้านจริยธรรม (Ethic)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO11</span> <span class=\"lo-desc\">แสดงออกถึงความซื่อสัตย์ ความกตัญญู ความรับผิดชอบ เคารพกฎระเบียบ และประพฤติตนตามจรรยาบรรณวิชาชีพ</span></div>\n\n<h3 class=\"domain-title\">4) ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO12</span> <span class=\"lo-desc\">แสดงออกถึงความเป็นผู้นำ มีจิตอาสา มีวินัย สามารถทำงานร่วมกับผู้อื่น ยอมรับฟังความคิดเห็นและความเห็นที่แตกต่าง ประพฤติปฏิบัติตนอย่างมีนิติทรรศนะ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO13</span> <span class=\"lo-desc\">แสดงออกถึงความใฝ่รู้ใฝ่เรียน และพัฒนาตนเองอย่างต่อเนื่อง</span></div>\n\n<h2 class=\"section-title\">แบบประเมินผลการปฏิบัติสหกิจศึกษาตามผลลัพธ์การเรียนรู้ที่คาดหวัง</h2>\n\n<h4 class=\"table-marker\">[TABLE 1]</h4>\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษา (Learning Outcome: LO)</h2>\n<h3 class=\"domain-title\">ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">ผู้เรียนสามารถระบุและแก้ปัญหาที่ซับซ้อนในงานที่ได้รับมอบหมายในสถานประกอบการ โดยประยุกต์หลักการทางวิชาชีพทางกฎหมายได้อย่างเหมาะสม</span></div>\n\n<h3 class=\"domain-title\">ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">ผู้เรียนสามารถรวบรวม วิเคราะห์ และแปลผลข้อมูลจากการปฏิบัติงานในสถานประกอบการ เพื่อหาข้อสรุปที่เป็นประโยชน์</span></div>\n\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">ผู้เรียนสามารถสื่อสารกับเพื่อนร่วมงานและบุคคลในสถานประกอบการด้วยภาษาอังกฤษได้อย่างเหมาะสม เพื่อให้การทำงานสำเร็จลุล่วงตามเป้าหมาย</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">ผู้เรียนสามารถเรียนรู้และพัฒนาทักษะใหม่ที่เกี่ยวข้องกับงานในสถานประกอบการด้วยตนเอง</span></div>\n\n<h3 class=\"domain-title\">ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">ผู้เรียนสามารถปฏิบัติงานด้วยความรับผิดชอบและคำนึงถึงจริยธรรมในวิชาชีพ โดยพิจารณาผลกระทบต่อเศรษฐกิจ สังคม และสิ่งแวดล้อม</span></div>\n\n<h3 class=\"domain-title\">ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO6</span> <span class=\"lo-desc\">ผู้เรียนสามารถทำงานร่วมกับทีม ได้อย่างมีประสิทธิภาพ พร้อมทั้งแสดงบทบาทความเป็นผู้นำและการร่วมมือที่ดีตามสถานะของตนเองในทีม</span></div>\n\n<h4 class=\"table-marker\">[TABLE 2]</h4>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table\">\n<tr><td>ผลการเรียนรู้ที่คาดหวัง</td><td>ผลการประเมิน</td></tr>\n</table></div>\n<h3 class=\"domain-title\">(1) ด้านความรู้ (Knowledge) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">ผู้เรียนสามารถระบุและแก้ปัญหาที่ซับซ้อนในงานที่ได้รับมอบหมายในสถานประกอบการ โดยประยุกต์หลักการทางวิชาชีพทางกฎหมายได้อย่างเหมาะสม |   5 (ยอดเยี่ยม): ระบุและแก้ปัญหาที่ซับซ้อนได้อย่างครบถ้วน พร้อมเสนอแนวทางแก้ไขที่สร้างสรรค์ มีประสิทธิภาพสูง และตอบโจทย์ความต้องการของสถานประกอบการได้อย่างสมบูรณ์</span></div>\n<p>  4 (ดีมาก): ระบุและแก้ปัญหาได้ในระดับดี พร้อมเสนอแนวทางแก้ไขที่เหมาะสม แม้จะมีข้อบกพร่องเล็กน้อยแต่ไม่กระทบต่อคุณภาพโดยรวม</p>\n<p>  3 (ดี): ระบุปัญหาและแก้ไขได้ในระดับพื้นฐาน แต่ข้อเสนอแนวทางแก้ไขยังขาดความสมบูรณ์ในบางส่วน</p>\n<p>  2 (พอใช้): ระบุปัญหาได้บางส่วน แต่ไม่สามารถแก้ไขได้อย่างเหมาะสม ต้องการคำแนะนำอย่างใกล้ชิด</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถระบุหรือแก้ปัญหาได้ และไม่มีข้อเสนอแนะแนวทางแก้ไข</p>\n<h3 class=\"domain-title\">(2) ด้านทักษะ (Skills) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">ผู้เรียนสามารถรวบรวม วิเคราะห์ และแปลผลข้อมูลจากการปฏิบัติงานในสถานประกอบการได้ |   5 (ยอดเยี่ยม): วิเคราะห์ข้อมูลได้อย่างถูกต้อง ครบถ้วน และแปลผลได้ชัดเจน พร้อมข้อสรุปที่นำไปใช้ได้จริง</span></div>\n<p>  4 (ดีมาก): วิเคราะห์ข้อมูลได้ดีในระดับที่เหมาะสม พร้อมข้อสรุปที่เป็นประโยชน์ แม้จะมีข้อผิดพลาดเล็กน้อย</p>\n<p>  3 (ดี): วิเคราะห์ข้อมูลได้ในระดับพื้นฐาน แต่ข้อสรุปยังขาดความชัดเจนและความสมบูรณ์ในบางส่วน</p>\n<p>  2 (พอใช้): วิเคราะห์ข้อมูลได้เพียงบางส่วน และข้อสรุปยังไม่ชัดเจน ต้องการคำแนะนำเพิ่มเติม</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถวิเคราะห์ข้อมูลหรือแปลผลได้</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">ผู้เรียนสามารถสื่อสารกับเพื่อนร่วมงานและบุคคลในสถานประกอบการด้วยภาษาอังกฤษได้ |   5 (ยอดเยี่ยม): สื่อสารได้ชัดเจน เข้าใจง่าย ใช้ภาษาอังกฤษได้อย่างเหมาะสมกับสถานการณ์</span></div>\n<p>  4 (ดีมาก): สื่อสารได้ดีในระดับที่เหมาะสม แม้จะมีข้อผิดพลาดเล็กน้อยที่ไม่กระทบต่อการทำงาน</p>\n<p>  3 (ดี): สื่อสารได้ในระดับพื้นฐาน แต่ยังมีข้อผิดพลาดหรือจุดที่ไม่ชัดเจนในบางสถานการณ์</p>\n<p>  2 (พอใช้): สื่อสารได้บ้าง แต่ยังไม่เหมาะสมกับสถานการณ์หรือมีข้อผิดพลาดที่ส่งผลต่อการทำงาน</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถสื่อสารได้อย่างเหมาะสมในสถานการณ์จริง</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">ผู้เรียนสามารถเรียนรู้และพัฒนาทักษะใหม่ที่เกี่ยวข้องกับงานในสถานประกอบการด้วยตนเอง |   5 (ยอดเยี่ยม): นักศึกษาสามารถเรียนรู้ทักษะใหม่ได้อย่างรวดเร็วและนำไปประยุกต์ใช้ในงานได้อย่างมีประสิทธิภาพ มีการริเริ่มในการศึกษาข้อมูลเพิ่มเติมด้วยตัวเอง และแสดงผลลัพธ์ที่ชัดเจน</span></div>\n<p>  4 (ดีมาก): นักศึกษาสามารถเรียนรู้ทักษะใหม่ได้ดี และสามารถนำไปใช้ในงานได้ในระดับที่เหมาะสม แม้จะมีการปรับปรุงในบางส่วน</p>\n<p>  3 (ดี): นักศึกษาสามารถเรียนรู้ทักษะใหม่ได้ในระดับพื้นฐาน และเริ่มต้นนำไปใช้ในงานบางส่วน แต่ยังขาดความสมบูรณ์</p>\n<p>  2 (พอใช้): นักศึกษาสามารถเรียนรู้ทักษะใหม่ได้ในระดับที่จำกัด และยังไม่สามารถประยุกต์ใช้ได้อย่างเหมาะสม</p>\n<p>  1 (ต้องปรับปรุง): นักศึกษาไม่สามารถเรียนรู้ทักษะใหม่ได้ด้วยตนเอง และขาดความพยายามในการพัฒนาตนเอง</p>\n<h3 class=\"domain-title\">(3) ด้านจริยธรรม (Ethics) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">ผู้เรียนสามารถปฏิบัติงานด้วยความรับผิดชอบและคำนึงถึงจริยธรรมในวิชาชีพ |   5 (ยอดเยี่ยม): ปฏิบัติตามกฎระเบียบทุกข้ออย่างเคร่งครัด พร้อมแสดงความซื่อสัตย์และความรับผิดชอบอย่างชัดเจน</span></div>\n<p>  4 (ดีมาก): ปฏิบัติตามกฎระเบียบส่วนใหญ่ และแสดงความรับผิดชอบในงานได้ดี แม้จะมีข้อผิดพลาดเล็กน้อย</p>\n<p>  3 (ดี): ปฏิบัติตามกฎระเบียบได้ในระดับพื้นฐาน แต่ยังต้องการการปรับปรุงในบางส่วน</p>\n<p>  2 (พอใช้): ปฏิบัติตามกฎระเบียบได้เพียงบางข้อ และยังมีการละเลยหรือผิดพลาดบ้าง</p>\n<p>  1 (ต้องปรับปรุง): ไม่ปฏิบัติตามกฎระเบียบ และแสดงถึงความขาดความรับผิดชอบในงาน</p>\n<h3 class=\"domain-title\">(4) ด้านลักษณะบุคคล (Character) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO6</span> <span class=\"lo-desc\">ผู้เรียนสามารถทำงานร่วมกับทีม ได้อย่างมีประสิทธิภาพ พร้อมทั้งแสดงบทบาทความเป็นผู้นำและการร่วมมือที่ดี |   5 (ยอดเยี่ยม): มีบทบาทสำคัญในทีม ช่วยสร้างสภาพแวดล้อมการทำงานที่ดี และแสดงภาวะผู้นำได้อย่างชัดเจน</span></div>\n<p>  4 (ดีมาก): ทำงานร่วมกับทีมได้ดีในระดับที่เหมาะสม และปฏิบัติงานตามบทบาทที่ได้รับอย่างสมบูรณ์</p>\n<p>  3 (ดี): ทำงานร่วมกับทีมได้ในระดับพื้นฐาน แต่ยังต้องปรับปรุงในบางด้าน</p>\n<p>  2 (พอใช้): ทำงานร่วมกับทีมได้บางส่วน แต่มีปัญหาในการสื่อสารหรือการมีส่วนร่วม</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถทำงานร่วมกับทีมได้อย่างเหมาะสม</p>"}]}, {"faculty": "สำนักวิชาการจัดการ", "curricula": [{"name": "หลักสูตรศิลปะการประกอบอาชีพ", "file": "9. สำนักวิชากการจัดการ 4 หลักสูตร\\LO สหกิจหลักสูตรศิลปะการประกอบอาชีพ.pdf", "ext": "pdf", "html": "<p>หลักสูตรบริหารธุรกิจบัณฑติ สาขาศิลปะการประกอบอาหารอย่างมืออาชีพ</p>\n<p>(หลักสูตรปรับปรุง พ.ศ. 2567)</p>\n<p>สาขาวิชาการท่องเที่ยวและโปรเชฟ สำนักวิชาการจัดการ</p>\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของหลักสูตร (Program Learning Outcomes: PLO)</h2>\n<h3 class=\"domain-title\">1) ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO1</span> <span class=\"lo-desc\">อธิบายแนวคิดและการเปลี่ยนแปลงสถานการณ์ทางสังคม วัฒนธรรม เศรษฐกิจ สิ่งแวดล้อม และ</span></div>\n<p>เทคโนโลยี ของอุตสาหกรรมบริการอาหาร</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO2</span> <span class=\"lo-desc\">อธิบายหลักการจัดการวัตถุดิบ การเตรียม เเละการประกอบอาหาร ภายใต้กฎกระทรวงสาธารณสุข</span></div>\n<p>สุขลักษณะของสถานที่จำหน่ายอาหาร พ.ศ. 2561</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO3</span> <span class=\"lo-desc\">อธิบายแนวคิดด้านบริหารธุรกิจของอุตสาหกรรมบริการอาหารภายใต้การเปลี่ยนแปลงของ เทคโนโลยี</span></div>\n<p>สารสนเทศในยุคดิจิทัล</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO4</span> <span class=\"lo-desc\">ประยุกต์ใช้องค์ความรู้ด้านการจัดการและบริหารธุรกิจ เพื่อบริหารจัดการธุรกิจในอุตสาหกรรมบริการ</span></div>\n<p>อาหาร</p>\n<h3 class=\"domain-title\">2) ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO5</span> <span class=\"lo-desc\">มีทักษะการสื่อสารภาษาไทยและภาษาอังกฤษ เพื่อใช้ในชีวิตประจำวัน และในการทำงาน ด้าน</span></div>\n<p>อุตสาหกรรมบริการอาหาร ทั้งการฟัง พูด อ่าน เขียน และเสนอผลงานได้ตามวัตถุประสงค์ ในกรณีที่นักศึกษา</p>\n<p>เลือกภาษาจีน สามารถสื่อสารในชีวิตประจำวันได้</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO6</span> <span class=\"lo-desc\">มีทักษะการใช้เทคโนโลยีสารสนเทศในการสืบค้นข้อมูล วิเคราะห์ข้อมูล นำเสนอ และมีทักษะการใช้</span></div>\n<p>โปรแกรมประยุกต์ในงานด้านอุตสาหกรรมบริการอาหาร</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO7</span> <span class=\"lo-desc\">มีทักษะการปรับตัวในสถานการณ์ที่มีการเปลี่ยนแปลงในด้านสังคมวัฒนธรรม เศรษฐกิจและ</span></div>\n<p>สิ่งแวดล้อม</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO8</span> <span class=\"lo-desc\">มีทักษะการประกอบอาหารอย่างถูกต้องและเหมาะสมกับรายการอาหาร ด้วยเทคนิคการประกอบ</span></div>\n<p>อาหารโดย ใช้ความร้อนชื้น ใช้ความร้อนแห้ง และใช้ความร้อนผสมผสาน (Moist-heat cooking methods, dry-</p>\n<p>heat cooking methods, and combination cooking methods) ตามกฎกระทรวงสาธารณสุข สุขลักษณะ</p>\n<p>ของสถานที่จำหน่ายอาหาร พ.ศ. 2561</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO9</span> <span class=\"lo-desc\">มีทักษะการออกแบบรายการอาหารแต่ละประเภทอย่างสร้างสรรค์ถูกต้องและเหมาะสมกับผู้บริโภค</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO10</span> <span class=\"lo-desc\">มีทักษะในการวางแผน คิดวิเคราะห์ การดำเนินงาน การจัดการ และการแก้ไขปัญหาในการปฏิบัติงาน</span></div>\n<p>ด้านอุตสาหกรรมบริการอาหารได้อย่างเหมาะสมตามสถานการณ์</p>\n<h3 class=\"domain-title\">3) ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO11</span> <span class=\"lo-desc\">มีความรับผิดชอบต่อตนเอง ผู้อื่น และสังคม</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO12</span> <span class=\"lo-desc\">มีความกตัญญู ซื่อสัตย์ มีวินัยและปฏิบัติตามกฎระเบียบ</span></div>\n<h3 class=\"domain-title\">4) ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO13</span> <span class=\"lo-desc\">แสดงออกถึงความมีวินัย ภาวะผู้นำ จิตอาสา ทำงานร่วมกับผู้อื่น และสามารถพัฒนาตนเองในงาน</span></div>\n<p>ด้านบริหารธุรกิจ และการประกอบอาหารได้อย่างต่อเนื่อง</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO14</span> <span class=\"lo-desc\">มีความคิดสร้างสรรค์ในการประกอบอาหารได้อย่างเหมาะสม และปลอดภัยเพื่อตอบสนองผู้บริโภคที่</span></div>\n<p>หลากหลาย</p>\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษา (Learning Outcome: LO)</h2>\n<h3 class=\"domain-title\">(1) ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">สามารถประยุกต์ใช้องค์ความรู้ทางด้านการจัดการวัตถุดิบ การเตรียม การประกอบอาหารและการบริหาร</span></div>\n<p>และการจัดการ เพื่อบริหารจัดการธุรกิจในอุตสาหกรรมบริการอาหารได้</p>\n<h3 class=\"domain-title\">(2) ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">สามารถสื่ออสารภาษาไทยและภาษาอังกฤษ เพื่อใช้ในการทำงาน ด้านอุตสาหกรรมบริการอาหาร ทั้งการ</span></div>\n<p>ฟัง พูด อ่าน เขียน และเสนอผลงานได้ตามวัตถปุ ระสงค์</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">สามารถประยุกต์ใช้เทคโนโลยีสารสนเทศเพื่อสืบค้นข้อมูล วิเคราะห์ข้อมูล นำเสนอข้อมูล และสามารถ</span></div>\n<p>ปรับตัวในสถานการณ์ที่มีการเปลี่ยนแปลงในด้านสังคมวัฒนธรรม เศรษฐกิจและสิ่งแวดล้อม มีความ</p>\n<p>พร้อมในการปฏิบัติงานในอุตสาหกรรมบริการอาหารได้อย่างเหมาะสมตามสถานการณ์</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">สามารถประกอบอาหารอย่างถูกต้องและเหมาะสมกับรายการอาหาร ด้วยเทคนิคการประกอบอาหารโดย</span></div>\n<p>ใช้ความร้อนชื้น ใช้ความร้อนแห้ง และใช้ความร้อนผสมผสาน (Moist-heat cooking methods, dry-</p>\n<p>heat cooking methods, and combination cooking methods) ตามกฎกระทรวงสาธารณสุข</p>\n<p>สุขลักษณะของสถานที่จำหน่ายอาหาร พ.ศ. 2561</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">สามารถออกแบบรายการอาหารแต่ละประเภทอย่างสร้างสรรค์ถูกต้องและเหมาะสมกับผู้บริโภค</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO6</span> <span class=\"lo-desc\">สามารถวางแผนการดำเนินงาน คิดวิเคราะห์ การจัดการบริหารจัดการ และการแก้ไขปัญหาในการ</span></div>\n<p>ปฏิบัติงานด้านอุตสาหกรรมบริการอาหารได้อย่างเหมาะสมตามสถานการณ์</p>\n<h3 class=\"domain-title\">(3) ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO7</span> <span class=\"lo-desc\">สามารถปฏิบัติงานด้วยความรับผิดชอบต่อตนเองและผู้อื่น มีวินัยและปฏิบัติตามกฎระเบียบของสถาน</span></div>\n<p>ประกอบการด้านอุตสาหกรรมบริการอาหารได้อย่างเหมาะสมตามสถานการณ์</p>\n<h3 class=\"domain-title\">(4) ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO8</span> <span class=\"lo-desc\">มีวินัย จิตอาสา สามารถทำงานร่วมกับผู้อื่น และสามารถพัฒนาตนเองในงานด้านบริหารธุรกิจ และการ</span></div>\n<p>ประกอบอาหารได้</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO9</span> <span class=\"lo-desc\">สามารถสร้างสรรค์อาหารโดยใช้เทคนิคการประกอบอาหารได้อย่างเหมาะสม และปลอดภัยเพื่อ</span></div>\n<p>ตอบสนองผู้บริโภคที่หลากหลาย</p>\n<h2 class=\"section-title\">แบบประเมินผลการปฏิบัติสหกิจศึกษาตามผลลัพธ์การเรียนรู้ทคี่ าดหวัง</h2>\n<p>ผลลัพธ์การเรียนรู้ที่คาดหวัง ระดับ ตัวชี้วัด (Indicators)</p>\n<h3 class=\"domain-title\">(1) ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">สามารถประยุกต์ใช้องค์ความรู้ ยอดเยี่ยม (5) - การจัดการวัตถุดิบ: วางแผนและจัดการวัตถุดิบได้อย่างมีประสิทธิภาพสูงสุด โดยคำนึงถึงคุณภาพ ต้นทุน และความยั่งยืน</span></div>\n<p>- การเตรียมและประกอบอาหาร: ดำเนินการเตรียมและประกอบอาหารได้อย่างถูกต้องตามมาตรฐานสากล มีความคิดสร้างสรรค์ และสามารถ</p>\n<p>ทางด้านการจัดการวัตถุดิบ การเตรียม</p>\n<p>ปรับสูตรอาหารให้เหมาะสมกับสถานการณ ์</p>\n<p>การประกอบอาหารและการบริหารและ - การบริหารจัดการ: วางแผนและจัดการงานในครัวและธุรกิจอาหารได้อย่างมีประสิทธิภาพ โดยใช้เครื่องมือและเทคนิคการบริหารที่ทันสมัย</p>\n<p>- การประยุกต์องค์ความรู้: สามารถประยุกต์ใช้ความรเู้พื่อแก้ปัญหาและพัฒนานวัตกรรมในอุตสาหกรรมบริการอาหารได้อย่างมีประสิทธิผล</p>\n<p>การจัดการ เพื่อบริหารจัดการธุรกิจใน</p>\n<div class=\"rubric-level\">ดีมาก (4) - การจัดการวัตถุดิบ: จัดการวัตถุดิบได้ดีในด้านคุณภาพและต้นทุน แต่ยังมีข้อจำกัดเล็กน้อยในด้านการลดของเสียหรือการใช้ทรัพยากรให้เกิด</div>\n<p>อุตสาหกรรมบริการอาหารได้</p>\n<p>ประโยชน์สูงสุด</p>\n<p>- การเตรียมและประกอบอาหาร: เตรียมและประกอบอาหารได้ตามมาตรฐาน มีข้อผิดพลาดเล็กน้อย และสามารถปรับปรุงได้</p>\n<p>- การบริหารจัดการ: จัดการงานในครัวและธรุ กิจอาหารได้ดี แต่ยังขาดการใช้เทคนิคขั้นสูงหรือการพัฒนาเพมิ่ เติม</p>\n<p>- การประยุกต์องค์ความรู้: สามารถประยุกต์ใช้ความรเู้พื่อพัฒนาธรุ กิจได้ดี แต่ยังมีพื้นที่สำหรับการปรับปรุงหรือสร้างสรรค์เพิ่มเติม</p>\n<div class=\"rubric-level\">ดี (3) - การจัดการวัตถุดิบ: จัดการวัตถุดิบได้ในระดับพื้นฐาน มีข้อผิดพลาดบางประการในด้านคุณภาพหรือการควบคุมต้นทุน</div>\n<p>- การเตรียมและประกอบอาหาร: ดำเนินการได้ในระดับพื้นฐาน แต่ยังขาดความคล่องตัวและความละเอียดในกระบวนการ</p>\n<p>- การบริหารจัดการ: จัดการงานในครัวได้ในระดับทั่วไป มีการวางแผนแต่ยังไม่ครอบคลุมทุกมิติของการดำเนินงาน</p>\n<p>- การประยุกต์องค์ความรู้: ประยุกต์ใช้ความรู้ได้ในระดับพื้นฐาน แต่ยังไม่สามารถแก้ปัญหาหรือพัฒนาแนวทางใหม่ๆ ได้อย่างมีประสิทธิภาพ</p>\n<div class=\"rubric-level\">พอใช้ (2) - การจัดการวัตถุดิบ: มีข้อผิดพลาดในการจัดการวัตถุดิบบ่อยครั้ง ไม่สามารถควบคุมคุณภาพและต้นทุนได้อย่างมีประสิทธิภาพ</div>\n<p>- การเตรียมและประกอบอาหาร: ขาดความแม่นยำในกระบวนการเตรียมและประกอบอาหาร ส่งผลต่อคุณภาพของผลิตภัณฑ์</p>\n<p>- การบริหารจัดการ: จัดการงานในครัวได้อย่างไม่เพียงพอ มีปัญหาในด้านการวางแผนและการจัดลำดับความสำคัญ</p>\n<p>- การประยุกต์องค์ความรู้: ขาดทักษะในการประยุกต์ใช้ความรู้เพื่อแก้ปัญหาและพัฒนาธุรกิจ</p>\n<div class=\"rubric-level\">ต้องปรับปรุง (1) - การจัดการวัตถุดิบ: ไม่สามารถจัดการวัตถุดิบได้อย่างเหมาะสม ส่งผลให้เกิดความสูญเสียทั้งคุณภาพและต้นทุน</div>\n<p>- การเตรียมและประกอบอาหาร: กระบวนการเตรียมและประกอบอาหารมีปัญหาอย่างรุนแรง ไม่เป็นไปตามมาตรฐาน</p>\n<p>- การบริหารจัดการ: ขาดความสามารถในการจัดการงานในครัว ส่งผลต่อประสิทธิภาพการทำงานโดยรวม</p>\n<p>- การประยุกต์องค์ความรู้: ไม่สามารถประยุกต์ใช้ความรู้ในสถานการณ์จริง หรือพัฒนาธรุ กิจได้อย่างเหมาะสม</p>\n<p>ผลลัพธ์การเรียนรู้ที่คาดหวัง ระดับ ตัวชี้วัด (Indicators)</p>\n<h3 class=\"domain-title\">(2) ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">สามารถสื่อสารภาษาไทยและ ยอดเยี่ยม (5) - ฟัง: เข้าใจข้อมูลและแนวคิดที่ซับซ้อนทั้งภาษาไทยและภาษาอังกฤษ และสามารถสรุปประเด็นสำคัญได้อย่างถูกต้อง</span></div>\n<p>- พูด: สื่อสารด้วยภาษาไทยและภาษาอังกฤษได้อย่างมั่นใจ ชัดเจน มีความคล่องตัว และใช้คำศัพท์ที่เหมาะสมในบริบทการทำงาน</p>\n<p>ภาษาอังกฤษ เพื่อใช้ในการทำงาน ด้าน</p>\n<p>- อ่าน: วิเคราะห์และตีความเอกสารหรือข้อมูลที่เกี่ยวข้องได้อย่างถูกต้องและรวดเร็วทั้งสองภาษา</p>\n<p>อุตสาหกรรมบริการอาหาร ทั้งการฟัง พูด - เขียน: เขียนรายงาน บันทึก หรืออีเมลทางธุรกิจได้อย่างมืออาชีพในทั้งสองภาษา</p>\n<p>- เสนอผลงาน: นำเสนอแนวคิดหรือผลงานในบริบทที่เป็นทางการได้อย่างโดดเด่น ใช้สื่อช่วยในการนำเสนออย่างมีประสิทธิภาพ</p>\n<p>อ่าน เขียน และเสนอผลงานได้ตาม</p>\n<div class=\"rubric-level\">ดีมาก (4) - ฟัง: เข้าใจข้อมูลและแนวคิดที่ซับซ้อนพอสมควรในภาษาไทยและภาษาอังกฤษ พร้อมสรุปเนื้อหาได้อย่างถูกต้องในระดับดี</div>\n<p>วัตถุประสงค์</p>\n<p>- พูด: สื่อสารภาษาไทยและภาษาอังกฤษได้ดี มีความมั่นใจ แต่ยังมีข้อผิดพลาดเล็กน้อยในด้านโครงสร้างหรือคำศัพท์</p>\n<p>- อ่าน: เข้าใจเอกสารหรือข้อมูลในระดับดี และสามารถสรุปประเด็นสำคัญได้อย่างถูกต้อง</p>\n<p>- เขียน: เขียนข้อความหรือเอกสารทางธุรกิจได้ดี แต่ยังมีข้อผิดพลาดเล็กน้อย</p>\n<p>- เสนอผลงาน: นำเสนอผลงานในบริบทที่เป็นทางการได้ดี มีการใช้สื่อช่วยที่เหมาะสม</p>\n<div class=\"rubric-level\">ดี (3) - ฟัง: เข้าใจข้อมูลในระดับพื้นฐานถึงปานกลางในทั้งสองภาษา แต่ยังมีข้อจำกัดในการเขา้ ใจเนื้อหาที่ซับซ้อน</div>\n<p>- พูด: สื่อสารภาษาไทยและภาษาอังกฤษได้ในระดับใช้งานทั่วไป แต่ยังขาดความคล่องแคล่วและความมั่นใจในบางสถานการณ์</p>\n<p>- อ่าน: อ่านและเข้าใจเอกสารทั่วไปได้ แต่ยังต้องการเวลามากขึ้นในเนื้อหาที่ซับซ้อน</p>\n<p>- เขียน: เขียนเอกสารทางธุรกิจได้ในระดับพื้นฐาน มีข้อผิดพลาดในด้านโครงสร้างหรือคำศัพท์</p>\n<p>- เสนอผลงาน: นำเสนอผลงานได้ในระดับทั่วไป แต่ยังขาดการจัดโครงสร้างที่ชัดเจนหรือความมั่นใจในบางจุด</p>\n<div class=\"rubric-level\">พอใช้ (2) - ฟัง: เข้าใจเฉพาะข้อมูลพื้นฐานในภาษาไทยและภาษาอังกฤษ อาจต้องฟังซ้ำหรือขอคำอธิบายเพิ่มเติม</div>\n<p>- พูด: สื่อสารภาษาไทยและภาษาอังกฤษในระดับพื้นฐานได้ แต่ยังมีข้อผิดพลาดมากในโครงสร้างหรือคำศัพท์</p>\n<p>- อ่าน: อ่านและเข้าใจข้อมูลพื้นฐานได้ แต่มีข้อจำกัดมากในเนื้อหาที่ซับซ้อน</p>\n<p>- เขียน: เขียนข้อความง่าย ๆ ได้ แต่ยังมีปัญหาด้านการจัดโครงสร้างและการใช้คำ</p>\n<p>- เสนอผลงาน: นำเสนอผลงานได้เพียงบางส่วน มีความไม่ชัดเจนและขาดการเตรียมตัว</p>\n<div class=\"rubric-level\">ต้องปรับปรุง (1) - ฟัง: ไม่สามารถเข้าใจข้อมูลที่ได้รับทั้งภาษาไทยและภาษาอังกฤษได้ในระดับที่เพียงพอ</div>\n<p>- พูด: มีข้อจำกัดอย่างมากในการสื่อสาร อาจไม่สามารถสื่อสารความคิดหรือข้อมูลได้อย่างมีประสิทธิภาพ</p>\n<p>- อ่าน: ไม่สามารถอ่านหรือเข้าใจข้อมูลพื้นฐานได้ในทั้งสองภาษา</p>\n<p>- เขียน: เขียนข้อความที่มีความผิดพลาดมาก และไม่สามารถสื่อสารความคิดได้อย่างชัดเจน</p>\n<p>- เสนอผลงาน: ไม่สามารถนำเสนอผลงานได้อย่างชัดเจน และไมม่ ีการใช้สื่อช่วยในการนำเสนอ</p>\n<p>ผลลัพธ์การเรียนรู้ที่คาดหวัง ระดับ ตัวชี้วัด (Indicators)</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">สามารถประยุกต์ใช้เทคโนโลยี ยอดเยี่ยม (5) - การใช้เทคโนโลยี: ใช้เทคโนโลยีสารสนเทศขั้นสูงเพื่อสืบค้น วิเคราะห์ และนำเสนอข้อมูลได้อย่างมีประสิทธิภาพสูงสุด พร้อมพัฒนาวิธีการใหม่ๆ</span></div>\n<p>เพื่อเพิ่มประสิทธิภาพในการทำงาน</p>\n<p>สารสนเทศเพื่อสืบค้นข้อมูล วิเคราะห์</p>\n<p>- การวิเคราะห์ข้อมูล: วิเคราะห์ข้อมูลได้ลึกซึ้ง ครอบคลุม และมีความแม่นยำสูง โดยเชื่อมโยงกับสถานการณ์ปัจจุบัน</p>\n<p>ข้อมูล นำเสนอข้อมูล และสามารถปรับตัว</p>\n<p>- การนำเสนอข้อมูล: นำเสนอข้อมูลได้อย่างสร้างสรรค์ ชัดเจน ใช้เครื่องมือและสื่อที่ทันสมัยในการสื่อสารได้อย่างมืออาชีพ</p>\n<p>ในสถานการณ์ที่มีการเปลี่ยนแปลงในด้าน - การปรับตัว: สามารถปรับตัวได้อย่างรวดเร็วและมีประสิทธิภาพในสถานการณ์เปลี่ยนแปลง ทั้งด้านสังคม วัฒนธรรม เศรษฐกิจ และสิ่งแวดล้อม</p>\n<p>พร้อมให้ข้อเสนอแนะที่เป็นประโยชน์ต่อทีมงานหรือองค์กร</p>\n<p>สังคมวัฒนธรรม เศรษฐกิจและสิ่งแวดล้อม</p>\n<div class=\"rubric-level\">ดีมาก (4) - การใช้เทคโนโลยี: ใช้เทคโนโลยีสารสนเทศได้ดีในการสืบค้น วิเคราะห์ และนำเสนอข้อมูล แต่ยังไม่หลากหลายหรือซับซ้อนมากนัก</div>\n<p>มีความพร้อมในการปฏิบัติงานใน</p>\n<p>- การวิเคราะห์ข้อมูล: วิเคราะห์ข้อมูลได้อย่างถูกต้องและครอบคลุม แต่ยังมีข้อจำกัดในบางมิติ</p>\n<p>อุตสาหกรรมบริการอาหารได้อย่าง - การนำเสนอข้อมูล: นำเสนอข้อมูลได้อย่างชัดเจน ใช้เครื่องมือที่เหมาะสม แต่ยังมีโอกาสในการปรับปรุงความน่าสนใจหรือความลื่นไหล</p>\n<p>- การปรับตัว: ปรับตัวได้ดีในสถานการณ์เปลี่ยนแปลง มีการประยุกต์ความรู้และทักษะได้เหมาะสมในระดับดี</p>\n<p>เหมาะสมตามสถานการณ์</p>\n<div class=\"rubric-level\">ดี (3) - การใช้เทคโนโลยี: ใช้เทคโนโลยีสารสนเทศได้ในระดับพื้นฐาน สามารถสืบค้น วิเคราะห์ และนำเสนอข้อมูลได้ในกรอบที่กำหนด</div>\n<p>- การวิเคราะห์ข้อมูล: วิเคราะห์ข้อมูลได้ในระดับทั่วไป อาจขาดความลึกซึ้งหรือการเชื่อมโยงเชิงกลยุทธ์</p>\n<p>- การนำเสนอข้อมูล: นำเสนอข้อมูลได้ในระดับทั่วไป มีความชัดเจนในบางส่วน แต่ยังขาดการใช้เทคโนโลยีหรือเครื่องมือช่วยที่เหมาะสม</p>\n<p>- การปรับตัว: ปรับตัวได้ในระดับพื้นฐาน มีความยืดหยุ่นในสถานการณ์เปลี่ยนแปลง แต่ยังต้องการคำแนะนำหรือการสนับสนุนเพิ่มเติม</p>\n<div class=\"rubric-level\">พอใช้ (2) - การใช้เทคโนโลยี: ใช้เทคโนโลยีสารสนเทศได้อย่างจำกัด มีข้อผิดพลาดในการสืบค้น วิเคราะห์ หรือการนำเสนอข้อมูล</div>\n<p>- การวิเคราะห์ข้อมูล: วิเคราะห์ข้อมูลได้อย่างผิวเผิน และไม่สามารถเชื่อมโยงกับบริบทได้อย่างเหมาะสม</p>\n<p>- การนำเสนอข้อมูล: การนำเสนอข้อมูลขาดความชัดเจน ใช้เครื่องมือหรือเทคโนโลยีได้ไม่เหมาะสม</p>\n<p>- การปรับตัว: ปรับตัวในสถานการณ์เปลี่ยนแปลงได้ช้า ต้องการการสนับสนุนจากผู้อื่นอย่างมาก</p>\n<div class=\"rubric-level\">ต้องปรับปรุง (1) - การใช้เทคโนโลยี: ไม่สามารถใช้เทคโนโลยีสารสนเทศได้อย่างเหมาะสม มีปัญหาในการสืบค้น วิเคราะห์ และนำเสนอข้อมูล</div>\n<p>- การวิเคราะห์ข้อมูล: ขาดทักษะในการวิเคราะห์ข้อมูลอย่างชัดเจนและถูกต้อง</p>\n<p>- การนำเสนอข้อมูล: นำเสนอข้อมูลได้ไม่ชัดเจน มีปัญหาด้านการจัดการข้อมูลและการสื่อสาร</p>\n<p>- การปรับตัว: ไม่สามารถปรับตัวในสถานการณ์เปลี่ยนแปลงได้ ต้องการการสนับสนุนและคำแนะนำอย่างมาก</p>\n<p>ผลลัพธ์การเรียนรู้ที่คาดหวัง ระดับ ตัวชี้วัด (Indicators)</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">สามารถประกอบอาหารอย่าง ยอดเยี่ยม (5) - เทคนิคการประกอบอาหาร: ดำเนินการประกอบอาหารโดยใช้ความร้อนชื้น ความร้อนแห้ง และความร้อนผสมผสานได้อย่างถูกต้องและแม่นยำ</span></div>\n<p>ตามประเภทของอาหาร พร้อมปรับแต่งเทคนิคให้เหมาะสมกับลักษณะอาหาร</p>\n<p>ถูกต้องและเหมาะสมกับรายการอาหาร</p>\n<p>- คุณภาพของอาหาร: ผลลัพธ์ของอาหารมีคุณภาพยอดเยี่ยมทั้งในด้านรสชาติ เนื้อสัมผัส การนำเสนอ และความสม่ำเสมอ</p>\n<p>ด้วยเทคนิคการประกอบอาหารโดย ใช้</p>\n<p>- สุขลักษณะ: ปฏิบัติตามสุขลักษณะของสถานที่จำหน่ายอาหารตามกฎกระทรวง พ.ศ. 2561 ได้อย่างครบถ้วน มีการจัดการพื้นที่ทำงานและ</p>\n<p>ความร้อนชื้น ใช้ความร้อนแห้ง และใช้ อุปกรณ์ได้สะอาด ปลอดภัย</p>\n<p>- การบริหารเวลา: สามารถบริหารเวลาได้ดีเยี่ยม และส่งมอบอาหารทันเวลาในทุกสถานการณ ์</p>\n<p>ความร้อนผสมผสาน (Moist-heat</p>\n<div class=\"rubric-level\">ดีมาก (4) - เทคนิคการประกอบอาหาร: ใช้เทคนิคการประกอบอาหารตามประเภทของความร้อนได้อย่างถูกต้อง ส่วนใหญ่มีความแม่นยำ แต่ยังมี</div>\n<p>cooking methods, dry-heat cooking</p>\n<p>ข้อผิดพลาดเล็กน้อยในบางขั้นตอน</p>\n<p>methods, and combination cooking - คุณภาพของอาหาร: อาหารที่ได้มีคุณภาพดี มีรสชาติและเนื้อสัมผัสที่เหมาะสม แต่ยังมีโอกาสปรับปรุงในด้านการนำเสนอ</p>\n<p>- สุขลักษณะ: ปฏิบัติตามข้อกำหนดสุขลักษณะของสถานที่จำหน่ายอาหารได้ดี แต่ยังมีบางจุดที่สามารถปรับปรุงให้ดีขึ้น</p>\n<p>methods) ตามกฎกระทรวงสาธารณสุข</p>\n<p>- การบริหารเวลา: สามารถส่งมอบอาหารได้ทันเวลา ส่วนใหญ่จัดการเวลาได้ดี แต่บางครั้งอาจล่าช้าเล็กน้อย</p>\n<p>สุขลักษณะของสถานที่จำหน่ายอาหาร</p>\n<div class=\"rubric-level\">ดี (3) - เทคนิคการประกอบอาหาร: ใช้เทคนิคการประกอบอาหารได้ในระดับพื้นฐาน มีข้อผิดพลาดบางส่วนที่อาจส่งผลต่อคุณภาพของอาหาร</div>\n<p>พ.ศ. 2561 - คุณภาพของอาหาร: อาหารมีคุณภาพระดับทั่วไป รสชาติ เนื้อสัมผัส และการนำเสนอสามารถปรับปรุงได้</p>\n<p>- สุขลักษณะ: ปฏิบัติตามข้อกำหนดด้านสุขลักษณะในระดับพื้นฐาน แต่ยังมีจุดที่ขาดความครบถ้วน เช่น การจัดการความสะอาดอุปกรณ์</p>\n<p>- การบริหารเวลา: มีปัญหาในการบริหารเวลาในบางกรณี ส่งผลให้การประกอบอาหารไม่ทันเวลา</p>\n<div class=\"rubric-level\">พอใช้ (2) - เทคนิคการประกอบอาหาร: ใช้เทคนิคการประกอบอาหารได้อย่างจำกัด มีข้อผิดพลาดที่ส่งผลกระทบต่อผลลัพธ์ของอาหาร</div>\n<p>- คุณภาพของอาหาร: คุณภาพของอาหารไม่เป็นไปตามมาตรฐาน รสชาติและเนื้อสัมผัสไม่สมำ่ เสมอ</p>\n<p>- สุขลักษณะ: มีการละเลยข้อกำหนดด้านสุขลักษณะในบางส่วน เช่น พื้นที่ทำงานไม่สะอาดเพียงพอ</p>\n<p>- การบริหารเวลา: ไม่สามารถจัดการเวลาได้อย่างเหมาะสม ส่งผลให้การส่งมอบอาหารล่าชา้ หรือไม่เสร็จทันกำหนด</p>\n<div class=\"rubric-level\">ต้องปรับปรุง (1) - เทคนิคการประกอบอาหาร: ไม่สามารถใช้เทคนิคการประกอบอาหารได้อย่างถูกต้อง อาหารที่ได้ไม่เป็นไปตามประเภทหรือมาตรฐานที่กำหนด</div>\n<p>- คุณภาพของอาหาร: อาหารมีคุณภาพต่ำ รสชาติ เนื้อสัมผัส และการนำเสนอไม่เหมาะสม</p>\n<p>- สุขลักษณะ: ไม่ปฏิบัติตามกฎกระทรวงสาธารณสุขในด้านสุขลักษณะอย่างรุนแรง มีปัญหาในเรื่องความสะอาดและความปลอดภัยของพื้นที่</p>\n<p>- การบริหารเวลา: ล้มเหลวในการบริหารเวลา ทำให้งานไม่เสร็จสิ้นหรือไมม่ ีคุณภาพ</p>\n<p>ผลลัพธ์การเรียนรู้ที่คาดหวัง ระดับ ตัวชี้วัด (Indicators)</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">สามารถออกแบบรายการอาหารแต่ ยอดเยี่ยม (5) - ความสร้างสรรค์: ออกแบบรายการอาหารที่มีความแปลกใหม่ สร้างสรรค์ มีเอกลักษณ์เฉพาะตัว และตอบโจทย์ความต้องการของผู้บริโภคใน</span></div>\n<p>กลุ่มเป้าหมาย</p>\n<p>ละประเภทอย่างสร้างสรรค์ถูกต้องและ</p>\n<p>- ความถูกต้อง: วางแผนและจัดการเมนูอาหารได้อย่างถูกต้องทั้งในแง่โภชนาการ วัตถุดิบ และเทคนิคการปรุง</p>\n<p>เหมาะสมกับผู้บริโภค</p>\n<p>- ความเหมาะสม: รายการอาหารที่ออกแบบเหมาะสมกับกลุ่มผู้บริโภค ทั้งด้านรสชาติ วัฒนธรรม และงบประมาณ</p>\n<p>- การนำเสนอ: สามารถนำเสนอแนวคิดและอธิบายรายการอาหารได้อย่างมืออาชีพ ใช้สื่อประกอบการนำเสนอได้อย่างมีประสิทธิภาพและ</p>\n<p>น่าสนใจ</p>\n<div class=\"rubric-level\">ดีมาก (4) - ความสร้างสรรค์: ออกแบบรายการอาหารที่มีความสรา้ งสรรค์ดี และมีความน่าสนใจ แต่ยังขาดเอกลักษณ์เล็กน้อยในบางจุด</div>\n<p>- ความถูกต้อง: วางแผนเมนูอาหารได้ถูกต้อง ส่วนใหญ่ตรงตามมาตรฐานโภชนาการและการปรุงอาหาร</p>\n<p>- ความเหมาะสม: รายการอาหารเหมาะสมกับกลุ่มผู้บริโภค แต่ยังมีบางจุดที่ต้องปรับให้ตอบสนองความต้องการได้ดีขึ้น</p>\n<p>- การนำเสนอ: นำเสนอแนวคิดได้ดี มีความชัดเจน แต่ยังสามารถพัฒนาความนา่ สนใจของสื่อหรือวิธีการนำเสนอเพิ่มเติมได ้</p>\n<div class=\"rubric-level\">ดี (3) - ความสร้างสรรค์: ออกแบบรายการอาหารได้ในระดับทั่วไป มีแนวคิดสร้างสรรค์บางส่วน แต่ยังขาดความโดดเด่น</div>\n<p>- ความถูกต้อง: วางแผนเมนูได้ในระดับพื้นฐาน มีข้อผิดพลาดบางประการในด้านโภชนาการหรือเทคนิคการปรุง</p>\n<p>- ความเหมาะสม: รายการอาหารเหมาะสมในระดับทั่วไป แต่ยังไม่ตอบโจทย์ความต้องการเฉพาะของกลุ่มผู้บริโภค</p>\n<p>- การนำเสนอ: นำเสนอแนวคิดได้ในระดับทั่วไป มีความชัดเจนบางส่วน แต่ยังขาดความน่าสนใจหรือความชัดเจนในรายละเอียด</p>\n<div class=\"rubric-level\">พอใช้ (2) - ความสร้างสรรค์: การออกแบบรายการอาหารมีความธรรมดาและขาดความนา่ สนใจ</div>\n<p>- ความถูกต้อง: วางแผนเมนูอาหารได้ในระดับที่จำกัด มีข้อผิดพลาดสำคัญในด้านโภชนาการหรือการปรุงอาหาร</p>\n<p>- ความเหมาะสม: รายการอาหารไม่เหมาะสมกับกลุ่มผู้บริโภค เช่น ขาดความเข้ากับวัฒนธรรมหรืองบประมาณ</p>\n<p>- การนำเสนอ: นำเสนอแนวคิดได้ในระดับพอใช้ ขาดความชัดเจน และไม่มีการใช้สื่อช่วยในการนำเสนออย่างเหมาะสม</p>\n<div class=\"rubric-level\">ต้องปรับปรุง (1) - ความสร้างสรรค์: ไม่สามารถออกแบบรายการอาหารที่มีความสรา้ งสรรค์หรือโดดเด่นได้</div>\n<p>- ความถูกต้อง: การวางแผนเมนูมีปัญหาร้ายแรงในด้านความถูกต้อง เช่น ไม่เหมาะสมกับหลักโภชนาการหรือการใช้วัตถุดิบ</p>\n<p>- ความเหมาะสม: รายการอาหารไม่เหมาะสมกับกลุ่มผู้บริโภคในด้านรสชาติ วัฒนธรรม หรือข้อจำกัดทางงบประมาณ</p>\n<p>- การนำเสนอ: ไม่สามารถนำเสนอแนวคิดหรืออธิบายรายละเอียดของรายการอาหารได้อย่างชัดเจน</p>\n<p>ผลลัพธ์การเรียนรู้ที่คาดหวัง ระดับ ตัวชี้วัด (Indicators)</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO6</span> <span class=\"lo-desc\">สามารถวางแผนการดำเนินงาน คิด ยอดเยี่ยม (5) - การวางแผนการดำเนินงาน: วางแผนการดำเนินงานได้อย่างละเอียด รอบคอบ และครอบคลุมทุกแง่มุมของงานด้านอุตสาหกรรมบริการอาหาร</span></div>\n<p>พร้อมทั้งจัดลำดับความสำคัญของงานได้อย่างเหมาะสม</p>\n<p>วิเคราะห์ การจัดการบริหารจัดการ และ</p>\n<p>- การคิดวิเคราะห์: วิเคราะห์สถานการณ์และข้อมูลได้อย่างลึกซึ้ง เชื่อมโยงปัจจัยต่างๆ ได้ครบถ้วน พร้อมนำเสนอแนวทางการปรับปรุงหรือ</p>\n<p>การแก้ไขปัญหาในการปฏิบัติงานด้าน</p>\n<p>พัฒนาที่สร้างสรรค ์</p>\n<p>อุตสาหกรรมบริการอาหารได้อย่าง - การจัดการ: จัดการทรัพยากร บุคลากร และเวลาได้อย่างมีประสิทธิภาพ พร้อมทั้งใช้เทคโนโลยีหรือเครื่องมือที่ทันสมัย</p>\n<p>- การแก้ไขปัญหา: สามารถระบุปัญหาได้อย่างรวดเร็วและแก้ไขปัญหาได้อย่างเหมาะสมและมีประสิทธิภาพ พร้อมทั้งให้คำแนะนำหรือแนว</p>\n<p>เหมาะสมตามสถานการณ์</p>\n<p>ทางแก้ไขในเชิงป้องกัน</p>\n<div class=\"rubric-level\">ดีมาก (4) - การวางแผนการดำเนินงาน: วางแผนการดำเนินงานได้ดี มีความรอบคอบในระดับสูง แต่ยังมีบางจุดที่ขาดรายละเอียดเพิ่มเติม</div>\n<p>- การคิดวิเคราะห์: วิเคราะห์สถานการณ์และข้อมูลได้ในระดับดี ส่วนใหญ่สามารถเชื่อมโยงปัจจัยต่างๆ ได้ครบถ้วน</p>\n<p>- การจัดการ: จัดการทรัพยากร บุคลากร และเวลาได้อย่างเหมาะสม แต่ยังมีโอกาสพัฒนาความคล่องตัวหรือการใช้เทคโนโลยี</p>\n<p>- การแก้ไขปัญหา: ระบุปัญหาและแก้ไขได้ดีในระดับส่วนใหญ่ แต่ยังมีบางสถานการณ์ที่การแก้ปัญหาขาดความรวดเร็วหรือเชิงลึก</p>\n<div class=\"rubric-level\">ดี (3) - การวางแผนการดำเนินงาน: วางแผนการดำเนินงานได้ในระดับทั่วไป มีข้อผิดพลาดหรือขาดรายละเอียดในบางส่วนที่สำคัญ</div>\n<p>- การคิดวิเคราะห์: วิเคราะห์สถานการณ์ได้ในระดับพื้นฐาน ขาดความลึกซึ้งหรือการเชื่อมโยงปัจจัยต่างๆ</p>\n<p>- การจัดการ: จัดการทรัพยากรได้ในระดับทั่วไป มีข้อจำกัดในการใช้เวลาและบุคลากร</p>\n<p>- การแก้ไขปัญหา: สามารถระบุและแก้ไขปัญหาได้ในระดับพื้นฐาน แต่ยังขาดความชัดเจนหรือวิธีการที่เหมาะสมในบางกรณี</p>\n<div class=\"rubric-level\">พอใช้ (2) - การวางแผนการดำเนินงาน: วางแผนการดำเนินงานได้อย่างไม่รอบคอบ ขาดการจัดลำดับความสำคัญและรายละเอียดที่สำคัญ</div>\n<p>- การคิดวิเคราะห์: วิเคราะห์สถานการณ์ได้อย่างจำกัด ไม่สามารถเชื่อมโยงปัจจัยที่เกี่ยวข้องได้เพียงพอ</p>\n<p>- การจัดการ: มีปัญหาในการจัดการทรัพยากร บุคลากร และเวลา ทำให้งานไม่เป็นไปตามเป้าหมายที่วางไว้</p>\n<p>- การแก้ไขปัญหา: ไม่สามารถระบุหรือแก้ไขปัญหาได้อย่างเหมาะสม ต้องพึ่งพาผู้อื่นในการแก้ไข</p>\n<div class=\"rubric-level\">ต้องปรับปรุง (1) - การวางแผนการดำเนินงาน: ไม่สามารถวางแผนการดำเนินงานได้อย่างเหมาะสม ขาดการจัดการและลำดับความสำคัญ</div>\n<p>- การคิดวิเคราะห์: ไม่สามารถวิเคราะห์สถานการณ์หรือข้อมูลที่ได้รับได้อย่างมีประสิทธิภาพ</p>\n<p>- การจัดการ: ล้มเหลวในการจัดการทรัพยากร บุคลากร และเวลา ทำให้งานล่าช้าหรือไม่สำเร็จ</p>\n<p>- การแก้ไขปัญหา: ไม่สามารถระบุปัญหาและแก้ไขได้อย่างเหมาะสม ส่งผลให้สถานการณ์แย่ลงหรือไม่สามารถแก้ไขได้</p>\n<p>ผลลัพธ์การเรียนรู้ที่คาดหวัง ระดับ ตัวชี้วัด (Indicators)</p>\n<h3 class=\"domain-title\">(3) ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO7</span> <span class=\"lo-desc\">สามารถปฏิบัติงานด้วยความ ยอดเยี่ยม (5) - ปฏิบัติงานอย่างมีความรับผิดชอบต่อตนเองและผู้อื่นได้อย่างสมบูรณ์แบบ</span></div>\n<p>- มีความเข้าใจและปฏิบัติตามกฎระเบียบของสถานประกอบการอย่างครบถ้วนและรอบคอบ</p>\n<p>รับผิดชอบต่อตนเองและผู้อื่น มีวินัยและ</p>\n<p>- มีความสามารถในการรับมือและปรับตัวในสถานการณ์ต่างๆ ได้อย่างเหมาะสมและมีประสิทธิภาพ</p>\n<p>ปฏิบัติตามกฎระเบียบของสถาน</p>\n<div class=\"rubric-level\">ดีมาก (4) - ปฏิบัติงานได้อย่างมีความรับผิดชอบส่วนใหญ่ แต่ยังมีข้อผิดพลาดเล็กน้อย</div>\n<p>ประกอบการด้านอุตสาหกรรมบริการ - ปฏิบัติตามกฎระเบียบของสถานประกอบการได้ดีในภาพรวม</p>\n<p>- สามารถปรับตัวได้ดีในสถานการณ์ทั่วไป แต่ยังต้องพัฒนาการรับมือในสถานการณ์ที่ซับซ้อน</p>\n<p>อาหารได้อย่างเหมาะสมตามสถานการณ์</p>\n<div class=\"rubric-level\">ดี (3) - ปฏิบัติงานได้ในระดับพื้นฐาน มีความรับผิดชอบในบางส่วน แต่ยังมีข้อบกพร่อง</div>\n<p>- ปฏิบัติตามกฎระเบียบได้เพียงบางส่วน มีการละเลยบางข้อที่สำคัญ</p>\n<p>- ปรับตัวในสถานการณ์ทั่วไปได้ในระดับพื้นฐาน แต่ขาดการวางแผนหรือการตอบสนองเชิงรุก</p>\n<div class=\"rubric-level\">พอใช้ (2) - มีความรับผิดชอบต่ำ ต้องการการแนะนำหรือการควบคุมจากผู้อื่นตลอดเวลา</div>\n<p>- ปฏิบัติตามกฎระเบียบได้อย่างไม่ครบถ้วน หรือมีการละเลยหลายครั้ง</p>\n<p>- ไม่สามารถปรับตัวในสถานการณ์ที่เปลี่ยนแปลงได้</p>\n<div class=\"rubric-level\">ต้องปรับปรุง (1) - ขาดความรับผิดชอบต่อหน้าที่และผู้อื่นอย่างเห็นได้ชัด</div>\n<p>- ไม่ปฏิบัติตามกฎระเบียบของสถานประกอบการอย่างร้ายแรง</p>\n<p>- ไม่สามารถปรับตัวในสถานการณ์ใดๆ และส่งผลเสียต่อการปฏิบัติงาน</p>\n<p>ผลลัพธ์การเรียนรู้ที่คาดหวัง ระดับ ตัวชี้วัด (Indicators)</p>\n<h3 class=\"domain-title\">(4) ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO8</span> <span class=\"lo-desc\">มีวินัย จิตอาสา สามารถทำงาน ยอดเยี่ยม (5) - มีวินัยในการทำงานสูง ปฏิบัติงานตามเป้าหมายและระยะเวลาที่กำหนด</span></div>\n<p>- แสดงถึงความมีจิตอาสา และพร้อมช่วยเหลือผู้อื่นในทีมเสมอ</p>\n<p>ร่วมกับผู้อื่น และสามารถพัฒนาตนเองใน</p>\n<p>- ทำงานร่วมกับผู้อื่นได้อย่างราบรื่น มีความเป็นผู้นำและสนับสนุนทีมได้ดี</p>\n<p>งานด้านบริหารธุรกิจ และการประกอบ</p>\n<p>- มีความกระตือรือร้นในการเรียนรู้และพัฒนาตนเองอย่างต่อเนื่อง</p>\n<p>อาหารได้ ดีมาก (4) - มีวินัยในการทำงานในระดับดี แต่บางครั้งอาจไม่สามารถปฏิบัติตามกำหนดการได้อย่างสมบูรณ์</p>\n<p>- แสดงถึงจิตอาสาและความช่วยเหลือ แต่ยังขาดความสม่ำเสมอ</p>\n<p>- ทำงานร่วมกับทีมได้ดีในภาพรวม แต่ยังขาดการสนับสนุนเชิงลึกในบางครั้ง</p>\n<p>- มีการพัฒนาตนเองในระดับดี แต่ยังต้องการการสนับสนุนเพิ่มเติม</p>\n<div class=\"rubric-level\">ดี (3) - มีวินัยในระดับพื้นฐาน แต่บางครั้งอาจละเลยระเบียบและเป้าหมาย</div>\n<p>- มีความตั้งใจช่วยเหลือทีมในบางสถานการณ์ แต่ยังขาดจิตอาสาอย่างแท้จริง</p>\n<p>- ทำงานร่วมกับทีมได้ในระดับทั่วไป แต่ยังมีปัญหาในการสื่อสารหรือความขัดแย้ง</p>\n<p>- มีการพัฒนาตนเองในระดับทั่วไป แต่ยังขาดความต่อเนื่อง</p>\n<div class=\"rubric-level\">พอใช้ (2) - ขาดวินัยในการทำงาน ต้องการการติดตามอย่างใกล้ชิด</div>\n<p>- ขาดจิตอาสาและความตั้งใจช่วยเหลือทีมอย่างเห็นได้ชัด</p>\n<p>- ทำงานร่วมกับผู้อื่นได้ยาก มักมีความขัดแย้งในทีม</p>\n<p>- มีการพัฒนาตนเองเพียงเล็กน้อย หรือขาดความตั้งใจในการเรียนรู้เพิ่มเติม</p>\n<div class=\"rubric-level\">ต้องปรับปรุง (1) - ไม่มีวินัยในการทำงาน ละเลยหน้าที่และไม่สามารถปฏิบัติตามเป้าหมายได้</div>\n<p>- ไม่มีจิตอาสาและไม่แสดงความรับผิดชอบต่อทีม</p>\n<p>- ไม่สามารถทำงานร่วมกับผู้อื่นได้ ส่งผลเสียต่อการปฏิบัติงานของทีม</p>\n<p>- ไม่มีความพยายามในการพัฒนาตนเอง</p>\n<p>ผลลัพธ์การเรียนรู้ที่คาดหวัง ระดับ ตัวชี้วัด (Indicators)</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO9</span> <span class=\"lo-desc\">สามารถสร้างสรรค์อาหารโดยใช้ ยอดเยี่ยม (5) - สร้างสรรค์อาหารใหม่ๆ ด้วยแนวคิดที่แปลกใหม่ สอดคล้องกับความต้องการของผู้บริโภคหลากหลายกลุ่ม</span></div>\n<p>- ใช้เทคนิคการประกอบอาหารได้อย่างถูกต้องและเหมาะสมกับประเภทอาหาร</p>\n<p>เทคนิคการประกอบอาหารได้อย่าง</p>\n<p>- ให้ความสำคัญกับความปลอดภัยของอาหารในทุกขั้นตอน ตั้งแต่วัตถุดิบจนถึงการเสิร์ฟ</p>\n<p>เหมาะสม และปลอดภัยเพื่อตอบสนอง</p>\n<p>- นำเสนออาหารได้อย่างน่าสนใจ สวยงาม และมีความสร้างสรรค์</p>\n<p>ผู้บริโภคที่หลากหลาย ดีมาก (4) - สร้างสรรค์อาหารได้ดี แต่ยังขาดความแปลกใหม่ในบางจุด</p>\n<p>- ใช้เทคนิคการประกอบอาหารได้ดีในภาพรวม แต่มีข้อผิดพลาดเล็กน้อย</p>\n<p>- มีการดูแลความปลอดภัยของอาหารในระดับดี แต่ยังต้องพัฒนาในบางขั้นตอน</p>\n<p>- นำเสนออาหารได้ดี แต่ยังมีจุดที่สามารถปรับปรุงเพื่อเพิ่มความน่าสนใจ</p>\n<div class=\"rubric-level\">ดี (3) - สร้างสรรค์อาหารได้ในระดับทั่วไป แต่ยังขาดความหลากหลายหรือการปรับให้เหมาะสมกับกลุ่มผู้บริโภค</div>\n<p>- ใช้เทคนิคการประกอบอาหารได้ในระดับพื้นฐาน แต่มีข้อผิดพลาดที่ต้องปรับปรุง</p>\n<p>- ดูแลความปลอดภัยของอาหารได้ในระดับทั่วไป แต่ยังมีความเสี่ยงในบางขั้นตอน</p>\n<p>- การนำเสนออาหารขาดความน่าสนใจหรือรายละเอียดที่ชัดเจน</p>\n<div class=\"rubric-level\">พอใช้ (2) - สร้างสรรค์อาหารได้อย่างจำกัด ไม่ตอบโจทย์ความต้องการของผู้บริโภค</div>\n<p>- ใช้เทคนิคการประกอบอาหารได้อย่างไม่เหมาะสม ส่งผลต่อคุณภาพของอาหาร</p>\n<p>- ขาดการดูแลความปลอดภัยในกระบวนการประกอบอาหาร</p>\n<p>- การนำเสนออาหารขาดความน่าสนใจและความเหมาะสมในทุกด้าน</p>\n<div class=\"rubric-level\">ต้องปรับปรุง (1) - ไม่สามารถสร้างสรรค์อาหารใหม่ๆ ได้ และอาหารที่ออกแบบไม่ตอบสนองความต้องการของผู้บริโภค</div>\n<p>- ใช้เทคนิคการประกอบอาหารผิดพลาดรุนแรง ส่งผลเสียต่อรสชาติและคุณภาพ</p>\n<p>- ไม่มีการดูแลความปลอดภัยในกระบวนการประกอบอาหาร</p>\n<p>- การนำเสนออาหารไมม่ ีความน่าสนใจและไม่เป็นมืออาชีพ</p>"}, {"name": "หลักสูตรการตลาดดิจิทัลและการสร้างแบรนด์", "file": "9. สำนักวิชากการจัดการ 4 หลักสูตร\\ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษา หลักสูตรการตลาดดิจิทัลและการสร้างแบรนด์.docx", "ext": "docx", "html": "<p>หลักสูตรการตลาดดิจิทัลและการสร้างแบรนด์</p>\n\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของหลักสูตร (Program Learning Outcomes: PLO)</h2>\n<h3 class=\"domain-title\">ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO1</span> <span class=\"lo-desc\">สามารถอธิบายแนวคิดทฤษฎีพื้นฐานทางด้านการตลาดดิจิทัลและการสร้างแบรนด์ได้อย่างถูกต้อง ครบถ้วน</span></div>\n<h3 class=\"domain-title\">ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO2</span> <span class=\"lo-desc\">สามารถประยุกต์แนวคิด ทฤษฎีพื้นฐานทางด้านการตลาดดิจิทัลและการสร้างแบรนด์ ไปเชื่อมโยงกับแนวคิดทางด้านอื่นๆ ในการบริหารจัดการองค์กรและการทำธุรกิจได้</span></div>\n<h3 class=\"domain-title\">ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO3</span> <span class=\"lo-desc\">สามารถอธิบายและแสดงให้เห็นถึงความมีคุณธรรม จริยธรรม และจรรยาบรรณในการประกอบอาชีพด้านการตลาดดิจิทัล และการสร้างแบรนด์และแสดงให้เห็นถึงความมีจิตสำนึกในการรับผิดชอบต่อสังคม</span></div>\n<h3 class=\"domain-title\">ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO4</span> <span class=\"lo-desc\">สามารถใช้เทคโนโลยีสารสนเทศต่างๆ และสามารถสื่อสารทั้งภาษาไทยและภาษาต่างประเทศที่จำเป็นในการประกอบอาชีพทางด้านการตลาดดิจิทัล และการสร้างแบรนด์ได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO5</span> <span class=\"lo-desc\">สามารถคิดวิเคราะห์อย่างเป็นระบบแบบองค์รวม สามารถบูรณาการความรู้เพื่อแก้ปัญหาทางธุรกิจและสถานการณ์ทั่วไปได้อย่างเหมาะสม</span></div>\n\n<h2 class=\"section-title\">แบบประเมินผลการปฏิบัติสหกิจศึกษาตามผลลัพธ์การเรียนรู้ที่คาดหวัง</h2>\n\n<h4 class=\"table-marker\">[TABLE 1]</h4>\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษา (Learning Outcome: LO)</h2>\n<h3 class=\"domain-title\">ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">ผู้เรียนสามารถระบุและแก้ปัญหาที่ซับซ้อนในงานที่ได้รับมอบหมายในสถานประกอบการ โดยประยุกต์แนวคิด ทฤษฎีทางด้านการตลาดดิจิทัลและการสร้างแบรนด์ได้อย่างเหมาะสม</span></div>\n\n<h3 class=\"domain-title\">ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">ผู้เรียนสามารถประยุกต์แนวคิด ทฤษฎีทางด้านการตลาดดิจิทัลและการสร้างแบรนด์ ไปเชื่อมโยงกับแนวคิดทางด้านอื่นๆ ในการบริหารจัดการองค์กรและการทำธุรกิจได้</span></div>\n\n<h3 class=\"domain-title\">ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">ผู้เรียนสามารถปฏิบัติงานด้วยความรับผิดชอบ คำนึงถึงจริยธรรมและจรรยาบรรณในการประกอบอาชีพด้านการตลาดดิจิทัล และการสร้างแบรนด์และแสดงให้เห็นถึงความมีจิตสำนึกในการรับผิดชอบต่อสังคม</span></div>\n\n<h3 class=\"domain-title\">ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">ผู้เรียนสามารถใช้เทคโนโลยีสารสนเทศต่างๆ และสามารถสื่อสารทั้งภาษาไทยและภาษาต่างประเทศที่จำเป็นในการประกอบอาชีพทางด้านการตลาดดิจิทัล และการสร้างแบรนด์ได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">ผู้เรียนสามารถคิดวิเคราะห์อย่างเป็นระบบแบบองค์รวม สามารถบูรณาการความรู้เพื่อแก้ปัญหาทางธุรกิจและสถานการณ์ทั่วไปได้อย่างเหมาะสม</span></div>\n\n<h4 class=\"table-marker\">[TABLE 2]</h4>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table\">\n<tr><td>ผลการเรียนรู้ที่คาดหวัง</td><td>ผลการประเมิน</td></tr>\n</table></div>\n<h3 class=\"domain-title\">(1) ด้านความรู้ (Knowledge) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">ผู้เรียนสามารถระบุและแก้ปัญหาที่ซับซ้อนในงานที่ได้รับมอบหมายในสถานประกอบการ โดยประยุกต์แนวคิด ทฤษฎีทางด้านการตลาดดิจิทัลและการสร้างแบรนด์ได้อย่างเหมาะสม |   5 (ยอดเยี่ยม): ระบุและแก้ปัญหาที่ซับซ้อนได้อย่างครบถ้วน พร้อมเสนอแนวทางแก้ไขที่สร้างสรรค์ มีประสิทธิภาพสูง และตอบโจทย์ความต้องการของสถานประกอบการได้อย่างสมบูรณ์</span></div>\n<p>  4 (ดีมาก): ระบุและแก้ปัญหาได้ในระดับดี พร้อมเสนอแนวทางแก้ไขที่เหมาะสม แม้จะมีข้อบกพร่องเล็กน้อยแต่ไม่กระทบต่อคุณภาพโดยรวม</p>\n<p>  3 (ดี): ระบุปัญหาและแก้ไขได้ในระดับพื้นฐาน แต่ข้อเสนอแนวทางแก้ไขยังขาดความสมบูรณ์ในบางส่วน</p>\n<p>  2 (พอใช้): ระบุปัญหาได้บางส่วน แต่ไม่สามารถแก้ไขได้อย่างเหมาะสม ต้องการคำแนะนำอย่างใกล้ชิด</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถระบุหรือแก้ปัญหาได้ และไม่มีข้อเสนอแนะแนวทางแก้ไข</p>\n<h3 class=\"domain-title\">(2) ด้านทักษะ (Skills) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">ผู้เรียนสามารถประยุกต์แนวคิด ทฤษฎีทางด้านการตลาดดิจิทัลและการสร้างแบรนด์ ไปเชื่อมโยงกับแนวคิดทางด้านอื่นๆ ในการบริหารจัดการองค์กรและการทำธุรกิจได้ |   5 (ยอดเยี่ยม): วิเคราะห์และเชื่อมโยงกับแนวคิดด้านอื่นๆ ในการบริหารจัดการองค์กรและการทำธุรกิจได้อย่างถูกต้อง ครบถ้วน และแปลผลได้ชัดเจน พร้อมข้อสรุปที่นำไปใช้ได้จริง</span></div>\n<p>  4 (ดีมาก): วิเคราะห์และเชื่อมโยงได้ดีในระดับที่เหมาะสม พร้อมข้อสรุปที่เป็นประโยชน์ แม้จะมีข้อผิดพลาดเล็กน้อย</p>\n<p>  3 (ดี): วิเคราะห์และเชื่อมโยงได้ในระดับพื้นฐาน แต่ข้อสรุปยังขาดความชัดเจนและสมบูรณ์ในบางส่วน</p>\n<p>  2 (พอใช้): วิเคราะห์และเชื่อมโยงได้เพียงบางส่วน และข้อสรุปยังไม่ชัดเจน ต้องการคำแนะนำเพิ่มเติม</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถวิเคราะห์และเชื่อมโยงหรือแปลผลได้</p>\n<h3 class=\"domain-title\">(3) ด้านจริยธรรม (Ethics) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">ผู้เรียนสามารถปฏิบัติงานด้วยความรับผิดชอบ คำนึงถึงจริยธรรมและจรรยาบรรณในการประกอบอาชีพด้านการตลาดดิจิทัล และการสร้างแบรนด์และแสดงให้เห็นถึงความมีจิตสำนึกในการรับผิดชอบต่อสังคม |   5 (ยอดเยี่ยม): ปฏิบัติตามกฎระเบียบทุกข้ออย่างเคร่งครัด พร้อมแสดงความซื่อสัตย์และความรับผิดชอบอย่างชัดเจน</span></div>\n<p>  4 (ดีมาก): ปฏิบัติตามกฎระเบียบส่วนใหญ่ และแสดงความรับผิดชอบในงานได้ดี แม้จะมีข้อผิดพลาดเล็กน้อย</p>\n<p>  3 (ดี): ปฏิบัติตามกฎระเบียบได้ในระดับพื้นฐาน แต่ยังต้องการการปรับปรุงในบางส่วน</p>\n<p>  2 (พอใช้): ปฏิบัติตามกฎระเบียบได้เพียงบางข้อ และยังมีการละเลยหรือผิดพลาดบ้าง</p>\n<p>  1 (ต้องปรับปรุง): ไม่ปฏิบัติตามกฎระเบียบ และแสดงถึงความขาดความรับผิดชอบในงาน</p>\n<h3 class=\"domain-title\">(4) ด้านลักษณะบุคคล (Character) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">ผู้เรียนสามารถใช้เทคโนโลยีสารสนเทศต่างๆ และสามารถสื่อสารทั้งภาษาไทยและภาษาต่างประเทศที่จำเป็นในการประกอบอาชีพทางด้านการตลาดดิจิทัล และการสร้างแบรนด์ได้ |   5 (ยอดเยี่ยม): สื่อสารได้ชัดเจน เข้าใจง่าย ใช้ภาษาไทยและภาษาอังกฤษได้อย่างเหมาะสมกับสถานการณ์</span></div>\n<p>  4 (ดีมาก): สื่อสารได้ดีในระดับที่เหมาะสม แม้จะมีข้อผิดพลาดเล็กน้อยที่ไม่กระทบต่อการทำงาน</p>\n<p>  3 (ดี): สื่อสารได้ในระดับพื้นฐาน แต่ยังมีข้อผิดพลาดหรือจุดที่ไม่ชัดเจนในบางสถานการณ์</p>\n<p>  2 (พอใช้): สื่อสารได้บ้าง แต่ยังไม่เหมาะสมกับสถานการณ์หรือมีข้อผิดพลาดที่ส่งผลต่อการทำงาน</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถสื่อสารได้อย่างเหมาะสมในสถานการณ์จริง</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">ผู้เรียนสามารถคิดวิเคราะห์อย่างเป็นระบบแบบองค์รวม สามารถบูรณาการความรู้เพื่อแก้ปัญหาทางธุรกิจและสถานการณ์ทั่วไปได้อย่างเหมาะสม |   5 (ยอดเยี่ยม): นักศึกษาสามารถคิดวิเคราะห์ได้อย่างเป็นระบบแบบองค์รวม บูรณาการความรู้เพื่อแก้ปัญหาทางธุรกิจและสถานการณ์ทั่วไปได้อย่างรวดเร็วและนำไปประยุกต์ใช้ในงานได้อย่างมีประสิทธิภาพ มีการริเริ่มในการศึกษาข้อมูลเพิ่มเติมด้วยตัวเอง และแสดงผลลัพธ์ที่ชัดเจน</span></div>\n<p>  4 (ดีมาก): นักศึกษาสามารถคิดวิเคราะห์ได้อย่างเป็นระบบแบบองค์รวม บูรณาการความรู้เพื่อแก้ปัญหาทางธุรกิจและสถานการณ์ทั่วไปได้ในระดับที่เหมาะสม แม้จะมีการปรับปรุงในบางส่วน</p>\n<p>  3 (ดี): นักศึกษาสามารถคิดวิเคราะห์ได้อย่างเป็นระบบแบบองค์รวม เรียนรู้ทักษะใหม่ได้ในระดับพื้นฐาน และเริ่มต้นนำไปใช้ในงานบางส่วน แต่ยังขาดความสมบูรณ์</p>\n<p>  2 (พอใช้): นักศึกษาสามารถเรียนรู้ทักษะใหม่ได้ในระดับที่จำกัด และยังไม่สามารถประยุกต์ใช้ได้อย่างเหมาะสม</p>\n<p>  1 (ต้องปรับปรุง): นักศึกษาไม่สามารถเรียนรู้ทักษะใหม่ได้ด้วยตนเอง และขาดความพยายามในการพัฒนาตนเอง</p>"}, {"name": "หลักสูตรการจัดการโลจิสติกส์", "file": "9. สำนักวิชากการจัดการ 4 หลักสูตร\\แบบประเมินรายวิชาสหกิจศึกษาตาม LO หลักสูตรการจัดการโลจิสติกส์_ส่ง.docx", "ext": "docx", "html": "<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของหลักสูตร (Program Learning Outcomes: PLOs)</h2>\n<p>หลักสูตรบริหารธุรกิจบัณฑิต สาขาการจัดการโลจิสติกส์</p>\n<p>(หลักสูตรปรับปรุง ปีการศึกษา 2567)</p>\n\n<h3 class=\"domain-title\">ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO1</span> <span class=\"lo-desc\">อธิบายแนวคิดด้านบริหารธุรกิจ และผลกระทบของการเปลี่ยนแปลงด้านการเมือง เศรษฐกิจ สังคม เทคโนโลยี สิ่งแวดล้อม รวมถึงความแตกต่างทางวัฒนธรรมที่มีต่อการจัดการธุรกิจอย่างยั่งยืน</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO2</span> <span class=\"lo-desc\">อธิบายหลักการ แนวคิด และทฤษฎีด้านการจัดการโลจิสติกส์และโซ่อุปทาน รวมถึงการเปลี่ยนแปลงของเทคโนโลยีทางโลจิสติกส์ และเทคโนโลยีสารสนเทศทางโลจิสติกส์ในยุคดิจิทัล</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO3</span> <span class=\"lo-desc\">ประยุกต์ใช้องค์ความรู้ด้านบริหารธุรกิจ การจัดการนวัตกรรม และการใช้เทคโนโลยีเพื่อการจัดการและสร้างโอกาสให้กับธุรกิจโลจิสติกส์</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO4</span> <span class=\"lo-desc\">ประยุกต์ใช้องค์ความรู้ด้านการจัดการโลจิสติกส์ และเครื่องมือทางโลจิสติกส์ เพื่อแก้ปัญหา หรือ/และปรับปรุงการทำงาน</span></div>\n\n<h3 class=\"domain-title\">ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO5</span> <span class=\"lo-desc\">มีทักษะในการฟัง พูด อ่าน เขียน และนำเสนอเรื่องราวทั้งภาษาไทยและภาษาอังกฤษในงานธุรกิจ ในกรณีที่นักศึกษาเลือกภาษาจีนต้องสามารถสื่อสารภาษาจีนในชีวิตประจำวันได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO6</span> <span class=\"lo-desc\">มีทักษะการดูแลตนเองเพื่อสร้างสุขภาวะ และสามารถป้องกันความเสี่ยงจากการปฏิบัติงาน</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO7</span> <span class=\"lo-desc\">มีทักษะการเป็นผู้ประกอบการโลจิสติกส์ สามารถเพิ่มประสิทธิภาพในกระบวนการทำงานด้านโลจิสติกส์ได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO8</span> <span class=\"lo-desc\">มีทักษะในการใช้เทคโนโลยีดิจิทัลและซอฟต์แวร์เพื่อสืบค้นข้อมูล คัดกรอง รวบรวม วิเคราะห์ รวมถึงโปรแกรมประยุกต์ทางโลจิสติกส์ในการทำงานได้</span></div>\n\n<h3 class=\"domain-title\">ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO9</span> <span class=\"lo-desc\">แสดงออกถึงความกตัญญู มีความซื่อสัตย์ เคารพกฎระเบียบ ตลอดจนมีความรับผิดชอบต่อตนเอง และสังคม</span></div>\n\n<h3 class=\"domain-title\">ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO10</span> <span class=\"lo-desc\">แสดงออกถึงการมีวินัย มีภาวะผู้นำ โดยเป็นได้ทั้งผู้นำและผู้ตาม สามารถทำงานร่วมกับผู้อื่น และมีใจอาสา</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO11</span> <span class=\"lo-desc\">แสดงออกถึงการเป็นผู้ใฝ่รู้ สามารถคิดวิเคราะห์อย่างมีเหตุผลในการพัฒนางานด้านโลจิสติกส์</span></div>\n\n<p>(ร่าง) ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษา (Learning Outcomes: LOs)</p>\n<p>หลักสูตรบริหารธุรกิจบัณฑิต สาขาการจัดการโลจิสติกส์</p>\n<p>(หลักสูตรปรับปรุง ปีการศึกษา 2567)</p>\n\n<h3 class=\"domain-title\">1) ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">ประยุกต์ใช้ความรู้ด้านการจัดการโลจิสติกส์ และเครื่องมือทางโลจิสติกส์ เพื่อวางแผนการทำงาน และแก้ปัญหาหรือปรับปรุงการทำงานในสถานประกอบการ</span></div>\n\n<h3 class=\"domain-title\">2) ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">มีทักษะในการทำงานด้านโลจิสติกส์</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">มีทักษะการใช้เทคโนโลยีดิจิทัล โปรแกรมสำนักงานระดับสูง และโปรแกรมประยุกต์ทางโลจิสติกส์เพื่อสืบค้นและรวบรวมข้อมูล ตลอดจนวิเคราะห์ข้อมูลเพื่อการทำงานในสถานประกอบการ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">มีทักษะการสื่อสารในการทำงานด้านโลจิสติกส์</span></div>\n\n<h3 class=\"domain-title\">3) ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">แสดงออกถึงความซื่อสัตย์ เคารพและปฏิบัติตามกฎระเบียบของสถานประกอบการ มีความรับผิดชอบต่อตนเอง และสังคม</span></div>\n\n<h3 class=\"domain-title\">4) ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO6</span> <span class=\"lo-desc\">แสดงออกถึงการมีวินัย มีภาวะผู้นำ เป็นทั้งผู้นำและผู้ตามที่ดี สามารถทำงานร่วมกับผู้อื่นได้ และมีใจอาสา</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO7</span> <span class=\"lo-desc\">แสดงออกถึงการเป็นผู้ใฝ่รู้ มีการคิดวิเคราะห์อย่างมีเหตุผลเพื่อแก้ไขปัญหาหรือพัฒนางานด้านโลจิสติกส์</span></div>\n\n<h2 class=\"section-title\">(ร่าง) แบบประเมินผลการปฏิบัติงานสหกิจศึกษาตามผลลัพธ์การเรียนรู้ที่คาดหวัง</h2>\n<h3 class=\"domain-title\">ตอนที่ 1 ผลลัพธ์การเรียนรู้ที่คาดหวังของหลักสูตรด้านความรู้และทักษะ</h3>\n\n<h3 class=\"domain-title\">ตอนที่ 2 ผลลัพธ์การเรียนรู้ด้านทักษะทางสังคม</h3>\n\n<h4 class=\"table-marker\">[TABLE 1]</h4>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table\">\n<tr><td>ผลลัพธ์การเรียนรู้ที่คาดหวัง</td><td>ผลการประเมิน</td></tr>\n</table></div>\n<h3 class=\"domain-title\">ด้านความรู้ (Knowledge) |</h3>\n<div class=\"eval-item\">1. การประยุกต์ใช้ความรู้ด้านการจัดการโลจิสติกส์ และเครื่องมือทางโลจิสติกส์ ในการทำงาน วางแผนแก้ปัญหาหรือปรับปรุงการทำงาน | ดีเยี่ยม (5 คะแนน)</div>\n<p>สามารถประยุกต์ใช้ความรู้ในการทำงานได้อย่างโดดเด่น ผลงานมีคุณภาพสูง มีแนวทางในการปรับปรุงงานที่โดดเด่น ตอบสนองความต้องการขององค์กรได้อย่างมีประสิทธิภาพ</p>\n\n<div class=\"rubric-level\">ดีมาก (4 คะแนน)</div>\n<p>สามารถประยุกต์ใช้ความรู้ในการทำงานได้อย่างดี ผลงานมีความสมบูรณ์ มีแนวคิดที่ดีในการพัฒนางาน และสามารถนำไปใช้งานได้ และอาจมีข้อบกพร่องเล็กน้อย</p>\n\n<div class=\"rubric-level\">ดี (3 คะแนน)</div>\n<p>สามารถประยุกต์ใช้ความรู้ในการทำงานได้ แต่ยังต้องได้รับคำแนะนำหรือการดูแลบางครั้งจากพี่เลี้ยงหรือผู้ที่เกี่ยวข้อง แนวคิดในการพัฒนาปรับปรุงงานยังมีข้อจำกัดหลายอย่างในการนำไปใช้ได้จริง และมีข้อบกพร่องบ้าง</p>\n\n<div class=\"rubric-level\">พอใช้ (2 คะแนน)</div>\n<p>สามารถประยุกต์ใช้ความรู้ในการทำงานได้ในระดับพื้นฐาน และต้องมีการดูแลอย่างใกล้ชิดจากพี่เลี้ยง สามารถเสนอแนวทางการปรับปรุงการทำงานได้บ้างแต่ขาดการประยุกต์ใช้ความรู้อย่างเหมาะสมกับบริบทของปัญหาขององค์กร ไม่สามารถแก้ปัญหาหรือพัฒนางานได้จริง</p>\n\n<p>ควรปรับปรุง (1 คะแนน)</p>\n<p>ไม่สามารถประยุกต์ใช้ความรู้ในการทำงาน และ เสนอแนวคิดในการพัฒนางาน</p>\n<h3 class=\"domain-title\">ด้านทักษะ (Skills) |</h3>\n<div class=\"eval-item\">2. ทักษะในการทำงานด้านโลจิสติกส์ | ดีเยี่ยม (5 คะแนน)</div>\n<p>สามารถทำงานได้อย่างมีประสิทธิภาพและเป็นระบบ ทำเสร็จในเวลาที่กำหนดเสมอ</p>\n\n<div class=\"rubric-level\">ดีมาก (4 คะแนน)</div>\n<p>สามารถทำงานได้อย่างมีประสิทธิภาพและเป็นระบบ ทำเสร็จในเวลาที่กำหนดเป็นส่วนใหญ่</p>\n\n<div class=\"rubric-level\">ดี (3 คะแนน)</div>\n<p>สามารถทำงานได้ตามเกณฑ์พื้นฐาน ทำเสร็จในเวลาที่กำหนดเป็นส่วนใหญ่ แต่ต้องปรับปรุงเรื่องความละเอียดรอบคอบ หรือความเร็ว บ้างเป็นบางครั้ง</p>\n\n<div class=\"rubric-level\">พอใช้ (2 คะแนน)</div>\n<p>สามารถทำงานได้บางส่วน แต่ขาดความสม่ำเสมอ ขาดความเป็นระบบ ส่วนใหญ่ไม่แล้วเสร็จในกำหนดเวลา</p>\n\n<p>ควรปรับปรุง (1 คะแนน)</p>\n<p>ไม่สามารถทำงานได้สำเร็จ งานมีความผิดพลาดและไม่แล้วเสร็จตามกำหนดเวลา</p>\n<div class=\"eval-item\">3. ทักษะการใช้เทคโนโลยีดิจิทัล โปรแกรมสำนักงานระดับสูง และโปรแกรมประยุกต์ทางโลจิสติกส์เพื่อสืบค้น รวบรวมข้อมูล ตลอดจนวิเคราะห์ข้อมูล | ดีเยี่ยม (5 คะแนน)</div>\n<p>มีทักษะในการใช้เทคโนโลยีดิจิทัลในการทำงานได้อย่างเชี่ยวชาญ สืบค้น/วิเคราะห์ข้อมูลได้อย่างรวดเร็ว ผลงานมีคุณภาพสูง</p>\n\n<div class=\"rubric-level\">ดีมาก (4 คะแนน)</div>\n<p>มีทักษะในการใช้เทคโนโลยีดิจิทัลในการทำงานได้ดี สืบค้น/วิเคราะห์ข้อมูลได้ดี ผลงานเชื่อถือได้</p>\n\n<div class=\"rubric-level\">ดี (3 คะแนน)</div>\n<p>มีทักษะเพียงพอสำหรับการใช้เทคโนโลยีดิจิทัลในการทำงาน ผลการสืบค้นหรือวิเคราะห์ข้อมูลยอมรับได้ แต่บางครั้งต้องการคำแนะนำจากพี่เลี้ยงหรือผู้ที่เกี่ยวข้อง</p>\n\n<div class=\"rubric-level\">พอใช้ (2 คะแนน)</div>\n<p>มีทักษะการใช้เทคโนโลยีดิจิทัลในการทำงานในระดับพื้นฐาน  สืบค้นหรือวิเคราะห์ข้อมูลได้เองบางส่วน แต่ต้องการคำแนะนำหรือการดูแลอย่างใกล้ชิดจากพี่เลี้ยงหรือผู้ที่เกี่ยวข้อง</p>\n\n<p>ควรปรับปรุง (1 คะแนน)</p>\n<p>ทักษะการใช้เทคโนโลยีดิจิทัลในการทำงานไม่เพียงพอ ผลงานที่ทำไม่ถูกต้องครบถ้วน ไม่ตอบสนองความต้องการขององค์กร</p>\n<div class=\"eval-item\">4. ทักษะการสื่อสารในการทำงาน | ดีเยี่ยม (5 คะแนน)</div>\n<p>สามารถสื่อสารและนำเสนอได้ชัดเจน เข้าใจได้ง่าย ใช้ภาษาและสื่อได้อย่างเหมาะสม  มีการโน้มน้าวใจในการสื่อสาร</p>\n\n<div class=\"rubric-level\">ดีมาก (4 คะแนน)</div>\n<p>สามารถสื่อสารและนำเสนอได้ชัดเจน ใช้ภาษาได้ดี</p>\n\n<div class=\"rubric-level\">ดี (3 คะแนน)</div>\n<p>สามารถสื่อสารและนำเสนอได้พอเข้าใจ ใช้ภาษาได้เหมาะสม ขาดความมั่นใจ</p>\n\n<div class=\"rubric-level\">พอใช้ (2 คะแนน)</div>\n<p>สื่อสารไม่ชัดเจนในบางจุด ขาดการลำดับความคิดในการนำเสนอ ภาษาที่ใช้ยังไม่เหมาะสม</p>\n\n<p>ควรปรับปรุง (1 คะแนน)</p>\n<p>สื่อสารไม่ชัดเจน ภาษาที่ใช้ไม่เหมาะสม</p>\n\n<h4 class=\"table-marker\">[TABLE 2]</h4>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table\">\n<tr><td>ลักษณะบุคคล/สมรรถนะ</td><td>ผลการประเมิน</td></tr>\n</table></div>\n<h3 class=\"domain-title\">ด้านจริยธรรม (Ethics) |</h3>\n<div class=\"eval-item\">5. ความซื่อสัตย์ และการปฏิบัติตามกฎระเบียบขององค์กร | ดีเยี่ยม (5 คะแนน)</div>\n<p>มีความซื่อสัตย์ ปฏิบัติตามกฎระเบียบขององค์กรอย่างเคร่งครัด</p>\n\n<div class=\"rubric-level\">ดีมาก (4 คะแนน)</div>\n<p>มีความซื่อสัตย์ ปฏิบัติตามกฎระเบียบได้ดีเป็นส่วนใหญ่ อาจมีการละเลยบ้าง แต่ไม่กระทบต่องาน</p>\n\n<div class=\"rubric-level\">ดี (3 คะแนน)</div>\n<p>มีความซื่อสัตย์ ปฏิบัติตามกฎระเบียบในระดับพื้นฐาน อาจมีการละเลยบ้าง และส่งผลกระทบต่องานเล็กน้อย ควรปรับปรุง</p>\n\n<div class=\"rubric-level\">พอใช้ (2 คะแนน)</div>\n<p>ขาดความสม่ำเสมอในการปฏิบัติตามกฎระเบียบบางประการ ละเมิดกฎในบางกรณี</p>\n\n<p>ควรปรับปรุง (1 คะแนน)</p>\n<p>ขาดความซื่อสัตย์ ไม่ปฏิบัติตามกฎระเบียบ และส่งผลกระทบต่อการทำงาน</p>\n<div class=\"eval-item\">6. ความรับผิดชอบต่อตนเองและสังคม | ดีเยี่ยม (5 คะแนน)</div>\n<p>มีความรับผิดชอบสูง ปฏิบัติหน้าที่ได้ดีเยี่ยม และมีส่วนร่วมในการทำประโยชน์แก่สังคมอย่างดีเยี่ยม</p>\n\n<div class=\"rubric-level\">ดีมาก (4 คะแนน)</div>\n<p>มีความรับผิดชอบดี ปฏิบัติหน้าที่ได้อย่างครบถ้วน และมีส่วนร่วมในการทำประโยชน์แก่สังคม</p>\n\n<div class=\"rubric-level\">ดี (3 คะแนน)</div>\n<p>มีความรับผิดชอบเพียงพอ ปฏิบัติหน้าที่ส่วนใหญ่ได้ดี และมีส่วนร่วมในการทำประโยชน์แก่สังคมบ้าง</p>\n\n<div class=\"rubric-level\">พอใช้ (2 คะแนน)</div>\n<p>มีความรับผิดชอบเป็นบางครั้ง ขาดความต่อเนื่องในหน้าที่ และมีส่วนร่วมกับสังคมน้อย</p>\n\n<p>ควรปรับปรุง (1 คะแนน)</p>\n<p>ขาดความรับผิดชอบ ละเลยหน้าที่ ไม่มีส่วนร่วมในการส่งเสริมสังคม</p>\n<h3 class=\"domain-title\">ด้านลักษณะบุคคล (Character) |</h3>\n<div class=\"eval-item\">7. ภาวะผู้นำ การเป็นทั้งผู้นำและผู้ตามที่ดี และความสามารถในการทำงานร่วมกับผู้อื่น | ดีเยี่ยม (5 คะแนน)</div>\n<p>มีภาวะความเป็นผู้นำสูง และเป็นผู้ตามที่ดี ยอมรับคำแนะนำและทำงานร่วมกับผู้อื่นอย่างมีประสิทธิภาพ สนับสนุนการทำงานร่วมกันและสร้างบรรยากาศที่ดีในทีม</p>\n\n<div class=\"rubric-level\">ดีมาก (4 คะแนน)</div>\n<p>สามารถเป็นผู้นำได้ดี และพร้อมทำหน้าที่เป็นผู้ตามในทีม มีทักษะในการทำงานร่วมกับผู้อื่นได้ดี มีความร่วมมือและประสานงานในทีมได้อย่างราบรื่น</p>\n\n<div class=\"rubric-level\">ดี (3 คะแนน)</div>\n<p>สามารถเป็นผู้นำในบางสถานการณ์ และเป็นผู้ตามได้เมื่อจำเป็น มีความพยายามในการทำงานร่วมกับผู้อื่น แต่ยังขาดความคล่องแคล่วในการประสานงานหรือการรับผิดชอบในบางครั้ง</p>\n<div class=\"rubric-level\">พอใช้ (2 คะแนน)</div>\n<p>สามารถเป็นผู้นำได้ในบางครั้ง แต่ขาดความมั่นใจ และอาจมีการประสานงานที่ไม่ราบรื่นหรือขาดความร่วมมือในบางครั้ง</p>\n\n<p>ควรปรับปรุง (1 คะแนน)</p>\n<p>ขาดภาวะผู้นำ ทำงานร่วมกับผู้อื่นไม่ดี มีปัญหาด้านการสื่อสารและการประสานงาน</p>\n<div class=\"eval-item\">8. ใจอาสา | ดีเยี่ยม (5 คะแนน)</div>\n<p>มีใจอาสา พร้อมที่จะช่วยเหลือผู้อื่นในทุกสถานการณ์</p>\n\n<div class=\"rubric-level\">ดีมาก (4 คะแนน)</div>\n<p>มีใจอาสา และพร้อมที่จะช่วยเหลือในหลายสถานการณ์ แต่บางครั้งอาจมีข้อจำกัดในการจัดการเวลา</p>\n\n<div class=\"rubric-level\">ดี (3 คะแนน)</div>\n<p>มีใจอาสา แต่การมีส่วนร่วมอาจไม่สม่ำเสมอ และอาจให้ความช่วยเหลือเฉพาะในบางโอกาสหรือกิจกรรม</p>\n\n<div class=\"rubric-level\">พอใช้ (2 คะแนน)</div>\n<p>ช่วยเหลือผู้อื่นในบางครั้ง แต่ยังขาดความกระตือรือร้นหรือมีข้อจำกัดในการให้ความช่วยเหลืออย่างต่อเนื่อง</p>\n\n<p>ควรปรับปรุง (1 คะแนน)</p>\n<p>ขาดความเต็มใจในการช่วยเหลือผู้อื่น และไม่แสดงถึงความตั้งใจในการมีส่วนร่วมในกิจกรรมที่ต้องการความช่วยเหลือ</p>\n<div class=\"eval-item\">9. การใฝ่เรียนรู้ | ดีเยี่ยม (5 คะแนน)</div>\n<p>มีความกระตือรือร้นในการเรียนรู้ พัฒนาทักษะอย่างต่อเนื่อง และนำความรู้ที่ได้ไปใช้ในทางปฏิบัติอย่างมีประสิทธิภาพ</p>\n\n<div class=\"rubric-level\">ดีมาก (4 คะแนน)</div>\n<p>มีความสนใจและตั้งใจเรียนรู้ มีการพัฒนาทักษะอย่างสม่ำเสมอ และพร้อมที่จะรับฟังและเรียนรู้จากผู้อื่นเพื่อปรับปรุงตนเอง</p>\n\n<div class=\"rubric-level\">ดี (3 คะแนน)</div>\n<p>มีความพยายามในการเรียนรู้และพัฒนาตนเอง แต่ยังไม่ค่อยแสดงถึงความกระตือรือร้นหรืออาจไม่ต่อเนื่องในการหาความรู้ใหม่ ๆ</p>\n\n<div class=\"rubric-level\">พอใช้ (2 คะแนน)</div>\n<p>แสดงความสนใจในการเรียนรู้เพียงบางครั้ง ขาดความกระตือรือร้นในการหาความรู้หรือพัฒนาทักษะที่เกี่ยวข้อง</p>\n\n<p>ควรปรับปรุง (1 คะแนน)</p>\n<p>ขาดความตั้งใจในการเรียนรู้ ไม่มีความสนใจในการหาความรู้ใหม่ ๆ หรือการพัฒนาทักษะ</p>\n<div class=\"eval-item\">10. การคิดวิเคราะห์อย่างมีเหตุผลเพื่อแก้ไขปัญหาหรือพัฒนางาน | ดีเยี่ยม (5 คะแนน)</div>\n<p>มีการคิดวิเคราะห์ที่มีเหตุผล สามารถระบุปัญหาหรือจุดที่ต้องการพัฒนาได้อย่างแม่นยำ และเสนอทางแก้ที่เหมาะสม โดยใช้ข้อมูลและหลักฐานที่มีความชัดเจน นำไปสู่การแก้ไขปัญหาหรือพัฒนางานได้อย่างมีประสิทธิภาพ</p>\n\n<div class=\"rubric-level\">ดีมาก (4 คะแนน)</div>\n<p>สามารถคิดวิเคราะห์และหาทางแก้ไขปัญหาหรือพัฒนางานได้ดี ใช้เหตุผลที่มีหลักฐานรองรับ แต่บางครั้งอาจขาดความลึกในการวิเคราะห์หรือพิจารณาทางเลือกที่หลากหลาย</p>\n\n<div class=\"rubric-level\">ดี (3 คะแนน)</div>\n<p>สามารถคิดวิเคราะห์และแก้ไขปัญหาได้ในระดับพื้นฐาน แต่การวิเคราะห์ยังขาดความลึกซึ้งหรืออาจไม่ครอบคลุมทุกแง่มุมของปัญหาหรือการพัฒนา</p>\n\n<div class=\"rubric-level\">พอใช้ (2 คะแนน)</div>\n<p>สามารถคิดวิเคราะห์ได้ในบางสถานการณ์ แต่ขาดความชัดเจนในการระบุปัญหา และการใช้เหตุผลในการแก้ไขปัญหาหรือพัฒนางานยังไม่สมบูรณ์</p>\n\n<p>ควรปรับปรุง (1 คะแนน)</p>\n<p>ขาดความสามารถในการคิดวิเคราะห์หรือใช้เหตุผลในการแก้ไขปัญหาหรือพัฒนางาน</p>"}, {"name": "หลักสูตรการจัดการการท่องเที่ยวและการโรงแรม", "file": "9. สำนักวิชากการจัดการ 4 หลักสูตร\\แบบประเมินสหกิจฯ สาขาการจัดการการท่องเที.docx", "ext": "docx", "html": "<p>หลักสูตรบริหารธุรกิจบัณฑิต</p>\n<p>สาขาการจัดการการท่องเที่ยวและการโรงแรม</p>\n<p>สำนักวิชาการจัดการ</p>\n<p>(หลักสูตรปรับปรุง ปีการศึกษา 2567)</p>\n\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของหลักสูตร (Program Learning Outcomes: PLOs)</h2>\n<h3 class=\"domain-title\">1) ด้านความรู้  (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO1</span> <span class=\"lo-desc\">อธิบายแนวคิด การปรับตัว  และคุณค่าวัฒนธรรมโดยคำนึงถึงความแตกต่างและการเปลี่ยนแปลงทั้งทางด้านเศรษฐกิจ สังคม วัฒนธรรม และสิ่งแวดล้อม</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO2</span> <span class=\"lo-desc\">อธิบายแนวคิดด้านบริหารธุรกิจ การท่องเที่ยวและการโรงแรม ภายใต้การเปลี่ยนแปลงของเทคโนโลยีสารสนเทศในยุคดิจิทัล</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO3</span> <span class=\"lo-desc\">ประยุกต์ความรู้ด้านบริหารธุรกิจและการจัดการนวัตกรรมเพื่อการดำเนินงานด้านการท่องเที่ยวและการโรงแรม</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO4</span> <span class=\"lo-desc\">ประยุก
