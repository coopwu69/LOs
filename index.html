ยุกต์ใช้ความรู้ด้านการจัดการ 5 (ยอดเยี่ยม): ระบุความต้องการในการดำเนินงาน</span></div>\n<p>สารสนเทศ การออกแบบและผลิตสื่อ การ ขององค์กรได้ สามารถออกแบบกระบวนการทำงานที่</p>\n<p>จัดบริการดิจิทัลคอนเทนต์ และความรู้ในการ</p>\n<p>แก้ปัญหาขององค์กร ใช้ความรู้จากรายวิชาเพื่อแก้ปัญหา</p>\n<p>ประกอบอาชีพด้านการพัฒนาการเรียนแบบ</p>\n<p>ในการทำงาน สามารถผลิตชนิ้ งานหรือบริการตามที่ได้รับ</p>\n<p>ออนไลน์ หรือ คอนเทนต์เพื่อการตลาดดิจิทัล หรือ</p>\n<p>มอบหมาย สรา้ งนวัตกรรมด้านบริหารให้กับองค์กร</p>\n<p>ดิจิทัลคอลเล็กชัน หรือ เทคโนโลยีเพื่อการจัดการ</p>\n<div class=\"rubric-level\">4 (ดีมาก): ระบุความต้องการในการดำเนินงานของ</div>\n<p>คอนเทนต์ เพื่อตอบสนองความต้องการของ</p>\n<p>ผู้ประกอบการในอุตสาหกรรมดิจิทัล องค์กรได้ สามารถออกแบบกระบวนการทำงานที่</p>\n<p>แก้ปัญหาขององค์กร ใช้ความรู้จากรายวิชาเพื่อแก้ปัญหา</p>\n<p>ผลลัพธ์การเรยี นรู้ทคี่ าดหวงั ผลการประเมนิ</p>\n<p>ในการทำงาน สามารถผลิตชนิ้ งานหรือบริการตามที่ได้รับ</p>\n<p>มอบหมาย</p>\n<div class=\"rubric-level\">3 (ดี): ระบุความต้องการในการดำเนินงานของ</div>\n<p>องค์กรได้ สามารถออกแบบกระบวนการทำงานที่</p>\n<p>แก้ปัญหาขององค์กร ใช้ความรู้จากรายวิชาเพื่อแก้ปัญหา</p>\n<p>ในการทำงาน</p>\n<div class=\"rubric-level\">2 (พอใช้): ระบุความต้องการในการดำเนินงานของ</div>\n<p>องค์กรได้ สามารถออกแบบกระบวนการทำงานที่</p>\n<p>แก้ปัญหาขององค์กร</p>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): ระบุความต้องการในการ</div>\n<p>ดำเนินงานขององค์กรได้</p>\n<h3 class=\"domain-title\">(2) ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO3</span> <span class=\"lo-desc\">เลือกใช้เทคโนโลยีเพื่อการพัฒนาดิจิทัล 5 (ยอดเยี่ยม): สามารถใช้งานโปรแกรมหรือ</span></div>\n<p>คอนเทนต์ที่ตอบสนองวัตถุประสงค์การใช้งานของ เทคโนโลยเี พื่อการพัฒนาดิจิทัลคอนเทนต์ได้อย่าง</p>\n<p>ผู้ใช้</p>\n<p>สร้างสรรค์ สอดคล้องตามวัตถุประสงค์การใช้งานอย่าง</p>\n<p>ถูกต้องและมีประสิทธิภาพ</p>\n<div class=\"rubric-level\">4 (ดีมาก): เลือกใช้งานโปรแกรมหรือเทคโนโลยีเพื่อ</div>\n<p>การพัฒนาดิจิทัลคอนเทนต์ได้ดี สอดคล้องตาม</p>\n<p>วัตถุประสงค์การใช้งาน สามารถปรบั ปรุงบางส่วนเพื่อเพิ่ม</p>\n<p>ประสิทธิภาพได้ดี</p>\n<div class=\"rubric-level\">3 (ดี): เลอื กใช้งานโปรแกรมหรือเทคโนโลยีเพื่อการ</div>\n<p>พัฒนาดิจิทัลคอนเทนต์ได ้ ตอบโจทย์วัตถุประสงค์ได้เพียง</p>\n<p>บางส่วน มีความคิดสร้างสรรค์ในระดับพื้นฐานและ</p>\n<p>แก้ปัญหาได้เพียงบางกรณี</p>\n<p>ผลลัพธ์การเรยี นรู้ทคี่ าดหวงั ผลการประเมนิ</p>\n<div class=\"rubric-level\">2 (พอใช้): เลือกใช้งานโปรแกรมหรือเทคโนโลยีเพื่อ</div>\n<p>การพัฒนาดิจิทัลคอนเทนต์ไดเ้ ป็นบางงาน ทำให้เกิด</p>\n<p>ข้อจำกัดในการทำงาน ขาดความคิดสร้างสรรค์และการ</p>\n<p>แก้ปัญหาที่เหมาะสม</p>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): ไม่เลอื กใช้งานโปรแกรมหรือ</div>\n<p>เทคโนโลยีเพื่อการพัฒนาดิจิทัลคอนเทนต์ได้ ขาด</p>\n<p>ความคิดสร้างสรรค์และการแก้ปัญหาที่เหมาะสม</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO4</span> <span class=\"lo-desc\">ออกแบบการจัดบริการดิจิทัลคอนเทนต์อ 5 (ยอดเยี่ยม): ออกแบบบรกิ ารนดิจิทัลคอนเทนต ์</span></div>\n<p>ย่างเป็นระบบ โดยใช้กระบวนการวิจัยและพัฒนา อย่างเป็นระบบครบถ้วน</p>\n<p>เพื่อรองรับการเปลี่ยนแปลงทางดิจิทัลขององค์กร</p>\n<div class=\"rubric-level\">4 (ดีมาก): ออกแบบบรกิ ารนดิจิทัลคอนเทนต ์ อย่าง</div>\n<p>เป็นระบบ</p>\n<div class=\"rubric-level\">3 (ดี): ออกแบบบริการได้อย่างมีโครงสร้างพื้นฐานที่</div>\n<p>ชัดเจน</p>\n<div class=\"rubric-level\">2 (พอใช้): ออกแบบได้ในระดับพื้นฐาน แต่ขาดความ</div>\n<p>เป็นระบบ</p>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): ไมส่ ามารถออกแบบบริการดิจิทัล</div>\n<p>คอนเทนต์ได ้</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO5</span> <span class=\"lo-desc\">มีทักษะในการจัดระบบบริการดิจิทัลคอน 5 (ยอดเยี่ยม): สามารถจัดระบบบริการได้อย่าง</span></div>\n<p>เทนต์ให้สอดคล้องกับความต้องการขององค์กร สมบูรณ์และเป็นระบบ สอดคล้องกับความต้องการของ</p>\n<p>องค์กรอย่างชัดเจน พร้อมทงั้ มีความสามารถในการ</p>\n<p>ปรับปรุงระบบให้เหมาะสมกบั บริบทที่เปลยี่ นแปลง</p>\n<div class=\"rubric-level\">4 (ดีมาก): สามารถจัดระบบบริการได้อย่างสมบรู ณ์</div>\n<p>และเป็นระบบ และครอบคลุมสอดคล้องกับความต้องการ</p>\n<p>ขององค์กรได้ในระดับที่ด ี</p>\n<p>ผลลัพธ์การเรยี นรู้ทคี่ าดหวงั ผลการประเมนิ</p>\n<div class=\"rubric-level\">3 (ดี): สามารถจัดระบบบริการได้อย่างมีโครงสร้างส</div>\n<p>พื้นฐาน สอดคล้องกับความต้องการขององค์กรในบางส่วน</p>\n<p>แต่ยังมีจุดที่ต้องปรับปรุง</p>\n<div class=\"rubric-level\">2 (พอใช้): สามารถจัดระบบบริการได้ในระดับ</div>\n<p>เบื้องต้น แต่ยังขาดความสอดคล้องกับความต้องการของ</p>\n<p>องค์กร</p>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): ไมม่ ีความสามารถในการจัดระบบ</div>\n<p>บริการดิจิทลั คอนเทนต์ได้อย่างเหมาะสม</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO6</span> <span class=\"lo-desc\">มีทักษะการสื่อสารภาษาไทยและ 5 (ยอดเยี่ยม): มีทักษะการสื่อสารภาษาไทยและ</span></div>\n<p>ภาษาอังกฤษ เพื่อใช้ในชีวิตประจำวัน ทั้งการฟัง ภาษาอังกฤษที่โดดเด่น สื่อสารได้อย่างคล่องแคล่ว</p>\n<p>พูด อ่าน เขียน และเสนอผลงานได้ตาม</p>\n<p>ถูกต้อง และมปี ระสิทธิภาพในทุกสถานการณ์ประจำวัน</p>\n<p>วัตถุประสงค์ ในกรณีที่นักศึกษาเลือกภาษาจีน</p>\n<div class=\"rubric-level\">4 (ดีมาก): มีทักษะการสอื่ สารภาษาไทยได้อย่าง</div>\n<p>สามารถสื่อสารภาษาจีนในชีวิตประจำวันได ้</p>\n<p>ถูกต้อง สามารถสื่อสารภาษาอังกฤษได้ในระดับดี ทั้งการ</p>\n<p>ฟัง พูด อ่าน เขียน ในสถานการณ์ประจำวัน</p>\n<div class=\"rubric-level\">3 (ดี): มีทักษะการสื่อสารภาษาไทยที่ดี และ</div>\n<p>สามารถใช้ภาษาอังกฤเพื่อการฟัง พูด อ่าน เขียนใน</p>\n<p>ระดับพื้นฐาน สื่อสารภาษาอังกฤษได้ในสถานการณ์ทั่วไป</p>\n<p>แต่ยังมีข้อผิดพลาดในโครงสร้างหรือการเลือกใช้คำ</p>\n<div class=\"rubric-level\">2 (พอใช้): สามารถสื่อสารภาษาไทยได้ใน</div>\n<p>ระดับพื้นฐาน การใช้ภาษาองั กฤษยังมีข้อจำกัด เช่น การ</p>\n<p>สื่อสารคำศัพทง์ ่ายๆ เท่านั้น</p>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): ขาดทักษะในการฟงั พูด อ่าน</div>\n<p>เขียน ทั้งภาษาไทยและภาษาอังกฤษณ ไม่สามารถสื่อสาร</p>\n<p>ในสถานการณป์ ระจำวันได้</p>\n<p>ผลลัพธ์การเรยี นรู้ทคี่ าดหวงั ผลการประเมนิ</p>\n<h3 class=\"domain-title\">(3) ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO7</span> <span class=\"lo-desc\">แสดงออกถึงความซื่อสัตย์ ความกตัญญู 5 (ยอดเยี่ยม): ปฏิบัติงานด้วยความซื่อสตั ย์สุจริต</span></div>\n<p>กตเวที ความรับผิดชอบต่อตนเองและสังคม ปฏิบัติ แสดงจิตอาสาและช่วยเหลืองานขององค์กร รับผิดชอบ</p>\n<p>ตามกฎระเบียบ และปฏิบัติตนอย่างถูกต้องตาม</p>\n<p>งานให้แล้วเสรจ็ ตรงเวลา แก้ปัญหาในการทำงานได้ด้วย</p>\n<p>จริยธรรมทางวิชาการ</p>\n<p>ตนเอง ปฏิบัติตามกฎระเบียบขององค์กร</p>\n<div class=\"rubric-level\">4 (ดีมาก): ปฏิบัติงานด้วยความซื่อสตั ยส์ ุจริต แสดง</div>\n<p>จิตอาสาและช่วยเหลืองานขององค์กร รับผิดชอบงานให้</p>\n<p>แล้วเสร็จตรงเวลา แก้ปัญหาในการทำงานได้ด้วยตนเอง</p>\n<div class=\"rubric-level\">3 (ดี): ปฏิบัติงานด้วยความซื่อสตั ย์สุจริต แสดงจิต</div>\n<p>อาสาและช่วยเหลืองานขององค์กร รับผิดชอบงานให้แล้ว</p>\n<p>เสร็จตรงเวลา</p>\n<div class=\"rubric-level\">2 (พอใช้): ปฏิบัติงานด้วยความซื่อสตั ยส์ ุจริต แสดง</div>\n<p>จิตอาสาและช่วยเหลืองานขององค์กร</p>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): ปฏิบัติงานด้วยความซื่อสตั ย์สุจริต</div>\n<h3 class=\"domain-title\">(4) ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO8</span> <span class=\"lo-desc\">แสดงออกถึงการมีภาวะผู้นำ มีสุขภาวะ 5 (ยอดเยี่ยม): แสดงความเป็นผู้นำได้อย่างชัดเจนใน</span></div>\n<p>สามารถเป็นได้ทั้งผู้นำและผู้ตาม มีจิตอาสาและ ทุกสถานการ์ มีการตัดสินใจอย่างเหมาะสม และสร้าง</p>\n<p>ทำงานร่วมกับผู้อื่น</p>\n<p>แรงจูงใจให้กับทีม</p>\n<div class=\"rubric-level\">4 (ดีมาก): มีความสามารถในการเป็นผนู้ ำได้ดีใน</div>\n<p>สถานการณ์ส่วนใหญ่ แต่ยังมจี ุดที่ต้องพัฒนา</p>\n<div class=\"rubric-level\">3 (ดี): แสดงบทบามผู้นำได้ในบางสถานการณ์ แต่</div>\n<p>ยังขาดความมั่นใจหรือประสทิ ธิภาพ</p>\n<p>ผลลัพธ์การเรยี นรู้ทคี่ าดหวงั ผลการประเมนิ</p>\n<div class=\"rubric-level\">2 (พอใช้): มีความยากลำบากในการแสดงบทบาท</div>\n<p>ผู้นำ และต้องการคำแนะนำเพิ่มเติม</p>\n<div class=\"rubric-level\">1 (ต้องปรับปรุง): ไมส่ ามารถแสดงบทบาทผู้นำได้</div>\n<p>หรือหลีกเลี่ยงการรับผิดชอบ</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO9</span> <span class=\"lo-desc\">แสดงออกถึงการรู้ดิจิทัล สามารถแสวงหา 5 (ยอดเยี่ยม): สามารถค้นหาและเข้าถูกข้อมูลได้</span></div>\n<p>ความรู้ภายใต้สภาพแวดล้อมดิจิทัล อย่างรวดเร็วและมีประสิทธิภาพ โดยใช้เครื่องมือดิจิทัลที่</p>\n<p>หลากหลาย</p>\n<div class=\"rubric-level\">4 (ดีมาก): ค้นหาและเขา้ ถึงข้อมูลได้ดี โดยใช้</div>\n<p>เครื่องมือมที่เหมาะสม</p>\n<div class=\"rubric-level\">3 (ด)ี : สามารถค้นหาข้อมูลได้ในระดับพื้นฐาน แต่</div>\n<p>ต้องการคำแนะนำเพิ่มเติม</p>\n<div class=\"rubric-level\">2 (พอใช้): มีความยากลำบากในการค้นหาข้อมูลและ</div>\n<p>ใช้งานเครื่องมือได้อย่างจำกัด</p>\n<div class=\"rubric-level\">1 (ต้องปรับปรงุ ): ไมส่ ามารถค้นหาและเข้าถึงข้อมูล</div>\n<p>ได้ด้วยตนเอง</p>"}, {"name": "หลักสูตรเทคโนโลยีและนวัตกรรมสื่อ (MTA/IMAG)", "file": "3. สำนักวิชาสารสนเทศศาสตร์ 5 หลักสูตร\\5.PLO ของ MTA หรือ IMAG.docx", "ext": "docx", "html": "<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษา (Learning Outcome: LO)</h2>\n<p>หลักสูตรอินเทอร์แอคทีฟมัลติมีเดีย แอนิเมชัน และเกม</p>\n<h3 class=\"domain-title\">1) ด้านความรู้ (knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO1</span> <span class=\"lo-desc\">อธิบายแนวคิดและหลักการใช้ชีวิตในสังคมอย่างมีสุขภาวะ รวมถึงความรู้ด้านภาษาไทยและพื้นฐานภาษาต่างประเทศเพื่อประโยชน์ในการสื่อสาร</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO2</span> <span class=\"lo-desc\">ประยุกต์ใช้ทฤษฎีสำหรับการออกแบบเพื่อผลิตผลงานด้านแอนิเมชันหรือดิจิทัลเกมตามรายวิชาโทที่เลือกเรียน (รายวิชาแอนิเมชันสองมิติ แอนิชันสามมิติ วิชวลเอฟเฟกต์ การออกแบบอินเทอร์แอคทีฟ)</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO3</span> <span class=\"lo-desc\">วิเคราะห์ความต้องการหรือพฤติกรรมของผู้ใช้เพื่อผลิตผลงานด้านแอนิเมชันหรือดิจิทัลเกมตามรายวิชาโทที่เลือกเรียน (รายวิชาแอนิเมชันสองมิติ แอนิชันสามมิติ วิชวลเอฟเฟกต์ การออกแบบอินเทอร์แอคทีฟ)</span></div>\n\n<h3 class=\"domain-title\">2) ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO4</span> <span class=\"lo-desc\">มีทักษะในการสื่อสารภาษาไทยและภาษาอังกฤษ เพื่อใช้ในชีวิตประจำวันและในการทำงานด้านอินเทอร์แอคทีฟมัลติมีเดีย แอนิเมชัน หรือเกม ทั้งการฟัง พูด อ่าน เขียน และนำเสนอผลงานได้ตามวัตถุประสงค์ ในกรณีที่นักศึกษาเลือกภาษาจีน สามารถสื่อสารภาษาจีนในชีวิตประจำวันได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO5</span> <span class=\"lo-desc\">มีทักษะออกแบบงานด้านแอนิเมชันหรือดิจิทัลเกมตามรายวิชาโทที่เลือกเรียน (รายวิชาแอนิเมชันสองมิติ แอนิชันสามมิติ วิชวลเอฟเฟกต์ การออกแบบอินเทอร์แอคทีฟ)</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO6</span> <span class=\"lo-desc\">มีทักษะสร้างผลงานด้านแอนิเมชันหรือดิจิทัลเกมตามรายวิชาโทที่เลือกเรียน (รายวิชาแอนิเมชันสองมิติ แอนิชันสามมิติ วิชวลเอฟเฟกต์ การออกแบบอินเทอร์แอคทีฟ)</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO7</span> <span class=\"lo-desc\">มีทักษะในการประยุกต์ใช้เครื่องมือในงานด้านแอนิเมชันหรือดิจิทัลเกมตามรายวิชาโทที่เลือกเรียน (รายวิชาแอนิเมชันสองมิติ แอนิชันสามมิติ วิชวลเอฟเฟกต์ การออกแบบอินเทอร์แอคทีฟ)</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO8</span> <span class=\"lo-desc\">มีทักษะในการแก้ปัญหาที่เกี่ยวข้องกับด้านแอนิเมชันหรือดิจิทัลเกมตามรายวิชาโทที่เลือกเรียน (รายวิชาแอนิเมชันสองมิติ แอนิชันสามมิติ วิชวลเอฟเฟกต์ การออกแบบอินเทอร์แอคทีฟ)</span></div>\n\n<h3 class=\"domain-title\">3) ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO9</span> <span class=\"lo-desc\">แสดงออกถึงความซื่อสัตย์ กตัญญู รับผิดชอบต่อหน้าที่ของตนเอง เคารพกฎระเบียบสังคม</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO10</span> <span class=\"lo-desc\">ไม่ละเมิดทรัพย์สินทางปัญญาและกฎหมายลิขสิทธิ์ด้านอินเทอร์แอคทีฟมัลติมีเดีย แอนิเมชัน หรือเกม</span></div>\n\n<h3 class=\"domain-title\">4) ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO11</span> <span class=\"lo-desc\">สามารถทำงานร่วมกับผู้อื่นได้ รู้วินัย ใจอาสาและมีภาวะผู้นำ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO12</span> <span class=\"lo-desc\">มีความคิดสร้างสรรค์ เข้าใจคุณค่าของความงาม พร้อมให้และรับฟังคำวิจารณ์</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO13</span> <span class=\"lo-desc\">สามารถเรียนรู้และปรับตัวให้เท่าทันกับการเปลี่ยนแปลงทางเทคโนโลยีด้านอินเทอร์แอคทีฟมัลติมีเดีย แอนิเมชัน หรือเกมได้</span></div>\n\n<p>แบบประเมินผลการปฏิบัติสหกิจศึกษาตามผลลัพธ์การเรียนรู้ที่คาดหวัง รูปแบบ Rubric Scoring</p>\n<h3 class=\"domain-title\">ตอนที่ 1: ผลลัพธ์การเรียนรู้ที่คาดหวังของหลักสูตรด้านความรู้และทักษะ</h3>\n\n<h3 class=\"domain-title\">ตอนที่ 2 ผลลัพธ์การเรียนรู้ที่คาดหวังของหลักสูตรด้านทักษะทางสังคม</h3>\n\n<h4 class=\"table-marker\">[TABLE 1]</h4>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table\">\n<tr><td>ผลลัพธ์การเรียนรู้ที่คาดหวัง</td><td>ผลการประเมิน</td></tr>\n</table></div>\n<h3 class=\"domain-title\">ด้านความรู้ (Knowledge) |</h3>\n<p>CLO1: ประยุกต์ใช้ทฤษฎีสำหรับการออกแบบเพื่อผลิตผลงานด้านมัลติมีเดีย แอนิเมชัน หรือดิจิทัลเกม | ☐ ระดับดีมาก (นำทฤษฎีการออกแบบมาประยุกต์ใช้ได้อย่างสร้างสรรค์ และสร้างผลงานที่มีคุณภาพสูง)</p>\n<p>☐ ระดับดี (นำทฤษฎีการออกแบบมาประยุกต์ใช้ได้ดี และสร้างผลงานที่มีคุณภาพ)</p>\n<p>☐ ระดับพอใช้ (นำทฤษฎีการออกแบบมาประยุกต์ใช้ได้บ้าง และสร้างผลงานได้ในระดับพื้นฐาน)</p>\n<p>☐ ระดับควรปรับปรุง (นำทฤษฎีการออกแบบมาประยุกต์ใช้ได้น้อย และสร้างผลงานที่ยังมีข้อบกพร่อง)</p>\n<p>CLO2: วิเคราะห์ความต้องการหรือพฤติกรรมของผู้ใช้เพื่อผลิตผลงานด้านมัลติมีเดีย แอนิเมชัน หรือดิจิทัลเกม | ☐ ระดับดีมาก (วิเคราะห์ความต้องการผู้ใช้ได้อย่างลึกซึ้ง และนำเสนอแนวคิดที่สามารถปรับปรุงความต้องการของผู้ใช้ได้)</p>\n<p>☐ ระดับดี (วิเคราะห์ความต้องการผู้ใช้ได้ดี และนำไปสู่ผลงานที่ตอบโจทย์ได้อย่างมีประสิทธิภาพ)</p>\n<p>☐ ระดับพอใช้ (วิเคราะห์ความต้องการผู้ใช้ได้พอสมควร และนำไปสู่ผลงานที่ตอบโจทย์ได้ในระดับพื้นฐาน)</p>\n<p>☐ ระดับควรปรับปรุง (วิเคราะห์ความต้องการผู้ใช้ได้จำกัด และผลงานไม่ตอบโจทย์ความต้องการ)</p>\n<h3 class=\"domain-title\">ด้านทักษะ (Skills) |</h3>\n<p>CLO3: มีทักษะออกแบบงานด้านมัลติมีเดีย แอนิเมชัน หรือดิจิทัลเกม | ☐ ระดับดีมาก (ออกแบบงานได้อย่างสร้างสรรค์ มีเอกลักษณ์ และสอดคล้องกับหลักการออกแบบระดับมืออาชีพ)</p>\n<p>☐ ระดับดี (ออกแบบงานได้ดี มีความน่าสนใจ และสอดคล้องกับหลักการออกแบบ)</p>\n<p>☐ ระดับพอใช้ (ออกแบบงานได้ตามมาตรฐานพื้นฐาน และสอดคล้องกับหลักการออกแบบเบื้องต้น)</p>\n<p>☐ ระดับควรปรับปรุง (ออกแบบงานได้จำกัด และไม่สอดคล้องกับหลักการออกแบบ)</p>\n<p>CLO4: มีทักษะสร้างผลงานด้านมัลติมีเดีย แอนิเมชัน หรือดิจิทัลเกม | ☐ ระดับดีมาก (สร้างผลงานได้อย่างมีคุณภาพสูง มีความสมบูรณ์ และมีความซับซ้อนทางเทคนิคระดับมืออาชีพ)</p>\n<p>☐ ระดับดี (สร้างผลงานได้อย่างมีคุณภาพดี มีความสมบูรณ์ และมีเทคนิคที่น่าสนใจ)</p>\n<p>☐ ระดับพอใช้ (สร้างผลงานได้ตามมาตรฐาน และใช้เทคนิคพื้นฐาน)</p>\n<p>☐ ระดับควรปรับปรุง (สร้างผลงานได้คุณภาพต่ำและขาดเทคนิคที่จำเป็น)</p>\n<p>CLO5: มีทักษะในการประยุกต์ใช้เครื่องมือในงานด้านมัลติมีเดีย แอนิเมชัน หรือดิจิทัลเกม | ☐ ระดับดีมาก (ประยุกต์ใช้เครื่องมือได้อย่างมืออาชีพ และใช้คุณสมบัติขั้นสูงได้อย่างมีประสิทธิภาพ)</p>\n<p>☐ ระดับดี (ประยุกต์ใช้เครื่องมือได้อย่างเชี่ยวชาญ และใช้คุณสมบัติที่หลากหลายได้อย่างเหมาะสม)</p>\n<p>☐ ระดับพอใช้ (ประยุกต์ใช้เครื่องมือได้ในระดับพื้นฐาน และใช้คุณสมบัติพื้นฐานได้)</p>\n<p>☐ ระดับควรปรับปรุง (ประยุกต์ใช้เครื่องมือได้จำกัด และใช้คุณสมบัติพื้นฐานไม่คล่อง)</p>\n<p>CLO6: มีทักษะในการแก้ปัญหาที่เกี่ยวข้องกับด้านมัลติมีเดีย แอนิเมชัน หรือดิจิทัลเกม | ☐ ระดับดีมาก (แก้ปัญหาได้อย่างสร้างสรรค์ รวดเร็ว และมีประสิทธิภาพ แม้ในสถานการณ์ซับซ้อน)</p>\n<p>☐ ระดับดี (แก้ปัญหาได้ดีและเป็นระบบในสถานการณ์ส่วนใหญ่)</p>\n<p>☐ ระดับพอใช้ (แก้ปัญหาพื้นฐานได้ แต่อาจต้องการคำแนะนำในสถานการณ์ซับซ้อน)</p>\n<p>☐ ระดับควรปรับปรุง (แก้ปัญหาได้จำกัดและต้องการความช่วยเหลือแม้ในสถานการณ์พื้นฐาน)</p>\n\n<h4 class=\"table-marker\">[TABLE 2]</h4>\n<h3 class=\"domain-title\">ด้านจริยธรรม (Ethics) |</h3>\n<p>CLO7: แสดงออกถึงความซื่อสัตย์ กตัญญู รับผิดชอบต่อหน้าที่ของตนเอง เคารพกฎระเบียบสังคม | ☐ ระดับดีมาก (มีคุณธรรมจริยธรรม เป็นแบบอย่างที่ดี และส่งเสริมให้ผู้อื่นปฏิบัติตาม)</p>\n<p>☐ ระดับดี (มีคุณธรรมจริยธรรม รับผิดชอบ และเคารพกฎระเบียบอย่างสม่ำเสมอ)</p>\n<p>☐ ระดับพอใช้ (มีคุณธรรมจริยธรรม และเคารพกฎระเบียบโดยทั่วไป)</p>\n<p>☐ ระดับควรปรับปรุง (ขาดคุณธรรมจริยธรรมในบางสถานการณ์ และละเลยกฎระเบียบบ่อยครั้ง)</p>\n<p>CLO8: ไม่ละเมิดทรัพย์สินทางปัญญาและกฎหมายลิขสิทธิ์ด้านอินเทอร์แอคทีฟมัลติมีเดีย แอนิเมชัน หรือดิจิทัลเกม | ☐ ระดับดีมาก (เข้าใจและปฏิบัติตามกฎหมายลิขสิทธิ์อย่างเคร่งครัด พร้อมส่งเสริมและให้ความรู้แก่ผู้อื่น)</p>\n<p>☐ ระดับดี (เข้าใจและปฏิบัติตามกฎหมายลิขสิทธิ์อย่างสม่ำเสมอ)</p>\n<p>☐ ระดับพอใช้ (เข้าใจและปฏิบัติตามกฎหมายลิขสิทธิ์โดยทั่วไป แต่อาจมีความเข้าใจคลาดเคลื่อนบางประการ)</p>\n<p>☐ ระดับควรปรับปรุง (ขาดความเข้าใจและละเมิดกฎหมายลิขสิทธิ์โดยไม่ตระหนักถึงผลกระทบ)</p>\n<h3 class=\"domain-title\">ด้านลักษณะบุคคล (Character) |</h3>\n<p>CLO9: สามารถทำงานร่วมกับผู้อื่นได้ รู้วินัย ใจอาสาและมีภาวะผู้นำ |</p>\n<p>CLO10: มีความคิดสร้างสรรค์ เข้าใจคุณค่าของความงาม พร้อมให้และรับฟังคำวิจารณ์ | ☐ ระดับดีมาก (มีความคิดสร้างสรรค์โดดเด่น เข้าใจสุนทรียศาสตร์อย่างลึกซึ้ง และรับฟังคำวิจารณ์อย่างสร้างสรรค์)</p>\n<p>☐ ระดับดี (มีความคิดสร้างสรรค์ดี เข้าใจสุนทรียศาสตร์ และรับฟังคำวิจารณ์เพื่อพัฒนาตนเอง)</p>\n<p>☐ ระดับพอใช้ (มีความคิดสร้างสรรค์พื้นฐาน เข้าใจสุนทรียศาสตร์ทั่วไป และรับฟังคำวิจารณ์บ้าง)</p>\n<p>☐ ระดับควรปรับปรุง (ขาดความคิดสร้างสรรค์ เข้าใจสุนทรียศาสตร์น้อย และไม่เปิดรับคำวิจารณ์)</p>\n<p>CLO11: สามารถเรียนรู้และปรับตัวให้เท่าทันกับการเปลี่ยนแปลงทางเทคโนโลยีด้านมัลติมีเดีย แอนิเมชัน หรือดิจิทัลเกม | ☐ ระดับดีมาก (เรียนรู้และปรับตัวกับเทคโนโลยีใหม่ได้อย่างรวดเร็ว มองเห็นแนวโน้มและคาดการณ์การเปลี่ยนแปลงได้)</p>\n<p>☐ ระดับดี (เรียนรู้และปรับตัวกับเทคโนโลยีใหม่ได้ดี และติดตามความก้าวหน้าอย่างสม่ำเสมอ)</p>\n<p>☐ ระดับพอใช้ (เรียนรู้และปรับตัวกับเทคโนโลยีใหม่ได้พอสมควร แต่อาจต้องใช้เวลา)</p>\n<p>☐ ระดับควรปรับปรุง (เรียนรู้และปรับตัวกับเทคโนโลยีใหม่ได้ช้า และไม่ติดตามความก้าวหน้า)</p>"}]}, {"faculty": "สำนักวิชารัฐศาสตร์", "curricula": [{"name": "หลักสูตรรัฐศาสตร์ (ความสัมพันธ์ระหว่างประเทศ) 2567", "file": "4. สำนักรัฐศาสตร์ฯ 3 หลักสูตร\\LO และแบบสอบถาม - หลักสูตรรัฐศาสตร์ IR 2567.docx", "ext": "docx", "html": "<p>หลักสูตรรัฐศาสตรบัณฑิต สาขาความสัมพันธ์ระหว่างประเทศ</p>\n<p>(หลักสูตรปรับปรุง พ.ศ. 2567)</p>\n\n<p>ผลลัพธ์การเรียนรู้ (LO) ของรายวิชาสหกิจศึกษาของหลักสูตรฯ</p>\n<p>(INR67-491 สหกิจศึกษา 1 และ INR67-492 สหกิจศึกษา 2)</p>\n\n<h3 class=\"domain-title\">1) ด้านความรู้ (Knowledge)</h3>\n<p>CLO1 ประยุกต์ใช้ความรู้พื้นฐานหรือแนวคิดด้านความสัมพันธ์ระหว่างประเทศในการทำงานจริง เพื่อปรับปรุงหรือแก้ไขกระบวนการทำงานในสถานประกอบการให้มีประสิทธิภาพขึ้น</p>\n<p>CLO2 ใช้กระบวนการคิดวิเคราะห์และความคิดสร้างสรรค์ เพื่อระบุและวิเคราะห์ปัญหาที่พบในสถานประกอบการ พร้อมเสนอแนวทางแก้ไขอย่างเป็นระบบ</p>\n<p>CLO3 สรุปผลการปฏิบัติงานสหกิจศึกษา นำเสนอผลงานได้ตามมาตรฐานทางวิชาการ และเชื่อมโยงประสบการณ์สู่การวางแผนประกอบอาชีพหรือการพัฒนาต่อยอดในอนาคต</p>\n<h3 class=\"domain-title\">2) ด้านทักษะ (Skills)</h3>\n<p>CLO4 ติดต่อสื่อสาร (ฟัง พูด อ่าน เขียน) ทั้งภาษาไทย ภาษาอังกฤษ และ/หรือภาษาที่สามได้อย่างเหมาะสมกับบริบทการทำงาน โดยคำนึงถึงความแตกต่างทางวัฒนธรรม</p>\n<p>CLO5 ใช้ทักษะด้านเทคโนโลยีสารสนเทศในการสืบค้น จัดเก็บ วิเคราะห์ข้อมูล และจัดทำรายงานได้อย่างถูกต้องและมีประสิทธิภาพ พร้อมทั้งตระหนักถึงความปลอดภัยทางไซเบอร์</p>\n<p>CLO6 วางแผนและปฏิบัติงานในโครงการหรือหน้าที่ที่ได้รับมอบหมายอย่างต่อเนื่อง จัดการปัญหา/อุปสรรคได้อย่างเหมาะสม และปรับตัวได้ดี</p>\n<h3 class=\"domain-title\">3) ด้านจริยธรรม (Ethics)</h3>\n<p>CLO7 รับผิดชอบต่อหน้าที่ ซื่อสัตย์สุจริต เคารพกฎระเบียบขององค์กร และจรรยาบรรณทางวิชาชีพ พร้อมทั้งเคารพสิทธิและความคิดเห็นที่หลากหลาย</p>\n<h3 class=\"domain-title\">4) ด้านลักษณะบุคคล (Character)</h3>\n<p>CLO8 ทำงานร่วมกับผู้อื่นได้อย่างมีประสิทธิภาพ มีวินัย แสดงทัศนคติเปิดกว้างแบบพลเมืองโลก และมีจิตอาสาในการช่วยเหลือสังคม</p>\n<p>CLO9 แสดงออกถึงความอดทนและยืดหยุ่นในการทำงาน สามารถบริหารเวลาได้ดี ภายใต้สถานการณ์กดดัน ใช้ความคิดสร้างสรรค์และมีทัศนคติเชิงบวกในการเรียนรู้สิ่งใหม่และนำมาพัฒนาตนเองอย่างต่อเนื่อง</p>\n<h2 class=\"section-title\">แบบประเมินสหกิจศึกษาของหลักสูตรฯ</h2>\n<p>สำนักวิชา: รัฐศาสตร์และรัฐประศาสตร์</p>\n<p>หลักสูตร: รัฐศาสตรบัณฑิต สาขาความสัมพันธ์ระหว่างประเทศ</p>\n<p>ภาคการศึกษา/ปีการศึกษา: ……………………</p>\n<p>รหัสนักศึกษา: ……………………</p>\n<p>ชื่อ-สกุล นักศึกษา: …………………………………………….</p>\n<p>ชื่อสถานประกอบการ: …………………………………………….</p>\n<p>ชื่อ-สกุลอาจารย์นิเทศ: …………………………………………….</p>\n\n<p>ระดับคะแนน (Rating Scale)</p>\n<p>4 = ดีเยี่ยม (Excellent)</p>\n<p>3 = ดี (Good)</p>\n<p>2 = พอใช้ (Satisfactory)</p>\n<p>1 = ควรปรับปรุง (Needs Improvement)</p>\n\n<p>จุดเด่นของนักศึกษา (Student’s Strengths).....</p>\n<p>จุดที่นักศึกษาควรปรับปรุง (Points for Improvement)....</p>\n\n<h4 class=\"table-marker\">[TABLE 1]</h4>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table\">\n<tr><td>รายการประเมิน (Indicators)</td><td>4</td><td>3</td><td>2</td><td>1</td><td>ความเห็นเพิ่มเติม</td></tr>\n</table></div>\n<p>หัวข้อที่ 1: ความรู้ (Knowledge)</p>\n<p>(สอดคล้องกับ CLO1, CLO2, CLO3) |  |  |  |  |</p>\n<p>1.1 ใช้ความรู้พื้นฐาน/แนวคิดด้านความสัมพันธ์ระหว่างประเทศในการพัฒนาหรือแก้ไขปัญหาในสถานประกอบการได้ (Applies fundamental IR knowledge or concepts to improve or solve organizational work processes effectively.) |  |  |  |  |</p>\n<p>1.2 ใช้กระบวนการคิดวิเคราะห์และความคิดสร้างสรรค์ เพื่อระบุและวิเคราะห์ปัญหา พร้อมเสนอแนวทางแก้ไขอย่างเป็นระบบ (Employs analytical and creative thinking to identify and analyze problems and propose systematic solutions.) |  |  |  |  |</p>\n<p>1.3 ทันต่อเหตุการณ์/ข่าวสารที่เกี่ยวข้องกับวิชาชีพและสถานการณ์ปัจจุบัน มีความสามารถในการสืบค้นข้อมูลเชิงวิชาการ (Keeps up-to-date with news and information relevant to the profession and current affairs, and demonstrates the ability to research for academic resources.) |  |  |  |  |</p>\n<p>1.4 สรุปผลการปฏิบัติงานสหกิจศึกษา และนำเสนอผลงานได้ตามมาตรฐานทางวิชาการ พร้อมเชื่อมโยงประสบการณ์สู่การวางแผนประกอบอาชีพ/การพัฒนาต่อยอด (Summarizes co-op work results and presents them according to academic standards, linking experiences to future career planning or further development.) |  |  |  |  |</p>\n<p>หัวข้อที่ 2: ทักษะ (Skills)</p>\n<p>(สอดคล้องกับ CLO4, CLO5, CLO6) |  |  |  |  |</p>\n<p>2.1 ติดต่อสื่อสาร (ฟัง พูด อ่าน เขียน) ทั้งภาษาไทย ภาษาอังกฤษ และ/หรือภาษาที่สามได้อย่างเหมาะสม โดยคำนึงถึงความแตกต่างทางวัฒนธรรม (Communicates effectively (listening, speaking, reading, writing) in Thai, English, and/or a third language, considering cultural differences.) |  |  |  |  |</p>\n<p>2.2 ใช้เทคโนโลยีสารสนเทศในการสืบค้น จัดเก็บ วิเคราะห์ข้อมูล จัดทำรายงานได้อย่างถูกต้อง พร้อมตระหนักถึงความปลอดภัยไซเบอร์ (Utilizes IT skills to search, store, and analyze data, preparing accurate reports while ensuring cybersecurity awareness.) |  |  |  |  |</p>\n<p>2.3 วางแผนและปฏิบัติงานในโครงการหรือหน้าที่ที่ได้รับมอบหมายได้อย่างต่อเนื่อง มีความสามารถในการจัดการปัญหา/อุปสรรคได้อย่างเหมาะสมและปรับตัวได้ดี (Plans and carries out assigned projects or tasks continuously, effectively resolves issues, and adapts well to changes.) |  |  |  |  |</p>\n<p>หัวข้อที่ 3: จริยธรรม (Ethics)</p>\n<p>(สอดคล้องกับ CLO7) |  |  |  |  |</p>\n<p>3.1 รับผิดชอบต่อหน้าที่ มีความซื่อสัตย์สุจริต และเคารพกฎระเบียบขององค์กร (Demonstrates responsibility, honesty, and respects organizational rules.) |  |  |  |  |</p>\n<p>3.2 ปฏิบัติงานโดยยึดจรรยาบรรณทางวิชาชีพ (Adheres to the professional code of ethics in all tasks.) |  |  |  |  |</p>\n<p>3.3 มีวินัย ตรงต่อเวลา และตระหนักในบทบาทหน้าที่ของตน (Maintains discipline, punctuality, and awareness of one’s responsibilities.) |  |  |  |  |</p>\n<p>3.4 เคารพสิทธิและความคิดเห็นที่หลากหลาย (Respects others’ rights and diverse opinions with an open mind.) |  |  |  |  |</p>\n<p>หัวข้อที่ 4: ลักษณะบุคคล (Character)</p>\n<p>(สอดคล้องกับ CLO8, CLO9) |  |  |  |  |</p>\n<p>4.1 ทำงานร่วมกับผู้อื่นได้อย่างมีประสิทธิภาพ ร่วมมือกับทีม มีวินัย และแสดงทัศนคติเปิดกว้างแบบพลเมืองโลก (Works effectively in a team, maintains discipline, and shows a global citizen attitude.) |  |  |  |  |</p>\n<p>4.2 แสดงออกถึงจิตอาสาในการช่วยเหลือสังคม และให้ความร่วมมือกับกิจกรรมส่วนรวม (Demonstrates volunteer spirit, actively contributing to the community and group activities.) |  |  |  |  |</p>\n<p>4.3 มีความอดทน ยืดหยุ่น บริหารเวลาได้ดี และสามารถทำงานภายใต้สภาวะกดดัน (Shows resilience and flexibility, manages time well, and performs under pressure.) |  |  |  |  |</p>\n<p>4.4 ใช้ความคิดสร้างสรรค์ และมี ทัศนคติเชิงบวกในการเรียนรู้สิ่งใหม่ เพื่อนำมาพัฒนาตนเองอย่างต่อเนื่อง (Applies creativity and maintains a positive attitude toward lifelong learning for continuous self-improvement.) |  |  |  |  |</p>\n<p>ผลการปฏิบัติงานโดยภาพรวม |  |  |  |  |</p>"}, {"name": "หลักสูตรการเมืองการปกครอง", "file": "4. สำนักรัฐศาสตร์ฯ 3 หลักสูตร\\แบบประเมินสหกิจ หลักสูตรการเมืองการปกครอง.docx", "ext": "docx", "html": "\n\n<h2 class=\"section-title\">Learning Outcome</h2>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">มีทักษะการคิด วิเคราะห์และออกแบบงานวิจัยที่สอดคล้องไปกับลักษณะการทำงานในที่ตนปฏิบัติ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">มีทักษะในการรับข้อมูลและจับประเด็นเพื่อแยกแยะ จัดสรรข้อมูลต่างๆให้กับได้อย่างเป็นระเบียบ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">มีทักษะในการถ่ายทอดและนำเสนอประเด็นต่างๆให้สอดคล้องไปกับลักษณะของงานที่ได้รับมอบหมายได้ถูกต้อง</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">มีความรับผิดชอบในการปฏิบัติงาน มีวินัยและเคารพกเกณฑ์ต่างๆ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">มีมนุษยสัมพันธ์ที่ดี มีจิตสาธารณะ พร้อมช่วยเหลือเพื่อนร่วมงาน</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO6</span> <span class=\"lo-desc\">มีความใฝ่รู้ ขยัน อดทนและพร้อมพัฒนาตนเองอยู่เสมอ</span></div>\n\n<h2 class=\"section-title\">แบบประเมิน LO</h2>\n\n<h4 class=\"table-marker\">[TABLE 1]</h4>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table\">\n<tr><td>คำถามสำหรับประเมิน</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td></tr>\n<tr><td>1.นักศึกษามีการวางแผน ปรึกษาและรายงานความคืบหน้าการทำวิจัยกับท่านมากแค่ไหน</td><td>|</td></tr>\n<tr><td>2.นักศึกษาสามารถจับประเด็นคำสั่งและสามารถปฏิบัติงานตามคำสั่งที่ได้รับมอบหมายได้มากน้อยแค่ไหน</td><td>|</td></tr>\n<tr><td>3.นักศึกษาสื่อสารและประสานงานกับผู้ปฏิบัติงานอื่นๆในหน่วยงานของท่านได้มากน้อยแค่ไหน</td><td>|</td></tr>\n<tr><td>4.นักศึกษาสามารถเขียนหนังสือและจัดทำเอกสารเพื่อประสานงานให้กับหน่วยงานของท่านได้อย่างถูกต้องเป็นไปตามระเบียบมากน้อยแค่ไหน</td><td>|</td></tr>\n<tr><td>5.นักศึกษาสามารถอภิปรายถ่ายทอดและนำเสนอประเด็นเกี่ยวกับงานที่ตนได้รับมอบหมายได้อย่างมีประสิทธิภาพมากน้อยแค่ไหน</td><td>|</td></tr>\n<tr><td>6.นักศึกษาแต่งกายในขณะปฏิบัติงานให้กับหน่วยงานของท่านได้อย่างเหมาะสมแค่ไหน</td><td>|</td></tr>\n<tr><td>7.นักศึกษาตรงเวลามากน้อยแค่ไหน</td><td>|</td></tr>\n<tr><td>8.นักศึกษามีความอ่อนน้อมและมนุษย์สัมพันธ์ที่ดีให้กับเจ้าหน้าที่ท่านอื่นๆในหน่วยงานของท่านมากน้อยแค่ไหน</td><td>|</td></tr>\n<tr><td>9.นักศึกษามีความกล้าแสดงออก พร้อมช่วยเหลือเจ้าหน้าที่ในหน่วยงานของท่านมากแค่ไหน</td><td>|</td></tr>\n<tr><td>10.จากการสังเกต ท่านคิดว่านักศึกษามีความขยัน หมั่นเพียร พร้อมพัฒนาตนเองมากน้อยแค่ไหน</td><td>|</td></tr>\n</table></div>"}, {"name": "หลักสูตรรัฐประศาสนศาสตร์", "file": "4. สำนักรัฐศาสตร์ฯ 3 หลักสูตร\\แบบประเมินสหกิจหลักสูตร รปศ.docx", "ext": "docx", "html": "<p>หลักสูตรรัฐประศาสนศาสตรบัณฑิต</p>\n<p>(หลักสูตรปรับปรุง ปีการศึกษา 2567)</p>\n\n<p>ผลลัพธ์การเรียนรู้ (LO) ของรายวิชาสหกิจศึกษาของหลักสูตรฯ</p>\n<p>(PAD67-491 สหกิจศึกษา 1 และ PAD67-492 สหกิจศึกษา 2)</p>\n\n<h3 class=\"domain-title\">1) ด้านความรู้ (Knowledge)</h3>\n<p>CLO1 ประยุกต์องค์ความรู้ทางรัฐประศาสนศาสตร์และองค์ความรู้ทางด้านวิจัยเพื่อการแก้ปัญหาสำหรับการปฏิบัติงานในสถานประกอบการ</p>\n<h3 class=\"domain-title\">2) ด้านทักษะ (Skills)</h3>\n<p>CLO2 ใช้ทักษะด้านเทคโนโลยีสารสนเทศในการสืบค้น จัดเก็บ วิเคราะห์ข้อมูล ในการปฏิบัติงานและจัดทำรายงานได้อย่างมีประสิทธิภาพ</p>\n<p>CLO3 ใช้ทักษะด้านการวิจัยทางรัฐประศาสนศาสตร์ เพื่อประยุกต์เข้ากับกระบวนการทำงานในสถานประกอบการอย่างเป็นระบบ</p>\n<h3 class=\"domain-title\">3) ด้านจริยธรรม (Ethics)</h3>\n<p>CLO4 ประพฤติตนตามหลักความซื่อสัตย์สุจริต มีความกตัญญู ปฏิบัติตามระเบียบ กฎหมาย และข้อบังคับของสถานประกอบการ</p>\n<p>CLO5 มีความรับผิดชอบต่อบทบาทหน้าที่ที่ได้รับมอบหมายในสถานประกอบการ</p>\n<h3 class=\"domain-title\">4) ด้านลักษณะบุคคล (Character)</h3>\n<p>CLO6 แสดงออกถึงการแสวงหาความรู้ เพื่อการปฏิบัติงานและการพัฒนาตนเองอย่างต่อเนื่อง</p>\n<p>CLO7 แสดงออกถึงการมีภาวะผู้นำ ทั้งในด้านของการปฏิบัติตามกฎระเบียบ มีจิตอาสา และมีความคิดริเริ่มสร้างสรรค์ในการแก้ปัญหาในสถานประกอบการ</p>\n\n<p>แบบประเมินสหกิจศึกษาของหลักสูตรรัฐประศาสนศาสตรบัณฑิต (หลักสูตรปรับปรุง ปีการศึกษา 2567)</p>\n\n<p>สำนักวิชา: รัฐศาสตร์และรัฐประศาสนศาสตร์</p>\n<p>หลักสูตร: รัฐประศาสนศาสตรบัณฑิต</p>\n<p>ภาคการศึกษา/ปีการศึกษา: ……………………</p>\n<p>รหัสนักศึกษา: ……………………</p>\n<p>ชื่อ-สกุล นักศึกษา: …………………………………………….</p>\n<p>ชื่อสถานประกอบการ: …………………………………………….</p>\n<p>ชื่อ – สกุล อาจารย์นิเทศ: …………………………………………….</p>\n\n<p>ระดับคะแนน (Rating Scale)</p>\n<p>4 = ดีเยี่ยม (Excellent)</p>\n<p>3 = ดี (Good)</p>\n<p>2 = พอใช้ (Satisfactory)</p>\n<p>1 = ควรปรับปรุง (Needs Improvement)</p>\n\n<p>จุดเด่นของนักศึกษา (Student’s Strengths)</p>\n<p>………………………………………………………………………………………………………………………………………………………………………………………</p>\n<p>………………………………………………………………………………………………………………………………………………………………………………………</p>\n<p>………………………………………………………………………………………………………………………………………………………………………………………</p>\n<p>………………………………………………………………………………………………………………………………………………………………………………………</p>\n<p>………………………………………………………………………………………………………………………………………………………………………………………</p>\n<p>………………………………………………………………………………………………………………………………………………………………………………………</p>\n\n<p>จุดที่นักศึกษาควรปรับปรุง (Points for Improvement)</p>\n<p>………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………</p>\n\n<p>ข้อเสนอแนะอื่นๆ (Other Comments)</p>\n<p>………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………</p>\n\n<h4 class=\"table-marker\">[TABLE 1]</h4>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table\">\n<tr><td>รายการประเมิน (Indicators)</td><td>4</td><td>3</td><td>2</td><td>1</td><td>ความเห็นเพิ่มเติม</td></tr>\n</table></div>\n<p>หัวข้อที่ 1: ความรู้ (Knowledge)</p>\n<p>(สอดคล้องกับ CLO1) |  |  |  |  |</p>\n<p>1.1 การนำหลักการและทฤษฎีรัฐประศาสนศาสตร์ไปปรับใช้กับการปฏิบัติงานในสถานประกอบการ</p>\n<p>(Be able to apply public administration principles and theories to workplace practices.) |  |  |  |  |</p>\n<p>1.2 ใช้กระบวนการคิดวิเคราะห์และความคิดสร้างสรรค์ เพื่อระบุและวิเคราะห์ปัญหาพร้อมเสนอแนวทางแก้ไขอย่างเป็น</p>\n<p>ระบบ</p>\n<p>(Employs analytical and creative thinking to identify and analyze problems and propose systematic solutions.) |  |  |  |  |</p>\n<p>หัวข้อที่ 2: ทักษะ (Skills)</p>\n<p>(สอดคล้องกับ CLO2, CLO3) |  |  |  |  |</p>\n<p>2.1 สามารถใช้เครื่องมือเทคโนโลยีสารสนเทศ ในการสืบค้น วิเคราะห์ และรายงานข้อมูลที่เกี่ยวข้องกับการปฏิบัติงานได้อย่างมีประสิทธิภาพ</p>\n<p>(The ability to use information technology tools to search, analyze, and effectively report work-related data.) |  |  |  |  |</p>\n<p>2.2 สามารถนำผลการวิจัยหรือการวิเคราะห์ข้อมูล เพื่อเสนอแนะแนวทางแก้ไขปัญหา หรือปรับปรุงงานในสถานประกอบการได้อย่างเหมาะสม</p>\n<p>(The ability to apply research findings or data analysis to propose solutions or improve workplace operations appropriately.) |  |  |  |  |</p>\n<p>หัวข้อที่ 3: จริยธรรม (Ethics)</p>\n<p>(สอดคล้องกับ CLO4, CLO5) |  |  |  |  |</p>\n<p>3.1 แสดงออกมีความซื่อสัตย์สุจริต ในการปฏิบัติงานของสถานประกอบการ</p>\n<p>(Demonstrates integrity and honesty in workplace practices.) |  |  |  |  |</p>\n<p>3.2 แสดงออกถึงความมีวินัยและปฏิบัติตามกฎระเบียบของสถานประกอบการ</p>\n<p>(Exhibits discipline and adherence to the organization&#x27;s rules and regulations.) |  |  |  |  |</p>\n<p>3.3 สามารถรับผิดชอบต่องานที่ได้รับมอบหมาย และส่งมอบงานได้ตามกำหนดเวลา</p>\n<p>(The ability to take responsibility for assigned tasks and deliver work within the specified timeframe.) |  |  |  |  |</p>\n<p>หัวข้อที่ 4: ลักษณะบุคคล (Character)</p>\n<p>(สอดคล้องกับ CLO6, CLO7) |  |  |  |  |</p>\n<p>4.1 แสดงออกถึงความพยายามในการเรียนรู้สิ่งใหม่ เพื่อพัฒนาความรู้และทักษะที่เกี่ยวข้องกับงานที่ได้รับมอบหมาย</p>\n<p>(Shows effort in learning new things to enhance knowledge and skills related to assigned tasks.) |  |  |  |  |</p>\n<p>4.2 แสดงออกถึงลักษณะของความเป็นผู้นำในการทำงานร่วมกับบุคลากรของสถานประกอบการ</p>\n<p>(Demonstrates leadership qualities in working collaboratively with organizational personnel.) |  |  |  |  |</p>\n<p>4.3 มีความคิดริเริ่มสร้างสรรค์ ในการแก้ปัญหาหรือปรับปรุงกระบวนการทำงานของสถานประกอบการ</p>\n<p>(Demonstrates leadership qualities in working collaboratively with organizational personnel.) |  |  |  |  |</p>\n<p>4.4 แสดงออกถึง จิตอาสาและความกระตือรือร้นในการช่วยเหลือผู้อื่นหรือสนับสนุนกิจกรรมของสถานประกอบการ</p>\n<p>(Exhibits volunteer spirit and enthusiasm in helping others or supporting organizational activities.) |  |  |  |  |</p>\n<p>ผลการปฏิบัติงานโดยภาพรวม |  |  |  |  |</p>"}]}, {"faculty": "สำนักวิทยาศาสตร์", "curricula": [{"name": "หลักสูตรวิทยาศาสตรบัณฑิต สาขาวิทยาศาสตร์", "file": "5. สำนักวิทยาศาสตร์ 2 หลักสูตร\\หลักสูตรวิทยาศาสตรบัณฑิต สาขาวิทยาศาสตร์.docx", "ext": "docx", "html": "<p>หลักสูตรวิทยาศาสตรบัณฑิต สาขาวิทยาศาสตร์</p>\n<p>หลักสูตรปรับปรุง ปีการศึกษา ๒๕๖๗</p>\n<p>สำนักวิชาวิทยาศาสตร์</p>\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของหลักสูตร (Program Learning Outcomes: PLOs)</h2>\n<p>หลักสูตรมุ่งผลิตบัณฑิตที่ตอบสนองทิศทาง นโยบาย ยุทธศาสตร์ชาติและมหาวิทยาลัย ตลอดจนความต้องการของผู้มีส่วนได้ส่วนเสีย และสอดคล้องตามเกณฑ์ 4 ด้าน ตามประกาศคณะกรรมการมาตรฐานการอุดมศึกษา เรื่อง รายละเอียดผลลัพธ์การเรียนรู้ตามมาตรฐานคุณวุฒิระดับอุดมศึกษา พ.ศ. 2565 รวมทั้งการมุ่งเน้นในการผลิตบัณฑิตที่มีความสามารถในการคิดวิเคราะห์และสังเคราะห์ สามารถแสวงหาความรู้ได้ตลอดชีวิต บนพื้นฐานของการมีจิตสำนึกในการรักชาติ รักแผ่นดิน มีความกตัญญู มีวินัย และรับผิดชอบต่อสังคม โดยบัณฑิตที่สำเร็จการศึกษาในหลักสูตรนี้มีความสามารถ แต่ละด้านดังนี้</p>\n<h3 class=\"domain-title\">1) ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO1</span> <span class=\"lo-desc\">อธิบายกฎ ทฤษฎี หลักการ และปรากฏการณ์ต่าง ๆ โดยใช้ความรู้พื้นฐานทางวิทยาศาสตร์และคณิตศาสตร์ได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO2</span> <span class=\"lo-desc\">ประยุกต์ใช้ความรู้เฉพาะด้านของแต่ละวิชาเอก (วิชาเอกคณิตศาสตร์และสถิติ หรือวิชาเอกเคมี หรือวิชาเอกชีววิทยา หรือวิชาเอกฟิสิกส์) เพื่อการแก้ปัญหาทางวิทยาศาสตร์ได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO3</span> <span class=\"lo-desc\">ประยุกต์ใช้ความรู้ตามศาสตร์สาขาวิชาโทให้เกิดความเชี่ยวชาญเฉพาะด้าน อันประกอบด้วย</span></div>\n<p>สำหรับวิชาเอกคณิตศาสตร์และสถิติ</p>\n<p>วิชาโทสถิติ หรือ</p>\n<p>วิชาโทคณิตศาสตร์การเงิน หรือ</p>\n<p>วิชาโทคณิตศาสตร์บริสุทธิ์</p>\n<p>สำหรับวิชาเอกเคมี</p>\n<p>วิชาโทวัสดุเคมีเพื่อความยั่งยืน หรือ</p>\n<p>วิชาโทเคมีเชิงคำนวณ หรือ</p>\n<p>วิชาโทนักออกแบบทางเคมี</p>\n<p>สำหรับวิชาเอกชีววิทยา</p>\n<p>วิชาโทซิสเทมาติคส์ของพืช หรือ</p>\n<p>วิชาโทสัตววิทยาและนิเวศวิทยา หรือ</p>\n<p>วิชาโทเทคโนโลยีชีวภาพ</p>\n<p>สำหรับวิชาเอกฟิสิกส์</p>\n<p>วิชาโทไมโครเวฟและฟิสิกส์วัสดุ หรือ</p>\n<p>วิชาโทฟิสิกส์พลังงานสูงและจักรวาลวิทยา หรือ</p>\n<p>วิชาโทการเรียนรู้ของเครื่องและปัญญาประดิษฐ์</p>\n<p>เพื่อการแก้ปัญหาทางวิทยาศาสตร์ได้</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO4</span> <span class=\"lo-desc\">อธิบายแนวคิดและวิธีการปรับตัวท่ามกลางสถานการณ์ที่มีการเปลี่ยนแปลงในด้านต่าง ๆ ของสังคม เศรษฐกิจ และสิ่งแวดล้อม โดยคำนึงถึงคุณค่าของวัฒนธรรมต่าง ๆ ที่หลากหลาย</span></div>\n<h3 class=\"domain-title\">2) ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO5</span> <span class=\"lo-desc\">ใช้เครื่องมือพื้นฐานเพื่อการทดลองและแก้ปัญหาทางวิทยาศาสตร์ในสถานการณ์ที่กำหนดให้ได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO6</span> <span class=\"lo-desc\">เลือกใช้เครื่องมือเพื่อการวิเคราะห์และทดสอบทางวิทยาศาสตร์ตามสาขาวิชาเอก ดังนี้ คณิตศาสตร์และสถิติ (สำหรับวิชาเอกคณิตศาสตร์และสถิติ) หรือเคมี (สำหรับวิชาเอกเคมี) หรือชีววิทยา (สำหรับวิชาเอกชีววิทยา) หรือฟิสิกส์ (สำหรับวิชาเอกฟิสิกส์) ได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO7</span> <span class=\"lo-desc\">เลือกใช้เครื่องมือตามศาสตร์สาขาวิชาโทเพื่อสร้างความเชี่ยวชาญเฉพาะด้าน อันประกอบด้วย</span></div>\n<p>สำหรับวิชาเอกคณิตศาสตร์และสถิติ</p>\n<p>วิชาโทสถิติ หรือ</p>\n<p>วิชาโทคณิตศาสตร์การเงิน หรือ</p>\n<p>วิชาโทคณิตศาสตร์บริสุทธิ์</p>\n<p>สำหรับวิชาเอกเคมี</p>\n<p>วิชาโทวัสดุเคมีเพื่อความยั่งยืน หรือ</p>\n<p>วิชาโทเคมีเชิงคำนวณ หรือ</p>\n<p>วิชาโทนักออกแบบทางเคมี</p>\n<p>สำหรับวิชาเอกชีววิทยา</p>\n<p>วิชาโทซิสเทมาติคส์ของพืช หรือ</p>\n<p>วิชาโทสัตววิทยาและนิเวศวิทยา หรือ</p>\n<p>วิชาโทเทคโนโลยีชีวภาพ</p>\n<p>สำหรับวิชาเอกฟิสิกส์</p>\n<p>วิชาโทไมโครเวฟและฟิสิกส์วัสดุ หรือ</p>\n<p>วิชาโทฟิสิกส์พลังงานสูงและจักรวาลวิทยา หรือ</p>\n<p>วิชาโทการเรียนรู้ของเครื่องและปัญญาประดิษฐ์</p>\n<p>เพื่อการแก้ปัญหาทางวิทยาศาสตร์ได้</p>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO8</span> <span class=\"lo-desc\">มีทักษะในการทำวิจัย เพื่อแก้ปัญหาทางวิทยาศาสตร์</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO9</span> <span class=\"lo-desc\">มีทักษะการสื่อสารภาษาไทยและภาษาอังกฤษ เพื่อใช้ในชีวิตประจำวัน และในการสื่อสารวิทยาศาสตร์ ทั้งการฟัง พูด อ่าน เขียน และนำเสนอผลงานได้ตามวัตถุประสงค์ ในกรณีที่นักศึกษาเลือกภาษาจีน สามารถสื่อสารภาษาจีนในชีวิตประจำวันได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO10</span> <span class=\"lo-desc\">ใช้เทคโนโลยีสารสนเทศในการค้นคว้า แสวงหาความรู้ และประยุกต์ใช้ในงานด้านวิทยาศาสตร์และงานสำนักงานได้อย่างรู้เท่าทัน ท่ามกลางการเปลี่ยนแปลงในยุคดิจิทัล</span></div>\n<h3 class=\"domain-title\">3) ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO11</span> <span class=\"lo-desc\">ปฏิบัติตามจริยธรรมขั้นพื้นฐานอันประกอบด้วย มีความรับผิดชอบ มีความซื่อสัตย์ เคารพกฎเกณฑ์ในสังคม และมีความกตัญญูรู้คุณ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO12</span> <span class=\"lo-desc\">ปฏิบัติตามจรรยาบรรณด้านความประพฤติต่อผู้ร่วมงานและผู้อื่นของวิชาชีพทางวิทยาศาสตร์และเทคโนโลยี</span></div>\n<h3 class=\"domain-title\">4) ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO13</span> <span class=\"lo-desc\">แสดงออกถึงลักษณะของการเป็นนักวิจัยทางวิทยาศาสตร์อันประกอบด้วย ช่างสังเกต คิดอย่างเป็นระบบ และมีเหตุผล</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO14</span> <span class=\"lo-desc\">มีภาวะผู้นำ มีวินัย มีจิตอาสา มีสุขภาวะ สามารถปรับตัวและทำงานร่วมกับผู้อื่นได้</span></div>\n\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของวิชาสหกิจศึกษา (Learning Outcome: LO)</h2>\n<h3 class=\"domain-title\">1) ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">อธิบายกฎ ทฤษฎี หลักการ และปรากฏการณ์ต่าง ๆ โดยใช้ความรู้พื้นฐานทางวิทยาศาสตร์และคณิตศาสตร์ ในการปฏิบัติสหกิจศึกษา ที่สถานประกอบการได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">ประยุกต์ใช้ความรู้เฉพาะด้านของแต่ละวิชาเอก (วิชาเอกคณิตศาสตร์และสถิติ หรือวิชาเอกเคมี หรือวิชาเอกชีววิทยา หรือวิชาเอกฟิสิกส์) เพื่อการแก้ปัญหาทางวิทยาศาสตร์ ในการปฏิบัติสหกิจศึกษา ที่สถานประกอบการได้</span></div>\n<h3 class=\"domain-title\">2) ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">ใช้เครื่องมือพื้นฐานเพื่อการทดลองและแก้ปัญหาทางวิทยาศาสตร์ ในการปฏิบัติสหกิจศึกษา ที่สถานประกอบการได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">เลือกใช้เครื่องมือเพื่อการวิเคราะห์และทดสอบทางวิทยาศาสตร์ตามสาขาวิชาเอก ดังนี้ คณิตศาสตร์และสถิติ (สำหรับวิชาเอกคณิตศาสตร์และสถิติ) หรือเคมี (สำหรับวิชาเอกเคมี) หรือชีววิทยา (สำหรับวิชาเอกชีววิทยา) หรือฟิสิกส์ (สำหรับวิชาเอกฟิสิกส์) ในการปฏิบัติสหกิจศึกษา ที่สถานประกอบการได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO5</span> <span class=\"lo-desc\">มีทักษะในการทำวิจัย เพื่อแก้ปัญหาทางวิทยาศาสตร์ ในการปฏิบัติสหกิจศึกษา ที่สถานประกอบการได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO6</span> <span class=\"lo-desc\">มีทักษะการสื่อสารภาษาไทยหรือภาษาต่างประเทศ ในการสื่อสารวิทยาศาสตร์ ทั้งการฟัง พูด อ่าน เขียน และนำเสนอผลงานตามวัตถุประสงค์ ในการปฏิบัติสหกิจศึกษา ที่สถานประกอบการได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO7</span> <span class=\"lo-desc\">ใช้เทคโนโลยีสารสนเทศในการค้นคว้า แสวงหาความรู้ และประยุกต์ในงานด้านวิทยาศาสตร์และงานสำนักงานได้อย่างรู้เท่าทัน ท่ามกลางการเปลี่ยนแปลงในยุคดิจิทัล ในการปฏิบัติสหกิจศึกษา ที่สถานประกอบการได้</span></div>\n<h3 class=\"domain-title\">3) ด้านจริยธรรม (Ethics)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO8</span> <span class=\"lo-desc\">ปฏิบัติตามจริยธรรมขั้นพื้นฐาน 4 ด้าน ได้แก่ มีความรับผิดชอบ มีความซื่อสัตย์ เคารพกฎเกณฑ์ในสังคม และมีความกตัญญูรู้คุณ ในการปฏิบัติสหกิจศึกษา ที่สถานประกอบการได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO9</span> <span class=\"lo-desc\">ปฏิบัติตามจรรยาบรรณด้านความประพฤติต่อผู้ร่วมงานและผู้อื่นของวิชาชีพทางวิทยาศาสตร์และเทคโนโลยี ในการปฏิบัติสหกิจศึกษา ที่สถานประกอบการได้</span></div>\n<h3 class=\"domain-title\">4) ด้านลักษณะบุคคล (Character)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO10</span> <span class=\"lo-desc\">แสดงออกถึงลักษณะของการเป็นนักวิจัยทางวิทยาศาสตร์ 3 ด้าน ได้แก่ ช่างสังเกต คิดอย่างเป็นระบบ และมีเหตุผล ในการปฏิบัติสหกิจศึกษา ที่สถานประกอบการได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">LO11</span> <span class=\"lo-desc\">แสดงออกถึงลักษณะบุคคล 6 ด้าน ได้แก่ มีภาวะผู้นำ มีวินัย มีจิตอาสา มีสุขภาวะ มีความสามารถในการปรับตัว และทำงานร่วมกับผู้อื่น ในการปฏิบัติสหกิจศึกษา ที่สถานประกอบการได้</span></div>\n\n<h2 class=\"section-title\">แบบประเมินผลการปฏิบัติสหกิจศึกษาตามผลลัพธ์การเรียนรู้ที่คาดหวัง</h2>\n\n<h4 class=\"table-marker\">[TABLE 1]</h4>\n<div class=\"rubric-table-wrap\"><table class=\"rubric-table\">\n<tr><td>ผลการเรียนรู้ที่คาดหวัง</td><td>ผลการประเมิน</td></tr>\n</table></div>\n<h3 class=\"domain-title\">(1) ด้านความรู้ (Knowledge) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO1</span> <span class=\"lo-desc\">อธิบายกฎ ทฤษฎี หลักการ และปรากฏการณ์ต่าง ๆ โดยใช้ความรู้พื้นฐานทางวิทยาศาสตร์และคณิตศาสตร์ ในการปฏิบัติสหกิจศึกษา ที่สถานประกอบการได้ |   5 (ยอดเยี่ยม): อธิบายกฎ ทฤษฎี หลักการ และปรากฏการณ์ต่าง ๆ โดยใช้ความรู้พื้นฐานทางวิทยาศาสตร์และคณิตศาสตร์ได้อย่างครบถ้วนและถูกต้อง</span></div>\n<p>  4 (ดีมาก): อธิบายกฎ ทฤษฎี หลักการ และปรากฏการณ์ต่าง ๆ โดยใช้ความรู้พื้นฐานทางวิทยาศาสตร์และคณิตศาสตร์ได้อย่างครบถ้วนและถูกต้องเป็นส่วนใหญ่</p>\n<p>  3 (ดี): อธิบายกฎ ทฤษฎี หลักการ และปรากฏการณ์ต่าง ๆ โดยใช้ความรู้พื้นฐานทางวิทยาศาสตร์และคณิตศาสตร์ได้ถูกต้องเป็นส่วนใหญ่ แต่ขาดรายละเอียดปลีกย่อย</p>\n<p>  2 (พอใช้): อธิบายกฎ ทฤษฎี หลักการ และปรากฏการณ์ต่าง ๆ โดยใช้ความรู้พื้นฐานทางวิทยาศาสตร์และคณิตศาสตร์ได้ แต่ยังมีข้อผิดพลาดที่ต้องการคำแนะนำอย่างใกล้ชิด</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถอธิบายกฎ ทฤษฎี หลักการ และปรากฏการณ์ต่าง ๆ โดยใช้ความรู้พื้นฐานทางวิทยาศาสตร์และคณิตศาสตร์ได้</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO2</span> <span class=\"lo-desc\">ประยุกต์ใช้ความรู้เฉพาะด้านของแต่ละวิชาเอก (วิชาเอกคณิตศาสตร์และสถิติ หรือวิชาเอกเคมี หรือวิชาเอกชีววิทยา หรือวิชาเอกฟิสิกส์) เพื่อการแก้ปัญหาทางวิทยาศาสตร์ ในการปฏิบัติสหกิจศึกษา ที่สถานประกอบการได้ |   5 (ยอดเยี่ยม): ประยุกต์ใช้ความรู้เฉพาะด้านของแต่ละวิชาเอก (วิชาเอกคณิตศาสตร์และสถิติ หรือวิชาเอกเคมี หรือวิชาเอกชีววิทยา หรือวิชาเอกฟิสิกส์) เพื่อการแก้ปัญหาทางวิทยาศาสตร์ ได้อย่างถูกต้อง เหมาะสม และนำไปใช้ประโยชน์ได้จริง</span></div>\n<p>  4 (ดีมาก): ประยุกต์ใช้ความรู้เฉพาะด้านของแต่ละวิชาเอก (วิชาเอกคณิตศาสตร์และสถิติ หรือวิชาเอกเคมี หรือวิชาเอกชีววิทยา หรือวิชาเอกฟิสิกส์) เพื่อการแก้ปัญหาทางวิทยาศาสตร์ได้อย่างถูกต้องและนำไปใช้ประโยชน์ได้จริง</p>\n<p>  3 (ดี): ประยุกต์ใช้ความรู้เฉพาะด้านของแต่ละวิชาเอก (วิชาเอกคณิตศาสตร์และสถิติ หรือวิชาเอกเคมี หรือวิชาเอกชีววิทยา หรือวิชาเอกฟิสิกส์) เพื่อการแก้ปัญหาทางวิทยาศาสตร์ได้ถูกต้องเป็นส่วนใหญ่</p>\n<p>  2 (พอใช้): ประยุกต์ใช้ความรู้เฉพาะด้านของแต่ละวิชาเอก (วิชาเอกคณิตศาสตร์และสถิติ หรือวิชาเอกเคมี หรือวิชาเอกชีววิทยา หรือวิชาเอกฟิสิกส์) เพื่อการแก้ปัญหาทางวิทยาศาสตร์ ได้แต่ยังมีข้อผิดพลาดที่ต้องการคำแนะนำอย่างใกล้ชิด</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถประยุกต์ใช้ความรู้เฉพาะด้านของแต่ละวิชาเอก (วิชาเอกคณิตศาสตร์และสถิติ หรือวิชาเอกเคมี หรือวิชาเอกชีววิทยา หรือวิชาเอกฟิสิกส์) เพื่อการแก้ปัญหาทางวิทยาศาสตร์ได้</p>\n<h3 class=\"domain-title\">(2) ด้านทักษะ (Skills) |</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">LO3</span> <span class=\"lo-desc\">ใช้เครื่องมือพื้นฐานเพื่อการทดลองและแก้ปัญหาทางวิทยาศาสตร์ ในการปฏิบัติสหกิจศึกษา ที่สถานประกอบการได้ |   5 (ยอดเยี่ยม): ใช้เครื่องมือพื้นฐานเพื่อการทดลองและแก้ปัญหาทางวิทยาศาสตร์ได้อย่างถูกต้อง และเหมาะสมกับงาน</span></div>\n<p>  4 (ดีมาก): ใช้เครื่องมือพื้นฐานเพื่อการทดลองและแก้ปัญหาทางวิทยาศาสตร์ ได้อย่างถูกต้องและเหมาะสมกับงานเป็นส่วนใหญ่</p>\n<p>  3 (ดี): ใช้เครื่องมือพื้นฐานเพื่อการทดลองและแก้ปัญหาทางวิทยาศาสตร์ได้ถูกต้องเป็นส่วนใหญ่</p>\n<p>  2 (พอใช้): ใช้เครื่องมือพื้นฐานเพื่อการทดลองและแก้ปัญหาทางวิทยาศาสตร์ได้แต่ยังมีข้อผิดพลาดที่ต้องการคำแนะนำอย่างใกล้ชิด</p>\n<p>  1 (ต้องปรับปรุง): ไม่สามารถใช้เครื่องมือพื้นฐานเพื่อการทดลองและแก้ปัญหาทางวิทยาศาสตร์ได้</p>\n<div class=\"lo-item\"><span class=\"lo-code\">LO4</span> <span class=\"lo-desc\">เลือกใช้เครื่องมือเพื่อการวิเคราะห์และทดสอบทางวิทยาศาสตร์ตามสาขาวิชาเอก ดังนี้ คณิตศาสตร์และสถิติ (สำหรับวิชาเอกคณิตศาสตร์และสถิติ) หรือเคมี (สำหรับวิชาเอกเคมี) หรือชีววิทยา (สำหรับวิชาเอกชีววิทยา) หรือฟิสิกส์ (สำหรับวิชาเอกฟิสิกส์) ในการปฏิบัติสหกิจศึกษา ที่สถานประกอบการได้ |   5 (ยอดเยี่ยม): เลือกใช้เครื่องมือเพื่อการวิเคร ass=\"lo-item\"><span class=\"lo-code\">LO11</span> <span class=\"lo-desc\">แสดงออกถึงลักษณะบุคคล 6 ด้าน ได้แก่ มีภาวะผู้นำ มีวินัย มีจิตอาสา มีสุขภาวะ มีความสามารถในการปรับตัว และทำงานร่วมกับผู้อื่น ในการปฏิบัติสหกิจศึกษา ที่สถานประกอบการได้ |   5 (ยอดเยี่ยม): แสดงออกถึงลักษณะบุคคลครบทั้ง 6 ด้าน</span></div>\n<p>  4 (ดีมาก): แสดงออกถึงลักษณะบุคคล 5 ใน 6 ด้าน</p>\n<p>  3 (ดี): แสดงออกถึงลักษณะบุคคล 4 ใน 6 ด้าน</p>\n<p>  2 (พอใช้): แสดงออกถึงลักษณะบุคคล 3 ใน 6 ด้าน</p>\n<p>  1 (ต้องปรับปรุง): แสดงออกถึงลักษณะบุคคล 2 ใน 6 ด้าน</p>"}, {"name": "หลักสูตรวิทยาศาสตร์ทางทะเล", "file": "5. สำนักวิทยาศาสตร์ 2 หลักสูตร\\หลักสูตรวิทยาศาสตร์ทางทะเล_CLO_สหกิจศึกษา_JR310.docx", "ext": "docx", "html": "<p>หลักสูตรวิทยาศาสตรบัณฑิต สาขาวิทยาศาสตร์ทางทะเล</p>\n<p>หลักสูตรปรับปรุง ปีการศึกษา ๒๕๖๗</p>\n<p>สำนักวิชาวิทยาศาสตร์</p>\n<h2 class=\"section-title\">ผลลัพธ์การเรียนรู้ของหลักสูตร (Program Learning Outcomes: PLOs)</h2>\n<p>หลักสูตรมุ่งผลิตบัณฑิตที่ตอบสนองทิศทาง นโยบาย ยุทธศาสตร์ชาติและมหาวิทยาลัย ตลอดจนความต้องการของผู้มีส่วนได้ส่วนเสีย และสอดคล้องตามเกณฑ์ 4 ด้าน ตามประกาศคณะกรรมการมาตรฐานการอุดมศึกษา เรื่อง รายละเอียดผลลัพธ์การเรียนรู้ตามมาตรฐานคุณวุฒิระดับอุดมศึกษา พ.ศ. 2565 รวมทั้งการมุ่งเน้นในการผลิตบัณฑิตที่มีความสามารถในการคิดวิเคราะห์และสังเคราะห์ สามารถแสวงหาความรู้ได้ตลอดชีวิต บนพื้นฐานของการมีจิตสำนึกในการรักชาติ รักแผ่นดิน มีความกตัญญู มีวินัย และรับผิดชอบต่อสังคม โดยบัณฑิตที่สำเร็จการศึกษาในหลักสูตรนี้มีความสามารถแต่ละด้านดังนี้</p>\n\n<h2 class=\"section-title\">แบบประเมินผลการปฏิบัติสหกิจศึกษาตามผลลัพธ์การเรียนรู้ที่คาดหวัง</h2>\n\n<h4 class=\"table-marker\">[TABLE 1]</h4>\n<h3 class=\"domain-title\">1) ด้านความรู้ (Knowledge) | 1) ด้านความรู้ (Knowledge)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO1</span> <span class=\"lo-desc\">| อธิบายคุณค่าความเป็นมนุษย์ ความหลากหลายทางวัฒนธรรม ปรับตัว และแก้ปัญหาเฉพาะหน้าในสถานการณ์ที่มีการเปลี่ยนแปลงของสังคม-เศรษฐกิจ และสิ่งแวดล้อม</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO2</span> <span class=\"lo-desc\">| อธิบายองค์ความรู้ด้านวิทยาศาสตร์ คณิตศาสตร์ สถิติ และเทคโนโลยีสารสนเทศ ได้อย่างถูกต้องตามหลักวิชาการ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO3</span> <span class=\"lo-desc\">| อธิบายหลักการ กระบวนการ การใช้เครื่องมือหรือเทคโนโลยีในภาคสนามและห้องปฏิบัติการ เป็นลำดับขั้นตอนที่ถูกต้องตามหลักวิชาการ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO4</span> <span class=\"lo-desc\">| ประยุกต์ใช้ความรู้ทางวิทยาศาสตร์เพื่อแก้ปัญหาด้านสิ่งแวดล้อม และทรัพยากรทางทะเลและชายฝั่งได้ถูกต้องตามหลักวิชาการ</span></div>\n<h3 class=\"domain-title\">2) ด้านทักษะ (Skills) | 2) ด้านทักษะ (Skills)</h3>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO5</span> <span class=\"lo-desc\">| มีทักษะการคิดวิเคราะห์และวิพากษ์เพื่อแก้ปัญหาด้านสิ่งแวดล้อม และทรัพยากรทางทะเลและชายฝั่ง</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO6</span> <span class=\"lo-desc\">| มีทักษะในการใช้เทคโนโลยีสารสนเทศในการค้นคว้า การจัดเก็บ ประมวลผล และนำเสนอข้อมูลเชิงวิชาการได้อย่างเหมาะสมกับสถานการณ์</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO7</span> <span class=\"lo-desc\">| มีทักษะในการสื่อสารด้วยภาษาไทยและภาษาอังกฤษ เพื่อใช้ในชีวิตประจำวัน และในการทำงานด้านวิทยาศาสตร์ทางทะเล ทั้งการฟัง การพูด การเขียน และนำเสนอผลงานได้ตามวัตถุประสงค์ ในกรณีที่นักศึกษาเลือกภาษาจีนสามารถสื่อสารภาษาจีนในชีวิตประจำวันได้</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO8</span> <span class=\"lo-desc\">| มีทักษะในการใช้อุปกรณ์และเครื่องมือเพื่อเก็บตัวอย่างในภาคสนาม และวิเคราะห์ตัวอย่างในห้องปฏิบัติการที่เกี่ยวข้องกับวิทยาศาสตร์พื้นฐาน และคุณภาพสิ่งแวดล้อมทางทะเลในด้านชีวภาพ กายภาพ และด้านเคมีได้อย่างถูกต้องตามมาตรฐานของห้องปฏิบัติการ</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO9</span> <span class=\"lo-desc\">| มีทักษะในการใช้โปรแกรมประยุกต์ด้านภูมิสารสนเทศ และด้านสถิติเพื่อการจัดการทรัพยากรทางทะเลและชายฝั่ง</span></div>\n<div class=\"lo-item\"><span class=\"lo-code\">PLO10</span> <span class=\"lo-desc\
